              run=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}']))
              assert run['status']=='completed' and run['conclusion']=='success' and run['head_sha']==source
          roster=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/38950078074/jobs']))['jobs']
          assert any(j['name']=='reuse-and-check (34)' and j['conclusion']=='success' for j in roster)
          PY
      - uses: actions/download-artifact@v4
        with:
          name: staged-alpha-preview254
          run-id: '38949555538'
          github-token: ${{ github.token }}
          path: delivery
      - name: Recheck compatibility, source and payload before private publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download apd-alpha-preview-250 --repo "$GITHUB_REPOSITORY" --pattern ADHD-Pixel-Dungeon-Alpha-Preview-250.apk --dir rollback
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess,sys,zipfile
          sys.path.insert(0,'tools')
          from apd_existing_build_evidence import application_inputs,certificates
          repo=os.environ['GITHUB_REPOSITORY'];root=pathlib.Path('delivery')
          evidence=json.loads((root/'TEST254-Verification.json').read_text())
          source='832c1a5679a8cd216e8c57638f1bc0fe2442fdfe';expected=evidence['apk_sha256']
          assert expected=='131d205b17a2c118abd794cf49631c21b52166cb3b4586fb2545cbbab3e53a72'
          assert evidence['source']==source and evidence['apk_sha256']==expected
          for name,count in [('core',1736),('android',36)]:
              data=evidence[name];assert data['tests']==len(data['cases'])==len({(c['classname'],c['name']) for c in data['cases']})==count
              assert data['failures']==data['errors']==data['skipped']==0
          assert any(c['name']=='liveMultipliersMatchEveryPositionAndUpdateDuringNativeDragBeforeRelease' for c in evidence['android']['cases'])
          trees=[]
          for sha in (source,os.environ['GITHUB_SHA']):
              tree=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/git/trees/{sha}?recursive=1']))
              assert not tree.get('truncated',False);trees.append(application_inputs(tree['tree']))
          assert trees[0]==trees[1], 'Publication wrapper changed application inputs'
          apk=root/'ADHD-Pixel-Dungeon-CODEX-TEST-254.apk';old=pathlib.Path('rollback/ADHD-Pixel-Dungeon-Alpha-Preview-250.apk')
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==expected
          assert hashlib.sha256(old.read_bytes()).hexdigest()=='06531de071cbe89a5b0c3260f5c5fb6e6368fbfdf388f8f18bb0fcd983532535'
          tools=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools';signer=sorted(tools.glob('*/apksigner'))[-1];aapt=signer.parent/'aapt'
          cert=[certificates(subprocess.check_output([str(signer),'verify','--print-certs',str(path)],text=True)) for path in (apk,old)]
          assert cert[0]==cert[1]==['067688b3ab6bd5820a67f4c1ba7d5859db578173771cf31d3252b3e4e012246e']
          package=[re.search(r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'",subprocess.check_output([str(aapt),'dump','badging',str(path)],text=True)).groups() for path in (apk,old)]
          assert package[0][0]==package[1][0]=='com.charltonchris29.adhdpixeldungeon.indev' and int(package[0][1])>=int(package[1][1])
          assert package[0][2]=='4.0.8-apd-INDEV-bC254-TEST'
          pdf=root/'APD-Alpha-Preview-254.pdf';assert pdf.read_bytes().startswith(b'%PDF-')
          download=root/'ADHD-Pixel-Dungeon-Alpha-Preview-254.apk';apk.rename(download)
          pathlib.Path(str(download)+'.sha256').write_text(expected+'  '+download.name+'\n')
          receipt={'application_source':source,'application_build_run':38949555542,'original_primary_run_conclusion':'success','android_retest_run':38951417636,'android_retest_source':'668ae0dec9d9ef3f815c699b6ce76e1834a460f6','staging_run':38949555538,'publication_commit':os.environ['GITHUB_SHA'],'publication_application_tree_matches_source':True,'download_name':download.name,'original_internal_name':apk.name,'apk_sha256':expected,'certificate_sha256':cert[0],'package':package[0],'core_methods':1736,'main_api34_methods':36,'physical_device_tested':False,'tester_distribution_approved':False,'application_rebuilt':False}
          (root/'APD-Preview-Delivery.json').write_text(json.dumps(receipt,indent=2))
          notes="Private owner early-alpha test; no automatic tester distribution.\n\nSince TEST250: optional scoring-vision popup; saved daily earned-score display; narrow-screen quickslot paging and message-log spacing. All 357 multipliers, scoring formula, original scores, challenges and slider gameplay remain unchanged.\n\nVerification: 1,736 core tests, 36 Android 14 methods, six-class save/continue acceptance, and eight repeated Android 16 methods plus two targeted native checks passed. 49 primary and 22 supplemental captures were reviewed. Emulator evidence only: physical-phone install-over and full human boss playthroughs remain pending. TEST253 was rejected after screenshot review found message overlap; TEST254 corrects it. Earlier failed checks and remaining backlog are documented in the PDF.\n\nSource: "+source+". Existing signed APK reused; no publication rebuild. Install over APD; never uninstall or clear data. SHA-256: "+expected+".\n"
          (root/'owner-release-notes.txt').write_text(notes)
          PY
      - uses: actions/download-artifact@v4
