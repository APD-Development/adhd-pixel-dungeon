name: Read APD384 native failure evidence without rebuilding applications
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-384-READ-NATIVE.txt]
permissions: {contents: write, actions: read}
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {name: apd384-native-Developer, run-id: 42539268859, github-token: '${{ github.token }}', path: evidence/Developer}
      - uses: actions/download-artifact@v4
        with: {name: apd384-native-Alpha-Testers, run-id: 42539268859, github-token: '${{ github.token }}', path: evidence/Alpha-Testers}
      - name: Read actual terminal failures and preserve diagnostic captures
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PYREAD'
          import pathlib,zipfile
          for p in pathlib.Path('evidence').rglob('*-qol.txt'):
            print(str(p));print(p.read_text()[-12000:])
          with zipfile.ZipFile('APD-384-Unaccepted-Native-Diagnostics.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in pathlib.Path('evidence').rglob('*'):
              if p.is_file() and p.suffix in ('.png','.txt'):z.write(p)
          PYREAD
          gh release upload apd-alpha-preview-384 APD-384-Unaccepted-Native-Diagnostics.zip --repo "$GITHUB_REPOSITORY"
