name: Build and qualify APD441 talent descriptions and runtime coverage
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-441-BUILD-REQUEST.txt]
permissions: {contents: read, actions: read}
concurrency: {group: apd441-exact-candidate, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify candidate provenance rejection and recovery safeguards
        run: |
          python3 tools/apd_candidate441.py self-test
          python3 -m unittest discover -s tools -p 'test_apd_recover439_440.py' -v
          python3 -m unittest discover -s tools -p 'test_apd_native_screenshot_transfer.py' -v
      - name: Require completed recovery and preserve exact APD440 compiled history
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 tools/apd_candidate441.py history
      - name: Run all3190 core tests and compile every required target
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac -PapdTestBuild -PapdBuild=C441
          python3 tools/apd_candidate441.py core
          python3 tools/check_android_json_abi.py .
      - name: Assemble one Developer and Alpha-Testers pair with original signing
        run: |
          mkdir -p candidate441/built/owner-delivery
          ./gradlew :android:assembleDebug :android:assembleDebugAndroidTest -PapdTestBuild -PapdBuild=C441
          cp android/build/outputs/apk/debug/android-debug.apk candidate441/built/owner-delivery/APD-Developer-441.apk
          cp android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk candidate441/built/evidence/instrumentation.apk
          ./gradlew :android:assembleDebug -PapdBuild=P441
          cp android/build/outputs/apk/debug/android-debug.apk candidate441/built/owner-delivery/APD-Alpha-Testers-441.apk
          python3 tools/check_android_json_abi.py .
          python3 tools/apd_candidate441.py freeze
      - uses: actions/upload-artifact@v4
        with:
          name: apd441-built-pair
          path: candidate441/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apd441-build-failure-evidence
          path: |
            candidate441/
            core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 30
  native:
    needs: build
    strategy:
      fail-fast: false
      matrix: {variant: [Developer, Alpha-Testers]}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Download and independently bind original candidate artifact
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 tools/apd_candidate441.py fetch
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test all six native cases including both corrected talent windows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none -skin 320x640
          script: python3 tools/apd_candidate441.py native --variant '${{ matrix.variant }}' --output native441
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd441-native-${{ matrix.variant }}
          path: native441/
          if-no-files-found: error
          retention-days: 30
  prepare-owner-review:
    needs: [build, native]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Recheck original candidate identity without rebuilding
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 tools/apd_candidate441.py fetch
      - uses: actions/download-artifact@v4
        with:
          pattern: apd441-native-*
          path: native-evidence
          merge-multiple: false
      - name: Require all12 cases and six affected talent captures per variant
        run: python3 tools/apd_candidate441.py finalize --output owner-review441
      - uses: actions/upload-artifact@v4
        with:
          name: apd441-owner-review-pair
          path: owner-review441/
          if-no-files-found: error
          retention-days: 30
