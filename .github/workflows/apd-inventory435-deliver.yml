name: Deliver verified APD435 private owner APK pair
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-435-DELIVERY-REQUEST.txt]
permissions: {contents: write, actions: read}
concurrency: {group: apd435-private-delivery, cancel-in-progress: false}
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Verify owner policy, exact producing workflow, APKs, tests, signatures and UI screenshots
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 tools/apd_owner_delivery_policy.py
          python3 - <<'PY'
          import json, pathlib, subprocess, hashlib, os, zipfile, re, sys
          repo='APD-Development/ShieldingShouldHaveWorked'
          api=lambda path:json.loads(subprocess.check_output(['gh','api',path]))
          assert api('repos/'+repo)['private']
          run=api('repos/'+repo+'/actions/runs/42920537849')
          assert run['conclusion']=='success' and run['status']=='completed',run['conclusion']
          assert run['head_sha']=='1ddb731d2d03a4ea2dd56cf76ebc7e3bbe7600ec',run['head_sha']
          assert run['path']=='.github/workflows/apd-inventory-435.yml'
          assert len([j for j in api('repos/'+repo+'/actions/runs/42920537849/jobs')['jobs'] if j['conclusion']=='success'])==3
          pathlib.Path('proof').mkdir()
          for name in ('apd435-built-pair','apd435-native-Developer','apd435-native-Alpha-Testers'):
              artifacts=[a for a in api('repos/'+repo+'/actions/runs/42920537849/artifacts')['artifacts'] if a['name']==name and not a['expired']]
              assert len(artifacts)==1,name
              dest=pathlib.Path('proof')/name;dest.mkdir()
              subprocess.run(['gh','run','download','42920537849','--repo',repo,'--name',name,'--dir',str(dest)],check=True)
          root=pathlib.Path('proof/apd435-built-pair')
          tests=list(root.rglob('TEST-*.xml'))
          import xml.etree.ElementTree as ET
          suites=[ET.parse(p).getroot() for p in tests]
          counts={k:sum(int(s.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
          assert len(suites)==458 and counts=={'tests':3172,'failures':0,'errors':0,'skipped':0},counts
          data=json.loads(next(root.rglob('apks.json')).read_text())
          signer=sorted((pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools').glob('*/apksigner'))[-1]
          expected='067688b3ab6bd5820a67f4c1ba7d5859db578173771cf31d3252b3e4e012246e'
          from importlib.util import spec_from_file_location,module_from_spec
          s=spec_from_file_location('evidence',str(pathlib.Path('tools/apd_existing_build_evidence.py')));m=module_from_spec(s);s.loader.exec_module(m)
          for variant in ('Developer','Alpha-Testers'):
              apk=root/'owner-delivery'/('APD-'+variant+'-435.apk')
              assert apk.exists() and apk.stat().st_size>1000000
              digest=hashlib.sha256(apk.read_bytes()).hexdigest()
              assert digest==data[variant]['sha256']
              cert=m.certificates(subprocess.check_output([str(signer),'verify','--print-certs',str(apk)],text=True))
              assert cert==[expected]
              assert data[variant]['cert']==expected
              with zipfile.ZipFile(apk) as z:
                  history=z.read('assets/apd/history/index.tsv').decode()
                  assert 'Codex TEST 435' in history and 'Codex TEST 434' in history
              native=pathlib.Path('proof')/('apd435-native-'+variant)
              results=list(native.rglob('*-qol.txt'))
              assert len(results)==1 and 'OK (1 test)' in results[0].read_text()
              images=list(native.rglob('qol-automatic-inventory-*.png'))
              assert len(images)>=5,(variant,len(images))
              assert all(p.stat().st_size>2000 for p in images)
          pathlib.Path('release-notes.md').write_text('APD435: Inventory organization. Gear now sorts by category, known upgrade and tier without treating an unknown curse as an unknown upgrade. Velvet Pouch keeps seeds together and stones together rather than mixing them by stack size. Gameplay, saves, stats and prior signing are unchanged. Verified 3172 core tests, API34 native inventory window checks for Developer and Alpha-Testers, matching signatures and offline build history. Emulator testing does not establish physical-phone testing. Install over existing app without uninstalling.\n')
          PY
      - name: Publish new tag without modifying existing APKs or releases
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          if gh release view apd-alpha-preview-435 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "APD435 release already exists; refusing to overwrite it"
            exit 1
          fi
          gh release create apd-alpha-preview-435 --repo "$GITHUB_REPOSITORY" \
            --target 1ddb731d2d03a4ea2dd56cf76ebc7e3bbe7600ec --prerelease --latest=false \
            --title "APD435: inventory sorting correction" --notes-file release-notes.md \
            proof/apd435-built-pair/owner-delivery/APD-Developer-435.apk \
            proof/apd435-built-pair/owner-delivery/APD-Alpha-Testers-435.apk
          mkdir -p downloaded
          gh release download apd-alpha-preview-435 --repo "$GITHUB_REPOSITORY" --pattern 'APD-*-435.apk' --dir downloaded
          for variant in Developer Alpha-Testers; do
            cmp "proof/apd435-built-pair/owner-delivery/APD-${variant}-435.apk" "downloaded/APD-${variant}-435.apk"
          done
          gh release view apd-alpha-preview-435 --repo "$GITHUB_REPOSITORY" --json url,isDraft,isPrerelease,assets
