name: Verify exact existing APD341 full native acceptance
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/apd-existing341-native-acceptance.yml]
permissions:
  contents: read
  actions: read
jobs:
  exact-native-api34:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Download exact APK and restore frozen production inputs for instrumentation
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,zipfile
          sys.path.insert(0,'tools')
          from apd_existing_build_evidence import application_inputs
          repo=os.environ['GITHUB_REPOSITORY'];source='acb69c653033ee0d8df68264395ca27e08eb566d';run_id=40976774216
          api=lambda p:json.loads(subprocess.check_output(['gh','api',p]))
          assert api('repos/'+repo)['private']
          trees=[api(f'repos/{repo}/git/trees/{s}?recursive=1') for s in (source,os.environ['GITHUB_SHA'])]
          assert all(not t.get('truncated') for t in trees)
          expected=application_inputs(trees[0]['tree']);current=application_inputs(trees[1]['tree'])
          changed=sorted(p for p in expected.keys()|current.keys() if expected.get(p)!=current.get(p))
          if changed:
              subprocess.run(['git','fetch','--no-tags','--depth=1','origin',source],check=True)
              restore=[p for p in changed if p in expected]
              if restore:subprocess.run(['git','checkout',source,'--',*restore],check=True)
              for p in changed:
                  if p not in expected:pathlib.Path(p).unlink()
          for p,sha in expected.items():
              assert pathlib.Path(p).is_file(),p
              assert subprocess.check_output(['git','hash-object','--',p],text=True).strip()==sha,p
          assert not any(pathlib.Path(p).exists() for p in current.keys()-expected.keys())
          run=api(f'repos/{repo}/actions/runs/{run_id}');assert run['head_sha']==source
          assert any(j['name']=='verify-and-build' and j['conclusion']=='success' for j in api(f'repos/{repo}/actions/runs/{run_id}/jobs')['jobs'])
          a,=[a for a in api(f'repos/{repo}/actions/runs/{run_id}/artifacts')['artifacts'] if a['name']=='apd-codex-private-test-apk' and not a['expired']]
          with open('exact341.zip','wb') as out:subprocess.run(['gh','api',f'repos/{repo}/actions/artifacts/{a["id"]}/zip'],stdout=out,check=True)
          assert 'sha256:'+hashlib.sha256(pathlib.Path('exact341.zip').read_bytes()).hexdigest()==a['digest']
          pathlib.Path('application').mkdir()
          with zipfile.ZipFile('exact341.zip') as z:
              apk,=[n for n in z.namelist() if n.endswith('.apk')]
              data=z.read(apk);digest=hashlib.sha256(data).hexdigest()
              checksum,=[n for n in z.namelist() if n.endswith('.apk.sha256')]
              assert z.read(checksum).decode().split()[0]==digest
              pathlib.Path('application/exact341.apk').write_bytes(data)
          print('EXACT_TEST341_APK_SHA256',digest)
          pathlib.Path('acceptance-source.json').write_text(json.dumps({'application_source':source,'application_run':run_id,'application_sha256':digest,'compilation_application_source':source,'production_inputs_restored_in_disposable_runner':changed,'protected_compilation_inputs_verified':True,'candidate_press_timing_injected':False,'input_handler_replaced':False,'application_rebuilt':False,'test_source':os.environ['GITHUB_SHA'],'purpose':'Complete unmodified 66-method acceptance of exact compiled341; only missing diagnostic helper compile dependency corrected; no runtime injection or app rebuild'},indent=2))
          PY
      - name: Compile corrected instrumentation only
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :android:assembleDebugAndroidTest -PapdTestBuild -PapdBuild=C341
          test ! -f android/build/outputs/apk/debug/android-debug.apk
          ./gradlew --stop
          python3 -m pip install pillow
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: All original66 methods and92 screenshots on exact installed APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: bash tools/run-existing341-native-acceptance.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-codex-android-checks
          path: |
            acceptance-source.json
            title-instrumentation.txt
            codex-logcat.txt
            title-evidence/
          retention-days: 7
