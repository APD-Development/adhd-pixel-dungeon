
name: APD Auto Development

on:
  schedule:
    cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apd-auto-development
  cancel-in-progress: false

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout APD
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run regression tests
        run: ./gradlew :core:test
