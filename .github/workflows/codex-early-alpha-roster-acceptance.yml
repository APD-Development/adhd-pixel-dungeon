name: APD early-alpha six-class Android acceptance

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: apd-early-alpha-roster-acceptance
  cancel-in-progress: false

jobs:
  six-class-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Reuse the exact verified TEST249 application
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,zipfile
          repo=os.environ['GITHUB_REPOSITORY']
          source='37a8f6d16cd497e13ed581e887ed9d4858fe97aa'
          run_id='38914965700'
          artifact_id='12051339058'
          expected='dcda79a5c6c83b1ac88e5294b3b134c8e1483109929b3a8da5365e7eadc8536e'
          assert json.loads(subprocess.check_output(['gh','api','repos/'+repo]))['private']
          run=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/actions/runs/'+run_id]))
          assert run['status']=='completed' and run['conclusion']=='success' and run['head_sha']==source
          subprocess.run(['git','fetch','--no-tags','--depth=1','origin',source],check=True)
          protected=['core/src/main','SPD-classes/src/main','services/src/main','android/src/main',
                     'android/build.gradle','core/build.gradle','SPD-classes/build.gradle',
                     'services/build.gradle','build.gradle','settings.gradle','gradle.properties',
                     'gradle']
          differences=subprocess.check_output(['git','diff','--name-only',source,'HEAD','--']+protected,text=True)
          pathlib.Path('acceptance-protected-differences.txt').write_text(differences)
          # Detach the disposable checkout at exact TEST249 so files added by a
          # newer application candidate cannot leak into compilation. Restore
          # only this acceptance test; androidTest is outside protected inputs.
          test_path='android/src/androidTest/java/com/shatteredpixel/shatteredpixeldungeon/android/EarlyAlphaRosterDeviceTest.java'
          test_source=pathlib.Path(test_path).read_bytes()
          subprocess.run(['git','checkout','--detach',source],check=True)
          pathlib.Path(test_path).parent.mkdir(parents=True,exist_ok=True)
          pathlib.Path(test_path).write_bytes(test_source)
          subprocess.run(['git','diff','--exit-code',source,'--']+protected,check=True)
          with open('verified-test249.zip','wb') as output:
              subprocess.run(['gh','api','repos/'+repo+'/actions/artifacts/'+artifact_id+'/zip'],
                             stdout=output,check=True)
          with zipfile.ZipFile('verified-test249.zip') as archive:
              names=[name for name in archive.namelist() if name.endswith('.apk')]
              assert len(names)==1
              apk=archive.read(names[0])
          digest=hashlib.sha256(apk).hexdigest()
          assert digest==expected,(digest,expected)
          pathlib.Path('verified-test249.apk').write_bytes(apk)
          pathlib.Path('acceptance-source.json').write_text(json.dumps({
              'application_source':source,'application_run':int(run_id),
              'application_artifact':int(artifact_id),'application_sha256':digest,
              'test_source':os.environ['GITHUB_SHA'],'application_reused':True,
              'application_rebuilt':False,'instrumentation_compile_tree':source,
              'live_protected_differences_recorded':bool(differences.strip()),
              'physical_device':False,'published':False
          },indent=2))
          PY
      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
      - name: Re-run playthrough-critical headless acceptance
        run: |
          ./gradlew :core:test \
            --tests '*CustomRuleCombinationAcceptanceTest' \
            --tests '*BossPhaseDamageProvenanceTest' \
            --tests '*CustomBossHealthSliderTest'
      - name: Compile the new instrumentation package
        run: ./gradlew :android:assembleDebugAndroidTest -PapdTestBuild -PapdBuild=C249
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start, save and continue all six classes on API 34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install -r verified-test249.apk
            adb install -r android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk
            adb logcat -c
            timeout 900 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.EarlyAlphaRosterDeviceTest#allSixClassesStartSaveAndContinueWithLockedExtremeRules com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner | tee early-alpha-roster-instrumentation.txt
            adb logcat -d -v time > early-alpha-roster-logcat.txt
      - name: Validate the six-class instrumentation result
        run: |
          python3 - <<'PY'
          import json,pathlib,re
          result=pathlib.Path('early-alpha-roster-instrumentation.txt').read_text()
          assert re.search(r'OK \(1 test\)',result),result
          assert not any(marker in result for marker in
                         ('FAILURES!!!','INSTRUMENTATION_FAILED','Process crashed.'))
          pathlib.Path('early-alpha-roster-result.json').write_text(json.dumps({
            'instrumented_methods':1,'classes':6,'start_save_continue':True,
            'locked_custom_rule_values':18,'difficulty':5,'challenges':9,
            'api_level':34,'application_reused':'TEST249',
            'physical_device':False,'failures':0,'errors':0,'skipped':0
          },indent=2))
          PY
      - name: Preserve exact acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apd-early-alpha-six-class-acceptance
          path: |
            acceptance-source.json
            acceptance-protected-differences.txt
            early-alpha-roster-result.json
            early-alpha-roster-instrumentation.txt
            early-alpha-roster-logcat.txt
            core/build/test-results/test/
            core/build/reports/tests/test/
          if-no-files-found: warn
          retention-days: 7
