name: Verify APD malformed wall-search memory restore
on:
  push:
    branches: [codex/apd-wall-memory-null-array-20261112]
    paths: [.github/workflows/apd-wall-memory-null-array-ci-20261112.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Require null-safe array restore and all scoped regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/SearchedWalls.java').read_text()
          assert 'int[] checks = bundle.getIntArray(CHECKS_KEY);' in code
          assert 'if (checks != null) for (int cell : checks)' in code
          assert 'int[] marks = bundle.getIntArray(KEY);' in code
          assert 'if (marks == null) return;' in code
          tests=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/SearchedWallsTest.java').read_text()
          for name in ('unreadableDoorChecksDoNotDiscardValidSearchMarks',
                       'unreadableSearchMarksDoNotDiscardValidDoorChecks',
                       'unreadableArraysClearOldMemoryWithoutChangingFloor'):
              assert name in tests,name
          print('Verified scoped null-array restore and regression source')
          PY
      - name: Run full core tests and desktop plus Android compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require full core success and exactly named new regression cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports,'Missing core JUnit XML'
          totals={key:sum(int(report.get(key,0)) for report in reports) for key in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3279 and not any(totals[key] for key in ('failures','errors','skipped')),totals
          suites=[report for report in reports if report.get('name','').endswith('.SearchedWallsTest')]
          assert len(suites)==1,'SearchedWallsTest not in full run'
          names={node.get('name') for node in suites[0].findall('testcase')}
          required={'unreadableDoorChecksDoNotDiscardValidSearchMarks',
                    'unreadableSearchMarksDoNotDiscardValidDoorChecks',
                    'unreadableArraysClearOldMemoryWithoutChangingFloor'}
          assert required <= names,required-names
          print('Verified',totals,'across',len(reports),'suites, including all three regressions')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-wall-memory-null-array-core-results
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
