name: Verify APD stair routing with incomplete metadata
on:
  push:
    branches: [codex/apd-stair-incomplete-metadata-20261112]
    paths: [.github/workflows/apd-stair-incomplete-metadata-ci-20261112.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify incomplete metadata is a read-only navigation refusal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/navigation/StairNavigation.java').read_text()
          check=code.split('public static boolean safeStep(',1)[1].split('public static String begin(',1)[0]
          assert 'level.traps==null' in check
          assert 'cell>=hero.fieldOfView.length' in check
          assert 'Trap trap=level.traps.get(cell)' in check
          tests=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/navigation/StairNavigationTest.java').read_text()
          required=('truncatedVisibilityMetadataBlocksStairShortcutWithoutSpendingATurn',
                    'missingTrapMetadataBlocksStairShortcutWithoutSpendingATurn',
                    'nullHeroNeverAuthorizesStairRouting')
          assert all(name in tests for name in required),required
          print('Verified bounded read-only stair-routing safety guards and regression presence.')
          PY
      - name: Complete core tests, desktop and Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require all core tests and exact new stair tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports,'Core JUnit result XML is missing'
          totals={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3272 and all(totals[k]==0 for k in ('failures','errors','skipped')),totals
          suites=[r for r in reports if r.get('name','').endswith('.StairNavigationTest')]
          assert len(suites)==1
          cases={node.get('name') for node in suites[0].findall('testcase')}
          required={'truncatedVisibilityMetadataBlocksStairShortcutWithoutSpendingATurn',
                    'missingTrapMetadataBlocksStairShortcutWithoutSpendingATurn',
                    'nullHeroNeverAuthorizesStairRouting'}
          assert required <= cases,(required-cases)
          print('Verified',totals,'across',len(reports),'core suites and all three new regressions')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-stair-incomplete-metadata-core-results
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
