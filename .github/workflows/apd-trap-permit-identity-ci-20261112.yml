name: Verify APD trap confirmation identity safety
on:
  push:
    branches: [codex/apd-trap-permit-null-identity-20261112]
    paths: [.github/workflows/apd-trap-permit-identity-ci-20261112.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Require non-null level, trap and action identities
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/TrapStepPermit.java').read_text()
          assert 'if (level==null || trap==null || action==null) return;' in source
          assert 'boolean allowed=this.level!=null && this.trap!=null && this.action!=null' in source
          assert 'clear();return allowed;' in source
          tests=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/TrapStepPermitIdentityTest.java').read_text()
          required=('missingLevelCannotAuthorizeEvenAnIdenticalNullLevel',
                    'missingTrapCannotAuthorizeEvenAnIdenticalNullTrap',
                    'invalidGrantClearsPreviouslyValidPermission',
                    'validExactConfirmationRemainsSingleUseAndMismatchesConsumeIt')
          assert all(name in tests for name in required),required
          print('Verified bounded trap permission identity guard and tests are present')
          PY
      - name: Run complete core tests and compile desktop and Android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require complete core results and four exact identity regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports,'Core JUnit result XML is missing'
          totals={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3276 and all(totals[k]==0 for k in ('failures','errors','skipped')),totals
          suites=[r for r in reports if r.get('name','').endswith('.TrapStepPermitIdentityTest')]
          assert len(suites)==1
          cases={node.get('name') for node in suites[0].findall('testcase')}
          required={'missingLevelCannotAuthorizeEvenAnIdenticalNullLevel',
                    'missingTrapCannotAuthorizeEvenAnIdenticalNullTrap',
                    'invalidGrantClearsPreviouslyValidPermission',
                    'validExactConfirmationRemainsSingleUseAndMismatchesConsumeIt'}
          assert required <= cases,(required-cases)
          print('Verified',totals,'across',len(reports),'core suites and all four identity regressions')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-trap-permit-identity-core-results
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
