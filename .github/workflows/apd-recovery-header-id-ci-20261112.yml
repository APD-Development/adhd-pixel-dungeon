name: APD destructive recovery header identity source gate
on:
  push:
    branches: [chatgpt/apd-recovery-header-id-20261112-2358]
    paths:
      - .github/workflows/apd-recovery-header-id-ci-20261112.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/LogRecovery.java
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/StatsStore.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/StatsStoreRecoveryHeaderIdentityBoundaryTest.java
permissions: {contents: read}
concurrency:
  group: apd-recovery-header-id-20261112
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Confirm bounded recovery identity and exact regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          repair=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/LogRecovery.java').read_text()
          store=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/StatsStore.java').read_text()
          tests=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/StatsStoreRecoveryHeaderIdentityBoundaryTest.java').read_text()
          assert 'expectedRunId.equals(r.header.runId)' in repair
          assert 'LogRecovery.repair(f, name.substring(' in store
          for case in ('damagedLogCopiedUnderAnotherValidRunIdIsNotTruncated','healthyCopiedLogStillRemainsUntouchedAndUnreadable'):
            assert 'void '+case+'(' in tests, case
          print('Original repair entry point retained, exact store-only header identity guard and filesystem cases present')
          PY
      - name: Full core JUnit and desktop/Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Assert full JUnit and preservation of prior recovery/index regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'missing JUnit reports'
          totals={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3375, totals
          assert all(totals[k]==0 for k in ('failures','errors','skipped')), totals
          cases={c.get('name') for r in reports for c in r.findall('testcase')}
          for case in (
            'damagedLogCopiedUnderAnotherValidRunIdIsNotTruncated',
            'healthyCopiedLogStillRemainsUntouchedAndUnreadable',
            'invalidFilenameWithValidDamagedHeaderIsNeverRepaired',
            'recoverySkipsInvalidNamesWithoutAnyValidRun',
            'copiedLogWithDifferentHeaderIdCannotImpersonateOriginalDuringRebuild',
            'recoveryNeverTruncatesSymlinkedRunLogs',
            'recoverAllRepairsDamagedLogsAndNeverDeletesThem',
          ):
            assert case in cases, case
          print('Full core JUnit:',totals,'suites:',len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-recovery-header-id-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
