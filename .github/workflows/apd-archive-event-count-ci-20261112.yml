name: APD archive event-count source gate
on:
  push:
    branches: [chatgpt/apd-archive-event-count-20261112-2035]
    paths:
      - .github/workflows/apd-archive-event-count-ci-20261112.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifest.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifestEventCountTest.java
permissions: {contents: read}
concurrency:
  group: apd-archive-event-count-20261112
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Check scoped event-count validation and regression coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifest.java').read_text()
          tests=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifestEventCountTest.java').read_text()
          assert 'if (e.events < 0) throw new IllegalArgumentException("a file has a negative event count")' in source
          for name in ('negativeEventCountsAreRefusedWithValidChecksums',
                       'nonnegativeEventCountsRoundTripUnchanged',
                       'negativeEventCountStopsImportWithoutHistoryMutation'):
              assert 'void '+name+'(' in tests,name
          print('Scoped nonnegative event count guard and three regression tests present')
          PY
      - name: Run complete core suite and compile desktop and Android Java
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require clean JUnit including new and existing archive compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports,'missing JUnit XML'
          totals={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3337,totals
          assert all(totals[k]==0 for k in ('failures','errors','skipped')),totals
          cases={c.get('name') for r in reports for c in r.findall('testcase')}
          for name in ('negativeEventCountsAreRefusedWithValidChecksums',
                       'nonnegativeEventCountsRoundTripUnchanged',
                       'negativeEventCountStopsImportWithoutHistoryMutation',
                       'invalidSealedTokensAreRefusedWithCorrectChecksums',
                       'invalidRedactedTokensAreRefusedWithCorrectChecksums',
                       'aManifestRoundTrips',
                       'repeatedManifestPathKeepsFirstMatchAndNeverOverwritesHistory'):
              assert name in cases,name
          print('Full APD source suite:',totals,'suites:',len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-archive-event-count-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
