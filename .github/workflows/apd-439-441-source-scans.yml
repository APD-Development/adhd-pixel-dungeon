name: Scan exact prepared APD439-441 source archives
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-SOURCE-SCANS-REQUEST.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: apd-prepared-source-scans-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Test source archive rejection guards
        run: python3 -m unittest discover -s tools -p test_apd_scan_prepared_sources.py -v
      - id: matrix
        name: Validate pinned build request
        run: |
          matrix="$(python3 tools/apd_scan_prepared_sources.py --matrix docs/APD-SOURCE-SCANS-REQUEST.json)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
  scan:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the existing pinned source scanner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! curl --connect-timeout 20 --max-time 120 -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/apd-gitleaks.tar.gz; then
            gh api repos/gitleaks/gitleaks/releases/assets/378332058 -H 'Accept: application/octet-stream' > /tmp/apd-gitleaks.tar.gz
          fi
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/apd-gitleaks.tar.gz' | sha256sum -c -
          mkdir /tmp/apd-gitleaks
          tar -xzf /tmp/apd-gitleaks.tar.gz -C /tmp/apd-gitleaks
      - name: Verify original artifact and scan its exact source plus reachable history
        env:
          GH_TOKEN: ${{ github.token }}
          APD_SCAN_BUILD_NUMBER: ${{ matrix.number }}
        run: python3 tools/apd_scan_prepared_sources.py --request docs/APD-SOURCE-SCANS-REQUEST.json --number "$APD_SCAN_BUILD_NUMBER"
      - name: Retain exact scan receipts and redacted findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apd${{ matrix.number }}-prepared-source-scan-evidence
          path: source-scan-evidence/${{ matrix.number }}/
          if-no-files-found: error
          retention-days: 30
