name: APD466 exact frozen Developer wall receipt retry on memory-stable emulator
on:
  push:
    branches: [chatgpt/apd466-wall-recovery-2-20261113]
    paths: [.github/workflows/apd466-wall-recovery-second-publish.yml]
permissions: {contents: write, actions: read}
concurrency: {group: apd466-exact-candidate-and-delivery, cancel-in-progress: false}
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Developer
            case: WallGeometryDeviceTest
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Obtain only original frozen candidate bytes
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p candidate466
          gh run download 43426522500 --repo "$GITHUB_REPOSITORY" --name apd466-frozen-candidate --dir candidate466
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          d=pathlib.Path('candidate466'); receipt=json.loads((d/'receipt.json').read_text())
          assert receipt['source']=='d1b3681d3a2a4e6e62c7cd9398f732843c039de3' and receipt['build']==466
          for key,info in receipt['files'].items():
              name='APD-'+key+'-466.apk' if key in ('Developer','Alpha-Testers') else key
              f=d/name
              assert f.stat().st_size==info['bytes'] and hashlib.sha256(f.read_bytes()).hexdigest()==info['sha256']
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test exact original Developer/Alpha APK on Android with native visual receipts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot -no-window -memory 3072 -cores 2 -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none -skin 320x640
          script: |
            mkdir -p native466
            adb install -r candidate466/APD-${{ matrix.variant }}-466.apk
            adb install -r candidate466/APD-Instrumentation-466.apk
            adb logcat -c
            timeout 1200 adb shell am instrument -w -r -e class 'com.shatteredpixel.shatteredpixeldungeon.android.${{ matrix.case }}' com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > native466/instrumentation.txt 2>&1
            cat native466/instrumentation.txt
            python3 tools/apd466_native_postcheck.py --variant '${{ matrix.variant }}' --case '${{ matrix.case }}' --directory native466 --source d1b3681d3a2a4e6e62c7cd9398f732843c039de3
            adb logcat -d -v time > native466/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd466-native-${{ matrix.variant }}-${{ matrix.case }}
          path: native466/
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Require exact six accepted native receipts from this build
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -e
          mkdir -p candidate466 native-receipts
          gh run download 43426522500 --repo "$GITHUB_REPOSITORY" --name apd466-frozen-candidate --dir candidate466
          gh run download 43426522500 --repo "$GITHUB_REPOSITORY" --pattern 'apd466-native-*' --dir previous-native
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'apd466-native-*' --dir native-receipts
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          source='d1b3681d3a2a4e6e62c7cd9398f732843c039de3'
          receipt=json.loads(Path('candidate466/receipt.json').read_text())
          assert receipt['source']==source
          previous=list(Path('previous-native').rglob('native-verification.json'))
          recovered=list(Path('native-receipts').rglob('native-verification.json'))
          assert len(previous)==5,len(previous)
          assert len(recovered)==1,len(recovered)
          verified=previous+recovered
          expected={(variant,case) for variant in ('Developer','Alpha-Testers')
                    for case in ('WallGeometryDeviceTest','SearchContextDeviceTest','SeedHistoryDeviceTest')}
          seen=set()
          for p in verified:
              d=json.loads(p.read_text())
              assert d['source']==source and d['build']==466 and d['tests']==1
              assert d['device_transfer_complete'] and d['screenshots']
              seen.add((d['variant'],d['case']))
          assert seen==expected,(seen,expected)
          for key,info in receipt['files'].items():
              name='APD-'+key+'-466.apk' if key in ('Developer','Alpha-Testers') else key
              f=Path('candidate466')/name
              assert f.stat().st_size==info['bytes']
              assert hashlib.sha256(f.read_bytes()).hexdigest()==info['sha256']
          print('Exact frozen source, original signed APKs and six complete native visual test receipts verified')
          PY
          if gh release view apd-466 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing APD466 release" >&2
            exit 1
          fi
      - name: Publish only qualified original-signer APKs
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release create apd-466 candidate466/APD-Developer-466.apk candidate466/APD-Alpha-Testers-466.apk candidate466/APD-Source-466.zip --repo "$GITHUB_REPOSITORY" --target d1b3681d3a2a4e6e62c7cd9398f732843c039de3 --title 'APD466: APD458 restored gameplay playback, five 1x visual exceptions' --notes 'Exact APD458 gameplay and game-speed behavior restored, with only owner-approved 1x exceptions for floating status/symbol displays, enemy awareness alerts, both magical wells and gas. No APD464/465 experimental category changes. Both Developer and Alpha Testers original-signed APKs and matching source. No turn costs, hunger, scoring, or buff-turn modifications. Signed using the original APD identity. Source tests, Android/desktop compilation, original signer/package checks and six frozen APK native visual regressions are required before publishing. Physical RedMagic installation remains unverified.' --prerelease --latest=false
      - name: Read back published assets and check byte-for-byte hashes
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p readback
          gh release download apd-466 --repo "$GITHUB_REPOSITORY" --dir readback
          python3 - <<'PY'
          import hashlib,json,pathlib
          receipt=json.loads(pathlib.Path('candidate466/receipt.json').read_text())
          for key,info in receipt['files'].items():
              if key=='APD-Instrumentation-466.apk':continue
              name='APD-'+key+'-466.apk' if key in ('Developer','Alpha-Testers') else key
              f=pathlib.Path('readback')/name
              assert f.stat().st_size==info['bytes'] and hashlib.sha256(f.read_bytes()).hexdigest()==info['sha256']
          print('Published APKs and corresponding source read back and matched original frozen bytes')
          PY
