name: APD archive temporary symlink safety source gate
on:
  push:
    branches: [chatgpt/apd-archive-temp-symlink-20261112-1615]
    paths:
      - .github/workflows/apd-archive-temp-symlink-ci-20261112.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporter.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveHostileTest.java
permissions: {contents: read}
concurrency:
  group: apd-archive-temp-symlink-20261112-1615
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Enforce source and existing archive controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporter.java').read_text()
          t=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveHostileTest.java').read_text()
          assert 'new File(parent.getCanonicalFile(), f.getName())' in s
          assert 'new File(root.getCanonicalFile(), "import-tmp")' in s
          for name in ('importTempDirectorySymlinkDoesNotDeleteExternalFiles','nestedStaleImportTempSymlinkDoesNotDeleteExternalFiles','aSymlinkedHistoryDirectoryCannotSendImportedLogsOutsideTheRoot','anExistingSymlinkedLogCannotBeReadAsAlreadyImported'):
              assert name in t, name
          print('Archive temp symlink guards and regression cases present')
          PY
      - name: Full core suite and Android/desktop Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Check full JUnit XML and original archive compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports
          totals={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3318, totals
          assert all(totals[k]==0 for k in ('failures','errors','skipped')), totals
          cases={c.get('name') for r in reports for c in r.findall('testcase')}
          for name in ('importTempDirectorySymlinkDoesNotDeleteExternalFiles','nestedStaleImportTempSymlinkDoesNotDeleteExternalFiles','aSymlinkedHistoryDirectoryCannotSendImportedLogsOutsideTheRoot','anExistingSymlinkedLogCannotBeReadAsAlreadyImported','repeatedManifestPathKeepsFirstMatchAndNeverOverwritesHistory'):
              assert name in cases, name
          print('Full source suite:',totals,'suites:',len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-archive-temp-symlink-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
