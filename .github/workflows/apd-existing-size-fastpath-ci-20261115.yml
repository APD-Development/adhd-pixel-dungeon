name: APD existing history size fast-path exact-source verification
on:
  push:
    branches: [chatgpt/apd-existing-size-fastpath-20261115-2200]
    paths:
      - .github/workflows/apd-existing-size-fastpath-ci-20261115.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporter.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporterExistingSizeFastPathTest.java
permissions: {contents: read}
concurrency:
  group: apd-existing-size-fastpath-20261115
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Assert size guard and regression remain in exact source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporter.java').read_text()
          assert 'sameContent(target, st.entry.size, st.entry.sha256, localBuffer)' in s
          method = s.split('private static boolean sameContent(', 1)[1].split('private static void copy(', 1)[0]
          assert 'if (f.length() != expectedSize) return false;' in method
          assert method.index('f.length() != expectedSize') < method.index('new FileInputStream(f)')
          test = Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporterExistingSizeFastPathTest.java').read_text()
          assert 'void mixedSizeAndHashComparisonsKeepEveryOriginalHistoryFile(' in test
          PY
      - name: Complete core and desktop Android Java verification
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Assert full green JUnit and preserved archive semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert suites
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3515,totals
          assert totals['failures']==totals['errors']==totals['skipped']==0,totals
          names={t.get('name') for s in suites for t in s.findall('testcase')}
          for name in ('mixedSizeAndHashComparisonsKeepEveryOriginalHistoryFile',
                       'repeatedExistingHashChecksPreserveSkipCollisionAndNewLogBytes',
                       'hundredsOfDifferentExistingLogsPreserveEveryOriginalAndBoundReport',
                       'mixedIgnoredAndValidMembersPreserveEveryLogByte',
                       'corruptFinalMemberStillRollsBackAllPriorStagedLogs'):
              assert name in names,name
          print(totals,'suites',len(suites))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-existing-size-fastpath-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
