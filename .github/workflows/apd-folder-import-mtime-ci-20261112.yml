name: APD fallback history ZIP modification-time verification
on:
  push:
    branches: [chatgpt/apd-folder-import-mtime-20261112]
    paths:
      - .github/workflows/apd-folder-import-mtime-ci-20261112.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ApdFiles.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ApdFilesFolderProviderTest.java
permissions: {contents: read}
concurrency:
  group: apd-folder-import-mtime-20261112
  cancel-in-progress: false
jobs:
  source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Full APD core tests and desktop/Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require clean source suite and exact fallback-import regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'missing JUnit XML'
          totals={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3330, totals
          assert all(totals[k]==0 for k in ('failures','errors','skipped')), totals
          cases={case.get('name') for report in reports for case in report.findall('testcase')}
          for required in ('newerZipWinsEvenWhenItsNameSortsFirst','equalModificationTimesPreserveLexicographicFallback'):
              assert required in cases, required
          print('APD source tests', totals, 'suites', len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-folder-import-mtime-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
