name: APD history storage meter symlink source gate
on:
  push:
    branches: [chatgpt/apd-storage-meter-symlink-20261113-0019]
    paths:
      - .github/workflows/apd-storage-meter-symlink-ci-20261113.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/StorageMeter.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/StorageMeterTest.java
permissions: {contents: read}
concurrency:
  group: apd-storage-meter-symlink-20261113
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Confirm bounded source changes and filesystem regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          meter=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/StorageMeter.java').read_text()
          tests=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/StorageMeterTest.java').read_text()
          assert 'isOwnedChild(root, runsDir)' in meter
          assert 'isOwnedChild(root, legacyDir)' in meter
          assert 'isOwnedChild(root, index)' in meter
          assert 'isOwnedChild(parent, f)' in meter
          for case in ('derivedCacheSymlinkCycleAndExternalFilesDoNotInflateTotals','runAndLegacyAliasesAreNotReportedAsOwnedHistory','canonicalStorageRootCanItselfBeASymlink'):
            assert 'void '+case+'(' in tests, case
          print('Read-only storage path boundaries and real-filesystem regressions present')
          PY
      - name: Full core JUnit and desktop/Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Assert actual full JUnit and historical safety cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'missing JUnit reports'
          totals={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3378, totals
          assert all(totals[k]==0 for k in ('failures','errors','skipped')), totals
          cases={c.get('name') for r in reports for c in r.findall('testcase')}
          for case in (
            'derivedCacheSymlinkCycleAndExternalFilesDoNotInflateTotals',
            'runAndLegacyAliasesAreNotReportedAsOwnedHistory',
            'canonicalStorageRootCanItselfBeASymlink',
            'itCountsEvidenceAndCachesSeparatelyAndNeverTouchesThem',
            'itWarnsAsTheHistoryGrowsButNeverLimitsAnything',
            'damagedLogCopiedUnderAnotherValidRunIdIsNotTruncated',
            'copiedLogWithDifferentHeaderIdCannotImpersonateOriginalDuringRebuild',
          ):
            assert case in cases, case
          print('Full core JUnit:',totals,'suites:',len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-storage-meter-symlink-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
