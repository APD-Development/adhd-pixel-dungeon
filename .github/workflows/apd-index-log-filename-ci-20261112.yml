name: APD run-index filename boundary source gate
on:
  push:
    branches: [chatgpt/apd-index-invalid-log-filename-20261112-2300]
    paths:
      - .github/workflows/apd-index-log-filename-ci-20261112.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunIndex.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunIndexLogFilenameBoundaryTest.java
permissions: {contents: read}
concurrency:
  group: apd-index-log-filename-20261112
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Require actual filename-boundary code and regression cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunIndex.java').read_text()
          tests=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunIndexLogFilenameBoundaryTest.java').read_text()
          assert 'isValidLogFileName(name)' in code
          assert 'isValidLogFileName(e.logFile)' in code
          for case in (
            'invalidLogFilenamesAreIgnoredWithoutChangingTheirBytes',
            'validHeaderUnderInvalidFilenameCannotImpersonateItsRun',
            'checksumValidLegacyCacheWithInvalidLogFilenameIsRebuilt',
            'validFilenameWithUnreadableLogRemainsVisible',
          ):
            assert 'void '+case+'(' in tests, case
          print('Index filename validation and four regressions present')
          PY
      - name: Run full core tests and compile desktop and Android Java
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Verify all core JUnit reports and retained index contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'missing JUnit reports'
          totals={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3368, totals
          assert all(totals[k] == 0 for k in ('failures','errors','skipped')), totals
          cases={c.get('name') for r in reports for c in r.findall('testcase')}
          for case in (
            'invalidLogFilenamesAreIgnoredWithoutChangingTheirBytes',
            'validHeaderUnderInvalidFilenameCannotImpersonateItsRun',
            'checksumValidLegacyCacheWithInvalidLogFilenameIsRebuilt',
            'validFilenameWithUnreadableLogRemainsVisible',
            'refreshRejectsPathLikeRunIdsWithoutReadingOutsideHistory',
            'recoveryNeverTruncatesSymlinkedRunLogs',
            'saveAndLoadRoundTrip',
            'entriesDescribeEachRun',
          ):
            assert case in cases, case
          print('Full core JUnit:',totals,'suites:',len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-index-filename-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
