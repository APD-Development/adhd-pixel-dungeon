name: Verify APD one-array Search chooser
on:
  push:
    branches: [codex/apd-chooser-single-array-20261112]
    paths: [.github/workflows/apd-chooser-single-array-ci.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Require one caller-owned allocation and original chooser order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/SearchControlContext.java')
          source=p.read_text()
          chooser=source.split('public static Action[] choices(',1)[1].split('public static boolean openRoomInterior(',1)[0]
          assert 'Action[] options = new Action[2 + (saved ? 3 : 0) + (movement ? 1 : 0)]' in chooser
          assert 'options[next++] = first' in chooser
          assert 'for (Action action : CHOICE_ORDER)' in chooser
          assert 'if (action != first) options[next++] = action;' in chooser
          assert 'return options;' in chooser
          assert 'new ArrayList' not in chooser and '.toArray(' not in chooser
          assert chooser.count('new Action[') == 1, 'Chooser must allocate only its result array'
          assert 'Action.SEARCH, Action.WALL_SEARCH, Action.SHOW_SAVED,' in source
          assert 'Action.RESUME_MOVEMENT, Action.FORGET, Action.CANCEL' in source
          test=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/SearchControlContextTest.java').read_text()
          assert 'singleResultArrayPreservesEveryChooserStateWithoutGapsOrAliases' in test
          print('Exact result-size and stable option-order guards passed.')
          PY
      - name: Execute complete core suite and compile desktop and Android variants
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Verify zero failures and exact new regression
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          roots=[ET.parse(p).getroot() for p in pathlib.Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert roots, 'Core XML test reports are missing'
          totals={key:sum(int(r.get(key,0)) for r in roots) for key in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3264 and totals['failures']==totals['errors']==totals['skipped']==0, totals
          cases=[x.get('name') for r in roots if r.get('name','').endswith('.SearchControlContextTest') for x in r.findall('testcase')]
          assert cases.count('singleResultArrayPreservesEveryChooserStateWithoutGapsOrAliases') == 1, cases
          print('Complete core suite and new regression passed:',totals,'suites:',len(roots))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-one-array-chooser-core-reports
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
