name: APD streamed frame length varint exact-source CI
on:
  push:
    branches: [chatgpt/apd-stream-varint-20261116-0200]
    paths:
      - .github/workflows/apd-stream-varint-ci-20261116.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunLogReader.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunLogStreamingReadTest.java
permissions: {contents: read}
concurrency:
  group: apd-stream-varint-20261116
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Assert scoped streaming parser change and retained bounds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunLogReader.java').read_text()
          assert 'long len = 0;' in r
          assert 'if (i == 9 && (b & 0x7E) != 0)' in r
          assert 'f.streamEnd = pos + 1 + 1 + lengthBytes + payload.length + 4;' in r
          assert 'if (len < 0 || len > LogFormat.MAX_FRAME_PAYLOAD)' in r
          assert 'readFrame(in, pos, options.onlyRunStartEvents ? reusablePayload : null)' in r
          PY
      - name: Full core suite and desktop/Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require complete suite and varint parity regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert suites, 'missing JUnit results'
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3521,totals
          assert totals['failures']==totals['errors']==totals['skipped']==0,totals
          names={t.get('name') for s in suites for t in s.findall('testcase')}
          for name in ('streamedFrameLengthVarintBoundariesMatchBufferedReader',
                       'malformedStreamedLengthVarintsRetainExistingTruncationResults',
                       'identityOnlyStreamingReusesEqualLengthFramesAndKeepsDifferentLengthsCorrect',
                       'identityOnlyReadValidatesLargeGameplayEventsWithoutCopyingTheirTails'):
              assert name in names,name
          print(totals,'suites',len(suites))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-stream-varint-junit-20261116
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
