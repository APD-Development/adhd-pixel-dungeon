name: APD run-index cache link boundary source gate
on:
  push:
    branches: [chatgpt/apd-run-index-temp-link-boundary-20261112]
    paths:
      - .github/workflows/apd-run-index-cache-link-ci-20261112.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunIndex.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunIndexCacheLinkBoundaryTest.java
permissions: {contents: read}
concurrency:
  group: apd-run-index-cache-link-20261112
  cancel-in-progress: false
jobs:
  source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Check isolated cache-link guard and regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunIndex.java').read_text()
          t=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunIndexCacheLinkBoundaryTest.java').read_text()
          assert 'if (indexFile.isFile() && isDirectIndexFile(indexFile))' in s
          assert 'if (!isDirectIndexFile(tmp)) throw new IOException' in s
          for name in ('linkedTempMustNotOverwriteExternalBytesOrSavedIndex', 'linkedCacheWithValidChecksumCannotHideActualHistory', 'symlinkedStorageRootStillSupportsOrdinaryIndexSaveAndLoad'):
              assert name in t, name
          print('Run-index cache path boundaries and three filesystem regressions present')
          PY
      - name: Full core tests and desktop/Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require passing full JUnit suite and cache-link regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'missing JUnit XML'
          totals={k:sum(int(r.get(k, 0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3357, totals
          assert all(totals[k] == 0 for k in ('failures','errors','skipped')), totals
          cases={c.get('name') for r in reports for c in r.findall('testcase')}
          for case in ('linkedTempMustNotOverwriteExternalBytesOrSavedIndex', 'linkedCacheWithValidChecksumCannotHideActualHistory', 'symlinkedStorageRootStillSupportsOrdinaryIndexSaveAndLoad', 'refreshRejectsPathLikeRunIdsWithoutReadingOutsideHistory', 'recoveryNeverTruncatesSymlinkedRunLogs', 'leftoverTempFileFromAnInterruptedSaveIsHarmless', 'separateInstancesSerializeTheirAtomicSave'):
              assert case in cases, case
          print('APD full source JUnit:', totals, 'suites:', len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-run-index-cache-link-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
