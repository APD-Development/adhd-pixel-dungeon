name: Verify APD native vulnerable-boss target control
on:
  push:
    branches: [chatgpt/apd-pylon-vulnerable-native-20261112-1345]
    paths: [.github/workflows/apd-pylon-vulnerable-native-ci-20261112.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check exact bounded native fixture change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('android/src/androidTest/java/com/shatteredpixel/shatteredpixeldungeon/android/BossPylonTargetingDeviceTest.java').read_text()
          assert src.count('void vulnerableBoss()') == 1
          assert 'boss.supercharged = false;' in src
          assert 'refresh("vulnerable-boss-retains-target", boss, boss, boss, true, true);' in src
          assert 'render(() -> probe.get().vulnerableBoss());' in src
          names=re.findall(r'capture\(probe.get\(\), "(pylon-native-[^"]+\.png)"\)',src)
          assert names == [
              'pylon-native-inactive-visible.png',
              'pylon-native-active-visible.png',
              'pylon-native-manual-rat-preserved.png',
              'pylon-native-ranged-pylon-melee-boss.png',
              'pylon-native-hidden-excluded.png'
          ],names
          assert src.count('@Test public void nativeIndicatorsPreserveManualTargetsAndExcludeHiddenOrInactivePylons()')==1
          print('Native pylon probe extended without changing existing screenshot inventory')
          PY
      - name: Full core tests and Android/desktop Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Verify complete core JUnit result
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          roots=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert roots, 'No full core suite reports'
          counts={k:sum(int(x.get(k,'0')) for x in roots) for k in ('tests','failures','errors','skipped')}
          assert counts['tests']>=3302 and not any(counts[k] for k in ('failures','errors','skipped')),counts
          print('Verified complete suite:',counts,'suites:',len(roots))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-native-pylon-vulnerable-core-reports
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
