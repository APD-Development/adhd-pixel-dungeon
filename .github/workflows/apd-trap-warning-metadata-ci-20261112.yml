name: Verify APD trap warning incomplete metadata
on:
  push:
    branches: [codex/apd-trap-warning-incomplete-metadata-20261112]
    paths: [.github/workflows/apd-trap-warning-metadata-ci-20261112.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Check bounded warning metadata guards and regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/TrapStepPermit.java').read_text()
          assert 'level.traps==null || level.map==null || step>=level.map.length' in source
          assert 'level.heroFOV==null || step>=level.heroFOV.length' in source
          test=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/TrapWarningMetadataTest.java').read_text()
          required=('visibleIdentifiedActiveTrapStillWarns',
                    'missingTrapCollectionDoesNotCrashOrInventWarning',
                    'missingOrTruncatedVisibilityDoesNotCrashOrInventWarning',
                    'missingOrTruncatedTerrainDoesNotCrashOrInventWarning')
          assert all(name in test for name in required),required
          print('Observed-trap warning guards and four regressions are present')
          PY
      - name: Run full core tests and compile desktop and Android Java
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require complete core suite and all four new regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports,'Missing JUnit reports'
          totals={key:sum(int(r.get(key,0)) for r in reports) for key in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3288 and all(totals[k]==0 for k in ('failures','errors','skipped')),totals
          suites=[r for r in reports if r.get('name','').endswith('.TrapWarningMetadataTest')]
          assert len(suites)==1,'Missing trap warning metadata JUnit suite'
          cases={t.get('name') for t in suites[0].findall('testcase')}
          expected={'visibleIdentifiedActiveTrapStillWarns',
                    'missingTrapCollectionDoesNotCrashOrInventWarning',
                    'missingOrTruncatedVisibilityDoesNotCrashOrInventWarning',
                    'missingOrTruncatedTerrainDoesNotCrashOrInventWarning'}
          assert expected<=cases,expected-cases
          print('Verified',totals,'across',len(reports),'suites and all four trap warning cases')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-trap-warning-metadata-core-results
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
