name: APD streamed header bounded-allocation exact-source CI
on:
  push:
    branches: [chatgpt/apd-stream-header-efficient-20261116-0700]
    paths:
      - .github/workflows/apd-stream-header-size-ci-20261116.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunLogReader.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunLogStreamingReadTest.java
permissions: {contents: read}
concurrency:
  group: apd-stream-header-size-20261116
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Assert bounded header read and intact history validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunLogReader.java').read_text()
          tests=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunLogStreamingReadTest.java').read_text()
          header=src.split('private static byte[] readHeader( InputStream in ) throws IOException {',1)[1].split('static byte[] readFully(',1)[0]
          assert 'byte[] prefix = new byte[LogFormat.MAGIC.length + 3];' in header
          assert 'if (bodyLength > LogFormat.MAX_HEADER_BODY) return prefix;' in header
          assert 'java.util.Arrays.copyOf(prefix, prefix.length + bodyLength + 4)' in header
          assert 'in.read(header, pos, header.length - pos)' in header
          assert 'new ByteArrayOutputStream(' not in header
          assert 'crc.reset();' in src
          assert 'if (crc.getValue() != stored)' in src
          assert 'streamedHeaderExactLengthsMatchBufferedReaderUpToMaximum' in tests
          assert 'streamedHeaderTruncationAndFutureFormatMatchBufferedReader' in tests
          PY
      - name: Full core suite and desktop/Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require clean complete JUnit suite, including new header regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert suites,'missing JUnit results'
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3526,totals
          assert totals['failures']==totals['errors']==totals['skipped']==0,totals
          names={t.get('name') for s in suites for t in s.findall('testcase')}
          for name in ('streamedHeaderExactLengthsMatchBufferedReaderUpToMaximum',
                       'streamedHeaderTruncationAndFutureFormatMatchBufferedReader',
                       'streamingFrameResultReuseKeepsEveryEventPayloadIndependent',
                       'streamingChecksumReusePreservesManyValidFramesAndDetectsLaterCorruption',
                       'streamedFrameLengthVarintBoundariesMatchBufferedReader'):
              assert name in names,name
          print(totals,'suites',len(suites))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-stream-header-size-junit-20261116
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
