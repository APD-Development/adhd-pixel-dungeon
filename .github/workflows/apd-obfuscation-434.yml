name: Build APD434 Obfuscation explanation and verify Android windows
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-434-BUILD-REQUEST.txt]
permissions: {contents: read, actions: read}
concurrency: {group: apd434-verified-build, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Recover exact previous compiled history without changing previous builds
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 tools/apd_owner_delivery_policy.py
          python3 - <<'PY'
          import json,pathlib,subprocess,sys
          sys.path.insert(0,'tools')
          from apd_build_history import merge_previous_apk,embed
          repo='APD-Development/ShieldingShouldHaveWorked'
          artifact=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/actions/artifacts/13799220595']))
          assert not artifact['expired']
          assert artifact['digest']=='sha256:c24bf81501a836f0c207412603a0f7470cff72df8a31943d32b661a77c463856'
          assert artifact['workflow_run']['head_sha']=='3cc23e1b4727a2401b7f4d4efd414973bcf2bef5'
          subprocess.run(['gh','run','download','42890868062','--repo',repo,'--name','apd433-built-pair','--dir','fallback'],check=True)
          previous=list(pathlib.Path('fallback').rglob('APD-Developer-433.apk'))
          assert len(previous)==1
          merge_previous_apk(pathlib.Path.cwd(),previous[0],'Codex TEST 433')
          changed=subprocess.check_output(['git','diff','--name-only','3cc23e1b4727a2401b7f4d4efd414973bcf2bef5','HEAD'],text=True).splitlines()
          assert 'core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/mechanics/ObfuscationExplanation.java' in changed
          assert 'core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/mechanics/MechanicsDetails.java' in changed
          assert 'android/src/androidTest/java/com/shatteredpixel/shatteredpixeldungeon/android/QolItemFeedbackDeviceTest.java' in changed
          ledger={'date':'2026-11-10','changes':[{'category':'Bug Fixes','sprite':'ICON_PREFS','title':'clearer armor glyph explanations','text':'Obfuscation now explains with a practical example how its stealth reduces detection chance, including a known Arcana comparison. Ordinary armor glyph windows no longer have an unnecessary calculations panel. No gameplay or balance values changed.','paths':changed}]}
          embed(pathlib.Path.cwd(),ledger,434)
          index=pathlib.Path('core/src/main/assets/apd/history/index.tsv').read_text()
          assert 'Codex TEST 433' in index and 'Codex TEST 434' in index
          pathlib.Path('evidence').mkdir(exist_ok=True)
          pathlib.Path('evidence/source.json').write_text(json.dumps({'source_commit':__import__('os').environ['GITHUB_SHA'],'previous_source':'3cc23e1b4727a2401b7f4d4efd414973bcf2bef5','changed_paths':changed},indent=2)+'\n')
          PY
      - name: Run core suite and compile all required variants before building
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac -PapdTestBuild -PapdBuild=C434
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as E
          roots=[E.parse(p).getroot() for p in pathlib.Path('core/build/test-results/test').glob('TEST-*.xml')]
          totals={key:sum(int(r.get(key,0)) for r in roots) for key in ('tests','failures','errors','skipped')}
          assert len(roots)==458 and totals=={'tests':3169,'failures':0,'errors':0,'skipped':0},(len(roots),totals)
          print(totals)
          PY
      - name: Assemble Developer and Alpha-Testers; verify original signature and built-in history
        run: |
          mkdir -p owner-delivery
          ./gradlew :android:assembleDebug :android:assembleDebugAndroidTest -PapdTestBuild -PapdBuild=C434
          cp android/build/outputs/apk/debug/android-debug.apk owner-delivery/APD-Developer-434.apk
          cp android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk evidence/instrumentation.apk
          ./gradlew :android:assembleDebug -PapdBuild=P434
          cp android/build/outputs/apk/debug/android-debug.apk owner-delivery/APD-Alpha-Testers-434.apk
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,os,sys
          sys.path.insert(0,'tools')
          from apd_build_history import verify_compiled
          from apd_existing_build_evidence import certificates
          root=pathlib.Path('.')
          signer=sorted((pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools').glob('*/apksigner'))[-1]
          aapt=signer.parent/'aapt'
          signatures={}
          for variant in ('Developer','Alpha-Testers'):
              p=root/'owner-delivery'/('APD-'+variant+'-434.apk')
              assert p.exists() and p.stat().st_size>1000000
              result=subprocess.check_output([str(signer),'verify','--print-certs',str(p)],text=True)
              cert=certificates(result)
              assert cert==['067688b3ab6bd5820a67f4c1ba7d5859db578173771cf31d3252b3e4e012246e'],cert
              metadata=subprocess.check_output([str(aapt),'dump','badging',str(p)],text=True)
              assert 'com.charltonchris29.adhdpixeldungeon.indev' in metadata
              verify_compiled(root,p)
              signatures[variant]={'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size,'cert':cert[0]}
          (root/'evidence'/'apks.json').write_text(json.dumps(signatures,indent=2)+'\n')
          print(json.dumps(signatures))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd434-built-pair
          path: |
            owner-delivery/
            evidence/
            core/build/test-results/test/
          retention-days: 30
  native:
    needs: build
    strategy:
      fail-fast: false
      matrix: {variant: [Developer, Alpha-Testers]}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: apd434-built-pair}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual item-window acceptance on the built APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none -skin 320x640
          script: |
            mkdir -p evidence
            adb install -r owner-delivery/APD-${{ matrix.variant }}-434.apk
            adb install -r evidence/instrumentation.apk
            timeout 1800 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.QolItemFeedbackDeviceTest com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/${{ matrix.variant }}-qol.txt
            python3 tools/apd_check_single_instrumentation.py evidence/${{ matrix.variant }}-qol.txt grassDewControlsRingBreakdownsSearchedWallAndOfflineLicenseRenderNatively com.shatteredpixel.shatteredpixeldungeon.android.QolItemFeedbackDeviceTest
            adb pull /sdcard/Pictures/APD-Test-Visuals/. evidence/${{ matrix.variant }}-visuals/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd434-native-${{ matrix.variant }}
          path: evidence/
          retention-days: 30
