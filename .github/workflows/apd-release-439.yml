# ADHD Pixel Dungeon 2026; GPL-3.0-or-later
name: Publish verified APD439 Developer and Alpha-Testers APKs
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-439-RELEASE-REQUEST.txt]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Independently verify exact successful producer and APK pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run watch 42938370462 --repo "$GITHUB_REPOSITORY" --exit-status --interval 15
          python3 tools/apd_owner_delivery_policy.py
          python3 - <<'PY'
          import json,subprocess,pathlib,hashlib,zipfile,xml.etree.ElementTree as E,os,sys
          repo=os.environ['GITHUB_REPOSITORY']
          api=lambda uri:json.loads(subprocess.check_output(['gh','api',uri]))
          assert api('repos/'+repo)['private']
          run=api('repos/'+repo+'/actions/runs/42938370462')
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']=='8224872be92c44827282ff8ba6bde363d67f0826'
          assert run['path']=='.github/workflows/apd-pylon-439.yml'
          jobs=api('repos/'+repo+'/actions/runs/42938370462/jobs')['jobs']
          assert len(jobs)==3 and all(j['conclusion']=='success' for j in jobs)
          artifacts=api('repos/'+repo+'/actions/runs/42938370462/artifacts')['artifacts']
          expected={'apd439-built-pair','apd439-native-Developer','apd439-native-Alpha-Testers'}
          assert expected.issubset({a['name'] for a in artifacts if not a['expired']})
          root=pathlib.Path('proof');root.mkdir()
          for name in sorted(expected):
              subprocess.run(['gh','run','download','42938370462','--repo',repo,'--name',name,'--dir',str(root/name)],check=True)
          built=root/'apd439-built-pair'
          xml=list(built.rglob('TEST-*.xml'))
          suites=[E.parse(path).getroot() for path in xml]
          totals={key:sum(int(s.get(key,0)) for s in suites) for key in ['tests','failures','errors','skipped']}
          assert len(suites)==461 and totals==dict(tests=3179,failures=0,errors=0,skipped=0),(len(suites),totals)
          proof=json.loads(next(built.rglob('apks.json')).read_text())
          signer=sorted((pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools').glob('*/apksigner'))[-1]
          sys.path.insert(0,'tools')
          from apd_existing_build_evidence import certificates
          cert_expected='067688b3ab6bd5820a67f4c1ba7d5859db578173771cf31d3252b3e4e012246e'
          for variant in ['Developer','Alpha-Testers']:
              apk=built/'owner-delivery'/('APD-'+variant+'-439.apk')
              assert apk.is_file() and apk.stat().st_size>1000000
              assert hashlib.sha256(apk.read_bytes()).hexdigest()==proof[variant]['sha256']
              output=subprocess.check_output([str(signer),'verify','--print-certs',str(apk)],text=True)
              assert certificates(output)==[cert_expected]
              with zipfile.ZipFile(apk) as z:
                  assert 'Codex TEST 439' in z.read('assets/apd/history/index.tsv').decode()
                  f=z.read('assets/apd/features.txt').decode().splitlines()
                  assert 'grudge' in f
                  if variant=='Alpha-Testers':
                      assert 'testBuild' not in f and 'demoUnlock' not in f and 'clericPlayable' not in f
              native=root/('apd439-native-'+variant)
              reports=list(native.rglob('*-qol.txt'))
              assert len(reports)==1 and 'OK (1 test)' in reports[0].read_text()
              screenshots=list(native.rglob('qol-automatic-inventory-*.png'))
              assert len(screenshots)>=5 and all(p.stat().st_size>2000 for p in screenshots)
          pathlib.Path('release-notes.md').write_text(
              'APD439: DM-300 pylon targeting fix. During its supercharged invulnerable phase, '
              'automatic aiming now prioritizes an active, visible and aimable power pylon over the boss. '
              'Inactive pylons are never selected by this priority. Existing boss damage, shields, '
              'player item mechanics, challenge balance, and save format remain unchanged. '
              'Preserves APD438 preset menus and all ten visual playback speeds. '
              'Both signed Android APKs passed 3179 core tests and native API34 checks. '
              'Physical-phone acceptance is not claimed. Install over your current app without uninstalling.\\n')
          print('Exact producer, tests, APK hashes, certificate and both native tests verified')
          PY
      - name: Publish immutable new APD439 GitHub release and verify download-back
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view apd-alpha-preview-439 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "APD439 release already exists; refusing to overwrite"
            exit 1
          fi
          gh release create apd-alpha-preview-439 --repo "$GITHUB_REPOSITORY" \
            --target 8224872be92c44827282ff8ba6bde363d67f0826 --prerelease --latest=false \
            --title "APD439: DM-300 active pylon targeting" --notes-file release-notes.md \
            proof/apd439-built-pair/owner-delivery/APD-Developer-439.apk \
            proof/apd439-built-pair/owner-delivery/APD-Alpha-Testers-439.apk
          mkdir -p downloaded
          gh release download apd-alpha-preview-439 --repo "$GITHUB_REPOSITORY" --pattern 'APD-*-439.apk' --dir downloaded
          for variant in Developer Alpha-Testers; do
            cmp "proof/apd439-built-pair/owner-delivery/APD-${variant}-439.apk" "downloaded/APD-${variant}-439.apk"
          done
          gh release view apd-alpha-preview-439 --repo "$GITHUB_REPOSITORY" --json url,isDraft,assets
