# Exact rerun after fixing only the synthetic local damaged-log fixture; failed first CI retained.
name: APD destructive recovery symlink guard
on:
  push:
    branches: [chatgpt/apd-recovery-symlink-20261112-1630]
    paths: [.github/workflows/apd-recovery-symlink-ci-20261112.yml]
permissions: {contents: read}
concurrency:
  group: apd-recovery-symlink-20261112-1630
  cancel-in-progress: false
jobs:
  source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Confirm bounded destructive-recovery guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          store = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/StatsStore.java').read_text()
          tests = Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunIndexTest.java').read_text()
          assert '&& isDirectRunLog(f)' in store
          assert 'canonical.getParentFile().equals(runsDir.getCanonicalFile())' in store
          assert 'canonical.getName().equals(log.getName())' in store
          assert 'recoveryNeverTruncatesSymlinkedRunLogs' in tests
          assert 'recoverAllRepairsDamagedLogsAndNeverDeletesThem' in tests
          print('Recovery log boundary and existing damaged-log compatibility control present')
          PY
      - name: Full core tests and desktop/Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require every JUnit case to pass with recovery regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'missing JUnit XML'
          totals={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3319, totals
          assert all(totals[k]==0 for k in ('failures','errors','skipped')), totals
          cases={c.get('name') for r in reports for c in r.findall('testcase')}
          assert {'recoveryNeverTruncatesSymlinkedRunLogs', 'recoverAllRepairsDamagedLogsAndNeverDeletesThem', 'checksumValidUncountedTailRebuildsFromOriginalLogs'} <= cases
          print('Verified full core suite:', totals, 'suites:', len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-recovery-symlink-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
