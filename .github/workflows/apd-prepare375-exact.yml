name: Prepare exact APD375 artifacts after completed native retry without rebuilding
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-375-EXACT-PREPARATION.txt]
permissions: {contents: read, actions: read}
concurrency: {group: apd375-exact-preparation, cancel-in-progress: false}
jobs:
  prepare:
    runs-on: ubuntu-latest
    env: {APD_SOURCE_SHA: '2f68a25e89825af707958798cb4e8a3929dfa339'}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {artifact-ids: '13596681044', run-id: '42428089148', github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {artifact-ids: '13596816381', run-id: '42428089148', github-token: '${{ github.token }}', path: evidence}
      - uses: actions/download-artifact@v4
        with: {artifact-ids: '13596139375', run-id: '42428089148', github-token: '${{ github.token }}', path: evidence}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Verify exact identities, completed tests and corresponding source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 tools/apd_prepare375.py
      - name: Scan key-free source and full reachable history
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/apd-gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/apd-gitleaks.tar.gz' | sha256sum -c -
          mkdir /tmp/apd-gitleaks
          tar -xzf /tmp/apd-gitleaks.tar.gz -C /tmp/apd-gitleaks
          python3 tools/apd_qol_source_scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd375-prepared-owner-pair
          path: owner-delivery/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd375-source-and-native-evidence
          path: |
            evidence/
            core/build/test-results/test/
            docs/APD-375-DELIVERY-SPEC.json
          retention-days: 14
