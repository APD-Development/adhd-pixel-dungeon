name: APD derived facts direct-log boundary source gate
on:
  push:
    branches: [chatgpt/apd-derivedstore-log-boundary-20261113-0031]
    paths:
      - .github/workflows/apd-derivedstore-log-boundary-ci-20261113.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/DerivedStore.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/DerivedStoreLogLinkBoundaryTest.java
permissions: {contents: read}
concurrency:
  group: apd-derivedstore-log-boundary-20261113
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Confirm narrow source and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/DerivedStore.java').read_text()
          test=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/DerivedStoreLogLinkBoundaryTest.java').read_text()
          assert 'canonicalDir.equals(canonical.getParentFile())' in source
          assert 'f.getName().equals(canonical.getName())' in source
          for name in ('apdDerivedFactsIgnoreExternalLinksAndInDirectoryAliases',
                       'legacyDerivedFactsIgnoreExternalLinksAndInDirectoryAliases',
                       'canonicalDirectChildrenRemainReadableUnderLinkedHistoryRoot'):
            assert 'void '+name+'(' in test, name
          print('Direct-child boundary, owner history root compatibility and three regressions present')
          PY
      - name: Full core JUnit and desktop/Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Assert full JUnit and established history safeguards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'missing JUnit reports'
          totals={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3378, totals
          assert all(totals[k]==0 for k in ('failures','errors','skipped')), totals
          cases={c.get('name') for r in reports for c in r.findall('testcase')}
          for case in ('apdDerivedFactsIgnoreExternalLinksAndInDirectoryAliases',
                       'legacyDerivedFactsIgnoreExternalLinksAndInDirectoryAliases',
                       'canonicalDirectChildrenRemainReadableUnderLinkedHistoryRoot',
                       'copiedLogWithDifferentHeaderIdCannotImpersonateOriginalDuringRebuild',
                       'recoveryNeverTruncatesSymlinkedRunLogs',
                       'theCacheIsUsedWhileCurrentAndRebuiltWhenAnythingChanges'):
            assert case in cases, case
          print('Full core JUnit:',totals,'suites:',len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-derivedstore-boundary-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
