name: Verify APD archive destination symlink refusal
on:
  push:
    branches: [chatgpt/apd-archive-symlink-boundary-20261112-1445]
    paths: [.github/workflows/apd-archive-symlink-ci-20261112.yml]
permissions: {contents: read}
concurrency:
  group: apd-archive-symlink-source-verification-20261112
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Check bounded destination guard and both hostile regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          imp=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporter.java').read_text()
          tests=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveHostileTest.java').read_text()
          assert 'File canonicalRoot = root.getCanonicalFile();' in imp
          assert 'expectedTarget.equals(target.getCanonicalFile())' in imp
          assert 'aSymlinkedHistoryDirectoryCannotSendImportedLogsOutsideTheRoot' in tests
          assert 'anExistingSymlinkedLogCannotBeReadAsAlreadyImported' in tests
          print('Bounded symlink destination guard and both regressions are present')
          PY
      - name: Full core tests and desktop and Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require complete clean core suite and preserve existing duplicate compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          roots=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert roots,'missing core JUnit XML'
          totals={k:sum(int(r.get(k,0)) for r in roots) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3306, totals
          assert all(totals[k]==0 for k in ('failures','errors','skipped')),totals
          cases={c.get('name') for r in roots for c in r.findall('testcase')}
          expected={'aSymlinkedHistoryDirectoryCannotSendImportedLogsOutsideTheRoot','anExistingSymlinkedLogCannotBeReadAsAlreadyImported','repeatedManifestPathKeepsFirstMatchAndNeverOverwritesHistory'}
          assert expected<=cases,expected-cases
          print('Verified two new symlink regressions and unchanged duplicate first-wins contract',totals,'suites',len(roots))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-archive-symlink-core-results
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
