###keys
items.keys.goldenkey.name=golden key
items.keys.goldenkey.desc=Opens one locked chest on its matching dungeon floor. The key is consumed when used.

items.keys.crystalkey.name=crystal key
items.keys.crystalkey.desc=Opens one crystal door or crystal chest on its matching dungeon floor. Using it consumes the key, so choose which lock to open.

items.keys.ironkey.name=iron key
items.keys.ironkey.desc=Opens one ordinary locked door on its matching dungeon floor. The key is consumed when used.

items.keys.wornkey.name=worn key
items.keys.wornkey.desc=Opens one locked exit on its matching dungeon floor. The key is consumed when used.



