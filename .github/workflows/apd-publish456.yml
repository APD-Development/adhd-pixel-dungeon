name: Publish verified APD456 Developer and Alpha APKs
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/apd-publish456.yml]
permissions: {contents: write, actions: read}
concurrency: {group: apd456-one-time-publish, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact source build and six successful frozen-APK Android checks
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,time
          repo='APD-Development/ShieldingShouldHaveWorked'
          expectations=[
            (43132795009,'2734fe532e282bc415c47e1d9892fa547386b075'),
            (43132867920,'7cdd9aedbebf6d31cae02cc12074205804ac4dc1'),
            (43132940662,'89a27848ed0275554dc6d8f3490d7e05de904b98')]
          for run_id,sha in expectations:
            for attempt in range(240):
              r=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}']))
              assert r['head_sha']==sha,(run_id,r['head_sha'],sha)
              if r['status']=='completed':
                assert r['conclusion']=='success',(run_id,r['conclusion'])
                break
              time.sleep(10)
            else: raise RuntimeError(f'Timeout waiting for {run_id}')
          jobs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/43132940662/jobs?per_page=100']))['jobs']
          assert len(jobs)==6 and all(j['conclusion']=='success' for j in jobs),[(j['name'],j['conclusion']) for j in jobs]
          arts=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/43132940662/artifacts?per_page=100']))['artifacts']
          expected={f'apd456-native-{variant}-{case}' for variant in ('Developer','Alpha-Testers')
                    for case in ('WallGeometryDeviceTest','SearchContextDeviceTest','SeedHistoryDeviceTest')}
          assert {a['name'] for a in arts}==expected,[(a['name'],a['expired']) for a in arts]
          assert all(not a['expired'] for a in arts)
          PY
          if gh release view apd-456 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'APD456 release already exists. Refusing to overwrite known-good assets.' >&2
            exit 1
          fi
      - name: Download exactly verified and signed original APK artifacts
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh run download 43132867920 --repo "$GITHUB_REPOSITORY" --name apd456-unaccepted-gated-room-candidate --dir candidate456
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('candidate456')
          r=json.loads((p/'receipt.json').read_text())
          assert r['build']==456 and r['source']=='2734fe532e282bc415c47e1d9892fa547386b075'
          assert set(r['files'])=={'Developer','Alpha-Testers','Instrumentation'}
          for kind,info in r['files'].items():
            name='APD-Instrumentation-456.apk' if kind=='Instrumentation' else f'APD-{kind}-456.apk'
            f=p/name
            assert f.stat().st_size==info['bytes']
            assert hashlib.sha256(f.read_bytes()).hexdigest()==info['sha256'],name
          source=p/'APD-Source-456.zip'
          assert source.is_file() and source.stat().st_size>100000
          print('Verified frozen artifacts for APD456',r['files'])
          PY
      - name: Publish prerelease with direct APK downloads
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh release create apd-456 candidate456/APD-Developer-456.apk candidate456/APD-Alpha-Testers-456.apk candidate456/APD-Source-456.zip \
            --repo "$GITHUB_REPOSITORY" --target 2734fe532e282bc415c47e1d9892fa547386b075 \
            --title 'APD456: seed-reuse scoring snapshot integrity' \
            --notes 'Verified Developer and Alpha-Testers APKs on the same signed APD456 source. Preserves previously approved APD seed-reuse scoring while rejecting internally inconsistent saved score and retention values, without recalculating valid historical records. Previously approved adaptive Search and Copy Seed fixes are preserved. Core/Android compilation and six isolated Android emulator cases must pass before publication. Existing game save compatibility and signer are retained. Physical-phone installation has not been verified.' \
            --prerelease --latest=false
      - name: Read back published APKs and verify exact digests
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p release-readback
          gh release download apd-456 --repo "$GITHUB_REPOSITORY" --dir release-readback
          python3 - <<'PY'
          import hashlib,json,pathlib
          r=json.loads(pathlib.Path('candidate456/receipt.json').read_text())
          for kind in ('Developer','Alpha-Testers'):
            name=f'APD-{kind}-456.apk'
            p=pathlib.Path('release-readback')/name
            assert p.stat().st_size==r['files'][kind]['bytes']
            assert hashlib.sha256(p.read_bytes()).hexdigest()==r['files'][kind]['sha256']
          assert hashlib.sha256(pathlib.Path('release-readback/APD-Source-456.zip').read_bytes()).hexdigest()==hashlib.sha256(pathlib.Path('candidate456/APD-Source-456.zip').read_bytes()).hexdigest()
          print('All three public APD456 release assets verified against frozen originals.')
          PY
