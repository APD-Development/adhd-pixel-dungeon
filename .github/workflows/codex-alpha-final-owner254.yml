          run-id: '38950078074'
          github-token: ${{ github.token }}
          path: supplemental/failed-first-gesture
      - uses: actions/download-artifact@v4
        with:
          name: apd-final-alpha-api36
          run-id: '38952725527'
          github-token: ${{ github.token }}
          path: supplemental/failed-pager-repeat
      - uses: actions/download-artifact@v4
        with:
          name: apd-final-alpha-api36
          run-id: '38953589679'
          github-token: ${{ github.token }}
          path: supplemental/failed-system-ui
      - uses: actions/download-artifact@v4
        with:
          name: apd-final-alpha-api36
          run-id: '38954130127'
          github-token: ${{ github.token }}
          path: supplemental/failed-acknowledged-pager
      - uses: actions/download-artifact@v4
        with:
          name: apd-final-alpha-api36
          run-id: '38955341493'
          github-token: ${{ github.token }}
          path: supplemental/failed-destroyed-preview-fixture
      - name: Prepare current factual PDF and preserve supplemental evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install reportlab==4.2.5 pypdf==5.1.0
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib,re,shutil,subprocess,zipfile
          from pypdf import PdfReader
          root=pathlib.Path('delivery');evidence={}
          main=json.loads((root/'TEST254-Verification.json').read_text())
          import sys
          sys.path.insert(0,'tools')
          from apd_existing_build_evidence import xml_summary
          for kind,count in [('core',1736),('android',36)]:
              original=xml_summary('primary-evidence/'+kind)
              assert original['tests']==count
              assert {(c['classname'],c['name']) for c in original['cases']}=={(c['classname'],c['name']) for c in main[kind]['cases']}
          source=main['source'];expected=main['apk_sha256']
          assert source=='832c1a5679a8cd216e8c57638f1bc0fe2442fdfe'
          primary_cases={(c['classname'],c['name']) for c in main['android']['cases']}
          for api,count in [(34,1),(36,8)]:
              folder=pathlib.Path('supplemental')/('api'+str(api))
