name: Package verified unchanged409 apps after exact scanner false-positive review
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-409-SCAN-RECOVERY-REQUEST.json]
permissions: {contents: read, actions: read}
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Require all original-APK retry cases actually passed
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PY'
          import json,subprocess
          d=json.loads(subprocess.check_output(['gh','run','view','42604779534','--repo','APD-Development/ShieldingShouldHaveWorked','--json','jobs,headSha,conclusion']))
          jobs={j['name']:j['conclusion'] for j in d['jobs']}
          assert d['headSha']=='bc1d183faab5f2587a11a9cf668b387001ba1792'
          assert jobs['instrumentation']=='success' and jobs['native (Developer, developer)']=='success' and jobs['native (Alpha-Testers, alpha)']=='success'
          assert jobs['prepare']=='failure' and d['conclusion']=='failure'
          PY
          gh run download 42604779534 --repo "$GITHUB_REPOSITORY" --name apd409-prepared-owner-pair --dir owner-delivery
          gh run download 42604779534 --repo "$GITHUB_REPOSITORY" --name apd409-source-and-native-evidence --dir complete-evidence
      - name: Verify unchanged original APKs and each completed native case
        run: |
          python3 - <<'PY'
          import pathlib,json,hashlib,subprocess
          p=pathlib.Path('owner-delivery/APD-Preview-409-Verification.json');d=json.loads(p.read_text());assert d['source_commit']=='9fddee7ee05770375925106afe455723b6a2d93b' and d['core_tests']==3126 and d['android_tests']==12
          assert d['original_apk_build_run']==42602974963 and d['retry_new_application_apks_created']==0
          for label,digest in d['apk_hashes'].items():assert hashlib.sha256(pathlib.Path('owner-delivery/APD-'+label+'-409.apk').read_bytes()).hexdigest()==digest
          assert hashlib.sha256(pathlib.Path('owner-delivery/APD-Source-409.zip').read_bytes()).hexdigest()==d['source_sha256']
          cases={'qol':'grassDewControlsRingBreakdownsSearchedWallAndOfflineLicenseRenderNatively','wall':'observedGeometryAndRetainedMarksUseTheActualAndroidLayer','seed':'a_controlWritesEnabledPreference','restart':'b_freshProcessReadsEnabledAndCanDisable','gameplay':'c_runtimeDiscoveryRouteAndActualTrapEffect','freeze':'cancelledGhoulAttackReleasesQueueButLiveAttackStaysPending'}
          for label in ['developer','alpha']:
            for case,method in cases.items():
              cls={'qol':'QolItemFeedbackDeviceTest','wall':'WallGeometryDeviceTest','freeze':'RemovedActorStallDeviceTest'}.get(case,'TrapDiscoveryDeviceTest')
              subprocess.run(['python3','tools/apd_check_single_instrumentation.py',str(pathlib.Path('complete-evidence/evidence')/(label+'-'+case+'.txt')),method,'com.shatteredpixel.shatteredpixeldungeon.android.'+cls],check=True)
          PY
      - name: Scan exact source and full history with reviewed full-line classification
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          if ! curl --connect-timeout 20 -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/apd-gitleaks.tar.gz; then
            gh api repos/gitleaks/gitleaks/releases/assets/378332058 -H 'Accept: application/octet-stream' > /tmp/apd-gitleaks.tar.gz
          fi
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/apd-gitleaks.tar.gz' | sha256sum -c -
          mkdir /tmp/apd-gitleaks
          tar -xzf /tmp/apd-gitleaks.tar.gz -C /tmp/apd-gitleaks
          python3 tools/apd_qol_source_scan.py
          python3 - <<'PY'
          import pathlib,json,os,shutil
          p=pathlib.Path('owner-delivery/APD-Preview-409-Verification.json');d=json.loads(p.read_text());d['packaging_recovery_run']=os.environ['GITHUB_RUN_ID'];d['scan_review_commit']=os.environ['GITHUB_SHA'];d['packaging_new_application_apks_created']=0;p.write_text(json.dumps(d,indent=2)+'\n')
          target=pathlib.Path('complete-evidence/evidence/scan-recovery');target.mkdir(parents=True,exist_ok=True)
          shutil.copy('docs/APD-409-SCAN-RECOVERY-REQUEST.json',target/'exact-line-review.json');shutil.copy('docs/evidence/APD-409-scan-failure-review.zip',target/'initial-scan-failure-review.zip');shutil.copy('tools/apd_qol_source_scan.py',target/'scanner-classifier.py')
          with pathlib.Path('owner-delivery/release-notes.md').open('a') as f:f.write('\nPackaging recovery: all12 native cases passed on original409APKs. Scanner falsely flagged SkeletonKey test boolean field assignment; exact original full-line SHA256 reviewed and pinned, no path/rule blanket exclusion. Exact source and full history rescanned. Original failures, two-call fixture patch and review preserved. No app APK rebuilt.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: apd409-prepared-owner-pair, path: owner-delivery/, retention-days: 30}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: apd409-source-and-native-evidence, path: complete-evidence/, retention-days: 14}
