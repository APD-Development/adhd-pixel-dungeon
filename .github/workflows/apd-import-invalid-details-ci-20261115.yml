name: APD invalid-present archive diagnostics exact-source verification
on:
  pull_request:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths:
      - .github/workflows/apd-import-invalid-details-ci-20261115.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporter.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporterInvalidEntryDetailsTest.java
permissions: {contents: read}
concurrency:
  group: apd-invalid-archive-details-20261115-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Require bounded invalid-member diagnostic and preservation cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporter.java').read_text()
          tst=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporterInvalidEntryDetailsTest.java').read_text()
          assert 'MAX_INVALID_ENTRY_DETAILS = 100' in src
          assert 'invalidDetails < MAX_INVALID_ENTRY_DETAILS' in src
          assert 'invalidDetails++ == MAX_INVALID_ENTRY_DETAILS' in src
          for name in ('fewInvalidPresentEntriesRetainOriginalDiagnosticNames',
                       'manyInvalidPresentEntriesKeepExactRejectionCountAndOriginalHistory'):
              assert 'void '+name+'(' in tst, name
          print('Invalid-present diagnostic bound and two real-ZIP regressions found')
          PY
      - name: Run full core tests and compile desktop and Android Java
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Verify all core results and preserved archive compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'Missing JUnit reports'
          sums={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert sums['tests'] >= 3500, sums
          assert all(sums[k]==0 for k in ('failures','errors','skipped')), sums
          cases={c.get('name') for r in reports for c in r.findall('testcase')}
          for name in ('fewInvalidPresentEntriesRetainOriginalDiagnosticNames',
                       'manyInvalidPresentEntriesKeepExactRejectionCountAndOriginalHistory',
                       'fewMissingEntriesRetainEveryOriginalDiagnostic',
                       'hundredsOfMissingEntriesAreAllRejectedWithoutGrowingReportOrChangingHistory',
                       'smallArchiveStillReportsEveryIgnoredExtraByName',
                       'manyExtraEntriesKeepValidImportAndBoundDiagnosticMemory',
                       'repeatedManifestPathKeepsFirstMatchAndNeverOverwritesHistory'):
              assert name in cases, 'Missing case: '+name
          print('JUnit:', sums, 'suites', len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-invalid-present-details-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
