name: Verify existing corrective tester APK without rebuilding
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-CORRECTIVE-PAIR-TESTER-REQUEST.json]
permissions: {contents: read, actions: read}
concurrency: {group: apd-corrective-tester-acceptance, cancel-in-progress: false}
jobs:
  actual-tester-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Recover exact tester APK and prove application inputs
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 tools/apd_pair_tester_check.py
      - name: Compile instrumentation only
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          python3 - <<'PYCODE'
          import json,pathlib,re,subprocess,os
          sdk=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools'
          versions=[p for p in sdk.iterdir() if (p/'apksigner').exists() and (p/'aapt').exists()]
          tools=sorted(versions,key=lambda p:p.name)[-1]
          signature=subprocess.check_output([str(tools/'apksigner'),'verify','--print-certs','application/exact-tester.apk'],text=True)
          digests=re.findall(r'certificate SHA-256 digest:\s*([0-9a-fA-F]{64})',signature)
          expected='067688b3ab6bd5820a67f4c1ba7d5859db578173771cf31d3252b3e4e012246e'
          assert digests and {d.lower() for d in digests}=={expected},signature
          cert=expected
          package=subprocess.check_output([str(tools/'aapt'),'dump','badging','application/exact-tester.apk'],text=True).splitlines()[0]
          expected_version=int(re.search(r"appVersionCode\s*=\s*(\d+)",pathlib.Path("build.gradle").read_text()).group(1))
          assert "name='com.charltonchris29.adhdpixeldungeon.indev'" in package and f"versionCode='{expected_version}'" in package,package
          assert "-bP"+os.environ["APD_TEST_NUMBER"] in package,package
          pathlib.Path('tester-identity.json').write_text(json.dumps({'signature_verified':True,'certificate_sha256':cert,'package':package,'physical_phone_tested':False},indent=2)+'\n')
          PYCODE
          ./gradlew :android:assembleDebugAndroidTest -PapdBuild=P${{ env.APD_TEST_NUMBER }}
          test ! -f android/build/outputs/apk/debug/android-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual tester healing, searched-wall color and saved-run checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_7
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb shell wm size 320x640
            adb shell wm density 160
            adb logcat -c
            adb logcat -v time > tester-logcat.txt &
            adb install -r application/exact-tester.apk
            adb install -r android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.HealingSettingsDeviceTest,com.shatteredpixel.shatteredpixeldungeon.android.QolStableCaptureDeviceTest,com.shatteredpixel.shatteredpixeldungeon.android.ApdSettingsClickDeviceTest#adultHumorControlWorksWithoutAnAgeProviderAndReopensWithSavedChoice com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > tester-instrumentation.txt
            cat tester-instrumentation.txt
            python3 -c "import pathlib; assert 'OK (4 tests)' in pathlib.Path('tester-instrumentation.txt').read_text()"
            mkdir -p tester-visuals
            adb pull /sdcard/Pictures/APD-Test-Visuals/. tester-visuals/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-corrective-pair-tester-checks
          path: |
            acceptance-source.json
            tester-identity.json
            tester-instrumentation.txt
            tester-logcat.txt
            tester-visuals/
          retention-days: 14
