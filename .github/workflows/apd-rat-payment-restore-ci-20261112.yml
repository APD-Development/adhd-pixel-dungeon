name: Verify APD Rat King Quick Search payment restore guards
on:
  push:
    branches: [codex/apd-rat-quick-search-payment-fields-20261112]
    paths: [.github/workflows/apd-rat-payment-restore-ci-20261112.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Require mandatory payment fields and preserved optional legacy search cost
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/RatKingQuickSearch.java').read_text()
          method=source.split('public static void restore(Hero hero,Bundle bundle){',1)[1]
          for key in ('width','height','door','anchor','total','remaining','hunger'):
              assert '!b.contains("'+key+'")' in method,key
          assert 'b.contains("search_cost")?b.getFloat("search_cost"):2f' in method
          test=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/RatKingRoomAndSearchTest.java').read_text()
          for name in ('missingDoorCannotRestorePaidQuickSearch','missingAnchorCannotRestorePaidQuickSearch',
                       'missingRemainingCannotRestoreFreeCompletion','missingHungerStateCannotRestorePaidQuickSearch',
                       'legacyPaidSearchWithoutOptionalSearchCostStillRestores'):
              assert name in test,name
          print('Required restore fields and original legacy compatibility preserved')
          PY
      - name: Run complete core tests and compile desktop and Android Java
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require full core success and five payment regression cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports,'Missing core JUnit XML'
          totals={key:sum(int(report.get(key,0)) for report in reports) for key in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3284 and not any(totals[key] for key in ('failures','errors','skipped')),totals
          suites=[r for r in reports if r.get('name','').endswith('.RatKingRoomAndSearchTest')]
          assert len(suites)==1,'Missing RatKingRoomAndSearchTest'
          names={test.get('name') for test in suites[0].findall('testcase')}
          required={'missingDoorCannotRestorePaidQuickSearch','missingAnchorCannotRestorePaidQuickSearch',
                    'missingRemainingCannotRestoreFreeCompletion','missingHungerStateCannotRestorePaidQuickSearch',
                    'legacyPaidSearchWithoutOptionalSearchCostStillRestores'}
          assert required <= names,required-names
          print('Verified',totals,'across',len(reports),'suites and all five new payment regressions')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-rat-payment-restore-core-results
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
