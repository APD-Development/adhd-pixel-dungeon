items.scrolls.exotic.exoticscroll.tiwaz=exotic scroll of TIWAZ
items.scrolls.exotic.exoticscroll.unknown_desc=A glowing indecipherable magical rune is written on this black parchment. It seems to be foreign to this land, who knows what it will do when read aloud?
items.scrolls.exotic.exoticscroll.discover_hint=You can craft this item via alchemy.

items.scrolls.exotic.scrollofsirenssong.name=scroll of siren's song
items.scrolls.exotic.scrollofsirenssong.prompt=Choose a target
items.scrolls.exotic.scrollofsirenssong.no_target=The scroll activates without a target.
items.scrolls.exotic.scrollofsirenssong.cancel=You must choose a target.
items.scrolls.exotic.scrollofsirenssong.desc=Permanently turns a chosen enemy into an ally and temporarily charms other visible enemies. Immune targets may be charmed instead.
items.scrolls.exotic.scrollofsirenssong$enthralled.name=enthralled
items.scrolls.exotic.scrollofsirenssong$enthralled.desc=This creature has been bewitched by the magic of a scroll of siren's song.\n\nAn enthralled character is permanently your ally, and will fight any enemies they encounter.

items.scrolls.exotic.scrollofantimagic.name=scroll of anti-magic
items.scrolls.exotic.scrollofantimagic.desc=Protects against many magical attacks for _%s turns_, but suppresses most of your own magic, including rings, artifacts, enchantments and curses. Armor abilities still work.

items.scrolls.exotic.scrollofchallenge.name=scroll of challenge
items.scrolls.exotic.scrollofchallenge.desc=Draws creatures to you and marks an arena for up to _%s turns_. Inside, you take _33%% less damage_ and hunger does not increase. Leaving ends the effect; arena size depends on the surrounding space.
items.scrolls.exotic.scrollofchallenge$challengearena.name=challenge arena
items.scrolls.exotic.scrollofchallenge$challengearena.desc=Take _33%% less damage_ and stop growing hungry while inside the red arena. Leaving ends the effect.\n\nTurns remaining: %d.

items.scrolls.exotic.scrollofdivination.name=scroll of divination
items.scrolls.exotic.scrollofdivination.nothing_left=There is nothing left to identify!
items.scrolls.exotic.scrollofdivination.desc=Identifies up to _4_ unknown potion, scroll or ring types. These need not be in your inventory.
items.scrolls.exotic.scrollofdivination$wnddivination.desc=Your scroll of divination has identified the following items:

items.scrolls.exotic.scrollofdread.name=scroll of dread
items.scrolls.exotic.scrollofdread.desc=Terrifies visible enemies, making them flee the floor once far enough out of sight. Damage and time can end the fear. Resistant enemies suffer ordinary fear instead. Fleeing enemies leave no normal loot and can grant less experience.

items.scrolls.exotic.scrollofenchantment.name=scroll of enchantment
items.scrolls.exotic.scrollofenchantment.inv_title=Enchant an item
items.scrolls.exotic.scrollofenchantment.weapon=Select an enchantment to apply to your weapon.
items.scrolls.exotic.scrollofenchantment.armor=Select a glyph to apply to your armor.
items.scrolls.exotic.scrollofenchantment.cancel=cancel
items.scrolls.exotic.scrollofenchantment.cancel_warn=Cancelling will still consume your scroll of enchantment, are you sure?
items.scrolls.exotic.scrollofenchantment.cancel_warn_yes=Yes, I'm sure
items.scrolls.exotic.scrollofenchantment.cancel_warn_no=No, I changed my mind
items.scrolls.exotic.scrollofenchantment.desc=Choose one of three new enchantments for a weapon or glyphs for armor, replacing its current effect.

items.scrolls.exotic.scrollofforesight.name=scroll of foresight
items.scrolls.exotic.scrollofforesight.desc=Automatically maps terrain and reveals hidden doors and traps within _%1$d tiles_ for _%2$s turns_.

items.scrolls.exotic.scrollofmetamorphosis.name=scroll of metamorphosis
items.scrolls.exotic.scrollofmetamorphosis.choose_desc=Choose a talent to metamorphose.
items.scrolls.exotic.scrollofmetamorphosis.replace_desc=Choose a new talent to replace your metamorphosed talent with.
items.scrolls.exotic.scrollofmetamorphosis.cancel_warn=Cancelling will still consume your scroll of metamorphosis, are you sure?
items.scrolls.exotic.scrollofmetamorphosis.metamorphose_talent=metamorphose talent
items.scrolls.exotic.scrollofmetamorphosis.desc=Swaps a class talent for a talent from another hero of the same tier, keeping its spent points. You are offered one random talent from each other hero. Subclass and armor-ability talents are excluded; you cannot pick a talent you already have. Brew it with alchemical energy into greater metamorphosis to choose from every talent instead.

items.scrolls.exotic.scrollofmysticalenergy.name=scroll of mystical energy
items.scrolls.exotic.scrollofmysticalenergy.desc=Recharges equipped, uncursed artifacts for _%s turns_. Also works on carried artifacts that a talent lets you use.

items.scrolls.exotic.scrollofpassage.name=scroll of passage
items.scrolls.exotic.scrollofpassage.desc=Returns to a dungeon region entrance, useful for revisiting shops. Cannot be used on sealed floors, in the mining site or vault, or while carrying the Amulet.
items.scrolls.exotic.scrollofpassage.desc_current=Returns to the region entrance on _Floor %d_, useful for revisiting shops. Cannot be used on sealed floors, in the mining site or vault, or while carrying the Amulet.

items.scrolls.exotic.scrollofprismaticimage.name=scroll of prismatic image
items.scrolls.exotic.scrollofprismaticimage.desc=Summons a guardian copy that appears when nearby enemies threaten you and shares your armor protection. Reading again fully heals an existing guardian.

items.scrolls.exotic.scrollofpsionicblast.name=scroll of psionic blast
items.scrolls.exotic.scrollofpsionicblast.ondeath=The Psionic Blast tears your mind apart...
items.scrolls.exotic.scrollofpsionicblast.desc=Deals heavy damage to all visible creatures, including allies. Also damages, blinds and weakens you; hitting more targets reduces the self-damage. Can kill you.



###spells
items.spells.alchemize.name=alchemize
items.spells.alchemize.prompt=Alchemize an Item
items.spells.alchemize.desc=Turns an item or stack into gold or alchemical energy without visiting a shop or alchemy pot. Energizing a potion or scroll also identifies its type. Buy casts in shops or craft them from a seed and a runestone.
items.spells.alchemize$wndalchemizeitem.sell=Turn into %dg
items.spells.alchemize$wndalchemizeitem.sell_1=Turn 1 into %dg
items.spells.alchemize$wndalchemizeitem.sell_all=Turn all into %dg
items.spells.alchemize$wndalchemizeitem.energize=Turn into %d energy
items.spells.alchemize$wndalchemizeitem.energize_1=Turn 1 into %d energy
items.spells.alchemize$wndalchemizeitem.energize_all=Turn all into %d energy

items.spells.beaconofreturning.name=beacon of returning
items.spells.beaconofreturning.preventing=The strong magic aura of this place prevents you from using the spell!
items.spells.beaconofreturning.creatures=The Psychic aura of neighbouring creatures doesn't allow you to teleport at this moment.
items.spells.beaconofreturning.set=The beacon was set at your current location.
items.spells.beaconofreturning.wnd_body=Setting will override the location the beacon was previously set to.\n\nReturning will return to your last set location and consume one use of the spell.
items.spells.beaconofreturning.wnd_set=Set
items.spells.beaconofreturning.wnd_return=Return
items.spells.beaconofreturning.desc_set=This beacon was set somewhere on floor %d.
items.spells.beaconofreturning.desc=Marks your location so you can teleport back later. Marking or replacing the location does not consume a cast; returning does. Cannot bypass restrictions on travel between floors or return you to the mining side floor.

items.spells.curseinfusion.name=curse infusion
items.spells.curseinfusion.inv_title=Curse an item
items.spells.curseinfusion.desc=Curses equipment, replacing a weapon’s enchantment or armor’s glyph with a curse. Weapons, armor and wands also gain bonus upgrades while cursed. Repeated infusions do not stack the bonus, but can change a weapon or armor curse. Removing the curse removes the bonus upgrades.

items.spells.spell.ac_cast=CAST
items.spells.spell.no_magic=You can't cast spells while magic immune.
items.spells.spell.discover_hint=You can craft this item via alchemy.

items.spells.greatermetamorphosis.name=greater metamorphosis
items.spells.greatermetamorphosis.desc=A scroll of metamorphosis refined with alchemical energy. Choose one of your talents, then replace it with any talent from any other hero's matching tier, instead of one random talent per hero. Your points carry over. Backing out before picking keeps the spell.
items.spells.magicalinfusion.name=magical infusion
items.spells.magicalinfusion.inv_title=Infuse an item
items.spells.magicalinfusion.infuse=Your item is infused with arcane energy!
items.spells.magicalinfusion.desc=Upgrades an item like a scroll of upgrade, while preserving its enchantment, glyph or curse.

items.spells.magicalporter.name=magical porter
items.spells.magicalporter.inv_title=Port an item
items.spells.magicalporter.nowhere=There is nowhere for you to port an item to.
items.spells.magicalporter.desc=This spell will magically transport any item it is cast on. Unlike a merchant's beacon however, the items will be transported to the entrance of the next boss floor.

items.spells.phaseshift.name=phase shift
items.spells.phaseshift.no_target=There is nothing to teleport there.
items.spells.phaseshift.desc=Teleports the target to a random location on the same floor. A successful teleport also paralyzes the target, except bosses and minibosses. Can target yourself. Normal teleportation restrictions still apply.

items.spells.reclaimtrap.name=reclaim trap
items.spells.reclaimtrap.no_trap=There is no trap there.
items.spells.reclaimtrap.desc_trap=The spell is currently ready to trigger a _%s._
items.spells.reclaimtrap.desc=Captures and disarms a visible, active trap. Cast again to release its effect at the target location, consuming the spell. Only one trap can be stored at a time, and some effects need suitable terrain.

items.spells.recycle.name=recycle
items.spells.recycle.inv_title=Recycle an item
items.spells.recycle.recycled=Your item was recycled into: %s.
items.spells.recycle.desc=Changes one potion, scroll, seed, runestone or tipped dart into a different random item of the same kind. Exotic potions and scrolls stay exotic. Cannot recycle equipment, elixirs or brews.

items.spells.summonelemental.name=summon elemental
items.spells.summonelemental.ac_imbue=IMBUE
items.spells.summonelemental.imbue_prompt=Imbue an item
items.spells.summonelemental.desc=Summons one friendly elemental to fight for you. If your elemental is already present, casting recalls it beside you without consuming a spell. Recalling still takes a turn and needs an open tile.
items.spells.summonelemental.desc_newborn=Summons a _newborn elemental_ with no ranged attack. Imbue this spell with an identified potion of liquid flame or frost, or a scroll of recharging or transmutation, to change future summons.
items.spells.summonelemental.desc_fire=Summons a _fire elemental_. Against targets outside water, melee hits have a 50% chance to ignite and ranged hits ignite. Cold severely hurts it. Re-imbuing changes future summons.
items.spells.summonelemental.desc_frost=Summons a _frost elemental_. Melee hits have a one-in-three chance to freeze, guaranteed against targets in water. Ranged hits freeze. Fire severely hurts it. Re-imbuing changes future summons.
items.spells.summonelemental.desc_shock=Summons a _shock elemental_. Its melee lightning can jump to nearby creatures, including you and your allies. Its ranged attacks blind. Re-imbuing changes future summons.
items.spells.summonelemental.desc_chaos=Summons a _chaos elemental_ whose attacks unleash random cursed wand effects. These can help or harm. Re-imbuing changes future summons.

items.spells.targetedspell.prompt=Choose a target
items.spells.targetedspell.inv_title=Infuse an item

items.spells.telekineticgrab.name=telekinetic grab
items.spells.telekineticgrab.cant_grab=You can't grab that.
items.spells.telekineticgrab.no_target=There's nothing to grab there.
items.spells.telekineticgrab.desc=Collects loose items from a distant tile, or throwing weapons stuck in an enemy. Cannot take shop goods or open containers such as chests. Collection stops if you cannot carry an item.

items.spells.unstablespell.name=unstable spell
items.spells.unstablespell.desc=Uses a random scroll effect. With enemies in sight, it chooses from combat effects; otherwise, it chooses a utility effect.

items.spells.wildenergy.name=wild energy
items.spells.wildenergy.desc=Recharges wands and uncursed artifacts you can currently use, then briefly speeds further recharging. Also fires unpredictable cursed wand magic in your chosen direction, which can help or harm.


###runestones
items.stones.inventorystone.ac_use=USE

items.stones.runestone$placeholder.name=runestone
items.stones.runestone.discover_hint=You can find this item randomly in the dungeon, or craft it via alchemy.

items.stones.stoneofaggression.name=stone of aggression
items.stones.stoneofaggression.desc=Marks a creature as a preferred target for alert enemies. Can target an enemy, an ally or yourself, but not a boss or miniboss.
items.stones.stoneofaggression$aggression.name=targeted
items.stones.stoneofaggression$aggression.desc=Alert enemies prefer to attack this character when choosing a target.\n\nTurns remaining: %s.

items.stones.stoneofaugmentation.name=stone of augmentation
items.stones.stoneofaugmentation.inv_title=Augment an item
items.stones.stoneofaugmentation.desc=Trades weapon damage for faster attacks, or attack speed for more damage. Faster throwing weapons also last longer; slower ones wear out sooner. On armor, trades protection for evasion or evasion for protection. Can also remove an existing augmentation.
items.stones.stoneofaugmentation.discover_hint=You can buy this item in a shop, or craft it via alchemy.
items.stones.stoneofaugmentation$wndaugment.choice=Augmenting for one property will reduce the other. What property would you like to enhance?
items.stones.stoneofaugmentation$wndaugment.already=This item is already augmented, you can swap the augment or remove it.
items.stones.stoneofaugmentation$wndaugment.speed=+Speed -Damage
items.stones.stoneofaugmentation$wndaugment.damage=+Damage -Speed
items.stones.stoneofaugmentation$wndaugment.evasion=+Evasion -Defense
items.stones.stoneofaugmentation$wndaugment.defense=+Defense -Evasion
items.stones.stoneofaugmentation$wndaugment.none=Remove Augmentation
items.stones.stoneofaugmentation$wndaugment.cancel=Never mind

items.stones.stoneofblast.name=stone of blast
items.stones.stoneofblast.desc=Explodes as soon as it lands, damaging everyone on or next to its tile. Like a bomb, it can destroy nearby items and terrain.

items.stones.stoneofblink.name=stone of blink
items.stones.stoneofblink.desc=Teleports you to where the stone lands. Obstacles and occupied tiles limit its destination.

items.stones.stoneofclairvoyance.name=stone of clairvoyance
items.stones.stoneofclairvoyance.desc=Maps a large area around where it lands, even through walls, revealing hidden doors and traps. Does not reveal creatures.

items.stones.stoneofdeepsleep.name=stone of deep sleep
items.stones.stoneofdeepsleep.desc=Puts another creature into magical sleep. Enemies stay asleep until disturbed; allies heal while asleep and wake at full health.

items.stones.stoneofdetectmagic.name=stone of detect magic
items.stones.stoneofdetectmagic.inv_title=Detect an item
items.stones.stoneofdetectmagic.detected_none=You don't detect any magic affecting this item.
items.stones.stoneofdetectmagic.detected_both=You detect both positive and malevolent magic affecting this item!
items.stones.stoneofdetectmagic.detected_good=You detect positive magic affecting this item!
items.stones.stoneofdetectmagic.detected_bad=You detect malevolent magic affecting this item!
items.stones.stoneofdetectmagic.desc=Reveals curses and reports whether equipment has beneficial magic, such as upgrades, enchantments or glyphs. Does not identify its upgrade level.

items.stones.stoneofdisarming.name=stone of disarming
items.stones.stoneofdisarming.desc=This runestone holds magic that can disable malicious traps hidden throughout the dungeon. It will disarm up to 9 traps around the area it is thrown at.

items.stones.stoneofenchantment.name=stone of enchantment
items.stones.stoneofenchantment.inv_title=Enchant an item
items.stones.stoneofenchantment.weapon=Your weapon glows in the darkness!
items.stones.stoneofenchantment.armor=Your armor glows in the darkness!
items.stones.stoneofenchantment.desc=Replaces a weapon’s enchantment or armor’s glyph with a random beneficial one. Does not upgrade the item.

items.stones.stoneoffear.name=stone of fear
items.stones.stoneoffear.desc=Makes a creature flee from you. Has no effect on allies. Attacking the fleeing creature shortens the fear.

items.stones.stoneofflock.name=stone of flock
items.stones.stoneofflock.desc=Summons short-lived magical sheep around where it lands. The sheep block movement, letting you obstruct a passage or separate enemies.

items.stones.stoneofintuition.name=stone of intuition
items.stones.stoneofintuition.inv_title=Select an item
items.stones.stoneofintuition.desc=Lets you guess the type of an unknown potion, scroll or ring. A correct guess identifies its type. Does not identify a ring’s upgrades or curse.
items.stones.stoneofintuition.break_info=_Your next guess will not consume a stone._ Every second guess uses one, whether right or wrong.
items.stones.stoneofintuition.break_warn=_Your next guess will consume a stone_, whether right or wrong.
items.stones.stoneofintuition$wndguess.text=Guess what the type of the unidentified item is. If you guess correctly, the type will be identified!
items.stones.stoneofintuition$wndguess.correct=Correct. The item's type has been identified!
items.stones.stoneofintuition$wndguess.incorrect=Your guess was incorrect.
items.stones.stoneofintuition$wndguess.break=Your stone of intuition crumbles to dust...

items.stones.stoneofshock.name=stone of shock
items.stones.stoneofshock.desc=Briefly paralyzes creatures within 2 tiles. If any are hit, each wand regains 1 charge plus 1 per creature. Deals no damage.


###trinkets
items.trinkets.chaoticcenser.name=chaotic censer
items.trinkets.chaoticcenser.spew=Your censer is about to spew: %s.
items.trinkets.chaoticcenser.desc=This enchanted censer builds up gas and vents it toward enemies. Watch its warning: the gas can harm you too.
items.trinkets.chaoticcenser.typical_stats_desc=At +0: Releases random gas near an enemy about every _%d turns_, with a warning beforehand. It only releases gas when enemies are present. Upgrades make powerful, exotic gases more common.
items.trinkets.chaoticcenser.stats_desc=Releases random gas near an enemy about every _%d turns_, with a warning beforehand. It only releases gas when enemies are present. Upgrades make powerful, exotic gases more common.

items.trinkets.crackedspyglass.name=cracked spyglass
items.trinkets.crackedspyglass.desc=A cracked spyglass that adds hidden loot to the dungeon. Search can uncover it.
items.trinkets.crackedspyglass.typical_stats_desc=At +0: Each non-boss floor has a _%1$s%% chance_ to contain an extra hidden item.
items.trinkets.crackedspyglass.stats_desc=Each non-boss floor has a _%1$s%% chance_ to contain an extra hidden item.
items.trinkets.crackedspyglass.stats_desc_upgraded=Adds one hidden item to each non-boss floor, with a _%1$s%% chance_ of a second.

items.trinkets.dimensionalsundial.name=dimensional sundial
items.trinkets.dimensionalsundial.warning=Your sundial isn't casting a shadow, you feel uneasy.
items.trinkets.dimensionalsundial.desc=This small handheld sundial is somehow able to cast a shadow in the depths of the dungeon, even if you aren't holding it upright. Even more strangely, the shadow's position seems to have no relation to the sun in this world. When no shadow is cast, the sundial seems to attract danger.
items.trinkets.dimensionalsundial.typical_stats_desc=At +0: Enemies spawn _%1$d%% less often_ from 8am to 8pm and _%2$d%% more often_ from 8pm to 8am, using your phone's clock.
items.trinkets.dimensionalsundial.stats_desc=Enemies spawn _%1$d%% less often_ from 8am to 8pm and _%2$d%% more often_ from 8pm to 8am, using your phone's clock.

items.trinkets.exoticcrystals.name=exotic crystals
items.trinkets.exoticcrystals.desc=Pink crystals that alter the potions and scrolls you find. They cannot be spent as alchemy energy.
items.trinkets.exoticcrystals.typical_stats_desc=At +0: Replaces _%s%%_ of potion and scroll drops with their exotic versions. Strength potions, upgrade scrolls and items needed to solve hazard rooms are unaffected.
items.trinkets.exoticcrystals.stats_desc=Replaces _%s%%_ of potion and scroll drops with their exotic versions. Strength potions, upgrade scrolls and items needed to solve hazard rooms are unaffected.

items.trinkets.eyeofnewt.name=eye of newt
items.trinkets.eyeofnewt.desc=An enchanted newt’s eye. Trades ordinary sight for the ability to sense enemies through walls.
items.trinkets.eyeofnewt.typical_stats_desc=At +0: Reduces your sight range by _%1$s%%_, but lets you sense enemies within _%2$d tiles_, even through walls. Stealthy mimics evade this sensing.
items.trinkets.eyeofnewt.stats_desc=Reduces your sight range by _%1$s%%_, but lets you sense enemies within _%2$d tiles_, even through walls. Stealthy mimics evade this sensing.

items.trinkets.ferrettuft.name=ferret tuft
items.trinkets.ferrettuft.desc=A tuft of ferret fur tied with a green ribbon.
items.trinkets.ferrettuft.typical_stats_desc=At +0, increases evasion by _%1$s%%_ for you, your allies _and your enemies_.
items.trinkets.ferrettuft.stats_desc=Increases evasion by _%1$s%%_ for you, your allies _and your enemies_.

items.trinkets.mimictooth.name=mimic tooth
items.trinkets.mimictooth.desc=This large sharp tooth must have been pulled from a very unhappy mimic. It seems to be influencing the mimics of the dungeon, making them more frequent and dangerous.
items.trinkets.mimictooth.typical_stats_desc=At +0: Makes mimics _%1$s×_ as common, harder to spot and more rewarding to defeat. Ordinary floors also have a _%2$s%% chance_ to spawn a stealthy ebony mimic.
items.trinkets.mimictooth.stats_desc=Makes mimics _%1$s×_ as common, harder to spot and more rewarding to defeat. Ordinary floors also have a _%2$s%% chance_ to spawn a stealthy ebony mimic.

items.trinkets.mossyclump.name=mossy clump
items.trinkets.mossyclump.desc=This clump of wet moss seems to hold onto its moisture no matter how hard you squeeze it. It seems to be magically tied to the dungeon itself, making grass and water more likely to appear.
items.trinkets.mossyclump.typical_stats_desc=At +0: a _%d%% chance_ to make a new, otherwise ordinary dungeon floor grassy or watery. Excludes Floor 1, bosses and side areas. Costs extra energy to upgrade.
items.trinkets.mossyclump.stats_desc=A _%d%% chance_ to make a new, otherwise ordinary dungeon floor grassy or watery. Excludes Floor 1, bosses and side areas. Costs extra energy to upgrade.

items.trinkets.parchmentscrap.name=parchment scrap
items.trinkets.parchmentscrap.desc=This little scrap of parchment looks like it came from a scroll. It has retained some of its magic, and it seems to be influencing weapons and armor found in the dungeon.
items.trinkets.parchmentscrap.typical_stats_desc=At +0: Makes randomly generated enchantments and glyphs _%d×_ as common, and weapon and armor curses _%s×_ as common. Other item curses are unaffected. Costs extra energy to upgrade.
items.trinkets.parchmentscrap.stats_desc=Makes randomly generated enchantments and glyphs _%d×_ as common, and weapon and armor curses _%s×_ as common. Other item curses are unaffected. Costs extra energy to upgrade.

items.trinkets.petrifiedseed.name=petrified seed
items.trinkets.petrifiedseed.desc=This seed has been fossilised, either by slow geological processes or by magic. The seed seems to be magically influencing the flora of the dungeon, occasionally replacing plant seeds with runestones.
items.trinkets.petrifiedseed.typical_stats_desc=At +0: replaces _%1$s%%_ of seeds dropped by grass with runestones. Grass drops seeds or runestones _%2$s%% more often_.
items.trinkets.petrifiedseed.stats_desc=Replaces _%1$s%%_ of seeds dropped by grass with runestones. Grass drops seeds or runestones _%2$s%% more often_.
items.trinkets.petrifiedseed.stats_desc_base=Replaces _%1$s%%_ of seeds dropped by grass with runestones.
items.trinkets.petrifiedseed.typical_stats_desc_base=At +0: replaces _%1$s%%_ of seeds dropped by grass with runestones.

items.trinkets.ratskull.name=rat skull
items.trinkets.ratskull.desc=This macabre trinket isn't much larger than the skull of a normal rat, which is somehow a rarity down in this dungeon. The skull's magical influence seems to attract the more rare denizens of the dungeon, making them appear far more often.
items.trinkets.ratskull.typical_stats_desc=At +0: Makes rare exotic enemies _%d×_ as likely to appear. Its bonus is halved for crystal mimics and armored statues.
items.trinkets.ratskull.stats_desc=Makes rare exotic enemies _%d×_ as likely to appear. Its bonus is halved for crystal mimics and armored statues.

items.trinkets.saltcube.name=salt cube
items.trinkets.saltcube.desc=A preserving salt crystal that slows hunger, but also slows natural healing.
items.trinkets.saltcube.typical_stats_desc=At +0: Food keeps you satisfied _%1$s%% longer_, but natural healing is _%2$s%% slower_. The healing penalty pauses on locked floors.
items.trinkets.saltcube.stats_desc=Food keeps you satisfied _%1$s%% longer_, but natural healing is _%2$s%% slower_. The healing penalty pauses on locked floors.

items.trinkets.shardofoblivion.name=shard of oblivion
items.trinkets.shardofoblivion.desc=This shard of cursed metal seems to be made of nothing. It hovers in the air, drawing power from what you don't know.
items.trinkets.shardofoblivion.typical_stats_desc=At +0, each unidentified equipped item raises enemy loot chances by 20%%, counting up to _%d_ items. Using an unidentified wand or hitting with an unidentified thrown weapon also counts, once for each type. Gear no longer identifies itself through use; when an item is ready, use the shard to identify it. An Identify scroll makes selected gear ready immediately.
items.trinkets.shardofoblivion.stats_desc=Each unidentified equipped item raises enemy loot chances by 20%%, counting up to _%d_ items. Using an unidentified wand or hitting with an unidentified thrown weapon also counts, once for each type. Gear no longer identifies itself through use; when an item is ready, use the shard to identify it. An Identify scroll makes selected gear ready immediately.
items.trinkets.shardofoblivion.ac_identify=IDENTIFY
items.trinkets.shardofoblivion.identify_prompt=Identify an Item
items.trinkets.shardofoblivion.identify_ready=An item is ready to identify: %s. Use your Shard of Oblivion on it to identify it.
items.trinkets.shardofoblivion.identify_ready_worn=Your worn items are now all ready to identify. Use your Shard of Oblivion on items to identify them.
items.trinkets.shardofoblivion.identify_not_yet=That item isn't ready to be identified yet.
items.trinkets.shardofoblivion.identify=You identify the item!
items.trinkets.shardofoblivion$wandusetracker.name=Unidentified Wand Used
items.trinkets.shardofoblivion$wandusetracker.desc=Your recent use of an unidentified wand counts as one item toward the shard's loot bonus.\n\nTurns remaining: %s.
items.trinkets.shardofoblivion$thrownusetracker.name=Unidentified Thrown Weapon Used
items.trinkets.shardofoblivion$thrownusetracker.desc=Your recent hit with an unidentified thrown weapon counts as one item toward the shard's loot bonus.\n\nTurns remaining: %s.

items.trinkets.thirteenleafclover.name=thirteen leaf clover
items.trinkets.thirteenleafclover.desc=An unnaturally leafy clover that makes your damage less predictable.
items.trinkets.thirteenleafclover.typical_stats_desc=At +0, forces the highest value on _%1$d%%_ of your weapon and many magical damage rolls, and the lowest on _%2$d%%_. Other rolls work normally; enemy defenses still apply.
items.trinkets.thirteenleafclover.stats_desc=Forces the highest value on _%1$d%%_ of your weapon and many magical damage rolls, and the lowest on _%2$d%%_. Other rolls work normally; enemy defenses still apply.

items.trinkets.trapmechanism.name=trap mechanism
items.trinkets.trapmechanism.desc=The core mechanism of one of the dungeon's pitfall traps, carefully carved out of the floor so it can be carried. It seems to be magically tied to the dungeon itself, making hazardous terrain more common but also increasing your affinity towards it.
items.trinkets.trapmechanism.typical_stats_desc=At +0: Turns _%1$d%%_ of new unthemed floors into trap-filled or chasm floors. Makes _%2$d%%_ of normally hidden traps visible from the start.
items.trinkets.trapmechanism.stats_desc=Turns _%1$d%%_ of new unthemed floors into trap-filled or chasm floors. Makes _%2$d%%_ of normally hidden traps visible from the start.

items.trinkets.vialofblood.name=vial of blood
items.trinkets.vialofblood.healing_disabled=Your current rules disable the healing this vial would improve.
items.trinkets.vialofblood.stats_without_hero=%1$sBurst healing restores _%2$s%% more health_, spread over time. The per-turn limit depends on your maximum health.
items.trinkets.vialofblood.desc=This vial's blood strengthens healing, but makes it take longer.
items.trinkets.vialofblood.typical_stats_desc=At +0, healing potions, waterskins and wells of health restore _%1$s%% more health_, spread over time at up to _%2$s HP per turn_. This limit increases with your maximum health.
items.trinkets.vialofblood.stats_desc=Healing potions, waterskins and wells of health restore _%1$s%% more health_, spread over time at up to _%2$s HP per turn_. This limit increases with your maximum health.

items.trinkets.wondrousresin.name=wondrous resin
items.trinkets.wondrousresin.desc=This shimmering blue resin appears to have the distilled essence of a cursed wand's magic. The magic from the alchemy pot has seemed to stabilize it somewhat, and it's now affecting your wands.
items.trinkets.wondrousresin.typical_stats_desc=At +0: Has a _%1$s%% chance_ to force a cursed wand effect to be neutral or positive. Uncursed wands have a _%2$s%% chance_ to fire an extra neutral or positive cursed zap. Costs extra energy to upgrade.
items.trinkets.wondrousresin.stats_desc=Has a _%1$s%% chance_ to force a cursed wand effect to be neutral or positive. Uncursed wands have a _%2$s%% chance_ to fire an extra neutral or positive cursed zap. Costs extra energy to upgrade.

items.trinkets.trinketcatalyst.name=magical catalyst
items.trinkets.trinketcatalyst.window_title=create a trinket
items.trinkets.trinketcatalyst.window_text=Choose one of these four trinkets. Confirming your choice consumes the catalyst.
items.trinkets.trinketcatalyst.desc=Spend _6 alchemy energy_ to choose one of four trinkets. Carrying the trinket activates its effects; dropping it stops them. More energy can upgrade it, up to _+3_.
items.trinkets.trinketcatalyst$randomtrinket.name=random trinket
items.trinkets.trinketcatalyst$randomtrinket.desc=Creates a random trinket. Its type is revealed only after you confirm.

items.trinkets.trinket.discover_hint=This item has a chance to be an option whenever you craft a trinket via alchemy.
items.trinkets.trinket$placeholder.name=trinket

###wands
items.wands.cursedwand.ondeath=You were killed by your own %s.
items.wands.cursedwand.nothing=Nothing happens.
items.wands.cursedwand.mass_invuln=Brilliant light erupts from your wand!
items.wands.cursedwand.petrify=You suddenly freeze in place!
items.wands.cursedwand.grass=Grass erupts around you!
items.wands.cursedwand.fire=You smell burning...
items.wands.cursedwand.transmogrify_wand=Your wand transmogrifies into a different item!
items.wands.cursedwand.transmogrify_other=Your item transmogrifies into something different!
items.wands.cursedwand.disguise=Your appearance changes before your eyes!
items.wands.cursedwand.supernova=A blazing ball of energy starts to grow. You might want to run!
items.wands.cursedwand.supernova_positive=A blazing ball of energy starts to grow, but it feels safe somehow.
items.wands.cursedwand.sinkhole=The ground starts to give way around you!
items.wands.cursedwand.sinkhole_positive=The ground starts to give way, but feels solid enough beneath you.
items.wands.cursedwand.gravity=Gravity suddenly starts to pull in random directions!
items.wands.cursedwand.gravity_positive=Gravity suddenly starts to pull in random directions, but this doesn't seem to affect you.
items.wands.cursedwand.gravity_end=The gravity chaos ends.

items.wands.damagewand.upgrade_stat_name_1=Magic Damage

items.wands.wand.ac_zap=ZAP
items.wands.wand.fizzles=Your wand fizzles; it must not have enough charge.
items.wands.wand.no_magic=Your wand fizzles; you cannot use wands while magic immune.
items.wands.wand.self_target=You can't target yourself!
items.wands.wand.identify=You are now familiar enough with your wand to identify it.
items.wands.wand.resin_one=This wand has gained _1 level_ from arcane resin.
items.wands.wand.resin_many=This wand has gained _%d levels_ from arcane resin.
items.wands.wand.cursed=This wand is cursed, making its magic chaotic and random.
items.wands.wand.not_cursed=This wand is free of malevolent magic.
items.wands.wand.curse_discover=This %s is cursed!
items.wands.wand.prompt=Choose a location to zap
items.wands.wand$placeholder.name=wand

items.wands.wandofblastwave.name=wand of blast wave
items.wands.wandofblastwave.staff_name=staff of blast wave
items.wands.wandofblastwave.ondeath=You killed yourself with your own Wand of Blast Wave...
items.wands.wandofblastwave.knockback_ondeath=The collision killed you...
items.wands.wandofblastwave.desc=This wand is made of a sort of marbled stone, with gold trim and a round black gem at the tip. It feels very weighty in your hand.
items.wands.wandofblastwave.typical_stats_desc=This wand shoots a bolt which violently detonates at a target location. The force of this blast typically deals _%1$d-%2$d damage_ and is strong enough to send most enemies flying.
items.wands.wandofblastwave.stats_desc=Deals _%1$d-%2$d damage_ in a small blast and knocks creatures away. The blast can hurt you, trigger traps and push creatures into pits.
items.wands.wandofblastwave.upgrade_stat_name_2=Knockback
items.wands.wandofblastwave.bmage_desc=When _the Battlemage_ strikes a paralyzed enemy with a staff of blast wave, it will consume the paralysis to deal a burst of bonus magic damage. This has a short cooldown per-enemy.
items.wands.wandofblastwave.eleblast_desc=An elemental blast with a staff of blast wave deals 67% damage and knocks all enemies outside of the blast area.

items.wands.wandofcorrosion.name=wand of corrosion
items.wands.wandofcorrosion.staff_name=staff of corrosion
items.wands.wandofcorrosion.desc=This wand has an ashen body which opens to a brilliant orange gem.
items.wands.wandofcorrosion.stats_desc=Creates corrosive gas at the target tile. Creatures in the cloud take increasing damage over time, starting at _%d base damage per turn_. The gas can harm you and allies.
items.wands.wandofcorrosion.upgrade_stat_name_1=Corrosion Damage
items.wands.wandofcorrosion.upgrade_stat_name_2=Gas Volume
items.wands.wandofcorrosion.bmage_desc=Battlemage: melee hits can coat an enemy in damaging ooze. Standing in water washes it off.
items.wands.wandofcorrosion.eleblast_desc=An elemental blast with a staff of corrosion inflicts enemies with 4 turns of corrosion, starting at 6 damage.

items.wands.wandofcorruption.name=wand of corruption
items.wands.wandofcorruption.staff_name=staff of corruption
items.wands.wandofcorruption.already_corrupted=That character cannot be influenced further.
items.wands.wandofcorruption.desc=A dark wand topped with a small decorative skull.
items.wands.wandofcorruption.stats_desc=Attempts to turn an enemy into an ally. Wounded enemies and those suffering harmful effects are easier to corrupt. Failed attempts can weaken the target instead; some enemies are immune.
items.wands.wandofcorruption.upgrade_stat_name_1=Corrupting Power
items.wands.wandofcorruption.upgrade_stat_name_2=Debuff Duration
items.wands.wandofcorruption.bmage_desc=Battlemage: melee hits can send an enemy into a frenzy, making it attack nearby creatures.
items.wands.wandofcorruption.eleblast_desc=An elemental blast with a staff of corruption inflicts enemies with 5 turns of amok.

items.wands.wandofdisintegration.name=wand of disintegration
items.wands.wandofdisintegration.staff_name=staff of disintegration
items.wands.wandofdisintegration.desc=A smooth obsidian wand glowing with destructive purple energy.
items.wands.wandofdisintegration.stats_desc=Fires a beam through walls and creatures, dealing _%1$d-%2$d base damage_. Hitting several creatures or firing through walls increases the damage. Upgrades extend its range. Can hit allies too.
items.wands.wandofdisintegration.upgrade_stat_name_2=Max Range
items.wands.wandofdisintegration.bmage_desc=Battlemage: this staff can strike enemies farther away.
items.wands.wandofdisintegration.eleblast_desc=An elemental blast with a staff of disintegration deals 100% damage and pierces through walls.

items.wands.wandoffireblast.name=wand of fireblast
items.wands.wandoffireblast.staff_name=staff of fireblast
items.wands.wandoffireblast.desc=This red-and-gold wand sprays a cone of fire, burning creatures and terrain. Stronger blasts can cripple or paralyze enemies.
items.wands.wandoffireblast.stats_desc=Charge cost: _%1$d_. The blast deals _%2$d-%3$d base damage_. Spending more charges makes the blast larger and stronger.
items.wands.wandoffireblast.upgrade_stat_name_1=1 Charge Damage
items.wands.wandoffireblast.upgrade_stat_name_2=2 Charge Damage
items.wands.wandoffireblast.upgrade_stat_name_3=3 Charge Damage
items.wands.wandoffireblast.bmage_desc=Battlemage: melee hits can cause an explosion around the target, damaging enemies and putting out nearby fire. More burning creatures and tiles nearby increase the chance.
items.wands.wandoffireblast.eleblast_desc=An elemental blast with a staff of fireblast deals 100% damage, bursts open doors, and sets enemies and terrain on fire.

items.wands.wandoffrost.name=wand of frost
items.wands.wandoffrost.staff_name=staff of frost
items.wands.wandoffrost.desc=This wand seems to be made out of some kind of magical ice. It grows brighter towards its rounded tip. It feels very cold when held, but somehow your hand stays warm.
items.wands.wandoffrost.stats_desc=Deals _%1$d-%2$d damage_ and chills the target. Water makes the chill last longer. This wand deals less damage to chilled targets and cannot harm frozen targets. Can shatter potions on the ground.
items.wands.wandoffrost.upgrade_stat_name_2=Chill Duration
items.wands.wandoffrost.bmage_desc=When _the Battlemage_ strikes a chilled enemy with a staff of frost, they have a chance to instantly freeze. This chance becomes greater the more chilled they are.
items.wands.wandoffrost.eleblast_desc=An elemental blast with a staff of frost deals 100% damage, freezes enemies, and puts out fires.

items.wands.wandoflightning.name=wand of lightning
items.wands.wandoflightning.staff_name=staff of lightning
items.wands.wandoflightning.ondeath=You killed yourself with your own Wand of Lightning...
items.wands.wandoflightning.desc=A heavy metal wand with two curved prongs crackling with electricity.
items.wands.wandoflightning.stats_desc=Deals _%1$d-%2$d base damage_ and chains between nearby creatures, farther in water. Each target takes less damage when several are hit, unless the first target's tile is water. Nearby arcs can hit you for half damage; allies are safe unless directly targeted.
items.wands.wandoflightning.bmage_desc=Battlemage: melee hits can grant Lightning Charge, normally for 10 turns; Empowered Strike can extend it. It blocks Wand of Lightning zaps and adds 1 tile to this wand's arc reach.
items.wands.wandoflightning.eleblast_desc=An elemental blast with a staff of lightning deals 100% damage, stuns enemies for 5 turns, and electrifies water.
items.wands.wandoflightning$lightningcharge.name=Electrically charged
items.wands.wandoflightning$lightningcharge.desc=Immune to Wand of Lightning zaps. Your lightning chains reach 1 tile farther.\n\nTurns remaining: %s.

items.wands.wandoflivingearth.name=wand of living earth
items.wands.wandoflivingearth.staff_name=staff of living earth
items.wands.wandoflivingearth.desc=A wand of shifting rock threaded with glowing yellow energy.
items.wands.wandoflivingearth.stats_desc=Deals _%1$d-%2$d base damage_. Enemy hits build rock armor; enough rock creates an earthen guardian if there is space. While the guardian is active, enemy hits or zapping the guardian restore its health instead.
items.wands.wandoflivingearth.upgrade_stat_name_2=Guardian Max HP
items.wands.wandoflivingearth.upgrade_stat_name_3=Guardian Blocking
items.wands.wandoflivingearth.bmage_desc=Battlemage: melee hits build rock armor or restore your guardian's health. Stronger hits add more.
items.wands.wandoflivingearth.eleblast_desc=An elemental blast with a staff of living earth deals 50% damage, and heals an active earthen guardian for each enemy hit.
items.wands.wandoflivingearth$rockarmor.name=rock armor
items.wands.wandoflivingearth$rockarmor.desc=Blocks half of incoming attack damage, rounded up, while reserve lasts. Each damage point blocked spends 1 reserve point.\n\nReserve: _%1$d_. A guardian needs _%2$d_ reserve and room to appear on your next Living Earth zap.
items.wands.wandoflivingearth$rockarmor.desc_many=Also carries Power of Many for %d more turns.
items.wands.wandoflivingearth$earthguardian.name=earthen guardian
items.wands.wandoflivingearth$earthguardian.desc=An earthen ally whose attacks draw enemies' attention. When nearby threats are gone, its remaining health becomes your rock armor. Build enough reserve to summon it again.
items.wands.wandoflivingearth$earthguardian.wand_info=Blocks _%1$d-%2$d damage_ from attacks. Stronger wand power improves its protection and maximum health.
items.wands.wandoflivingearth$earthguardian.discover_hint=You can find this character with a specific wand.

items.wands.wandofmagicmissile.name=wand of magic missile
items.wands.wandofmagicmissile.staff_name=staff of magic missile
items.wands.wandofmagicmissile.desc=A plain wand that fires bolts of pure magical energy.
items.wands.wandofmagicmissile.stats_desc=Deals _%1$d-%2$d base damage_. A hit grants a brief boost: the next zap from a weaker wand uses this wand's power.
items.wands.wandofmagicmissile.bmage_desc=Battlemage: melee hits recharge your other wands as well as the staff.
items.wands.wandofmagicmissile.eleblast_desc=An elemental blast with a staff of magic missile deals 50% damage, and grants the mage 15 turns of recharging.
items.wands.wandofmagicmissile.discover_hint=One of the heroes starts with this item.
items.wands.wandofmagicmissile$magiccharge.name=magic charge
items.wands.wandofmagicmissile$magiccharge.desc=Temporarily raises a weaker wand to _+%1$d_ for one zap.\n\nTurns remaining: %2$s.

items.wands.wandofprismaticlight.name=wand of prismatic light
items.wands.wandofprismaticlight.staff_name=staff of prismatic light
items.wands.wandofprismaticlight.desc=A clear crystal wand with colored light dancing inside.
items.wands.wandofprismaticlight.stats_desc=Deals _%1$d-%2$d base damage_ and can blind its target. Undead and demonic creatures take extra damage. Reveals terrain, hidden doors and traps along the beam, and grants light on dark floors.
items.wands.wandofprismaticlight.upgrade_stat_name_2=Blind Chance
items.wands.wandofprismaticlight.upgrade_stat_name_3=Light Duration
items.wands.wandofprismaticlight.bmage_desc=Battlemage: melee hits slow enemy movement. Upgrades make the effect last longer.
items.wands.wandofprismaticlight.eleblast_desc=An elemental blast with a staff of prismatic light deals 67% damage, reveals all terrain in the blast, and blinds enemies for 5 turns.

items.wands.wandofregrowth.name=wand of regrowth
items.wands.wandofregrowth.staff_name=staff of regrowth
items.wands.wandofregrowth.desc=This living wooden wand grows grass and plants in a cone, rooting creatures caught on ground where plants can grow.
items.wands.wandofregrowth.stats_desc=Charge cost: _%1$d_. Spending more charges grows more plants over a larger area. A zap using 3 charges can also summon a golden lotus if there is room.
items.wands.wandofregrowth.degradation=Charges left before plant growth becomes unreliable: _%d_. Leveling up or upgrading the wand increases this allowance.
items.wands.wandofregrowth.upgrade_stat_name_1=Grass Per Charge
items.wands.wandofregrowth.upgrade_stat_name_2=Total Grass Limit
items.wands.wandofregrowth.bmage_desc=Battlemage: melee hits add healing when you or the target are on grass. Stronger hits add more. Stay still to receive the healing.
items.wands.wandofregrowth.eleblast_desc=An elemental blast with a staff of regrowth roots enemies and grows grass randomly over the blast area.
items.wands.wandofregrowth$dewcatcher.name=Dewcatcher
items.wands.wandofregrowth$dewcatcher.desc=Trample this plant to release 3-6 dew drops onto nearby ground, if there is room.
items.wands.wandofregrowth$dewcatcher.discover_hint=You can find this plant with a specific wand.
items.wands.wandofregrowth$seedpod.name=Seed Pod
items.wands.wandofregrowth$seedpod.desc=Trample this plant to scatter 2-4 random seeds onto nearby ground, if there is room.
items.wands.wandofregrowth$seedpod.discover_hint=You can find this plant with a specific wand.
items.wands.wandofregrowth$lotus.name=Golden Lotus
items.wands.wandofregrowth$lotus.desc=The golden lotus is a mystical plant that can only be conjured by a powerful wand of regrowth. Its aura can preserve seeds and most tipped-dart coatings. It fades after a short time.
items.wands.wandofregrowth$lotus.wand_info=This lotus was summoned with _+%1$d wand power_. Plants placed on creatures in its aura trigger immediately. Plants have a _%2$d%% chance_ to return their seeds. Most tipped darts can last longer here; Rot Darts keep their fixed five uses.
items.wands.wandofregrowth$lotus.discover_hint=You can find this plant with a specific wand, after upgrading it several times.

items.wands.wandoftransfusion.name=wand of transfusion
items.wands.wandoftransfusion.staff_name=staff of transfusion
items.wands.wandoftransfusion.ondeath=You killed yourself with your own Wand of Transfusion...
items.wands.wandoftransfusion.charged=Your staff is charged with the life energy of your enemy!
items.wands.wandoftransfusion.desc=A fairly plainly shaped wand, it stands out due to its magenta hue and pitch black gem at the tip.
items.wands.wandoftransfusion.stats_desc=Allies or charmed enemies: costs _%1$d HP_ before defenses to restore _%2$d HP_, turning excess healing into shielding. Enemies: briefly charms them and grants you _%3$d shielding_. Undead enemies take _%4$d-%5$d damage_ instead of being charmed.
items.wands.wandoftransfusion.stats_desc_without_hero=Transfers some of your health to heal an ally or turn excess healing into shielding. Charms living enemies and shields you, or damages undead enemies instead.
items.wands.wandoftransfusion.upgrade_stat_name_1=Ally Healing
items.wands.wandoftransfusion.upgrade_stat_name_2=Self-Shielding
items.wands.wandoftransfusion.upgrade_stat_name_3=Undead Damage
items.wands.wandoftransfusion.bmage_desc=Battlemage: hitting an enemy charmed by you grants shielding and makes your next ally-healing zap cost no health. It still uses a charge and a turn.
items.wands.wandoftransfusion.eleblast_desc=An elemental blast with a staff of transfusion charms enemies, heals allies, and deals 100% damage to undead enemies.

items.wands.wandofwarding.name=wand of warding
items.wands.wandofwarding.staff_name=staff of warding
items.wands.wandofwarding.no_more_wards=Your wand can't sustain any more wards.
items.wands.wandofwarding.bad_location=You can't place a ward there.
items.wands.wandofwarding.desc=This short metal wand has a bright purple gem floating above its tip.
items.wands.wandofwarding.stats_desc=Summons stationary wards that attack enemies. This wand can support _%d basic wards_, or fewer stronger wards. Zap an existing ward to upgrade it. Wards can be placed across walls on open tiles you can see.
items.wands.wandofwarding.upgrade_stat_name_1=Ward Damage
items.wands.wandofwarding.upgrade_stat_name_2=Ward Energy
items.wands.wandofwarding.bmage_desc=Battlemage: melee hits can restore spent attacks to upgraded wards and heal sentries. Basic wards cannot be repaired.
items.wands.wandofwarding.eleblast_desc=An elemental blast with a staff of warding heals all wards and sentries in the blast area.
items.wands.wandofwarding$ward.desc_generic_ward=This ward will automatically zap any enemy which comes into its range of vision.\n\nZapping this ward with your wand of warding will upgrade it.\n\nWards have a limited number of zaps before dissipating.
items.wands.wandofwarding$ward.desc_generic_sentry=This sentry has the same firepower as a ward, but has health instead of a set number of charges. It resembles the gem at the tip of your wand of warding.\n\nZapping this sentry with your wand of warding will upgrade and heal it.\n\nThis sentry will spend some health each time it zaps an enemy, but can be healed by using your wand of warding on it.
items.wands.wandofwarding$ward.name_1=lesser ward
items.wands.wandofwarding$ward.desc_1=This basic ward will automatically zap any enemy which comes into its range of vision, dealing _%1$d-%2$d damage._\n\nZapping this ward with your wand of warding will upgrade it.\n\nThis ward will only zap a single time before dissipating.\n\nYour wand of warding is using _%3$d energy_ to sustain this ward.
items.wands.wandofwarding$ward.name_2=ward
items.wands.wandofwarding$ward.desc_2=This upgraded ward has a more intricate pattern, and can attack multiple times. Each zap from this ward will deal _%1$d-%2$d damage._\n\nZapping this ward with your wand of warding will upgrade it.\n\nThis ward will zap three times before dissipating.\n\nYour wand of warding is using _%3$d energy_ to sustain this ward.
items.wands.wandofwarding$ward.name_3=greater ward
items.wands.wandofwarding$ward.desc_3=This fully upgraded ward is able to attack more times than its predecessors. Each zap from this ward will deal _%1$d-%2$d damage._\n\nZapping this ward with your wand of warding will upgrade it.\n\nThis ward will zap five times before dissipating.\n\nYour wand of warding is using _%3$d energy_ to sustain this ward.
items.wands.wandofwarding$ward.name_4=lesser sentry
items.wands.wandofwarding$ward.desc_4=This smaller sentry has the same firepower as a greater ward, but has health instead of a set number of charges. It resembles the gem at the tip of your wand of warding. Each zap from this sentry will deal _%1$d-%2$d damage._\n\nZapping this sentry with your wand of warding will upgrade and heal it.\n\nThis sentry will spend some health each time it zaps an enemy, but can be healed by using your wand of warding on it.\n\nYour wand of warding is using _%3$d energy_ to sustain this sentry.
items.wands.wandofwarding$ward.name_5=sentry
items.wands.wandofwarding$ward.desc_5=This upgraded sentry is larger and more durable than a lesser sentry. Each zap from this sentry will deal _%1$d-%2$d damage._\n\nZapping this sentry with your wand of warding will upgrade and heal it.\n\nThis sentry will spend some health each time it zaps an enemy, but can be healed by using your wand of warding on it.\n\nYour wand of warding is using _%3$d energy_ to sustain this sentry.
items.wands.wandofwarding$ward.name_6=greater sentry
items.wands.wandofwarding$ward.desc_6=This fully upgraded sentry is significantly more durable than its predecessors. Each zap from this sentry will deal _%1$d-%2$d damage._\n\nZapping this sentry with your wand of warding will heal it.\n\nThis sentry will spend some health each time it zaps an enemy, but can be healed by using your wand of warding on it.\n\nYour wand of warding is using _%3$d energy_ to sustain this sentry.
items.wands.wandofwarding$ward.discover_hint=You can find this character with a specific wand.
items.wands.wandofwarding$ward.dismiss_title=Dismiss this ward?
items.wands.wandofwarding$ward.dismiss_body=You can dispel this ward if you no longer want your wand to maintain it. Doing so immediately destroys the ward.\n\nDismiss this ward?
items.wands.wandofwarding$ward.dismiss_confirm=yes
items.wands.wandofwarding$ward.dismiss_cancel=no

###weapon curses
items.weapon.curses.annoying.name=annoying %s
items.weapon.curses.annoying.msg_1=OOH, ARE WE FIGHTING SOMETHING!?
items.weapon.curses.annoying.msg_2=YEAH, GET THEM!
items.weapon.curses.annoying.msg_3=HEY, LISTEN!
items.weapon.curses.annoying.msg_4=ARE WE AT THE BOSS YET!?
items.weapon.curses.annoying.msg_5=OUCH, DON'T SWING ME SO HARD!
items.weapon.curses.annoying.msg_6=DIE, INSECT!
items.weapon.curses.annoying.msg_7=WHEEEEEEEEEEEEEEE!
items.weapon.curses.annoying.msg_8=CAN WE TAKE A BREAK!?
items.weapon.curses.annoying.msg_9=POW, HAHA!
items.weapon.curses.annoying.msg_10=WELL STRUCK!
items.weapon.curses.annoying.msg_11=I didn't want to be a weapon, I wanted to be a lumberjack's axe.
items.weapon.curses.annoying.msg_12=Remember, overconfidence is a slow and insidious killer.
items.weapon.curses.annoying.msg_13=ALL YOUR BASE ARE BELONG TO US!
items.weapon.curses.annoying.desc=Can shout during attacks, drawing creatures across the floor toward you and ending invisibility.
items.weapon.curses.annoying.elestrike_desc=An elemental strike with an annoying curse has a 20% chance to amok each enemy in range for 6 turns.

items.weapon.curses.dazzling.name=dazzling %s
items.weapon.curses.dazzling.desc=Can blind you and creatures that can see your target, including allies.
items.weapon.curses.dazzling.elestrike_desc=An elemental strike with a dazzling curse has a 50% chance to blind each enemy in range for 6 turns.

items.weapon.curses.displacing.name=displacing %s
items.weapon.curses.displacing.desc=Can teleport your target elsewhere on the same floor.
items.weapon.curses.displacing.elestrike_desc=An elemental strike with a displacing curse has a 50% chance to teleport each enemy in range.

items.weapon.curses.explosive.name=explosive %s
items.weapon.curses.explosive.warm=Warm...
items.weapon.curses.explosive.hot=Hot!
items.weapon.curses.explosive.desc=Can explode as you fight, damaging nearby creatures, including you. Watch its heat warnings.
items.weapon.curses.explosive.desc_cool=Your weapon is currently cool to the touch.
items.weapon.curses.explosive.desc_warm=Your weapon is building energy and getting warm...
items.weapon.curses.explosive.desc_hot=Your weapon is hot! It's about to explode!
items.weapon.curses.explosive.elestrike_desc=An elemental strike with an explosive curse has a 50% chance to cause an explosion to appear on a random enemy in range.

items.weapon.curses.friendly.name=friendly %s
items.weapon.curses.friendly.desc=Can charm you and your target, preventing direct attacks between you until the charms end.
items.weapon.curses.friendly.elestrike_desc=An elemental strike with a friendly curse has a 50% chance to charm each enemy in range for 6 turns.

items.weapon.curses.polarized.name=polarized %s
items.weapon.curses.polarized.desc=Can amplify a hit's damage by _50%_ or cancel it. Arcana changes how often each result occurs.
items.weapon.curses.polarized.elestrike_desc=An elemental strike with a polarized curse has a 50% chance to deal 24-36 damage to each enemy in range.

items.weapon.curses.pressurized.name=pressurized %s
items.weapon.curses.pressurized.desc=Can unleash a water burst around the target, knocking back nearby creatures, including you.
items.weapon.curses.pressurized.elestrike_desc=An elemental strike with a pressurized curse will create a wave of water that destroys terrain and knocks back every enemy in range.

items.weapon.curses.sacrificial.name=sacrificial %s
items.weapon.curses.sacrificial.desc=Can make you bleed when attacking. More health increases both the risk and the severity.
items.weapon.curses.sacrificial.elestrike_desc=An elemental strike with a sacrificial curse causes the hero and each enemy in range to bleed for 12 HP.

items.weapon.curses.wayward.name=wayward %s
items.weapon.curses.wayward.desc=Can temporarily reduce your accuracy. Landing a hit with this weapon clears the penalty.
items.weapon.curses.wayward.elestrike_desc=An elemental strike with a wayward curse has a 50% chance to hex each enemy in range for 6 turns.
items.weapon.curses.wayward$waywardbuff.name=wayward
items.weapon.curses.wayward$waywardbuff.desc=Your Wayward weapon is much less accurate. Hitting with it ends this effect; guaranteed hits are unaffected.\n\nTurns remaining: %s.

items.weapon.curses.wondrous.name=wondrous %s
items.weapon.curses.wondrous.desc=Can trigger a random cursed-wand effect, which may help or harm you.
items.weapon.curses.wondrous.elestrike_desc=An elemental strike with a wondrous curse has a chance to apply a different cursed wand effect to every enemy in range.

###enchantments
items.weapon.enchantments.blazing.name=blazing %s
items.weapon.enchantments.blazing.desc=This enchantment causes flames to spit forth from a weapon, igniting enemies and dealing bonus damage to enemies that are already aflame.
items.weapon.enchantments.blazing.elestrike_desc=An elemental strike with a blazing enchantment spreads fire to every tile in range, which lasts 8 turns.

items.weapon.enchantments.blocking.name=blocking %s
items.weapon.enchantments.blocking.desc=Blocking weapons have a chance to briefly shield you after attacking with them.
items.weapon.enchantments.blocking.elestrike_desc=An elemental strike with a blocking enchantment grants the Duelist an extra 6 shielding for each enemy in range.
items.weapon.enchantments.blocking$blockbuff.name=blocking
items.weapon.enchantments.blocking$blockbuff.desc=Shielding: %d points.\n\nNormally expires in %s turns. Hold Fast can extend or pause this timer.

items.weapon.enchantments.blooming.name=blooming %s
items.weapon.enchantments.blooming.desc=Blooming weapons contain magic which will cause vegetation to sprout on or around those struck by them.
items.weapon.enchantments.blooming.elestrike_desc=An elemental strike with a blooming enchantment spreads grass to up to 8 tiles in range, and roots all enemies in range for 6 turns.

items.weapon.enchantments.chilling.name=chilling %s
items.weapon.enchantments.chilling.desc=Enemies struck with this enchantment are chilled, slowing their movement and attacks.
items.weapon.enchantments.chilling.elestrike_desc=An elemental strike with a chilling enchantment spreads chilling air to every tile in range, which lasts 8 turns.

items.weapon.enchantments.crystal.name=crystal %s
items.weapon.enchantments.crystal.alert_fixed=Your crystal weapon is fully repaired!
items.weapon.enchantments.crystal.alert_fixed_ghost=The ghost's crystal weapon is fully repaired!
items.weapon.enchantments.crystal.alert_noflaw=Your crystal weapon is no longer flawed.
items.weapon.enchantments.crystal.alert_noflaw_ghost=The ghost's crystal weapon is no longer flawed.
items.weapon.enchantments.crystal.alert_nocrack=Your crystal weapon is no longer cracked.
items.weapon.enchantments.crystal.alert_nocrack_ghost=The ghost's crystal weapon is no longer cracked.
items.weapon.enchantments.crystal.alert_flawed=Your crystal weapon has become slightly damaged.
items.weapon.enchantments.crystal.alert_flawed_ghost=The ghost's crystal weapon has become slightly damaged.
items.weapon.enchantments.crystal.alert_cracked=Your crystal weapon cracks, it's about to break!
items.weapon.enchantments.crystal.alert_cracked_ghost=The ghost's crystal weapon cracks, it's about to break!
items.weapon.enchantments.crystal.alert_shattered=Your crystal weapon shatters into pieces!
items.weapon.enchantments.crystal.alert_shattered_ghost=The ghost's crystal weapon shatters into pieces!
items.weapon.enchantments.crystal.desc=This powerful enchantment deals extra magic damage and enhances a weapon's value. However, the enchanted weapon can shatter if the crystals aren't repaired, or given time to self-repair.
items.weapon.enchantments.crystal.desc_thrown=Crystal thrown weapons have much less durability, but regain it slowly over time.
items.weapon.enchantments.crystal.desc_perfect=This crystal weapon is currently in perfect condition.
items.weapon.enchantments.crystal.desc_fine=This crystal weapon is currently in good condition.
items.weapon.enchantments.crystal.desc_flawed=This crystal weapon has a flaw, but isn't about to break.
items.weapon.enchantments.crystal.desc_cracked=This crystal weapon is cracking, it's at risk of permanently breaking!
items.weapon.enchantments.crystal.elestrike_desc=An elemental strike with a crystal enchantment deals 10-20 damage and repairs the weapon for every enemy in range, except the primary target.

items.weapon.enchantments.kinetic.name=kinetic %s
items.weapon.enchantments.kinetic.desc=When an enemy is killed with a kinetic weapon, any excess force is stored in the weapon and will be applied to the next successful attack.
items.weapon.enchantments.kinetic.elestrike_desc=An elemental strike with a kinetic enchantment applies 40% of stored damage to each enemy in range, except the primary target.
items.weapon.enchantments.kinetic$conserveddamage.name=conserved damage
items.weapon.enchantments.kinetic$conserveddamage.desc=Adds %d damage to your next Kinetic or Unstable hit. The stored damage slowly fades.

items.weapon.enchantments.corrupting.name=corrupting %s
items.weapon.enchantments.corrupting.desc=This powerful enchantment possesses the ability to turn enemies to your will. When an enemy is killed with this weapon, there is a chance they will become corrupted instead of dying.
items.weapon.enchantments.corrupting.elestrike_desc=An elemental strike with a corrupting enchantment has a 5-25% chance (based on missing HP) to corrupt each enemy in range, except the primary target.

items.weapon.enchantments.eldritch.name=eldritch %s
items.weapon.enchantments.eldritch.desc=Eldritch weapons strike fear into nearby enemies that witness their strikes, causing them to flee from the attacker.
items.weapon.enchantments.eldritch.elestrike_desc=An elemental strike with an eldritch enchantment applies extended fear to every enemy in range, including the primary target.

items.weapon.enchantments.elastic.name=elastic %s
items.weapon.enchantments.elastic.desc=Elastic weapons have a chance to send enemies flying back short distances.
items.weapon.enchantments.elastic.elestrike_desc=An elemental strike with an elastic enchantment knocks all enemies in range back 5 tiles.

items.weapon.enchantments.grim.name=grim %s
items.weapon.enchantments.grim.desc=This powerful enchantment possesses the power to instantly execute an enemy. The effect is more likely to occur the weaker the enemy is.
items.weapon.enchantments.grim.elestrike_desc=An elemental strike with a grim enchantment has a 6-30% chance (based on missing HP) to kill each enemy in range, except the primary target.

items.weapon.enchantments.lucky.name=lucky %s
items.weapon.enchantments.lucky.desc=Enemies which are killed by a lucky weapon have a chance to drop extra loot.
items.weapon.enchantments.lucky.elestrike_desc=An elemental strike with a lucky enchantment has a 12.5% chance to spawn loot under each enemy in range. This effect can only trigger once per enemy.

items.weapon.enchantments.projecting.name=projecting %s
items.weapon.enchantments.projecting.desc=With this enchantment melee weapons will gain extra reach. Ranged weapons will penetrate walls when aimed at nearby targets.
items.weapon.enchantments.projecting.elestrike_desc=An elemental strike with a projecting enchantment deals 30% damage to each enemy in range, except the primary target.

items.weapon.enchantments.shocking.name=shocking %s
items.weapon.enchantments.shocking.desc=Electricity arcs from a shocking weapon, dealing extra damage to all nearby enemies.
items.weapon.enchantments.shocking.elestrike_desc=An elemental strike with a shocking enchantment spreads electricity to every tile in range, which lasts 8 turns.

items.weapon.enchantments.unstable.name=unstable %s
items.weapon.enchantments.unstable.desc=This enchantment radiates chaotic energy, acting as a different enchantment with each hit.
items.weapon.enchantments.unstable.elestrike_desc=An elemental strike with an unstable enchantment applies a random enchantment effect to each enemy in range, except the primary target.

items.weapon.enchantments.vampiric.name=vampiric %s
items.weapon.enchantments.vampiric.desc=This powerful enchantment leeches life force from enemies with each blow, funneling it back into the wearer. The effect is stronger the lower the wearer's health.
items.weapon.enchantments.vampiric.elestrike_desc=An elemental strike with a vampiric enchantment heals the Duelist for 2.5 HP for each enemy in range.

items.weapon.enchantments.venomous.name=venomous %s
items.weapon.enchantments.venomous.desc=Venomous weapons inflict a delayed but deadly poison, which becomes more severe each time it is applied.
items.weapon.enchantments.venomous.elestrike_desc=An elemental strike with a venomous enchantment applies additional delayed poison to every enemy in range, except the primary target.

items.weapon.enchantments.vorpal.name=vorpal %s
items.weapon.enchantments.vorpal.desc=Vorpal weapons are especially deadly, they have a chance to strike so cleanly that they inflict bleed instead of damage to enemies that can bleed.
items.weapon.enchantments.vorpal.elestrike_desc=An elemental strike with a vorpal enchantment applies additional bleeding to every enemy in range, except the primary target.


###melee weapons
items.weapon.melee.assassinsblade.name=assassin's blade
items.weapon.melee.assassinsblade.stats_desc=This weapon is stronger against unaware enemies.
items.weapon.melee.assassinsblade.ability_name=sneak
items.weapon.melee.assassinsblade.typical_ability_desc=Unupgraded example (+0): _Sneak_ instantly blinks to a visible empty tile up to 3 steps away and grants _%d turns of invisibility_. Cannot be used while rooted.
items.weapon.melee.assassinsblade.ability_desc=Duelist: _Sneak_ instantly blinks to a visible empty tile up to 3 steps away and grants _%d turns of invisibility_. Cannot be used while rooted.
items.weapon.melee.assassinsblade.upgrade_ability_stat_name=Ability Duration
items.weapon.melee.assassinsblade.desc=A small wavy blade made of obsidian, difficult to use despite being lightweight, but deadly if it finds the right mark.

items.weapon.melee.battleaxe.name=battle axe
items.weapon.melee.battleaxe.stats_desc=This is a rather accurate weapon.
items.weapon.melee.battleaxe.ability_name=heavy blow
items.weapon.melee.battleaxe.typical_ability_desc=_Unupgraded example (+0):_ The Duelist’s _heavy blow_ always hits. Surprise attacks deal _%1$d-%2$d damage_; other hits deal normal damage. Survivors are dazed for 5 turns, halving their accuracy and evasion.
items.weapon.melee.battleaxe.ability_desc=The Duelist’s _heavy blow_ always hits. Surprise attacks deal _%1$d-%2$d damage_; other hits deal normal damage. Survivors are dazed for 5 turns, halving their accuracy and evasion.
items.weapon.melee.battleaxe.desc=The enormous steel head of this battle axe puts considerable heft behind each wide stroke.

items.weapon.melee.crossbow.name=crossbow
items.weapon.melee.crossbow.typical_stats_desc=Unupgraded example (+0): while equipped, gives darts _%1$d-%2$d base damage_ and shares its enchantment with them.
items.weapon.melee.crossbow.stats_desc=While equipped, gives darts _%1$d-%2$d base damage_ and shares its enchantment with them.
items.weapon.melee.crossbow.ability_name=charged shot
items.weapon.melee.crossbow.typical_ability_desc=Unupgraded example (+0): _Charged Shot_ prepares your next attack, which cannot miss. A melee hit pushes its target back; an untipped dart gains _+%1$d base damage_; a tipped dart spreads its effect over a 7×7 area and gets _%2$d more uses_.
items.weapon.melee.crossbow.ability_desc=Duelist: _Charged Shot_ prepares your next attack, which cannot miss. A melee hit pushes its target back; an untipped dart gains _+%1$d base damage_; a tipped dart spreads its effect over a 7×7 area and gets _%2$d more uses_.
items.weapon.melee.crossbow.desc=A fairly intricate weapon which shoots bolts at exceptional speeds. While it isn't designed for it, this crossbow's heft and sturdy construction make it a decent melee weapon as well.
items.weapon.melee.crossbow.upgrade_ability_stat_name=Extra Tip Uses
items.weapon.melee.crossbow$chargedshot.name=charged
items.weapon.melee.crossbow$chargedshot.desc=The Duelist is focusing power into her crossbow. The next attack she makes with it will always hit and apply one of three effects:\n- Melee attacks will knock enemies a few tiles away.\n- Untipped darts will deal bonus damage.\n- Tipped darts will gain extra uses and apply their effect in a 7x7 area. Positive dart effects will only affect allies, and harmful effects will only apply to enemies. The Duelist cannot use this ability to apply positive dart effects to herself.

items.weapon.melee.cudgel.name=cudgel
items.weapon.melee.cudgel.stats_desc=This is a rather accurate weapon.
items.weapon.melee.cudgel.ability_name=heavy blow
items.weapon.melee.cudgel.typical_ability_desc=_Unupgraded example (+0):_ The Duelist’s _heavy blow_ always hits. Surprise attacks deal _%1$d-%2$d damage_; other hits deal normal damage. Survivors are dazed for 5 turns, halving their accuracy and evasion.
items.weapon.melee.cudgel.ability_desc=The Duelist’s _heavy blow_ always hits. Surprise attacks deal _%1$d-%2$d damage_; other hits deal normal damage. Survivors are dazed for 5 turns, halving their accuracy and evasion.
items.weapon.melee.cudgel.desc=A small brass mace, made more as a self-defense tool for nobles than as an adventuring weapon.
items.weapon.melee.cudgel.discover_hint=One of the heroes starts with this item.

items.weapon.melee.dagger.name=dagger
items.weapon.melee.dagger.stats_desc=This weapon is stronger against unaware enemies.
items.weapon.melee.dagger.ability_name=sneak
items.weapon.melee.dagger.typical_ability_desc=Unupgraded example (+0): _Sneak_ instantly blinks to a visible empty tile up to 5 steps away and grants _%d turns of invisibility_. Cannot be used while rooted.
items.weapon.melee.dagger.ability_desc=Duelist: _Sneak_ instantly blinks to a visible empty tile up to 5 steps away and grants _%d turns of invisibility_. Cannot be used while rooted.
