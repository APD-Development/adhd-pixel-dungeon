name: APD archive import header filename identity source gate
on:
  push:
    branches: [chatgpt/apd-import-header-filename-20261113-0118]
    paths:
      - .github/workflows/apd-import-header-filename-ci-20261113.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporter.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveHeaderFilenameBoundaryTest.java
permissions: {contents: read}
concurrency:
  group: apd-import-header-filename-20261113
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Confirm per-log filename header guard and coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporter.java').read_text()
          tests=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveHeaderFilenameBoundaryTest.java').read_text()
          assert 'e.logId().equals(r.header.runId)' in source
          assert '!runMatches || !headerMatchesFilename' in source
          for name in (
              'matchingTypedRunStartCannotDisguiseWrongHeaderFilename',
              'rejectedHeaderCannotPartiallyImportOtherLogOrModifyExistingHistory',
              'distinctSegmentHeadersWithOneSharedRunIdStillImportLosslessly',
          ):
              assert 'void '+name+'(' in tests, name
          print('Header filename identity and three real-writer ZIP regressions present')
          PY
      - name: Run full core suite and compile desktop and Android Java
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Assert actual JUnit XML and existing archive compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'missing JUnit XML'
          totals={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3388, totals
          assert all(totals[k]==0 for k in ('failures','errors','skipped')), totals
          cases={c.get('name') for r in reports for c in r.findall('testcase')}
          for name in (
              'matchingTypedRunStartCannotDisguiseWrongHeaderFilename',
              'rejectedHeaderCannotPartiallyImportOtherLogOrModifyExistingHistory',
              'distinctSegmentHeadersWithOneSharedRunIdStillImportLosslessly',
              'theHistoryMovesToAnotherDeviceAndRebuildsToTheSameThing',
              'aFileWhoseHeaderNamesAnotherRunIsDropped',
              'repeatedManifestPathKeepsFirstMatchAndNeverOverwritesHistory',
          ):
              assert name in cases, name
          print('Full APD core suite:',totals,'suites:',len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-import-header-filename-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
