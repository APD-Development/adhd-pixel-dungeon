name: Verify applied APD seed reuse scoring
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths:
      - .github/workflows/apd-seed-reuse-applied-ci.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/Rankings.java
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/windows/WndScoreBreakdown.java
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/recorder/SeedHistory.java
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/recorder/SeedReuseScore.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/recorder/SeedReuseScoreTest.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/SeedHistoryTest.java
      - tools/test_apd_seed_reuse_breakdown_disclosure.py
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Require live seed scoring wiring and no placeholder
        run: |
          python3 -m unittest discover -s tools -p 'test_apd_seed_reuse_breakdown_disclosure.py' -v
          python3 - <<'PY'
          from pathlib import Path
          ranks=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/Rankings.java').read_text()
          ui=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/windows/WndScoreBreakdown.java').read_text()
          assert 'SeedReuseScore.calculate(' in ranks and '.store(rec.gameData);' in ranks
          assert 'SeedReuseScore.earnedScore(gameData,adjusted)' in ranks
          assert 'SeedReuseScore.restore(recordedGameData)' in ui
          assert 'Seed reuse deduction","Not recorded"' not in ui
          PY
      - name: Compile all Android variants, run complete core tests
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Verify seed reuse tests and all suites are green
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          roots=[ET.parse(p).getroot() for p in pathlib.Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert roots,'Missing complete core test results'
          totals={k:sum(int(r.get(k,0)) for r in roots) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3262 and totals['failures']==totals['errors']==totals['skipped']==0,totals
          suite=[r for r in roots if r.get('name','').endswith('.SeedReuseScoreTest')]
          assert len(suite)==1,'Missing real saved-penalty tests'
          assert int(suite[0].get('tests','0'))>=5
          hist=[r for r in roots if r.get('name','').endswith('.SeedHistoryTest')]
          assert len(hist)==1
          assert 'currentRunIsExcludedFromScoringHistoryWithoutLosingEarlierAttempts' in {
              c.get('name') for c in hist[0].findall('testcase')}
          print('Accepted core tests:',totals)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-seed-reuse-scoring-core-results
          path: core/build/test-results/test/
          if-no-files-found: warn
