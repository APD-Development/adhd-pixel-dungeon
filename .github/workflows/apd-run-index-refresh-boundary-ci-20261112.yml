name: APD derived run index path safety
on:
  push:
    branches: [chatgpt/apd-index-refresh-path-20261112-1515]
    paths: [.github/workflows/apd-run-index-refresh-boundary-ci-20261112.yml]
permissions: {contents: read}
concurrency:
  group: apd-run-index-refresh-boundary-20261112
  cancel-in-progress: false
jobs:
  source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Require bounded index refresh and unmodified valid-ID semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunIndex.java').read_text()
          test = Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunIndexTest.java').read_text()
          refresh = source.split('public synchronized RunIndexEntry refresh( String runId ) throws IOException {',1)[1].split('\n\t}',1)[0]
          assert 'StatsStore.isValidRunId(runId)' in refresh
          assert refresh.index('StatsStore.isValidRunId(runId)') < refresh.index('new File(runsDir, runId + LOG_SUFFIX)')
          assert 'refreshRejectsPathLikeRunIdsWithoutReadingOutsideHistory' in test
          assert 'refreshTracksAChangingRun' in test
          print('Run ID boundary check precedes file read; both regression and valid control present')
          PY
      - name: Complete core tests and desktop/Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Check every JUnit suite and required real filesystem regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = [ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'missing test-result XML'
          totals = {k: sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3310, totals
          assert all(totals[k] == 0 for k in ('failures','errors','skipped')), totals
          cases = {c.get('name') for r in reports for c in r.findall('testcase')}
          assert {'refreshRejectsPathLikeRunIdsWithoutReadingOutsideHistory','refreshTracksAChangingRun'} <= cases
          print('Verified full core suite', totals, 'suites', len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-run-index-path-safety-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
