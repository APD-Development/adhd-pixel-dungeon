name: Verify and publish APD371 wall correction
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-371-PUBLISH-REQUEST.txt]
permissions: {contents: write}
concurrency: {group: apd371-owner-publication, cancel-in-progress: false}
env:
  APD_DELIVERY_SPEC: docs/APD-371-DELIVERY-SPEC.json
jobs:
  build-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Preserve fallback and embed complete existing history
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 tools/apd_owner_delivery_policy.py
          python3 - <<'PY'
          import json,subprocess,pathlib,sys
          sys.path.insert(0,'tools')
          from apd_build_history import merge_previous_apk,embed
          repo='APD-Development/ShieldingShouldHaveWorked'
          api=lambda p:json.loads(subprocess.check_output(['gh','api',p]))
          assert api('repos/'+repo)['private']
          release=api('repos/'+repo+'/releases/tags/apd-alpha-preview-370')
          pathlib.Path('evidence').mkdir()
          pathlib.Path('evidence/fallback370.json').write_text(json.dumps(release,indent=2))
          subprocess.run(['gh','release','download','apd-alpha-preview-370','--repo',repo,'--pattern','APD-Developer-370.apk','--dir','fallback'],check=True)
          merge_previous_apk(pathlib.Path.cwd(),'fallback/APD-Developer-370.apk','Codex TEST 370')
          ledger={'date':'2026-11-07','changes':[{'category':'Quality of Life','sprite':'ICON_PREFS','title':'Observed doorway geometry for search marks','text':'Requires observed side frames and an observed approach before displaying doorway search marks. Prevents unknown corners from receiving speculative checks. Keeps valid marks in remembered terrain and preserves normal paid resumption of saved uncertain searches. Search costs, discovery chances and dungeon generation remain unchanged. The wider description review remains unfinished.'}]}
          embed(pathlib.Path.cwd(),ledger,371)
          PY
      - name: Full core and required compilation; build exactly one pair
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          mkdir -p owner-delivery
          ./gradlew :core:test :desktop:classes :android:compileReleaseJavaWithJavac :android:assembleDebug :android:assembleDebugAndroidTest -PapdTestBuild -PapdBuild=C371
          cp android/build/outputs/apk/debug/android-debug.apk owner-delivery/APD-Developer-371.apk
          cp android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk evidence/instrumentation.apk
          ./gradlew :android:assembleDebug -PapdBuild=P371
          cp android/build/outputs/apk/debug/android-debug.apk owner-delivery/APD-Alpha-Testers-371.apk
          python3 tools/check_android_json_abi.py
          ./gradlew --stop
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual Developer and Alpha applications on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 320x640
          script: |
            adb logcat -c
            adb logcat -v time > evidence/native-logcat.txt &
            adb install -r owner-delivery/APD-Developer-371.apk
            adb install -r evidence/instrumentation.apk
            timeout 360 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.QolItemFeedbackDeviceTest com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/developer-qol.txt
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 180 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.WallGeometryDeviceTest com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/developer-wall.txt
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 180 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.TrapDiscoveryDeviceTest#a_controlWritesEnabledPreference com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/developer-seed.txt
            python3 tools/apd_check_single_instrumentation.py evidence/developer-seed.txt a_controlWritesEnabledPreference
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 180 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.TrapDiscoveryDeviceTest#b_freshProcessReadsEnabledAndCanDisable com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/developer-restart.txt
            python3 tools/apd_check_single_instrumentation.py evidence/developer-restart.txt b_freshProcessReadsEnabledAndCanDisable
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 180 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.TrapDiscoveryDeviceTest#c_runtimeDiscoveryRouteAndActualTrapEffect com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/developer-gameplay.txt
            python3 tools/apd_check_single_instrumentation.py evidence/developer-gameplay.txt c_runtimeDiscoveryRouteAndActualTrapEffect
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            adb install -r owner-delivery/APD-Alpha-Testers-371.apk
            timeout 180 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.WallGeometryDeviceTest com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/alpha-wall.txt
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 180 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.TrapDiscoveryDeviceTest#a_controlWritesEnabledPreference com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/alpha-seed.txt
            python3 tools/apd_check_single_instrumentation.py evidence/alpha-seed.txt a_controlWritesEnabledPreference
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 180 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.TrapDiscoveryDeviceTest#b_freshProcessReadsEnabledAndCanDisable com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/alpha-restart.txt
            python3 tools/apd_check_single_instrumentation.py evidence/alpha-restart.txt b_freshProcessReadsEnabledAndCanDisable
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 180 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.TrapDiscoveryDeviceTest#c_runtimeDiscoveryRouteAndActualTrapEffect com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/alpha-gameplay.txt
            python3 tools/apd_check_single_instrumentation.py evidence/alpha-gameplay.txt c_runtimeDiscoveryRouteAndActualTrapEffect
            adb pull /sdcard/Pictures/APD-Test-Visuals/. evidence/visuals/
      - name: Verify identities, results and package matching credential-free source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 tools/apd_prepare371.py
      - name: Scan source and full reachable history
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/apd-gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/apd-gitleaks.tar.gz' | sha256sum -c -
          mkdir /tmp/apd-gitleaks
          tar -xzf /tmp/apd-gitleaks.tar.gz -C /tmp/apd-gitleaks
          python3 tools/apd_qol_source_scan.py
      - name: Publish verified pair to existing private draft and download back
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 tools/apd_qol_publish_prepared.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd371-publication-evidence
          path: |
            owner-delivery/
            evidence/*.txt
            evidence/*.json
            evidence/visuals/
            core/build/test-results/test/
          retention-days: 14
