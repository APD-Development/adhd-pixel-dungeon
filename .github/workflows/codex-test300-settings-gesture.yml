name: APD TEST300 exact APK settings gesture acceptance
# Screenshots are retained by the full main suite; this gate verifies the corrected gesture only.
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/codex-test300-settings-gesture.yml]
permissions:
  contents: read
  actions: read
jobs:
  settings-gesture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Obtain exact produced TEST300 application and prove unchanged application inputs
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          git fetch --depth=1 origin d41631b3e5b43bf832036426a9e7c7a0694d07ed
          test -z "$(git diff d41631b3e5b43bf832036426a9e7c7a0694d07ed HEAD -- core/src/main android/src/main SPD-classes/src/main)"
          mkdir -p settings-gesture-evidence
          gh api repos/APD-Development/ShieldingShouldHaveWorked/actions/artifacts/12222971201/zip > settings-application.zip
          python3 - <<'PY'
          import zipfile,pathlib,hashlib,json,os
          archive=pathlib.Path('settings-application.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='d2da2eae9c0b979d1ced8662a9247268a9cdee82eb8362a893d94bc982e94cd8'
          with zipfile.ZipFile(archive) as z:
              name=next(n for n in z.namelist() if n.endswith('.apk'));data=z.read(name)
          assert hashlib.sha256(data).hexdigest()=='12687b32034edaeeac8d9bc9d62bda2ba74f17b65e3f30fc4f72a13d4a3ee26d'
          pathlib.Path('application.apk').write_bytes(data)
          pathlib.Path('settings-gesture-evidence/source.json').write_text(json.dumps({'application_source':'d41631b3e5b43bf832036426a9e7c7a0694d07ed','test_source':os.environ['GITHUB_SHA'],'sha256':hashlib.sha256(data).hexdigest(),'application_rebuilt':False,'protected_application_inputs_identical':True},indent=2))
          PY
      - name: Compile corrected instrumentation only
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :android:assembleDebugAndroidTest -PapdTestBuild -PapdBuild=C300
          test ! -f android/build/outputs/apk/debug/android-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the retained failed gesture/control regression against the exact APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: bash tools/run-test300-settings-gesture.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-test300-settings-gesture-exact-apk
          path: settings-gesture-evidence/
          if-no-files-found: error
          retention-days: 7
