items.weapon.melee.dirk.name=dirk
items.weapon.melee.dirk.stats_desc=This weapon is stronger against unaware enemies.
items.weapon.melee.dirk.ability_name=sneak
items.weapon.melee.dirk.typical_ability_desc=Unupgraded example (+0): _Sneak_ instantly blinks to a visible empty tile up to 4 steps away and grants _%d turns of invisibility_. Cannot be used while rooted.
items.weapon.melee.dirk.ability_desc=Duelist: _Sneak_ instantly blinks to a visible empty tile up to 4 steps away and grants _%d turns of invisibility_. Cannot be used while rooted.
items.weapon.melee.dirk.upgrade_ability_stat_name=Ability Duration
items.weapon.melee.dirk.desc=A longer thrusting dagger, gives a bit more steel to plunge into foes.

items.weapon.melee.flail.name=flail
items.weapon.melee.flail.stats_desc=This is a rather inaccurate weapon.\nThis weapon cannot surprise attack.
items.weapon.melee.flail.ability_name=spin
items.weapon.melee.flail.spin_warn=You can't spin the flail any more.
items.weapon.melee.flail.typical_ability_desc=Unupgraded example (+0): _Spin_ for 1 turn to add _+%d damage_ to your next regular attack, which cannot miss. Stack up to 3 spins; only the first costs a charge. Attack before the effect expires.
items.weapon.melee.flail.ability_desc=Duelist: _Spin_ for 1 turn to add _+%d damage_ to your next regular attack, which cannot miss. Stack up to 3 spins; only the first costs a charge. Attack before the effect expires.
items.weapon.melee.flail.desc=A spiked ball attached to a handle by a length of chain. Very unwieldy, but devastating if it lands a solid hit.
items.weapon.melee.flail$spinabilitytracker.name=spinning
items.weapon.melee.flail$spinabilitytracker.desc=Your next regular flail attack cannot miss and gains damage from each spin, up to 3 spins. Each spin takes 1 turn.\n\nSpins: %3$d/3.\nTurns remaining: %2$s.

items.weapon.melee.gauntlet.name=stone gauntlet
items.weapon.melee.gauntlet.stats_desc=This is a very fast weapon.
items.weapon.melee.gauntlet.ability_name=combo strike
items.weapon.melee.gauntlet.typical_ability_desc=Unupgraded example (+0): _Combo Strike_ cannot miss and adds _+%d damage_ for each recent normal melee or thrown hit, then uses up the combo. The combo expires after 5 turns without a hit, or 15 after a kill.
items.weapon.melee.gauntlet.ability_desc=Duelist: _Combo Strike_ cannot miss and adds _+%d damage_ for each recent normal melee or thrown hit, then uses up the combo. The combo expires after 5 turns without a hit, or 15 after a kill.
items.weapon.melee.gauntlet.desc=This massive gauntlet is made of crimson fabric with heavy magical stone layered on top. The fabric tightens around you, making the thick stone plates almost like a second skin. Swinging such a heavy weapon requires strength, but adds tremendous force to your blows.

items.weapon.melee.glaive.name=glaive
items.weapon.melee.glaive.stats_desc=Base reach: _2 tiles_.
items.weapon.melee.glaive.ability_name=spike
items.weapon.melee.glaive.typical_ability_desc=_Unupgraded example (+0):_ The Duelist’s _spike_ always hits a nonadjacent enemy within reach for _%1$d-%2$d damage_, pushing it back up to 1 tile.
items.weapon.melee.glaive.ability_desc=The Duelist’s _spike_ always hits a nonadjacent enemy within reach for _%1$d-%2$d damage_, pushing it back up to 1 tile.
items.weapon.melee.glaive.desc=A massive polearm consisting of a sword blade on the end of a pole.

items.weapon.melee.gloves.name=studded gloves
items.weapon.melee.gloves.stats_desc=This is a very fast weapon.
items.weapon.melee.gloves.ability_name=combo strike
items.weapon.melee.gloves.typical_ability_desc=Unupgraded example (+0): _Combo Strike_ cannot miss and adds _+%d damage_ for each recent normal melee or thrown hit, then uses up the combo. The combo expires after 5 turns without a hit, or 15 after a kill.
items.weapon.melee.gloves.ability_desc=Duelist: _Combo Strike_ cannot miss and adds _+%d damage_ for each recent normal melee or thrown hit, then uses up the combo. The combo expires after 5 turns without a hit, or 15 after a kill.
items.weapon.melee.gloves.desc=These studded gloves don't provide any real protection, but they act as a serviceable weapon while keeping the hands free.
items.weapon.melee.gloves.discover_hint=One of the heroes starts with this item.

items.weapon.melee.greataxe.name=greataxe
items.weapon.melee.greataxe.stats_desc=This weapon is incredibly heavy.
items.weapon.melee.greataxe.ability_name=retribution
items.weapon.melee.greataxe.typical_ability_desc=_Unupgraded example (+0):_ The Duelist’s _retribution_ requires less than half health. It always hits for _%1$d-%2$d damage_. A kill takes no time.
items.weapon.melee.greataxe.ability_desc=The Duelist’s _retribution_ requires less than half health. It always hits for _%1$d-%2$d damage_. A kill takes no time.
items.weapon.melee.greataxe.desc=Meant to be wielded over the shoulder, this titanic axe is as powerful as it is heavy.

items.weapon.melee.greatshield.name=greatshield
items.weapon.melee.greatshield.typical_stats_desc=Typically this weapon blocks 0-%d damage. This blocking scales with upgrades.
items.weapon.melee.greatshield.stats_desc=This weapon blocks 0-%d damage. This blocking scales with upgrades.
items.weapon.melee.greatshield.ability_name=guard
items.weapon.melee.greatshield.typical_ability_desc=Unupgraded example (+0): _Guard_ blocks incoming attacks for _%d turns_. After blocking an attack, attacking or using magic ends the guard.
items.weapon.melee.greatshield.ability_desc=Duelist: _Guard_ blocks incoming attacks for _%d turns_. After blocking an attack, attacking or using magic ends the guard.
items.weapon.melee.greatshield.upgrade_ability_stat_name=Ability Duration
items.weapon.melee.greatshield.desc=More like a mobile wall than a shield, this gigantic mass of metal aids defense, but doesn't leave much room for attacking.

items.weapon.melee.greatsword.name=greatsword
items.weapon.melee.greatsword.ability_name=cleave
items.weapon.melee.greatsword.typical_ability_desc=_Unupgraded example (+0):_ The Duelist’s _cleave_ always hits for _%1$d-%2$d damage_. A kill takes no time. A paid cleave that kills grants one charge-free follow-up within 5 turns.
items.weapon.melee.greatsword.ability_desc=The Duelist’s _cleave_ always hits for _%1$d-%2$d damage_. A kill takes no time. A paid cleave that kills grants one charge-free follow-up within 5 turns.
items.weapon.melee.greatsword.desc=This towering blade inflicts heavy damage by investing its heft into every swing.

