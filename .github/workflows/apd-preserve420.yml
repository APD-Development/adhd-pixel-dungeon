name: Preserve rejected420 original APKs and raw evidence in private draft only
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-420-PRESERVE-REQUEST.txt]
permissions: {contents: write, actions: read}
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Preserve immutable rejected files without publishing
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh run download 42650360251 --repo "$GITHUB_REPOSITORY" --name apd420-built-pair --dir original-build
          gh run download 42650360251 --repo "$GITHUB_REPOSITORY" --name apd420-native-Developer --dir rejected-evidence/Developer
          gh run download 42650360251 --repo "$GITHUB_REPOSITORY" --name apd420-native-Alpha-Testers --dir rejected-evidence/Alpha-Testers
          python3 - <<'PYPRESERVE'
          import pathlib,json,subprocess,zipfile,hashlib,os
          repo=os.environ['GITHUB_REPOSITORY'];api=lambda p:json.loads(subprocess.check_output(['gh','api',p]));assert api('repos/'+repo)['private'];run=api('repos/'+repo+'/actions/runs/42650360251');assert run['conclusion']=='failure' and run['head_sha']=='55d8e9adfb05756e4b6a854e43d2b836748772fd';releases=api('repos/'+repo+'/releases?per_page=100');release=next(r for r in releases if r['tag_name']=='apd-alpha-preview-420');assert release['draft']
          apps=sorted(pathlib.Path('original-build/owner-delivery').glob('APD-*-420.apk'));assert len(apps)==2
          manifest={'accepted':False,'native_acceptance':'Both QoL cases stopped at a test-only Might highlight expectation mismatch. Actual value5of5 is correctly present with highlighting markers. Application build and3143core passed. Original pair unchanged; retry corrects only the expected raw-format markers and requires all12 cases.','source_commit':run['head_sha'],'run':run['html_url'],'application_apks_rebuilt':False,'files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in apps}}
          pathlib.Path('rejected420.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with zipfile.ZipFile('APD-420-Native-Held-Original-APKs.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in apps:z.write(p,p.name)
            z.write('rejected420.json','UNVERIFIED-READ-FIRST.json')
          with zipfile.ZipFile('APD-420-Initial-Native-Held-Evidence.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in pathlib.Path('rejected-evidence').rglob('*'):
              if p.is_file():z.write(p,p.relative_to('rejected-evidence'))
            z.write('rejected420.json','rejected420.json')
          for name in ['APD-420-Native-Held-Original-APKs.zip','APD-420-Initial-Native-Held-Evidence.zip']:
            assert name not in {a['name'] for a in release['assets']};subprocess.run(['gh','release','upload','apd-alpha-preview-420',name,'--repo',repo],check=True)
          assert next(r for r in api('repos/'+repo+'/releases?per_page=100') if r['tag_name']=='apd-alpha-preview-420')['draft'];print('Rejected immutable files preserved in private draft only; not published.')
          PYPRESERVE
