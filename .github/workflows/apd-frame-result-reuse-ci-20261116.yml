name: APD streaming frame-result reuse exact-source CI
on:
  push:
    branches: [chatgpt/apd-frame-result-reuse-20261116-0600]
    paths:
      - .github/workflows/apd-frame-result-reuse-ci-20261116.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunLogReader.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunLogStreamingReadTest.java
permissions: {contents: read}
concurrency:
  group: apd-stream-frame-result-reuse-20261116
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Assert frame-record reuse and unchanged checksum validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunLogReader.java').read_text()
          tests=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunLogStreamingReadTest.java').read_text()
          assert 'FrameResult reusableFrame = new FrameResult();' in src
          assert 'crc, reusableFrame);' in src
          assert 'FrameResult f = result;' in src
          assert 'crc.reset();' in src
          assert 'if (crc.getValue() != stored)' in src
          assert 'if (len < 0 || len > LogFormat.MAX_FRAME_PAYLOAD)' in src
          assert 'assertNotSame(streamed.events.get(i - 1).payload, streamed.events.get(i).payload);' in tests
          PY
      - name: Full core suite and desktop/Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require complete JUnit suite and exact CRC regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert suites,'missing JUnit results'
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3524,totals
          assert totals['failures']==totals['errors']==totals['skipped']==0,totals
          names={t.get('name') for s in suites for t in s.findall('testcase')}
          for name in ('streamingFrameResultReuseKeepsEveryEventPayloadIndependent',
                       'streamingChecksumReusePreservesManyValidFramesAndDetectsLaterCorruption',
                       'streamingChecksumReusePreservesTruncatedChecksumRefusal',
                       'streamedFrameLengthVarintBoundariesMatchBufferedReader',
                       'malformedStreamedLengthVarintsRetainExistingTruncationResults',
                       'identityOnlyStreamingReusesEqualLengthFramesAndKeepsDifferentLengthsCorrect'):
              assert name in names,name
          print(totals,'suites',len(suites))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-frame-result-reuse-junit-20261116
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
