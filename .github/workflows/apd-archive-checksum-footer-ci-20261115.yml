name: APD archive checksum footer exact-source verification
on:
  push:
    branches: [chatgpt/apd-archive-check-footer-20261115-0800]
    paths:
      - .github/workflows/apd-archive-checksum-footer-ci-20261115.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifest.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifestChecksumFooterTest.java
permissions: {contents: read}
concurrency:
  group: apd-archive-checksum-footer-20261115
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Require checksum-footer source guard and regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifest.java').read_text()
          test = Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifestChecksumFooterTest.java').read_text()
          assert 'claimed.matches("[0-9a-fA-F]{64}")' in src
          assert 'the manifest has a damaged checksum footer' in src
          for method in ('exactWriterFooterAndExistingLineEndingVariantsStillParse',
                         'uncheckedBlankRecordAndTrailingSpacesCannotBeTrimmedAway',
                         'uncheckedSuffixInZipRefusesWithoutTouchingOriginalHistory'):
              assert 'void ' + method + '(' in test, method
          print('Checksum footer guard and three new regression cases present')
          PY
      - name: Run complete core suite and compile desktop and Android Java
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require zero failures and retained compatibility regressions
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          reports = [ET.parse(path).getroot() for path in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'Missing test evidence'
          totals = {k: sum(int(r.get(k, 0)) for r in reports) for k in ('tests', 'failures', 'errors', 'skipped')}
          assert totals['tests'] >= 3491, totals
          assert all(totals[k] == 0 for k in ('failures', 'errors', 'skipped')), totals
          cases = {c.get('name') for r in reports for c in r.findall('testcase')}
          for name in ('exactWriterFooterAndExistingLineEndingVariantsStillParse',
                       'uncheckedBlankRecordAndTrailingSpacesCannotBeTrimmedAway',
                       'uncheckedSuffixInZipRefusesWithoutTouchingOriginalHistory',
                       'secondCorrectFinalChecksumDoesNotLegitimizeFirstChecksum',
                       'secondValidChecksumCannotHideConflictingEarlierChecksum',
                       'ordinarySingleChecksumAndUnknownExtensionStillRoundTrip',
                       'duplicateChecksumZipImportRefusesWithoutChangingOldHistory',
                       'invalidUtf8IsRejectedEvenWithAReplacementBasedValidChecksum',
                       'repeatedManifestPathKeepsFirstMatchAndNeverOverwritesHistory'):
              assert name in cases, 'Missing regression: ' + name
          print('Full core JUnit suite:', totals, 'suites:', len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-archive-checksum-footer-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
