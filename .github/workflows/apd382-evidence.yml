name: Report382 raw item-window acceptance evidence
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-382-EVIDENCE-REQUEST.txt]
permissions: {contents: read, actions: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {name: apd382-native-Developer, run-id: 42534873950, github-token: '${{ github.token }}', path: evidence/Developer}
      - uses: actions/download-artifact@v4
        with: {name: apd382-native-Alpha-Testers, run-id: 42534873950, github-token: '${{ github.token }}', path: evidence/Alpha}
      - name: Print actual instrumentation failure without changing application APKs
        run: |
          python3 - <<'PYREPORT'
          import pathlib
          for p in pathlib.Path('evidence').rglob('*-qol.txt'):
            print(p)
            print(p.read_text())
          PYREPORT
