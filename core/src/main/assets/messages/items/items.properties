items.artifacts.skeletonkey.discard=You discard your excess keys.
items.artifacts.skeletonkey.levelup=Your skeleton key grows stronger!
items.artifacts.skeletonkey.desc=A magical key that opens locks, locks doors and creates temporary walls. Wear it to use its power.
items.artifacts.skeletonkey.desc_worn=Opening nearby locks costs _1 charge for Iron_, _2 for Golden_ or _5 for Crystal_. Cannot open locked exits, or iron-lock doors on sealed floors or side branches.\n\nLock a door or create a _3 tile wide wall for 10 turns_: _2 charges_. Enemies are pushed away if there is room. Reopening a door you locked costs no charge. Successful uses take _1 turn_ and help the key grow stronger. Redundant dungeon keys are discarded.
items.artifacts.skeletonkey.desc_cursed=While worn, _5 out of 6_ attempts to open locked doors or chests fail, wasting time and extra hunger. Its own magic and recharging are disabled.
items.artifacts.skeletonkey$keywall.desc=A temporary magical wall has been placed here by the skeleton key.

items.artifacts.talismanofforesight.name=talisman of foresight
items.artifacts.talismanofforesight.ac_scry=SCRY
items.artifacts.talismanofforesight.low_charge=The talisman requires at least 5% charge to scry.
