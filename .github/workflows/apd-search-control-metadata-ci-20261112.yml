name: Verify APD adaptive Search chooser metadata safety
on:
  push:
    branches: [codex/apd-search-control-metadata-safety-20261112]
    paths: [.github/workflows/apd-search-control-metadata-ci-20261112.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate isolated read-only chooser guards and test coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/SearchControlContext.java').read_text()
          assert 'completeObservedMetadata(Level level)' in s
          for name in ('map','heroFOV','visited','mapped'):
              assert 'level.'+name+' != null && level.'+name+'.length >= length' in s
          assert s.count('!completeObservedMetadata(level)') == 2
          t=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/SearchControlContextTest.java').read_text()
          for case in ('incompleteObservationArraysCannotPromoteAdaptiveWallChoice',
                       'roomCenterCheckHandlesMissingAndShortVisibilityWithoutReadingHiddenTiles'):
              assert case in t
          print('Bounded adaptive chooser guards and regression cases present')
          PY
      - name: Run complete core suite and compile desktop and Android Java
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require clean complete suite and both new regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports,'Missing JUnit reports'
          totals={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3290 and all(totals[k]==0 for k in ('failures','errors','skipped')),totals
          cases={t.get('name') for r in reports if r.get('name','').endswith('.SearchControlContextTest') for t in r.findall('testcase')}
          required={'incompleteObservationArraysCannotPromoteAdaptiveWallChoice',
                    'roomCenterCheckHandlesMissingAndShortVisibilityWithoutReadingHiddenTiles'}
          assert required<=cases,required-cases
          print('Verified',totals,'across',len(reports),'suites; both new chooser cases passed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-search-control-metadata-core-results
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
