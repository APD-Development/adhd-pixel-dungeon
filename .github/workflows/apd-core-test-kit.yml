name: APD private offline core test runtime
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-CORE-TEST-KIT-REQUEST.txt]
permissions: {contents: read}
jobs:
  test-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Run the full core suite and export only its runtime classpath
        env:
          APD_TEST_KIT_OUT: ${{ github.workspace }}/core-test-kit
        run: bash tools/run-core-tests.sh :core:apdExportTestKit --init-script "$PWD/tools/apd_core_test_kit.gradle"
      - name: Verify results and hash exported files
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,os,xml.etree.ElementTree as E
          root=pathlib.Path('core-test-kit')
          suites=[E.parse(p).getroot() for p in pathlib.Path('core/build/test-results/test').glob('TEST-*.xml')]
          counts={k:sum(int(s.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
          assert suites and counts['tests']>=3169 and not any(counts[k] for k in ('failures','errors','skipped')),counts
          hashes={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}
          assert hashes and all(not any(x in p.lower() for x in ('.keystore','.jks','credentials','gradle.properties')) for p in hashes)
          (root/'verification.json').write_text(json.dumps(dict(source_commit=os.environ['GITHUB_SHA'],suites=len(suites),**counts,files=hashes),indent=2)+'\n')
          print(counts)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: apd-core-test-kit
          path: core-test-kit/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-core-test-kit-results
          path: core/build/test-results/test/
          retention-days: 14
