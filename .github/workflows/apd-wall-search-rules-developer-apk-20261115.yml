name: APD wall search rules + throw aim Developer APK
on:
  push:
    branches: [fix/apd-adaptive-wall-search-rules-20261115]
    paths: [.github/workflows/apd-wall-search-rules-developer-apk-20261115.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Core tests and Developer APK
        run: ./gradlew :core:test :android:assembleDebug -PapdTestBuild -PapdBuild=C466R7
      - name: Verify signer and package
        run: |
          set -euo pipefail
          mkdir -p out
          cp android/build/outputs/apk/debug/android-debug.apk out/APD-WallSearchRules-Developer-TEST.apk
          tools=$(ls -d $ANDROID_HOME/build-tools/* | sort | tail -1)
          $tools/apksigner verify --print-certs out/*.apk | grep -i "067688b3ab6bd5820a67f4c1ba7d5859db578173771cf31d3252b3e4e012246e" || $tools/apksigner verify --print-certs out/*.apk | tr -d ':' | grep -i 067688b3ab6bd5820a67f4c1ba7d5859db578173771cf31d3252b3e4e012246e
          $tools/aapt dump badging out/*.apk | grep "^package:"
      - uses: actions/upload-artifact@v4
        with:
          name: APD-WallSearchRules-Developer-TEST
          path: out/APD-WallSearchRules-Developer-TEST.apk
          retention-days: 30
          if-no-files-found: error
