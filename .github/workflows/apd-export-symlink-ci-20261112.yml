name: APD archive export symlink boundary source gate
on:
  push:
    branches: [chatgpt/apd-export-symlink-boundary-20261112-1905]
    paths:
      - .github/workflows/apd-export-symlink-ci-20261112.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveExporter.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveExporterSymlinkTest.java
permissions: {contents: read}
concurrency:
  group: apd-export-symlink-20261112-1905
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify bounded archive export source and compatibility fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveExporter.java').read_text()
          t=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveExporterSymlinkTest.java').read_text()
          assert 'isDirectHistoryFolder(dir)' in s
          assert s.count('isDirectHistoryFile(') >= 3
          for name in ('linkedRunAndLegacyLogsCannotExportExternalHistory','linkedRunAndLegacyDirectoriesCannotExportOutsideHistoryRoot','callerSuppliedCanonicalRootAliasStillExportsNormalHistory'):
              assert name in t, name
          print('Archive export source and three filesystem regressions present')
          PY
      - name: Full core suite plus desktop and Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require JUnit tests without failures and preserve archive first-wins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'missing JUnit XML'
          totals={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3323, totals
          assert all(totals[k]==0 for k in ('failures','errors','skipped')), totals
          cases={c.get('name') for r in reports for c in r.findall('testcase')}
          for name in ('linkedRunAndLegacyLogsCannotExportExternalHistory','linkedRunAndLegacyDirectoriesCannotExportOutsideHistoryRoot','callerSuppliedCanonicalRootAliasStillExportsNormalHistory','repeatedManifestPathKeepsFirstMatchAndNeverOverwritesHistory','exporterReleasesItsZipWithoutClosingTheCallerStream'):
              assert name in cases, name
          print('Full APD source suite:', totals, 'suites:', len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-export-symlink-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
