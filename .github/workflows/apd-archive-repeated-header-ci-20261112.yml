name: APD archive repeated header source gate
on:
  push:
    branches: [chatgpt/apd-archive-repeated-header-20261112]
    paths:
      - .github/workflows/apd-archive-repeated-header-ci-20261112.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifest.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifestRepeatedHeaderTest.java
permissions: {contents: read}
concurrency:
  group: apd-archive-repeated-header-20261112
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Confirm isolated header validation and regression scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifest.java').read_text()
          tests = Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifestRepeatedHeaderTest.java').read_text()
          assert 'if (header) throw new IllegalArgumentException("the manifest has repeated headers")' in source
          for name in ('identicalRepeatedHeadersAreRejectedWithValidChecksum',
                       'conflictingRepeatedHeadersAreRejectedBeforeChangingFormat',
                       'singleHeaderAndUnknownFutureMetadataStillRoundTrip',
                       'repeatedHeaderZipImportPreservesOriginalHistory'):
              assert 'void ' + name + '(' in tests, name
          print('Scoped repeated-header guard and four regression methods present')
          PY
      - name: Run all core tests and compile desktop and Android Java
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require clean JUnit and existing archive compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = [ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'missing JUnit XML'
          totals = {k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3345, totals
          assert all(totals[k] == 0 for k in ('failures','errors','skipped')), totals
          cases = {c.get('name') for r in reports for c in r.findall('testcase')}
          for name in ('identicalRepeatedHeadersAreRejectedWithValidChecksum',
                       'conflictingRepeatedHeadersAreRejectedBeforeChangingFormat',
                       'singleHeaderAndUnknownFutureMetadataStillRoundTrip',
                       'repeatedHeaderZipImportPreservesOriginalHistory',
                       'contradictoryRepeatedTotalsAreRefusedDespiteValidChecksum',
                       'negativeEventCountsAreRefusedWithValidChecksums',
                       'invalidSealedTokensAreRefusedWithCorrectChecksums',
                       'aManifestRoundTrips',
                       'repeatedManifestPathKeepsFirstMatchAndNeverOverwritesHistory'):
              assert name in cases, name
          print('Full APD source suite:',totals,'suites:',len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-archive-repeated-header-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
