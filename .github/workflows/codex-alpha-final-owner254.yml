              result=json.loads((folder/'device-acceptance-result.json').read_text())
              assert origin['application_source']==source and origin['application_sha256']==expected
              assert origin['protected_application_inputs_identical'] and not origin['application_rebuilt']
              assert result['instrumented_methods']==count and result['api_level']==api
              assert result['failures']==result['errors']==result['skipped']==0 and not result['physical_device']
              assert len(result['images'])==(6 if api==34 else 13)
              assert all(v==([320,640] if api==34 else [540,960]) for v in result['images'].values())
              text=(folder/'instrumentation.txt').read_text()
              assert re.search(r'OK \('+str(count)+r' tests?\)',text) and 'FAILURES!!!' not in text
              if api==36:
                  tested=set(re.findall(r'INSTRUMENTATION_STATUS: test=([^\r\n]+)',text))
                  assert len(tested)==8 and tested<={name for _,name in primary_cases}
              evidence['api'+str(api)]={'source':origin,'device':result}
          folder=pathlib.Path('supplemental/native-proof')
          visible_origin=json.loads((folder/'acceptance-source.json').read_text())
          visible_result=json.loads((folder/'device-acceptance-result.json').read_text())
          assert visible_origin['application_source']==source and visible_origin['application_sha256']==expected and not visible_origin['application_rebuilt']
          assert visible_result['instrumented_methods']==2 and visible_result['failures']==visible_result['errors']==visible_result['skipped']==0 and len(visible_result['images'])==3
          assert all(v==[540,960] for v in visible_result['images'].values())
          assert re.search(r'OK \(2 tests\)',(folder/'instrumentation.txt').read_text())
          evidence['native_proof']={'source':visible_origin,'device':visible_result}
          boss=[c for c in main['core']['cases'] if c['classname'].endswith('.BossProgressionAcceptanceTest')]
          assert len(boss)==2
          api=lambda path:json.loads(subprocess.check_output(['gh','api',path]))
          workflow=api('repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/38949555542')
          supplemental=api('repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/38951417636')
          assert workflow['conclusion']==supplemental['conclusion']=='success'
          prepared=datetime.datetime.now(datetime.timezone.utc).isoformat()
          failures=[
              {'run':38938832573,'executed':0,'cause':'Emulator disk space insufficient for Android16 userdata; setup corrected'},
              {'run':38941029689,'executed':7,'passed':5,'failed':2,'cause':'Calendar test cleanup and narrow toolbar overlap'},
              {'run':38942484475,'executed':0,'cause':'Diagnostic heredoc split into shell commands; runner corrected'},
              {'run':38943230165,'executed':7,'passed':6,'failed':1,'cause':'Confirmed 2.5 logical-pixel quickslot/Inventory overlap'},
              {'run':38943900747,'executed':36,'passed':35,'failed':1,'cause':'Test-owned empty-category modal blocked new native pager check'},
              {'run':38946476567,'api34_executed':36,'api34_passed':31,'api34_failed':5,'api36_executed':8,'api36_passed':7,'api36_failed':1,'cause':'Per-method cold starts invalidated existing fixture initialization; live-drag acknowledgement missing'},
              {'run':38950078074,'api36_executed':8,'api36_passed':7,'api36_failed':1,'cause':'Vertical swipe test saw unchanged scroll; fixture now waits for realized camera and actual native DOWN, preserving all gesture assertions; Android16-only rerun uses same APK'},
              {'run':38951417636,'api36_executed':8,'api36_passed':8,'cause':'All assertions passed; later live-preview checks strengthen actual caption visibility and screenshot presentation'},
              {'run':38954130127,'api36_executed':2,'api36_passed':1,'api36_failed':1,'cause':'Live individual and combined captions verified while held; acknowledged OS pager tap still failed with GMS ANRs present. No production root cause established.'},
              {'run':38953589679,'api36_executed':1,'api36_passed':0,'api36_failed':1,'cause':'SystemUI ANR dialog covered APD; InputManager rejected targeted touch as directed at a non-APD window. Diagnostic screenshot and SystemUI/GMS ANR logs retained.'},
              {'run':38952725527,'api36_executed':8,'api36_passed':7,'api36_failed':1,'cause':'Preview caption/held-pointer assertions passed; repeated native pager tap did not change page. Timing cause unconfirmed. Final fixture samples the presented camera and acknowledges actual button DOWN before release.'},
              {'run':38948655465,'api34_passed':36,'api36_passed':8,'release_rejected':True,'cause':'Corrected native suite passed on TEST253; manual screenshot review still found raised pager covering message text. TEST254 fixes message baseline.'}]
          failures.append({'run':38955341493,'api36_executed':2,'api36_passed':1,'api36_failed':1,'cause':'Actual pager/play/save/continue/end passed, but startup destroyed the preview test window, causing Collection.toArray NullPointerException. Final fixture now requires a new settled Title before attaching the window; no application changes.'})
          status={'application_source':source,'application_sha256':expected,'main_core_methods':1736,'main_api34_methods':36,'main_reviewed_screenshots':49,'supplemental':evidence,'unique_android_methods':37,'android_method_executions':47,'all_test254_android_executions_including_prior_attempts':68,'all_test254_android_passed_including_prior_attempts':63,'all_test254_android_failed_including_prior_attempts':5,'supplemental_screenshots':22,'boss_matrix_methods_in_full_core':boss,'tengu_matrix_cases':1200,'dm300_matrix_cases':1200,'boss_visual_callbacks_isolated':True,'native_toolbar_matrix_cases':72,'physical_phone_verified':False,'full_human_boss_playthroughs_verified':False,'all_357_values_unchanged':True,'scoring_formula_unchanged':True,'future_class_scoring_implemented':False,'prior_unsuccessful_checks':failures,'application_workflow':{k:workflow[k] for k in ('id','head_sha','created_at','run_started_at','updated_at','conclusion')},'supplemental_workflow':{k:supplemental[k] for k in ('id','head_sha','created_at','run_started_at','updated_at','conclusion')},'report_prepared_at':prepared,'tester_distribution':False,'application_rebuilt':False}
          (root/'APD-Final-Alpha-Status-254.json').write_text(json.dumps(status,indent=2))
          pdf=root/'APD-Alpha-Preview-254.pdf'
          shutil.copyfile(pdf,'supplemental/original-staged-report.pdf')
          verification=f"TEST254 source: {source}. APK SHA-256: {expected}.\n\nComplete core suite: 1,736 unique tests, zero failures, errors or skips. Primary Android14: 36 methods, zero failures, errors or skips;49 screenshots reviewed. Supplemental Android14: one six-class save/continue method and 6 screenshots. Android16: eight repeated targeted methods and 13 screenshots. Total 37 distinct Android methods across 47 selected acceptance executions;71 captures, including the final visible-caption and pager checks. These are automated emulators, not physical phones.\n\nApplication workflow started {workflow['run_started_at']}; completed/update {workflow['updated_at']}. Supplemental workflow started {supplemental['run_started_at']}; completed/update {supplemental['updated_at']}. Report prepared {prepared}. These timestamps are not a measure of continuous developer-active time. Publication, verified download and sending the chat links are separate events recorded afterward."
          (root/'final-verification.txt').write_text(verification)
          report="""# APD current development report — October 16, 2026

          ## Actual changes since delivered TEST250
          TEST251 added a compact Experimental scoring information button above the Custom Dungeon Rules controls. Its native, scrollable popup explains my future vision for interacting rules, classes, subclasses, crown choices and progression without rewarding random-loot luck. The currently active provisional 357-value scoring system remains unchanged. No future dynamic or class-specific scoring was implemented.

          TEST252 corrected the daily calendar's earned-score display and persistence. A reproduced real daily submission stored original 133 and earned 266, but the calendar read the old integer map and displayed 133. Additive optional long-score metadata now retains the frozen earned value while preserving original historical integer scores. The latest older daily can be recovered if its frozen score exists; unknown older adjusted scores are not invented. Large values wrap below dates.

          TEST253 fixed quickslot paging on very narrow screens. Three quickslot frames, the original action controls and pager require 140 logical pixels; at 135 pixels, the original centering shifted a slot 2.5 pixels into Inventory. The pager now moves above the slots only when the row cannot fit. Although corrected native tests passed, manual screenshot review found that this raised pager covered message text, so TEST253 was rejected and never delivered as verified.

          TEST254 reserves the message baseline above the raised pager, with a two-pixel logical gap. Wider layouts keep their existing baseline. Runtime toolbar layout changes also refresh the message placement. The permanent Android matrix checks both the message baseline and rendered text bounds, as well as actual pager touch interaction. No movement, combat, scoring, RNG, save format or slider mechanics changed in this HUD correction.

          ## Files and systems changed
          Production files since delivered 250: core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/Rankings.java; windows/WndDailies.java; apd/difficulty/CustomRulesPresentation.java; windows/WndCustomDungeonRules.java; ui/Toolbar.java; scenes/GameScene.java; and core/src/main/assets/apd/releases/apd-alpha-preview.tsv. Paths after the first Java file are relative to the same game package.

          New permanent core regressions are DailyEarnedScoreHistoryTest and BossProgressionAcceptanceTest. Android changes are in CustomRulesNoticeDeviceTest, CustomScoreDeviceTest and PlayRunDeviceTest; existing EarlyAlphaRosterDeviceTest is reused. Workflow, build-history ledger, preparation profile, report and handoff changes retain source/build evidence. Delivery-only commits do not rebuild the application.

          ## Tests added and completed
          Five permanent daily-score core methods cover submission/save/load, long scores, legacy records, latest-frozen recovery and malformed optional arrays. Two boss phase/save methods cover 1,200 Tengu and 1,200 DM-300 configurations across six class identities, five difficulties, twenty boss-HP settings and both stronger-boss states. Real phase, damage and save logic is exercised with visual callbacks isolated. These matrices do not establish that every human avoidance strategy or all five bosses were fully played.

          The primary Android suite includes the scoring-vision popup and daily-calendar tests. Existing real-run coverage now exercises 72 combinations of viewport width, toolbar layout, side and page, checks overlap and message bounds, and taps the visible pager using Android touchscreen events. Gesture tests cover directional locking. All 357 slider positions are compared against shared scoring logic, with a real native drag checked before finger release.

          Supplemental acceptance uses the exact same signed TEST254 APK without rebuilding it. All six classes start a generated dungeon, save and continue with locked extreme rules while next-run preferences change independently. Android16 checks all 18 controls, live previews, gesture handling, scoring explanations, daily layout, score popups, scene restoration and actual play/save/continue/end behavior. XML identities are deduplicated; repeated OS checks are not counted as new tests.

          ## Failures retained honestly
          The first Android16 attempt ran 0 tests because its userdata needed 7372.80 MB and the runner had 7036.54 MB free. Unused disposable-runner toolchains were removed. Another diagnostic ran 0 tests because a heredoc was split by the emulator action; it was replaced with a script file. These were setup failures, not passing application checks.

          Later252 checks passed 5/7 and then 6/7: they exposed the narrow Inventory overlap and a calendar fixture that waited for cleanup after Back had destroyed its activity. The fixture now establishes a fresh TitleScene without changing game Back behavior.

          TEST253's first primary Android run passed 35/36 because a test-created empty-hotbar message window remained over the HUD. Cleanup now closes only windows created by that setup. A per-method cold-process rerun passed 31/36 on Android14 and 7/8 on Android16; the isolated runner violated existing initialization assumptions, and the live-drag fixture needed to wait for actual pointer acknowledgement. The normal complete-suite runner with those fixture corrections passed 36/36 and 8/8 on the unchanged 253 APK. Manual image review still rejected that build for the message overlap, leading to 254. None of these rejected checks is represented as a successful254 test.

          The first TEST254 Android16 run 38950078074 passed 7/8; the vertical-swipe assertion saw unchanged scroll. The fixture now samples the realized camera and waits for actual native DOWN before moving, retaining every gesture assertion. Retry 38951417636 passed 8/8 on the unchanged application. A stronger caption/presentation rerun 38952725527 passed 7/8: its live-preview checks passed, but the native pager tap did not change page. This intermittent timing result does not establish a production root cause and is not presented as a successful run.

          The pager fixture now samples its presented camera after layout/capture, requires actual button DOWN and click readiness, releases immediately, then requires the real page change. No click callback or value is substituted. Run 38954130127 verified the visible live multiplier captions, but the acknowledged pager tap still failed (1/2 passing), with Google Play services ANRs logged. Resource-isolated run 38955341493 stops the unused Gradle daemon and disables only the repeatedly crashing Google Play services package on the disposable emulator. It preserves System UI and every APD touch assertion, without hiding dialogs or changing the APK. This isolates emulator background services; it is not a claim of a production input fix or physical-phone verification. That run passed real pager/play/save/continue/end, but the preview fixture accessed a destroyed startup window and failed with Collection.toArray NullPointerException (1/2 passing). Final native-proof run 38956379747 requires a fresh settled Title before attaching the preview and passes both original native methods on the unchanged APK. This is a fixture correction, not a confirmed production crash or input fix. The final gate covers visible live multipliers while touch is held and complete play/save/continue/end with pager interaction. The Enemy HP caption must be inside the actual scroll viewport; presentation is captured before release. Separate run 38953589679 failed before native preview capture: an actual System UI ANR dialog covered APD, and InputManager rejected injection as targeting another UID. Its screenshot and logs confirm ANRs in com.android.systemui and com.google.android.gms.persistent. The pager-repeat run also logs Google Play services ANRs, but that does not prove the exact pager failure cause. These are retained as failed setup/evidence, not successful previews. Across current 254 attempts there are 68 Android method executions: 63 passes and 5 failures; selected release acceptance contains 47 passing executions of 37 distinct methods. Earlier failed attempts remain separate from the latest entirely passing acceptance. Their timing cause is not claimed proven, and physical-phone behavior remains pending.

          During local daily implementation, two legacy null-array cases failed and were corrected before 252. One manual source-inspection test command omitted its required source-root property; correcting that invocation restored all 17 targeted passes. Those repeated focused checks are not added to the 1,736 total.

          ## Regressions, compatibility and remaining work
          The narrow pager occupies space above quickslots; message placement is now checked against its actual position. Daily-score metadata is additive and keeps original integer scores. All 357 values, ordinary multiplication, original SPD scoring and nine challenge factors are preserved. Exact run rules remain frozen independently from editable next-run drafts.

          Physical-phone install-over, the owner's active-save continuity, physical touch acceptance and full human-played class/boss strategies remain unverified. No phone is attached. This is a verified emulator-tested owner candidate, not a claim that every backlog item or all game-breaking risks are eliminated.

          The broader UIMSD audit and storage research, reproduction of the owner's armor-availability experience, and upstream delayed-audio investigation remain open. Existing findings are retained; no raw history was removed and no production storage migration was performed. Historical build gaps are not declared reconstructed by these tests.

          ## Source, timing and delivery
          Application sources:251 435d945d421a2a2a7dc8bb6b3df12d5e6fce9b31;252 fa39ad824347a67624a93efbb4a3fb358c7477fe;253 6d9162f5946311728b1723a3b02d688072a8da79;254 832c1a5679a8cd216e8c57638f1bc0fe2442fdfe. The 254 primary run is 38949555542, staging 38949555538 and six-class acceptance 38950078074 and Android16 acceptance 38951417636 plus final settled native-proof 38956379747. Publication wrappers are checked for identical application inputs and reuse the signed artifact.

          The earlier lunch PDF was published11:55:49EDT and the TEST250 APK12:01:23EDT. They were49 and83 seconds late respectively. This later owner delivery does not retroactively satisfy exact lunch timing. Workflow timestamps alone do not prove scheduled causation, developer-active hours or chat delivery.

          Before publication, the APK signature, application ID, version and checksum are checked against delivered 250. The published APK and PDF are downloaded and rehashed afterward. Actual asset publication and download timestamps are recorded separately from this report's preparation time. Chat-link delivery occurs only when links are sent.

          Install over existing APD. Never uninstall or clear app data. Existing 250 and 231 assets remain preserved. This private owner prerelease does not authorize automatic distribution to testers. No public release, paid service or unfinished online feature is enabled.
          """
