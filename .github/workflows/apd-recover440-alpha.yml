name: Complete original APD440 Alpha native evidence without rebuilding
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-440-ALPHA-RECOVERY-REQUEST.txt]
permissions: {contents: read, actions: read}
concurrency: {group: apd440-alpha-exact-recovery, cancel-in-progress: false}
jobs:
  recover-440-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Test artifact and complete-image safeguards
        run: python3 -m unittest discover -s tools -p 'test_apd_recover440_alpha.py' -v
      - name: Verify frozen APKs, original core results and retained successful native evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 tools/apd_recover440_alpha.py prepare --root recovery-retry
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run all six original Alpha cases and verify every transferred screenshot
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none -skin 320x640
          script: python3 tools/apd_recover440_alpha.py native --root recovery-retry
      - name: Require all original and new native evidence before packaging the exact pair
        run: python3 tools/apd_recover440_alpha.py finalize --root recovery-retry
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd440-alpha-retry-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            recovery-retry/native/apd-recovery-440-native-Alpha-Testers/
            recovery-retry/input-provenance.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: apd440-complete-owner-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery-retry/owner-review/
          if-no-files-found: error
          retention-days: 30
