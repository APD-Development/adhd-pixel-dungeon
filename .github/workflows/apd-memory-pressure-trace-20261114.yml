name: Verify APD Android memory pressure diagnostic details
on:
  push:
    branches: [chatgpt/apd-memory-pressure-trace-20261114-2200]
    paths:
      - .github/workflows/apd-memory-pressure-trace-20261114.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: apd-memory-pressure-trace-20261114
  cancel-in-progress: false
jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run core tests plus desktop and Android Java compilation
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac --no-daemon
      - name: Check complete JUnit results and exact memory pressure regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=list(Path('core/build/test-results/test').glob('TEST-*.xml'))
          assert reports,'No core JUnit XML'
          roots=[ET.parse(p).getroot() for p in reports]
          totals={key:sum(int(root.get(key,0)) for root in roots)
                  for key in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3400,totals
          assert all(totals[key]==0 for key in ('failures','errors','skipped')),totals
          cases={case.get('name') for root in roots for case in root.findall('testcase')}
          required={
              'androidMemoryPressureSeveritySurvivesNoisyInputHistory',
              'heapHistorySurvivesBurstOfInputWithoutUnboundedRetention',
              'periodicMemorySamplingIsRateLimited',
          }
          assert required<=cases,required-cases
          print('APD memory pressure source gate:',totals,'suites:',len(roots))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apd-memory-pressure-source-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
