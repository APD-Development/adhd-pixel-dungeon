name: Deliver verified QoL owner APK pair without rebuilding
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-QOL-OWNER-DELIVERY.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: apd-qol-owner-delivery-single
  cancel-in-progress: false
jobs:
  verify-source-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - run: python3 -m pip install Pillow==12.0.0
      - name: Verify actual APKs, source, signatures, core and emulator evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 tools/apd_qol_owner_delivery.py
      - name: Scan exact sanitized source plus current reachable history before source sharing
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/apd-gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/apd-gitleaks.tar.gz' | sha256sum -c -
          mkdir /tmp/apd-gitleaks
          tar -xzf /tmp/apd-gitleaks.tar.gz -C /tmp/apd-gitleaks
          python3 tools/apd_qol_source_scan.py
      - name: Publish existing verified APKs and corresponding source privately
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 tools/apd_qol_publish_prepared.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-qol-owner-delivery
          path: owner-delivery/
          retention-days: 30
