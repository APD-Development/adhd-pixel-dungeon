name: Publish verified TEST254 early-alpha owner APK
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/codex-alpha-final-owner254.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: apd-owner-draft254
  cancel-in-progress: false
