name: APD identity-only frame reuse exact-source CI
on:
  push:
    branches: [chatgpt/apd-identity-frame-reuse-20261116-0100]
    paths:
      - .github/workflows/apd-identity-frame-reuse-ci-20261116.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunLogReader.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunLogStreamingReadTest.java
permissions: {contents: read}
concurrency:
  group: apd-identity-frame-reuse-20261116
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Assert opt-in, exact-size reuse only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          r=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunLogReader.java').read_text()
          assert 'readFrame(in, pos, options.onlyRunStartEvents ? reusablePayload : null)' in r
          assert 'if (options.onlyRunStartEvents) reusablePayload = f.payload;' in r
          assert 'reusable != null && reusable.length == (int) len' in r
          assert 'r.events.add(new ApdEvent(index, type, flags, clock, p.readRemaining()));' in r
          PY
      - name: Full core tests and desktop/Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require all full-suite and targeted regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert suites
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3519,totals
          assert totals['failures']==totals['errors']==totals['skipped']==0,totals
          names={t.get('name') for s in suites for t in s.findall('testcase')}
          for name in ('identityOnlyStreamingReusesEqualLengthFramesAndKeepsDifferentLengthsCorrect',
                       'identityOnlyReadValidatesLargeGameplayEventsWithoutCopyingTheirTails',
                       'thousandsOfGameplayEventsDoNotNeedToRemainInImportIdentityRead',
                       'noRunStartLegacyLogAndDefaultReaderStillKeepExistingBehavior'):
              assert name in names,name
          print(totals,'suites',len(suites))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-identity-frame-reuse-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
