name: APD malformed archive manifest diagnostic bound source verification
on:
  push:
    branches: [chatgpt/apd-manifest-diagnostic-limit-20261115-1700]
    paths:
      - .github/workflows/apd-manifest-damaged-line-ci-20261115.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifest.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifestDamagedLineDetailTest.java
permissions: {contents: read}
concurrency:
  group: apd-manifest-diagnostic-limit-20261115
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Require bounded diagnostic and all independent regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifest.java').read_text()
          test=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifestDamagedLineDetailTest.java').read_text()
          assert 'MAX_DAMAGED_LINE_DETAIL_CHARS = 160' in source
          assert 'line.substring(0, MAX_DAMAGED_LINE_DETAIL_CHARS)' in source
          for name in ('shortMalformedLineRetainsItsExactOriginalDiagnostic',
                       'hugeMalformedLineRetainsOnlyBoundedMarkedExcerpt',
                       'hugeMalformedManifestInRealZipIsRejectedWithoutHistoryChanges'):
              assert 'void '+name+'(' in test, name
          print('Bounded malformed-line source and three regressions present')
          PY
      - name: Full core suite and desktop/Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Verify terminal JUnit counts and retained compatibility cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'missing JUnit results'
          totals={key:sum(int(r.get(key,0)) for r in reports) for key in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3507, totals
          assert all(totals[key] == 0 for key in ('failures','errors','skipped')), totals
          cases={c.get('name') for r in reports for c in r.findall('testcase')}
          for name in ('shortMalformedLineRetainsItsExactOriginalDiagnostic',
                       'hugeMalformedLineRetainsOnlyBoundedMarkedExcerpt',
                       'hugeMalformedManifestInRealZipIsRejectedWithoutHistoryChanges',
                       'checksumValidNegativeContainerVersionsAreRejectedButZeroAndOneRemainValid',
                       'negativeContainerInRealZipRefusesImportWithoutTouchingExistingHistory',
                       'missingContainerIsRejectedWithCorrectChecksumForEmptyAndNonemptyManifests',
                       'repeatedManifestPathKeepsFirstMatchAndNeverOverwritesHistory'):
              assert name in cases, name
          print('Core JUnit', totals, 'suites',len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-manifest-damaged-line-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
