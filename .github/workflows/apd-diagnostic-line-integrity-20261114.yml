name: Verify APD diagnostic event line integrity
on:
  push:
    branches: [chatgpt/apd-diagnostic-line-integrity-20261114-2300]
    paths:
      - .github/workflows/apd-diagnostic-line-integrity-20261114.yml
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: apd-diagnostic-line-integrity-20261114
  cancel-in-progress: false
jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run core tests and desktop and Android Java compilation
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac --no-daemon
      - name: Verify exact JUnit count and diagnostic boundary regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=list(Path('core/build/test-results/test').glob('TEST-*.xml'))
          assert reports,'Missing core JUnit results'
          roots=[ET.parse(p).getroot() for p in reports]
          totals={k:sum(int(root.get(k,0)) for root in roots)
                  for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3463,totals
          assert all(totals[k]==0 for k in ('failures','errors','skipped')),totals
          cases={case.get('name') for root in roots for case in root.findall('testcase')}
          assert 'eventAndExceptionLineBreaksCannotForgeDiagnosticRecords' in cases
          print('APD diagnostic line integrity verification',totals,'suites',len(roots))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apd-diagnostic-line-integrity-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
