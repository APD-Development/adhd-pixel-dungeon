apd.arcanainfodisplay.power_decrease=Your cursed Arcana: _-%1$s%%_ power.
apd.arcanainfodisplay.chance_increase=Arcana adds %1$s percentage points to this chance.
apd.arcanainfodisplay.chance_decrease=Arcana removes %1$s percentage points from this chance.
apd.arcanainfodisplay.chance=Chance per hit: _%2$s%%_.
apd.arcanainfodisplay.kinetic=Only damage stored from now on is boosted; damage already stored isn't boosted again.
apd.arcanainfodisplay.magic=Extra magic damage: _%2$s%%_ of the hit (rounded up).
apd.arcanainfodisplay.reach=Extra melee reach: _%2$s_ tiles.
apd.arcanainfodisplay.total_reach=Total reach right now: _%1$s_ tiles.
apd.arcanainfodisplay.reach_rounding=Your Arcana isn't high enough yet to round up to another tile.
apd.arcanainfodisplay.runic_reach=Runic Slash adds another _+%1$s%%_ power, for _%2$s_ tiles of total reach.
apd.arcanainfodisplay.missile_reach=Wall-piercing distance: _%2$s_ tiles.
apd.arcanainfodisplay.unstable=Boosts whichever enchantment it rolls on each hit.
apd.arcanainfodisplay.explosive=It wears down faster; exactly when it blows up is still random.
apd.arcanainfodisplay.current_hp=Based on your current HP.
apd.arcanainfodisplay.unknown_level=Identify this item to see exact numbers.
apd.arcanainfodisplay.grim=The real chance depends on how much HP the enemy has left after the hit.
apd.arcanainfodisplay.sacrificial=Whether it triggers and how much you bleed also depend on your HP.
apd.arcanainfodisplay.custom=Arcana multiplies this effect's power by _x%1$s_.
apd.arcanainfodisplay.brimstone=You're already immune to fire, so Arcana makes the Barrier you get when something tries to burn you stronger.
apd.arcanainfodisplay.stealth=Stealth: _%2$s_.
apd.arcanainfodisplay.speed=Movement speed: _%2$sx_ normal.
apd.arcanainfodisplay.turns=Invisibility from trampling grass: _%2$s_ turns.
apd.arcanainfodisplay.magic_dr=Magic damage blocked per hit: _%3$s-%4$s_.
apd.arcanainfodisplay.stone=Your evasion becomes damage reduction, up to 75% less damage. Arcana raises the evasion it uses.
apd.arcanainfodisplay.swiftness=Only when no enemy is nearby.
apd.arcanainfodisplay.water=Only while in water.
apd.arcanainfodisplay.door=Only while standing in a doorway.
apd.arcanainfodisplay.viscosity=Delay power: _%1$s_. Above 1, all damage that gets through is delayed, and part of it is prevented.
apd.arcanainfodisplay.unavailable=Your Arcana is too high to show as a number.
apd.arcanainfodisplay.inactive=This glyph does nothing at this armor's current level.
apd.arcanainfodisplay.effect_blazing=Arcana: more likely to set enemies on fire; once it always does, the fire hits harder.
apd.arcanainfodisplay.effect_chilling=Arcana: more likely to chill; once it always does, chill lasts longer and can stack higher.
apd.arcanainfodisplay.effect_kinetic=Arcana: boosts the overkill damage it saves for your next hit.
apd.arcanainfodisplay.effect_shocking=Arcana: more likely to shock; once it always does, the lightning hits nearby enemies harder.
apd.arcanainfodisplay.effect_venomous=Arcana: more likely to poison; once it always does, poison lasts longer.
apd.arcanainfodisplay.effect_blocking=Arcana: more likely to shield you; once it always does, the shield is bigger.
apd.arcanainfodisplay.effect_blooming=Arcana: more likely to grow grass; once it always does, more grass grows.
apd.arcanainfodisplay.effect_eldritch=Arcana: more likely to terrify; once it always does, fear lasts longer.
apd.arcanainfodisplay.effect_elastic=Arcana: more likely to knock back; once it always does, enemies fly farther.
apd.arcanainfodisplay.effect_lucky=Arcana: more likely to drop bonus loot; once it always does, the loot is better.
apd.arcanainfodisplay.effect_projecting=Arcana: more reach, rounded to whole tiles.
apd.arcanainfodisplay.effect_unstable=Arcana: boosts whichever enchantment it rolls, so the result changes every hit.
apd.arcanainfodisplay.effect_vorpal=Arcana: more likely to cause bleeding; once it always does, bleeding hurts more.
apd.arcanainfodisplay.effect_corrupting=Arcana: more likely to turn a dying enemy into an ally; once it always does, the ally gets a stronger boost.
apd.arcanainfodisplay.effect_crystal=Arcana: a bigger share of each hit is added as extra magic damage.
apd.arcanainfodisplay.effect_grim=Arcana: higher chance to execute; the real odds depend on the enemy's remaining HP.
apd.arcanainfodisplay.effect_vampiric=Arcana: more likely to heal you; once it always does, each heal is bigger.
apd.arcanainfodisplay.effect_annoying=Arcana (curse): more likely to wake nearby enemies.
apd.arcanainfodisplay.effect_displacing=Arcana (curse): more likely to teleport the enemy somewhere random.
apd.arcanainfodisplay.effect_dazzling=Arcana (curse): more likely to blind everyone who can see; blindness doesn't last longer.
apd.arcanainfodisplay.effect_explosive=Arcana (curse): wears down faster, so it blows up sooner; the exact turn is still random.
apd.arcanainfodisplay.effect_friendly=Arcana (curse): more likely to charm both you and the enemy.
apd.arcanainfodisplay.effect_polarized=Arcana (curse): changes the odds between 150% damage and no damage at all.
apd.arcanainfodisplay.effect_pressurized=Arcana (curse): more likely to burst water and knock things back.
apd.arcanainfodisplay.effect_sacrificial=Arcana (curse): more likely to make you bleed; how much depends on your HP.
apd.arcanainfodisplay.effect_wayward=Arcana (curse): more likely to lower your accuracy for a while.
apd.arcanainfodisplay.effect_wondrous=Arcana (curse): more likely to cast a random cursed-wand effect.
apd.arcanainfodisplay.effect_obfuscation=Arcana: boosts the glyph's stealth.
apd.arcanainfodisplay.effect_swiftness=Arcana: multiplies your speed while no enemy is nearby.
apd.arcanainfodisplay.effect_viscosity=Arcana: delays more of each hit to later turns, and can prevent some of it.
apd.arcanainfodisplay.effect_potential=Arcana: more likely to recharge your wands; once it always does, each recharge is bigger.
apd.arcanainfodisplay.effect_brimstone=Arcana: makes the fire-to-Barrier shield stronger.
apd.arcanainfodisplay.effect_stone=Arcana: more of your evasion turns into damage reduction.
apd.arcanainfodisplay.effect_entanglement=Arcana: more likely to root you in earthen armor; once it always does, the armor is stronger.
apd.arcanainfodisplay.effect_repulsion=Arcana: more likely to push attackers away; once it always does, they're pushed farther.
apd.arcanainfodisplay.effect_camouflage=Arcana: invisibility from grass lasts longer (rounded to whole turns).
apd.arcanainfodisplay.effect_flow=Arcana: multiplies your speed while in water.
apd.arcanainfodisplay.effect_affection=Arcana: more likely to charm attackers; once it always does, charm lasts longer.
apd.arcanainfodisplay.effect_antimagic=Arcana: blocks more magic damage.
apd.arcanainfodisplay.effect_thorns=Arcana: more likely to make attackers bleed; once it always does, they bleed more.
apd.arcanainfodisplay.effect_antientropy=Arcana (curse): more likely to set you on fire and freeze things around you.
apd.arcanainfodisplay.effect_corrosion=Arcana (curse): more likely to spray corrosive goo around you.
apd.arcanainfodisplay.effect_displacement=Arcana (curse): more likely to teleport you when you're hit.
apd.arcanainfodisplay.effect_metabolism=Arcana (curse): more likely to burn your food to heal you.
