name: APD CSV comment-line boundary source verification
on:
  push:
    branches: [chatgpt/apd-csv-comment-boundary-20261113-0403]
    paths:
      - .github/workflows/apd-csv-comment-boundary-ci-20261113.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/report/ReportRenderer.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/report/ReportCsvCommentBoundaryTest.java
      - docs/APD-CSV-COMMENT-BOUNDARY-CONTINUATION-2026-11-13.md
permissions: {contents: read}
concurrency:
  group: apd-csv-comment-line-20261113
  cancel-in-progress: false
jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Full JUnit and desktop/Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Check exact-source JUnit evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files=list(Path('core/build/test-results/test').glob('TEST-*.xml'))
          assert files, 'missing JUnit XML'
          roots=[ET.parse(f).getroot() for f in files]
          totals={k:sum(int(root.get(k,'0')) for root in roots) for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3412, totals
          assert all(totals[k] == 0 for k in ('failures','errors','skipped')), totals
          cases={c.get('name') for root in roots for c in root.findall('testcase')}
          for name in ('factAndTableHeadingsCannotInjectAnExtraCsvRow',
                       'noTableTitleAndVersionCannotInjectMetadataRows',
                       'normalCommentsAndQuotedMultilineDataRemainCompatible'):
              assert name in cases, name
          print('EXACT_APD_CSV_JUNIT',totals,'suites',len(files))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apd-csv-comment-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
