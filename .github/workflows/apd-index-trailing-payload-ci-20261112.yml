name: APD derived index exact payload gate
on:
  push:
    branches: [chatgpt/apd-index-trailing-record-20261112-1530]
    paths: [.github/workflows/apd-index-trailing-payload-ci-20261112.yml]
permissions: {contents: read}
concurrency:
  group: apd-index-trailing-payload-20261112-1530
  cancel-in-progress: false
jobs:
  source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Check narrow exact-length index guard and existing compatibility control
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunIndex.java').read_text()
          tests = Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunIndexCountValidationTest.java').read_text()
          readfrom = source.split('private void readFrom( byte[] data ){', 1)[1]
          assert 'if (src.hasRemaining()) throw new FormatException("trailing data in run index")' in readfrom
          assert readfrom.index('if (src.hasRemaining())') > readfrom.index('entries.put(e.runId, e);')
          assert 'checksumValidUncountedTailRebuildsFromOriginalLogs' in tests
          assert 'legitimateEmptyIndexRemainsValidWithoutRebuilding' in tests
          print('Exact index payload, real-log fallback and empty-index compatibility guards present')
          PY
      - name: Complete core tests and desktop/Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require zero failed/skipped tests including both exact-length controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = [ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'missing JUnit XML'
          totals = {k: sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3311, totals
          assert all(totals[k] == 0 for k in ('failures','errors','skipped')), totals
          cases = {c.get('name') for report in reports for c in report.findall('testcase')}
          assert {'checksumValidUncountedTailRebuildsFromOriginalLogs', 'legitimateEmptyIndexRemainsValidWithoutRebuilding', 'unsignedCountOutsideSignedRangeRebuildsFromLogs'} <= cases
          print('Verified entire core suite', totals, 'suites', len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-index-trailing-payload-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
