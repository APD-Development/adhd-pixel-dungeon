name: Complete two Developer native cases on frozen APD446
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-446-NATIVE-RECOVERY-REQUEST.txt]
permissions: {contents: read, actions: read}
concurrency: {group: apd446-frozen-developer-recovery, cancel-in-progress: false}
jobs:
  recover-developer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Check recovery identity and cohort rejection guards
        run: python3 -m unittest discover -s tools -p 'test_apd_recover446_developer.py' -v
      - name: Verify original immutable APK, source and native evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 tools/apd_recover446_developer.py prepare --root recovery446
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run only Developer seed-history and pylon with fresh screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none -skin 320x640
          script: python3 tools/apd_recover446_developer.py native --root recovery446
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd446-developer-recovery-native-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: recovery446/native-recovery/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apd446-developer-recovery-failure-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            recovery446/metadata/
            recovery446/*-failure.json
            recovery446/input-provenance.json
            recovery446/native-recovery/
          if-no-files-found: warn
          retention-days: 30
  prepare-owner-review:
    needs: recover-developer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Recheck original immutable APK, source and separate native evidence
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 tools/apd_recover446_developer.py prepare --root recovery446
      - name: Require all eighteen cases with explicit cohort provenance before packaging
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 tools/apd_recover446_developer.py finalize --root recovery446 --output owner-review446-recovered
      - uses: actions/upload-artifact@v4
        with:
          name: apd446-developer-recovery-owner-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: owner-review446-recovered/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apd446-developer-recovery-owner-failure-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            recovery446/metadata/
            recovery446/*-failure.json
            recovery446/input-provenance.json
            recovery446/inputs/recovery/
          if-no-files-found: warn
          retention-days: 30
