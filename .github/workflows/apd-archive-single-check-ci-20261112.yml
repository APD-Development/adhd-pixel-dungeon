name: APD archive checksum singleton source gate
on:
  push:
    branches: [chatgpt/apd-archive-single-check-20261112-2235]
    paths:
      - .github/workflows/apd-archive-single-check-ci-20261112.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifest.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifestChecksumSingletonTest.java
permissions: {contents: read}
concurrency:
  group: apd-archive-single-check-20261112
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Require isolated checksum singleton guard and regression fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifest.java').read_text()
          tests=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifestChecksumSingletonTest.java').read_text()
          assert 'case "check":' in source
          assert 'the manifest has repeated checksums' in source
          for case in ('secondCorrectFinalChecksumDoesNotLegitimizeFirstChecksum',
                       'secondValidChecksumCannotHideConflictingEarlierChecksum',
                       'ordinarySingleChecksumAndUnknownExtensionStillRoundTrip',
                       'duplicateChecksumZipImportRefusesWithoutChangingOldHistory'):
              assert 'void ' + case + '(' in tests, case
          print('Checksum singleton guard and four targeted regressions present')
          PY
      - name: Test full core and compile desktop and Android Java
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require passing full suite and retained archive compatibility regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'missing JUnit reports'
          totals={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3364, totals
          assert all(totals[k]==0 for k in ('failures','errors','skipped')), totals
          cases={c.get('name') for r in reports for c in r.findall('testcase')}
          for case in ('secondCorrectFinalChecksumDoesNotLegitimizeFirstChecksum',
                       'secondValidChecksumCannotHideConflictingEarlierChecksum',
                       'ordinarySingleChecksumAndUnknownExtensionStillRoundTrip',
                       'duplicateChecksumZipImportRefusesWithoutChangingOldHistory',
                       'invalidUtf8IsRejectedEvenWithAReplacementBasedValidChecksum',
                       'duplicateScalarMetadataInZipRefusesWithoutWritingHistory',
                       'repeatedManifestPathKeepsFirstMatchAndNeverOverwritesHistory'):
              assert case in cases, case
          print('Full JUnit suite:',totals,'suites:',len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-archive-single-check-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
