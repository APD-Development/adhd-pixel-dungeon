name: Verify Changes screenshots against exact TEST65 APK
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/codex-uimsd-resource-check.yml]
permissions:
  contents: read
  actions: read
jobs:
  resource-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: apd-codex-private-test-apk
          run-id: 38239793231
          github-token: ${{ github.token }}
          path: reference
      - name: Validate unchanged production source and exact reference APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          from tools.apd_existing_build_evidence import application_inputs
          repo=os.environ['GITHUB_REPOSITORY']
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/'+path]))
          run=api('actions/runs/38239793231')
          assert run['conclusion']=='success' and run['head_sha']=='4ffe4fb38533e41ad17c4c1dd3ebc528f55ace0a'
          trees=[api('git/trees/'+ref+'?recursive=1') for ref in (run['head_sha'],os.environ['GITHUB_SHA'])]
          assert all(not t.get('truncated',False) for t in trees)
          assert application_inputs(trees[0]['tree'])==application_inputs(trees[1]['tree'])
          apk=next(pathlib.Path('reference').glob('*.apk'))
          assert hashlib.sha256(apk.read_bytes()).hexdigest()==next(pathlib.Path('reference').glob('*.apk.sha256')).read_text().split()[0]
          print('Reusing exact verified TEST65 APK; production inputs unchanged.')
          PY
      - name: Build only new instrumentation tests
        run: ./gradlew :android:assembleDebugAndroidTest -PapdTestBuild -PapdBuild=C65
      - name: Capture actual APD and preserved SPD Changes scenes on API34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb logcat -c
            adb logcat -v time > resource-logcat.txt &
            adb install -r reference/ADHD-Pixel-Dungeon-CODEX-TEST-65.apk
            adb install -r android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.ChangesVisualDeviceTest com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > resource-result.txt
            cat resource-result.txt
            python3 -c "import pathlib,re; t=pathlib.Path('resource-result.txt').read_text(); assert 'FAILURES!!!' not in t and re.search(r'OK \\(1 test\\)',t),t"
            mkdir -p codex-visual-evidence
            adb exec-out cat /sdcard/Pictures/APD-Test-Visuals/apd-changes.png > codex-visual-evidence/apd-changes.png
            adb exec-out cat /sdcard/Pictures/APD-Test-Visuals/spd-changes-reference.png > codex-visual-evidence/spd-changes-reference.png
            python3 tools/validate_android_visuals.py codex-visual-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-changes-visual-review
          path: |
            resource-result.txt
            resource-logcat.txt
            codex-visual-evidence/
          if-no-files-found: warn
          retention-days: 7
