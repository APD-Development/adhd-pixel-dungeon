name: APD buffered history-stream exact-source CI
on:
  push:
    branches: [chatgpt/apd-buffered-log-stream-20261116-0935]
    paths:
      - .github/workflows/apd-buffered-history-read-ci-20261116.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunLogReader.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunLogStreamingReadTest.java
permissions: {contents: read}
concurrency:
  group: apd-buffered-history-read-20261116
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate buffering is scoped to ordinary forward-only log reads
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunLogReader.java').read_text()
          tests=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunLogStreamingReadTest.java').read_text()
          stream=src.split('private static ReadResult readStreaming(',1)[1].split('private static byte[] readHeader(',1)[0]
          assert 'new BufferedInputStream(new FileInputStream(file), 8192)' in stream
          assert 'if (options.resync) return parse(readFully(file), options);' in src
          assert 'if (crc.getValue() != stored)' in src
          assert 'bufferedForwardOnlyReadsMatchParserAcrossRefillsAndDamage' in tests
          assert 'largeUnknownFramesPreserveKnownEventsAndStreamedOffsets' in tests
          PY
      - name: Full core tests and desktop/Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require complete clean JUnit suite including buffering and prior regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert suites, 'missing JUnit results'
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3529, totals
          assert totals['failures']==totals['errors']==totals['skipped']==0, totals
          names={t.get('name') for s in suites for t in s.findall('testcase')}
          for name in ('bufferedForwardOnlyReadsMatchParserAcrossRefillsAndDamage',
                       'largeUnknownFramesPreserveKnownEventsAndStreamedOffsets',
                       'unknownFramesStillRejectCorruptCrcAndTruncatedPayloadOrChecksum',
                       'streamedHeaderExactLengthsMatchBufferedReaderUpToMaximum',
                       'streamingFrameResultReuseKeepsEveryEventPayloadIndependent'):
              assert name in names, name
          print(totals,'suites',len(suites))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-buffered-history-read-junit-20261116
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
