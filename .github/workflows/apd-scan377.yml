name: Complete APD377 source scan on exact existing APK and source bytes; no build
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-377-SCAN-REQUEST.txt]
permissions: {contents: read, actions: read}
concurrency: {group: apd377-scan-recovery, cancel-in-progress: false}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: apd377-prepared-owner-pair, run-id: 42492364454, github-token: '${{ github.token }}', path: owner-delivery}
      - name: Require exact unchanged verified game APK and source hashes
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,json
          out=pathlib.Path('owner-delivery');proof=json.loads((out/'APD-Preview-377-Verification.json').read_text())
          assert proof['source_commit']=='52e00c273064dd43ade94dde88b851369aaa0ddc' and proof['core_tests']==2972 and proof['android_tests']==12
          for label,expected in proof['apk_hashes'].items():assert hashlib.sha256((out/f'APD-{label}-377.apk').read_bytes()).hexdigest()==expected
          assert hashlib.sha256((out/'APD-Source-377.zip').read_bytes()).hexdigest()==proof['source_sha256']
          PY
      - name: Scan key-free source and full reachable history with exact reviewed prose finding
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/apd-gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/apd-gitleaks.tar.gz' | sha256sum -c -
          mkdir /tmp/apd-gitleaks
          tar -xzf /tmp/apd-gitleaks.tar.gz -C /tmp/apd-gitleaks
          python3 tools/apd_qol_source_scan.py
      - name: Preserve recovery evidence without claiming a new game build
        run: |
          python3 - <<'PY'
          import json,pathlib,os
          p=pathlib.Path('owner-delivery/APD-Preview-377-Verification.json');d=json.loads(p.read_text());d['source_scan_recovery_run']=os.environ['GITHUB_RUN_ID'];d['source_scan_recovery_commit']=os.environ['GITHUB_SHA'];d['source_scan_recovery']='Exact prose match keys reviewed, inventory5298. inspected and pinned by full line hash. Original APK and source archive unchanged; no rebuild.';p.write_text(json.dumps(d,indent=2)+'\n')
          with pathlib.Path('owner-delivery/release-notes.md').open('a') as f:f.write('\nPreparation failure retained: source scanner first stopped on the audit-prose phrase keys reviewed, inventory5298. An exact reviewed-line hash guard now classifies that false positive; all other findings remain subject to review. Full source/history scan rerun on the same source archive; no APK or source rebuild.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: apd377-final-prepared-owner-pair, path: owner-delivery/, retention-days: 30}
