name: Verify APD archive missing stream handling
on:
  push:
    branches: [chatgpt/apd-archive-null-stream-20261112]
    paths: [.github/workflows/apd-archive-null-stream-ci-20261112.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Check bounded archive changes and regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          production=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporter.java').read_text()
          tests=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveStreamOwnershipTest.java').read_text()
          assert 'if (in == null)' in production
          assert 'if (zip == null)' in production
          assert 'void missingArchiveStreamsReturnAReportWithoutCreatingHistory(' in tests
          print('Archive null-source guards and regression are present')
          PY
      - name: Complete core regression suite and Android/desktop Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require clean results including missing stream case
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports,'No core JUnit reports'
          totals={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3298 and all(totals[k]==0 for k in ('failures','errors','skipped')),totals
          cases={t.get('name') for r in reports if r.get('name','').endswith('.ArchiveStreamOwnershipTest') for t in r.findall('testcase')}
          assert 'missingArchiveStreamsReturnAReportWithoutCreatingHistory' in cases,cases
          print('Verified',totals,'across',len(reports),'suites, including missing-source archive guard')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-archive-null-stream-core-results
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
