name: Verify APD contextual Search radius bounds
on:
  push:
    branches: [codex/apd-search-radius-scan-20261112]
    paths: [.github/workflows/apd-search-radius-ci.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Require original Search footprint as contextual scan bound
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol')
          session=(root/'WallSearchSession.java').read_text()
          chooser=(root/'SearchControlContext.java').read_text()
          assert 'int distance=searchRadius(hero,foresight);' in session
          assert 'if(foresight)return Foresight.DISTANCE;' in session
          assert '(hero.heroClass==HeroClass.ROGUE?2:1)+(hero.hasTalent(Talent.WIDE_SEARCH)?1:0)' in session
          assert 'int radius = WallSearchSession.searchRadius(hero, hero.buff(Foresight.class) != null);' in chooser
          assert 'WallSearchSession.covers(hero, level, hero.pos, cell)' in chooser
          assert 'DoorSearchEligibility.candidate(level, cell)' in chooser
          assert '!level.searchedWalls.confirmed(level, cell)' in chooser
          test=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/SearchControlContextTest.java').read_text()
          assert 'contextualScanBoundsMatchActualClassTalentAndForesightFootprints' in test
          print('Adaptive bounding and existing geometric/visibility gates preserved')
          PY
      - name: Run complete core tests and compile desktop and Android targets
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Verify complete suite and targeted adaptive bounds regression
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          roots=[ET.parse(p).getroot() for p in pathlib.Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert roots,'Missing test reports'
          totals={k:sum(int(r.get(k,0)) for r in roots) for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3266 and totals['failures']==totals['errors']==totals['skipped']==0,totals
          cases=[x.get('name') for r in roots if r.get('name','').endswith('.SearchControlContextTest') for x in r.findall('testcase')]
          assert cases.count('contextualScanBoundsMatchActualClassTalentAndForesightFootprints')==1,cases
          print('Verified',totals,'across',len(roots),'suites')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-search-radius-core-reports
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
