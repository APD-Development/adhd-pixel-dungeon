name: APD derived run index direct-log boundary
on:
  push:
    branches: [chatgpt/apd-run-index-direct-log-guard-20261112]
    paths:
      - .github/workflows/apd-run-index-direct-log-20261112.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunIndex.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunIndexLinkBoundaryTest.java
permissions: {contents: read}
concurrency:
  group: apd-run-index-direct-log-20261112
  cancel-in-progress: false
jobs:
  source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Confirm bounded derived-index boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunIndex.java').read_text()
          tests=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunIndexLinkBoundaryTest.java').read_text()
          assert 'if (!isDirectRunLog(log)) throw new IOException' in source
          assert '|| !isDirectRunLog(f)) continue;' in source
          assert 'canonical.getParentFile().equals(runsDir.getCanonicalFile())' in source
          assert 'canonical.getName().equals(log.getName())' in source
          for case in ('refreshAndRebuildNeverReadLinkedIndividualRunLogs','symlinkedHistoryRootRemainsCompatible'):
              assert case in tests, case
          print('Derived-index source guard and linked-root compatibility regression present')
          PY
      - name: Full core tests and desktop/Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require clean JUnit suite with linked-log regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'missing JUnit XML'
          totals={k:sum(int(r.get(k, 0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3328, totals
          assert all(totals[k]==0 for k in ('failures','errors','skipped')), totals
          cases={c.get('name') for r in reports for c in r.findall('testcase')}
          for case in ('refreshAndRebuildNeverReadLinkedIndividualRunLogs','symlinkedHistoryRootRemainsCompatible','refreshRejectsPathLikeRunIdsWithoutReadingOutsideHistory','recoveryNeverTruncatesSymlinkedRunLogs'):
              assert case in cases, case
          print('Full APD source suite:', totals, 'suites:', len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-run-index-direct-log-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
