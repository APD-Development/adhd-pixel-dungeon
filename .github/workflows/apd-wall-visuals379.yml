name: Stage retained wall lifecycle screenshots for actual review
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-WALL-VISUAL-REVIEW-REQUEST.txt]
permissions: {contents: write, actions: read}
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Preserve completed or failed wall evidence without rebuilding
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh run watch 42528440686 --repo "$GITHUB_REPOSITORY" --interval 15 || true
          gh run download 42528440686 --repo "$GITHUB_REPOSITORY" --name apd379-wall-pixel-lifecycle-evidence --dir wall-evidence
          cat wall-evidence/wall.txt
          python3 - <<'PYZIP'
          import pathlib,zipfile,subprocess,json,os
          repo=os.environ['GITHUB_REPOSITORY'];matches=[r for r in json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/releases?per_page=100'])) if r['tag_name']=='apd-alpha-preview-379'];assert len(matches)==1;d=matches[0];assert d['draft'];images=list(pathlib.Path('wall-evidence').rglob('*.png'));assert images
          with zipfile.ZipFile('APD379-Wall-Lifecycle-Visuals.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in images:z.write(p,p.relative_to('wall-evidence'))
          subprocess.run(['gh','release','upload','apd-alpha-preview-379','APD379-Wall-Lifecycle-Visuals.zip','--repo',repo],check=True)
          PYZIP
