name: APD archive strict UTF-8 source integrity gate
on:
  push:
    branches: [chatgpt/apd-archive-strict-utf8-20261112-2215]
    paths:
      - .github/workflows/apd-archive-strict-utf8-ci-20261112.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifest.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifestUtf8IntegrityTest.java
permissions: {contents: read}
concurrency:
  group: apd-archive-strict-utf8-20261112
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Require strict original-byte decoder and regression fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          production = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifest.java').read_text()
          tests = Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifestUtf8IntegrityTest.java').read_text()
          assert '.onMalformedInput(CodingErrorAction.REPORT)' in production
          assert '.onUnmappableCharacter(CodingErrorAction.REPORT)' in production
          assert 'ByteBuffer.wrap(data)' in production
          for case in ('invalidUtf8IsRejectedEvenWithAReplacementBasedValidChecksum',
                       'legitimateUnicodeManifestMetadataStillRoundTrips',
                       'invalidUtf8ZipImportRefusesWithoutTouchingExistingHistory'):
              assert 'void ' + case + '(' in tests, case
          print('Strict manifest decoding and three regression anchors present')
          PY
      - name: Test full core and compile desktop and Android Java
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require full passing JUnit and retained manifest compatibility cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = [ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'missing JUnit reports'
          totals = {k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3360, totals
          assert all(totals[k] == 0 for k in ('failures','errors','skipped')), totals
          cases = {c.get('name') for r in reports for c in r.findall('testcase')}
          for case in ('invalidUtf8IsRejectedEvenWithAReplacementBasedValidChecksum',
                       'legitimateUnicodeManifestMetadataStillRoundTrips',
                       'invalidUtf8ZipImportRefusesWithoutTouchingExistingHistory',
                       'aManifestRoundTrips',
                       'duplicateScalarMetadataInZipRefusesWithoutWritingHistory',
                       'repeatedManifestPathKeepsFirstMatchAndNeverOverwritesHistory'):
              assert case in cases, case
          print('Complete source JUnit suite:', totals, 'suites:', len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-archive-strict-utf8-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
