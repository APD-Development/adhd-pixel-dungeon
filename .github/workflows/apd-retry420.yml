name: Retry APD420 native acceptance on unchanged application APKs
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-420-NATIVE-RETRY-REQUEST.json]
permissions: {contents: read, actions: read}
concurrency: {group: apd420-native-retry, cancel-in-progress: false}
jobs:
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with: {name: apd420-built-pair, run-id: 42650360251, github-token: '${{ github.token }}'}
      - name: Verify production source identity and compile instrumentation only
        run: |
          set -euo pipefail
          mkdir -p evidence/retry
          git diff --name-only 7143d16bc481045b49ec4a60624128b0dcccc6b1..HEAD > evidence/retry/branch-diff.txt
          python3 - <<'PY'
          import pathlib
          allowed=('android/src/androidTest/','.github/workflows/','docs/','tools/')
          paths=[p for p in pathlib.Path('evidence/retry/branch-diff.txt').read_text().splitlines() if p]
          unexpected=[p for p in paths if not p.startswith(allowed)]
          if unexpected: raise SystemExit(f'Production source changed after APD420 cutoff: {unexpected}')
          p=pathlib.Path('android/src/androidTest/java/com/shatteredpixel/shatteredpixeldungeon/android/QolItemFeedbackDeviceTest.java')
          text=p.read_text()
          if text.count('"Level-ups remaining: 5","qol-existing-status-clear-MightBoost.png"') != 1:
              raise SystemExit('Corrected MightBoost expectation missing or duplicated')
          if '"Level-ups remaining: 5 of 5","qol-existing-status-clear-MightBoost.png"' in text:
              raise SystemExit('Stale MightBoost expectation remains')
          PY
          git diff 7143d16bc481045b49ec4a60624128b0dcccc6b1..HEAD -- android/src/androidTest/java/com/shatteredpixel/shatteredpixeldungeon/android/QolItemFeedbackDeviceTest.java > evidence/retry/corrected-test-fixture.patch
          test -s evidence/retry/corrected-test-fixture.patch
          sha256sum owner-delivery/APD-*-420.apk > evidence/retry/original-app-hashes.txt
          cp evidence/instrumentation.apk evidence/retry/original-instrumentation.apk
          if [ -d android/build/outputs/apk ]; then mv android/build/outputs/apk evidence/retry/original-build-apk-outputs; fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :android:assembleDebugAndroidTest -PapdTestBuild -PapdBuild=C420
          test ! -f android/build/outputs/apk/debug/android-debug.apk
          cp android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk evidence/retry/instrumentation.apk
          ./gradlew --stop
      - uses: actions/upload-artifact@v4
        with:
          name: apd420-retry-inputs
          path: evidence/retry/
          retention-days: 14
  native:
    needs: instrumentation
    strategy:
      fail-fast: false
      matrix: {variant: [Developer, Alpha-Testers]}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: apd420-built-pair, run-id: 42650360251, github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: apd420-retry-inputs, path: retry-inputs}
      - uses: actions/download-artifact@v4
        with: {name: 'apd420-native-${{ matrix.variant }}', run-id: 42650360251, path: 'evidence/initial-failure/${{ matrix.variant }}', github-token: '${{ github.token }}'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify exact original APK with corrected instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none -skin 320x640
          script: |
            mkdir -p evidence/retry-${{ matrix.variant }}
            adb logcat -c
            adb logcat -v time > evidence/retry-${{ matrix.variant }}/native-logcat.txt &
            adb install -r owner-delivery/APD-${{ matrix.variant }}-420.apk
            adb install -r retry-inputs/instrumentation.apk
            if test '${{ matrix.variant }}' = Developer; then echo developer > case-label.txt; else echo alpha > case-label.txt; fi
            timeout 900 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.QolItemFeedbackDeviceTest com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/retry-${{ matrix.variant }}/$(cat case-label.txt)-qol.txt
            python3 tools/apd_check_single_instrumentation.py evidence/retry-${{ matrix.variant }}/$(cat case-label.txt)-qol.txt grassDewControlsRingBreakdownsSearchedWallAndOfflineLicenseRenderNatively com.shatteredpixel.shatteredpixeldungeon.android.QolItemFeedbackDeviceTest
            adb pull /sdcard/Pictures/APD-Test-Visuals/. evidence/retry-${{ matrix.variant }}/visuals/
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 240 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.WallGeometryDeviceTest com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/retry-${{ matrix.variant }}/$(cat case-label.txt)-wall.txt
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 180 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.TrapDiscoveryDeviceTest#a_controlWritesEnabledPreference com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/retry-${{ matrix.variant }}/$(cat case-label.txt)-seed.txt
            python3 tools/apd_check_single_instrumentation.py evidence/retry-${{ matrix.variant }}/$(cat case-label.txt)-seed.txt a_controlWritesEnabledPreference
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 180 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.TrapDiscoveryDeviceTest#b_freshProcessReadsEnabledAndCanDisable com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/retry-${{ matrix.variant }}/$(cat case-label.txt)-restart.txt
            python3 tools/apd_check_single_instrumentation.py evidence/retry-${{ matrix.variant }}/$(cat case-label.txt)-restart.txt b_freshProcessReadsEnabledAndCanDisable
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 180 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.TrapDiscoveryDeviceTest#c_runtimeDiscoveryRouteAndActualTrapEffect com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/retry-${{ matrix.variant }}/$(cat case-label.txt)-gameplay.txt
            python3 tools/apd_check_single_instrumentation.py evidence/retry-${{ matrix.variant }}/$(cat case-label.txt)-gameplay.txt c_runtimeDiscoveryRouteAndActualTrapEffect
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 240 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.RemovedActorStallDeviceTest com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/retry-${{ matrix.variant }}/$(cat case-label.txt)-freeze.txt
            python3 tools/apd_check_single_instrumentation.py evidence/retry-${{ matrix.variant }}/$(cat case-label.txt)-freeze.txt cancelledGhoulAttackReleasesQueueButLiveAttackStaysPending com.shatteredpixel.shatteredpixeldungeon.android.RemovedActorStallDeviceTest
            adb pull /sdcard/Pictures/APD-Test-Visuals/. evidence/retry-${{ matrix.variant }}/visuals/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd420-retry-${{ matrix.variant }}
          path: evidence/
          retention-days: 14
