name: Complete402 Android acceptance on unchanged application APKs
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-402-RETRY-REQUEST.txt]
permissions: {contents: read, actions: read}
concurrency: {group: apd402-native-retry, cancel-in-progress: false}
jobs:
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: e91c52c0d7c2190686eb3213488f562e6ce8ef77}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Wait only for original application build and preserve its identity
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 - <<'PYWAIT'
          import subprocess,json,time
          for attempt in range(120):
            jobs=json.loads(subprocess.check_output(['gh','run','view','42583016501','--repo','APD-Development/ShieldingShouldHaveWorked','--json','jobs']))['jobs']
            build=next(j for j in jobs if j['name']=='build')
            if build['status']=='completed':
              assert build['conclusion']=='success',build
              break
            time.sleep(10)
          else:raise AssertionError('Original application build did not complete')
          PYWAIT
      - uses: actions/download-artifact@v4
        with: {name: apd402-built-pair, run-id: 42583016501, github-token: '${{ github.token }}'}
      - name: Verify unchanged production source and compile instrumentation only
        run: |
          test "$(git rev-parse HEAD)" = e91c52c0d7c2190686eb3213488f562e6ce8ef77
          git show "$GITHUB_SHA":tools/apd402-native-fixture.patch > /tmp/apd-native-fixture.patch
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          if [ -d android/build/outputs/apk ]; then mv android/build/outputs/apk evidence/original-build-apk-outputs; fi
          cp evidence/instrumentation.apk evidence/original-instrumentation.apk
          cp /tmp/apd-native-fixture.patch evidence/corrected-test-fixture.patch
          sha256sum owner-delivery/APD-*-402.apk > evidence/original-app-hashes.txt
          git apply --check /tmp/apd-native-fixture.patch
          git apply /tmp/apd-native-fixture.patch
          ./gradlew :android:assembleDebugAndroidTest -PapdTestBuild -PapdBuild=C402
          test ! -f android/build/outputs/apk/debug/android-debug.apk
          cp android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk evidence/instrumentation.apk
          ./gradlew --stop
      - uses: actions/upload-artifact@v4
        with:
          name: apd402-retry-inputs
          path: |
            evidence/instrumentation.apk
            evidence/corrected-test-fixture.patch
            evidence/original-app-hashes.txt
          retention-days: 14
  native:
    needs: instrumentation
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: Developer, label: developer}
          - {variant: Alpha-Testers, label: alpha}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@v4
        with: {name: apd402-built-pair, run-id: 42583016501, github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: apd402-retry-inputs, path: fresh-instrumentation}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none -skin 320x640
          script: |
            adb logcat -c
            adb logcat -v time > evidence/${{ matrix.label }}-qol-logcat.txt &
            adb install -r owner-delivery/APD-${{ matrix.variant }}-402.apk
            adb install -r fresh-instrumentation/instrumentation.apk
            timeout 600 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.QolItemFeedbackDeviceTest com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/${{ matrix.label }}-qol.txt
            python3 tools/apd_check_single_instrumentation.py evidence/${{ matrix.label }}-qol.txt grassDewControlsRingBreakdownsSearchedWallAndOfflineLicenseRenderNatively com.shatteredpixel.shatteredpixeldungeon.android.QolItemFeedbackDeviceTest
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 240 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.WallGeometryDeviceTest com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/${{ matrix.label }}-wall.txt
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 180 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.TrapDiscoveryDeviceTest#a_controlWritesEnabledPreference com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/${{ matrix.label }}-seed.txt
            python3 tools/apd_check_single_instrumentation.py evidence/${{ matrix.label }}-seed.txt a_controlWritesEnabledPreference
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 180 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.TrapDiscoveryDeviceTest#b_freshProcessReadsEnabledAndCanDisable com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/${{ matrix.label }}-restart.txt
            python3 tools/apd_check_single_instrumentation.py evidence/${{ matrix.label }}-restart.txt b_freshProcessReadsEnabledAndCanDisable
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 180 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.TrapDiscoveryDeviceTest#c_runtimeDiscoveryRouteAndActualTrapEffect com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/${{ matrix.label }}-gameplay.txt
            python3 tools/apd_check_single_instrumentation.py evidence/${{ matrix.label }}-gameplay.txt c_runtimeDiscoveryRouteAndActualTrapEffect
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 240 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.RemovedActorStallDeviceTest com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/${{ matrix.label }}-freeze.txt
            python3 tools/apd_check_single_instrumentation.py evidence/${{ matrix.label }}-freeze.txt cancelledGhoulAttackReleasesQueueButLiveAttackStaysPending com.shatteredpixel.shatteredpixeldungeon.android.RemovedActorStallDeviceTest
            adb pull /sdcard/Pictures/APD-Test-Visuals/. evidence/${{ matrix.variant }}-visuals/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd402-retry-${{ matrix.variant }}
          path: |
            evidence/
          retention-days: 14
  prepare:
    needs: [instrumentation, native]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: apd402-built-pair, run-id: 42583016501, github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: apd402-retry-Developer, path: evidence}
      - uses: actions/download-artifact@v4
        with: {name: apd402-retry-Alpha-Testers, path: evidence}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@v4
        with: {name: apd402-retry-inputs, path: evidence/corrected-instrumentation}
      - name: Verify exact identities, completed tests and corresponding source
        env: {GH_TOKEN: '${{ github.token }}', APD_SOURCE_SHA: 'e91c52c0d7c2190686eb3213488f562e6ce8ef77'}
        run: |
          gh run download 42583016501 --repo "$GITHUB_REPOSITORY" --name apd402-native-Developer --dir evidence/initial-rejected/Developer
          gh run download 42583016501 --repo "$GITHUB_REPOSITORY" --name apd402-native-Alpha-Testers --dir evidence/initial-rejected/Alpha-Testers
          cp tools/apd402-native-fixture.patch evidence/corrected-test-fixture.patch
          python3 tools/apd_prepare402.py
          python3 - <<'PYPROOF'
          import pathlib,json,os
          p=pathlib.Path('owner-delivery/APD-Preview-402-Verification.json');d=json.loads(p.read_text());d['original_apk_build_run']=42583016501;d['verification_harness_source']=os.environ['GITHUB_SHA'];d['native_retry']='Rose fixture checks the concise ghost-health-percentage header instead of its obsolete wording, preserving the resource/health distinction. All six distinct cases per variant rerun on immutable original APKs. Original rejected evidence and exact fixture patch included. No application APK rebuilt.';p.write_text(json.dumps(d,indent=2)+'\n')
          with pathlib.Path('owner-delivery/release-notes.md').open('a') as f:f.write('\nVerification retry: corrected a stale Rose header expectation to verify the actual ghost-health-percentage statement; full twelve-case grid rerun on unchanged original APKs. Initial failed checks retained; no new game APKs rebuilt.\n')
          PYPROOF
      - name: Scan key-free source and full reachable history
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          if ! curl --connect-timeout 20 -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/apd-gitleaks.tar.gz; then
            gh api repos/gitleaks/gitleaks/releases/assets/378332058 -H 'Accept: application/octet-stream' > /tmp/apd-gitleaks.tar.gz
          fi
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/apd-gitleaks.tar.gz' | sha256sum -c -
          mkdir /tmp/apd-gitleaks
          tar -xzf /tmp/apd-gitleaks.tar.gz -C /tmp/apd-gitleaks
          python3 tools/apd_qol_source_scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd402-prepared-owner-pair
          path: owner-delivery/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd402-source-and-native-evidence
          path: |
            evidence/
            core/build/test-results/test/
            docs/APD-402-DELIVERY-SPEC.json
          retention-days: 14
