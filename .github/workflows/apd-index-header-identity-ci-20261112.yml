name: APD run-index header identity source gate
on:
  push:
    branches: [chatgpt/apd-index-header-identity-20261112]
    paths:
      - .github/workflows/apd-index-header-identity-ci-20261112.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunIndex.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunIndexHeaderIdentityBoundaryTest.java
permissions: {contents: read}
concurrency:
  group: apd-index-header-identity-20261112
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Confirm narrow identity correction and regression cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunIndex.java').read_text()
          tests=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/RunIndexHeaderIdentityBoundaryTest.java').read_text()
          assert 'describeDirectLog(log, runId)' in code
          assert 'describeDirectLog(f, stem)' in code
          assert 'if (!fileRunId.equals(e.runId))' in code
          for name in (
            'copiedLogWithDifferentHeaderIdCannotImpersonateOriginalDuringRebuild',
            'refreshKeepsCopiedLogUnderItsOwnFilenameIdentity',
            'checksumValidCachedEntryWithMismatchedRunIdRebuildsFromOriginalLog'
          ):
            assert 'void '+name+'(' in tests, name
          print('Index header identity and three regressions present')
          PY
      - name: Run complete core JUnit and compile desktop and Android Java
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Enforce complete JUnit results and old history controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'no core JUnit results'
          totals={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3371, totals
          assert all(totals[k] == 0 for k in ('failures','errors','skipped')), totals
          cases={c.get('name') for r in reports for c in r.findall('testcase')}
          for name in (
            'copiedLogWithDifferentHeaderIdCannotImpersonateOriginalDuringRebuild',
            'refreshKeepsCopiedLogUnderItsOwnFilenameIdentity',
            'checksumValidCachedEntryWithMismatchedRunIdRebuildsFromOriginalLog',
            'invalidLogFilenamesAreIgnoredWithoutChangingTheirBytes',
            'validHeaderUnderInvalidFilenameCannotImpersonateItsRun',
            'checksumValidLegacyCacheWithInvalidLogFilenameIsRebuilt',
            'refreshRejectsPathLikeRunIdsWithoutReadingOutsideHistory',
            'recoveryNeverTruncatesSymlinkedRunLogs',
            'saveAndLoadRoundTrip'
          ):
            assert name in cases, name
          print('Core JUnit:',totals,'suites:',len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-index-header-identity-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
