name: Verify APD normal-speed visual overlays
on:
  push:
    branches: [chatgpt/apd-normal-speed-symbols-wells-gas-20261112]
    paths: [.github/workflows/apd-normal-speed-overlays-ci-20261112.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify all three requested visual layers use normal time
        run: |
          python3 - <<'PY'
          from pathlib import Path
          scene=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/GameScene.java').read_text()
          for name in ('statuses','emoicons','gases'):
              assert name+' = com.shatteredpixel.shatteredpixeldungeon.apd.PlaybackGroup.normalSpeedGroup();' in scene,name
          group=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/PlaybackGroup.java').read_text()
          assert 'public static Group normalSpeedGroup()' in group
          test=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/PlaybackSpeedTest.java').read_text()
          assert 'persistentDungeonOverlaysKeepNormalSpeedAtEveryPlaybackSetting' in test
          print('Normal-speed status, awareness and blob layer wiring present')
          PY
      - name: Run complete core tests and compile desktop and Android Java
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require complete passing suite and new visual timing regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports,'Missing core JUnit reports'
          totals={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3301 and all(totals[k]==0 for k in ('failures','errors','skipped')),totals
          cases={t.get('name') for r in reports if r.get('name','').endswith('.PlaybackSpeedTest') for t in r.findall('testcase')}
          assert 'persistentDungeonOverlaysKeepNormalSpeedAtEveryPlaybackSetting' in cases,cases
          print('Verified',totals,'across',len(reports),'suites; visual timing regression passed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-normal-speed-visual-overlays-core-results
          path: core/build/test-results/test/
          retention-days: 14
          if-no-files-found: warn
