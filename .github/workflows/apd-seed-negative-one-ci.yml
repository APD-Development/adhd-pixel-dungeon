# APD source-only verification for the exact -1 seed history regression.
name: Verify APD negative-one seed history source
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths:
      - .github/workflows/apd-seed-negative-one-ci.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/recorder/SeedHistory.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/SeedHistoryTest.java
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test with the existing Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require new seed regression and no failures
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          files=list(pathlib.Path('core/build/test-results/test').glob('TEST-*.xml'))
          assert files, 'Core test XML missing'
          roots=[ET.parse(f).getroot() for f in files]
          count=lambda name:sum(int(r.get(name,0)) for r in roots)
          assert count('tests')>=3248,(count('tests'), 'expected new regression')
          assert count('failures')==count('errors')==count('skipped')==0
          matching=[r for r in roots if 'SeedHistoryTest' in r.get('name','')]
          assert len(matching)==1,'Missing real SeedHistoryTest suite'
          assert any(c.get('name')=='explicitNegativeOneIsRecordedHistoryNotAnEmptySelection'
                     for c in matching[0].findall('testcase')),'Missing requested regression'
          print('Verified',count('tests'),'tests in',len(files),'suites, zero failures/errors/skips')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-seed-negative-one-core-results
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
