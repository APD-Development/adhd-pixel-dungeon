plants.blandfruitbush.name=blandfruit
plants.blandfruitbush.desc=Drops a blandfruit when trampled. It cannot be eaten raw; cook it with a seed to make a filling meal with a magical effect.
plants.blandfruitbush.discover_hint=You can find this plant randomly in the dungeon.
plants.blandfruitbush$seed.name=seed of blandfruit

plants.blindweed.name=blindweed
plants.blindweed.desc=Blinds and cripples whoever steps on it. Affected enemies lose track of their target.
plants.blindweed.warden_desc=_The Warden_ becomes temporarily invisible instead of being blinded and crippled.
plants.blindweed$seed.name=seed of blindweed

plants.mageroyal.name=mageroyal
plants.mageroyal.refreshed=You feel refreshed.
plants.mageroyal.desc=Cures ailments such as poison, bleeding, blindness and weakness when stepped on. Does not restore health.
plants.mageroyal.warden_desc=_The Warden_ also gains temporary protection from harmful clouds, ground fire, electricity and webs.
plants.mageroyal$seed.name=seed of mageroyal

plants.earthroot.name=earthroot
plants.earthroot.desc=Grants extra protection against physical hits while you stay on its tile. Moving ends the protection.
plants.earthroot.warden_desc=_The Warden_ gains temporary barkskin instead, so she can keep the protection while moving.
plants.earthroot$seed.name=seed of earthroot
plants.earthroot$armor.name=herbal armor
plants.earthroot$armor.desc=Blocks up to %1$d damage per physical hit while you stay on this tile. Breaks after absorbing at least %2$d more damage. Moving ends the protection.

plants.fadeleaf.name=fadeleaf
plants.fadeleaf.desc=Teleports whoever steps on it to a random open spot on the same floor. Cannot move immovable creatures or bypass restrictions on teleportation.
plants.fadeleaf.warden_desc=_The Warden_ returns to the previous floor’s exit when travel between floors is allowed. On Floor 1, she returns to that floor’s exit. If travel between floors is blocked, she teleports within the current floor.
plants.fadeleaf$seed.name=seed of fadeleaf

plants.firebloom.name=firebloom
plants.firebloom.desc=Bursts into flame when stepped on, setting its tile alight.
plants.firebloom.warden_desc=_The Warden_ briefly gains burning immunity and can ignite enemies with melee attacks. The plant still creates fire.
plants.firebloom$seed.name=seed of firebloom

plants.icecap.name=icecap
plants.icecap.desc=Freezes creatures on its tile and nearby open tiles, puts out fire and can shatter unprotected potions on the ground. Creatures standing in water stay frozen longer.
plants.icecap.warden_desc=_The Warden_ briefly gains immunity to chilling and freezing, and can chill enemies with melee attacks.
plants.icecap$seed.name=seed of icecap

plants.plant.warden_desc=This plant has no special effect when used by the Warden.
plants.plant.discover_hint=You can find this plant randomly in the dungeon, or grow it from its associated seed.
plants.plant$seed.seed_of=seed of %s
plants.plant$seed.ac_plant=PLANT
plants.plant$seed.info=Throw or plant this seed to grow a plant.\n\n%s
plants.plant$seed.info_barren=Barren Land prevents this seed from growing.\n\n%s
plants.plant$seed$placeholder.name=seed

plants.rotberry.name=rotberry
plants.rotberry.desc=Releases toxic gas when trampled and leaves its seed behind.
plants.rotberry.warden_desc=_The Warden_ gains temporary extra strength instead of releasing toxic gas.
plants.rotberry.discover_hint=You can grow this plant from its associated seed during a specific quest.
plants.rotberry$seed.name=seed of rotberry
plants.rotberry$seed.discover_hint=You can find this item during a specific quest.

plants.sorrowmoss.name=sorrowmoss
plants.sorrowmoss.desc=Poisons whoever steps on it, dealing damage over time.
plants.sorrowmoss.warden_desc=_The Warden_ briefly gains poison immunity and can poison enemies with melee attacks instead of being poisoned.
plants.sorrowmoss$seed.name=seed of sorrowmoss

plants.starflower.name=starflower
plants.starflower.desc=Blesses whoever steps on it, improving accuracy and evasion.
plants.starflower.warden_desc=_The Warden_ also gains temporary faster wand recharging.
plants.starflower$seed.name=seed of starflower

plants.stormvine.name=stormvine
plants.stormvine.desc=Causes vertigo when stepped on, making movement unpredictable. Keep away from pits while affected.
plants.stormvine.warden_desc=_The Warden_ briefly levitates instead of suffering vertigo.
plants.stormvine$seed.name=seed of stormvine

plants.sungrass.name=sungrass
plants.sungrass.desc_disabled_healing=Your current rules prevent Sungrass from restoring your health.
plants.sungrass.desc=Gradually restores health while you stay on its tile. Moving ends the healing.
plants.sungrass.warden_desc=_The Warden_ keeps healing even after moving away.
plants.sungrass$seed.name=seed of sungrass
plants.sungrass$health.name=herbal healing
plants.sungrass$health.desc=Stored healing: %d HP before bonuses or penalties. Stay on this tile to heal; moving ends the effect.

plants.swiftthistle.name=swiftthistle
plants.swiftthistle.desc=Lets you take several actions without time passing. Attacking or using magic ends the effect.
plants.swiftthistle.warden_desc=_The Warden_ also gains a brief burst of tripled movement speed.
plants.swiftthistle$seed.name=seed of swiftthistle
plants.swiftthistle$timebubble.name=time bubble
plants.swiftthistle$timebubble.desc=Your actions take no time while the bubble lasts. Attacking or using magic ends it.\n\nFree action time left: %s turns.
