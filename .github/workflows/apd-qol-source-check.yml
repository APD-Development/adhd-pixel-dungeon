name: APD quality-of-life source verification (no APK)
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09, codex/apd-description-followup-20261109T1933]
    paths: [docs/APD-QOL-SOURCE-VERIFY-REQUEST.txt]
permissions:
  contents: read
  statuses: write
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APD_EXPECTED_TESTS: '3247'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish source-check run link without claiming completion
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          APD_JOB_STATUS: running
        run: python3 tools/apd_source_check_status.py
      - name: Verify source-status evidence safeguards
        run: python3 -m unittest discover -s tools -p test_apd_source_check_status.py -v
      - name: Complete core suite and Android debug/release plus desktop compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Summarize exact JUnit results
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as E,json
          roots=[E.parse(p).getroot() for p in pathlib.Path('core/build/test-results/test').glob('TEST-*.xml')]
          totals={k:sum(int(r.get(k,0)) for r in roots) for k in ['tests','failures','errors','skipped']}
          summary={'source_commit':__import__('os').environ['GITHUB_SHA'],'suites':len(roots),**totals,'apk_assembled':False,'physical_phone_tested':False}
          pathlib.Path('qol-verification.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary))
          if not roots or totals['tests']!=int(__import__('os').environ['APD_EXPECTED_TESTS']) or any(totals[k] for k in ['failures','errors','skipped']):raise SystemExit('Missing, changed or failed test inventory')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-qol-source-verification
          path: |
            core/build/test-results/test/
            qol-verification.json
          retention-days: 14
      - name: Publish exact source-check outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          APD_JOB_STATUS: ${{ job.status }}
        run: python3 tools/apd_source_check_status.py
