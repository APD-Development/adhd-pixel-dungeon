###missile weapons
items.weapon.missiles.darts.adrenalinedart.name=adrenaline dart
items.weapon.missiles.darts.adrenalinedart.desc=Speeds up an ally's movement and attacks without hurting them. Against enemies, deals normal dart damage and briefly slows movement.

items.weapon.missiles.darts.blindingdart.name=blinding dart
items.weapon.missiles.darts.blindingdart.desc=Blinds the target briefly, making it harder to find you. Enemies still remember where they last saw you.

items.weapon.missiles.darts.chillingdart.name=chilling dart
items.weapon.missiles.darts.chillingdart.desc=Chills the target, slowing all actions and putting out Burning. The chill lasts longer in water.

items.weapon.missiles.darts.cleansingdart.name=cleansing dart
items.weapon.missiles.darts.cleansingdart.desc=Cleanses an ally and briefly protects them from harmful effects without dealing damage. Against enemies, deals normal dart damage and removes most beneficial effects, but not champion powers. Surviving enemies may lose track of you.

items.weapon.missiles.darts.dart.name=dart
items.weapon.missiles.darts.dart.ac_tip=TIP
items.weapon.missiles.darts.dart.prompt=Select a seed
items.weapon.missiles.darts.dart.tip_title=Tip Darts
items.weapon.missiles.darts.dart.tip_desc=A seed can coat up to two darts with its special effect. The coating wears off with use, leaving a regular dart. Bonuses that preserve dart tips can make it last longer.\n\nThis seed makes a _%s._
items.weapon.missiles.darts.dart.tip_all=tip %1$d darts with %2$d seeds
items.weapon.missiles.darts.dart.tip_two=tip 2 darts with 1 seed
items.weapon.missiles.darts.dart.tip_one=tip 1 dart with 1 seed
items.weapon.missiles.darts.dart.tip_cancel=cancel
items.weapon.missiles.darts.dart.desc=Reusable wooden darts. Use TIP with a seed to coat up to two darts with its special effect.
items.weapon.missiles.darts.dart.unlimited_uses=These darts do not wear out.

items.weapon.missiles.darts.displacingdart.name=displacing dart
items.weapon.missiles.darts.displacingdart.desc=Relocates the target to a suitable empty tile, preferring one you can see. This can bring a distant enemy closer. Briefly reveals the enemy if the destination is unseen. Cannot move immovable targets.

items.weapon.missiles.darts.healingdart.name=healing dart
items.weapon.missiles.darts.healingdart.desc=Heals the target over time and cures the ailments removed by a Potion of Healing. Does not hurt allies, but still deals normal dart damage to enemies.

items.weapon.missiles.darts.holydart.name=holy dart
items.weapon.missiles.darts.holydart.desc=Deals extra holy damage to undead and demonic enemies. Blesses other targets instead, improving their accuracy and evasion. Allies take no dart damage; ordinary enemies do, but also receive the blessing.

items.weapon.missiles.darts.incendiarydart.name=incendiary dart
items.weapon.missiles.darts.incendiarydart.desc=Sets the target on fire. Can also ignite flammable terrain when thrown onto an empty tile.

items.weapon.missiles.darts.paralyticdart.name=paralytic dart
items.weapon.missiles.darts.paralyticdart.desc=Briefly paralyzes the target, stopping all actions. Damage can end the paralysis early.

items.weapon.missiles.darts.poisondart.name=poison dart
items.weapon.missiles.darts.poisondart.desc=Poisons the target, causing damage over time. The poison grows stronger deeper in the dungeon.

items.weapon.missiles.darts.rotdart.name=rot dart
items.weapon.missiles.darts.rotdart.desc=Inflicts corrosion: damage that grows stronger over time. Strong enough to kill many ordinary enemies, but much weaker against bosses and minibosses. Each fresh tip lasts five uses; bonuses cannot extend it.
items.weapon.missiles.darts.rotdart.discover_hint=You can create this item using a seed from a specific quest.

items.weapon.missiles.darts.shockingdart.name=shocking dart
items.weapon.missiles.darts.shockingdart.desc=Deals extra lightning damage on impact. This damage increases deeper in the dungeon.

items.weapon.missiles.darts.tippeddart.ac_clean=CLEAN
items.weapon.missiles.darts.tippeddart.clean_title=Clean Darts
items.weapon.missiles.darts.tippeddart.clean_desc=Remove the seed coating and turn these back into regular darts. This takes one turn.
