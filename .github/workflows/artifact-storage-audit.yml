name: Read-only Actions artifact storage audit
on:
  issues:
    types: [opened]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  issues: read
jobs:
  inventory:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.title == 'Run read-only artifact storage audit' &&
       github.event.issue.user.login == 'charltonchris29')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inventory artifacts (read only, no deletion)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import sys
          import urllib.request
          import urllib.error
          from collections import Counter
          
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          base = "https://api.github.com/repos/" + repo + "/actions/artifacts"
          all_artifacts = []
          for page in range(1, 1001):
              url = base + "?per_page=100&page=" + str(page)
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28"
              })
              with urllib.request.urlopen(request, timeout=45) as response:
                  entries = json.load(response).get("artifacts", [])
              all_artifacts.extend(entries)
              if len(entries) < 100:
                  break
          else:
              raise RuntimeError("Inventory exceeds 100000 artifacts; aborting incomplete audit")
          
          live = [a for a in all_artifacts if not a.get("expired")]
          apk = [a for a in live if a.get("name", "").startswith("PTO-Android-") or a.get("name", "").startswith("MC-APK-")]
          apk.sort(key=lambda a: (a.get("created_at", ""), a.get("id", 0)), reverse=True)
          protected = {a["id"] for a in apk[:3]}
          now = dt.datetime.now(dt.timezone.utc)
          older = []
          for a in live:
              created = dt.datetime.fromisoformat(a["created_at"].replace("Z", "+00:00"))
              if a["id"] not in protected and (now - created).days >= 7:
                  older.append(a)
          older.sort(key=lambda a: (a.get("created_at", ""), a.get("id", 0)))
          size = lambda rows: sum(int(a.get("size_in_bytes", 0)) for a in rows)
          gib = lambda n: round(n / 1073741824, 3)
          summary = {
              "repo": repo,
              "inventory_count": len(all_artifacts),
              "currently_unexpired_count": len(live),
              "currently_unexpired_gib": gib(size(live)),
              "apk_named_artifacts_count": len(apk),
              "latest_three_apk_named_protected": [{"id": a["id"], "name": a["name"], "created_at": a.get("created_at"), "gib": gib(size([a]))} for a in apk[:3]],
              "historical_review_candidates_count": len(older),
              "historical_review_candidates_gib": gib(size(older)),
              "note": "DRY RUN ONLY. A name does not prove an APK is signed/usable. Review every candidate before approving deletion. Releases and source code were not inspected or modified."
          }
          print("AUDIT_SUMMARY_JSON=" + json.dumps(summary, separators=(",", ":")), flush=True)
          print("AUDIT_CANDIDATE_LIST_BEGIN", flush=True)
          for a in older:
              print(json.dumps({"id": a["id"], "name": a.get("name"), "bytes": a.get("size_in_bytes"), "created_at": a.get("created_at"), "workflow_run_id": (a.get("workflow_run") or {}).get("id")}, separators=(",", ":")))
          print("AUDIT_CANDIDATE_LIST_END", flush=True)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as out:
                  out.write("## Read-only Actions artifact inventory\n\n")
                  out.write("Repository: `" + repo + "`\n\n")
                  out.write("Unexpired artifacts: **" + str(len(live)) + "**, **" + str(gib(size(live))) + " GiB**.\n\n")
                  out.write("Historical items for review (7+ days, excluding three newest APK-named artifacts): **" + str(len(older)) + "**, **" + str(gib(size(older))) + " GiB**.\n\n")
                  out.write("No files were deleted. Artifact names alone do not prove usable signed APKs. Check the complete list in the job log before authorizing cleanup.\n\n")
                  out.write("### Provisional three APK-named preserves\n\n")
                  for a in apk[:3]:
                      out.write("- `" + a["name"].replace("`", "") + "` (ID " + str(a["id"]) + ")\n")
          
          PY
