name: Complete exact TEST346 API34 acceptance retry

on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths:
      - .github/workflows/apd-existing346-full-api34-retry.yml
      - android/src/androidTest/java/com/shatteredpixel/shatteredpixeldungeon/android/AboutDeviceTest.java

permissions:
  contents: read
  actions: read

concurrency:
  group: apd-existing346-full-api34-retry
  cancel-in-progress: false

jobs:
  exact-apk-full-api34:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Download exact TEST346 APK and prove application inputs are unchanged
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,zipfile
          sys.path.insert(0,'tools')
          from apd_existing_build_evidence import application_inputs
          repo=os.environ['GITHUB_REPOSITORY']
          source='0d938a994359b6a0e5cb2533b1207d5722df6cab'
          run_id=41520122020
          artifact_id=13176363739
          api=lambda p:json.loads(subprocess.check_output(['gh','api',p]))
          assert api('repos/'+repo)['private']
          trees=[api(f'repos/{repo}/git/trees/{s}?recursive=1') for s in (source,os.environ['GITHUB_SHA'])]
          assert all(not tree.get('truncated') for tree in trees)
          assert application_inputs(trees[0]['tree'])==application_inputs(trees[1]['tree'])
          run=api(f'repos/{repo}/actions/runs/{run_id}')
          assert run['head_sha']==source and run['run_number']==346 and run['conclusion']=='failure'
          jobs=api(f'repos/{repo}/actions/runs/{run_id}/jobs')['jobs']
          assert any(job['name']=='verify-and-build' and job['conclusion']=='success' for job in jobs)
          artifacts=api(f'repos/{repo}/actions/runs/{run_id}/artifacts')['artifacts']
          artifact,=[a for a in artifacts if a['id']==artifact_id and a['name']=='apd-codex-private-test-apk' and not a['expired']]
          with open('exact346.zip','wb') as out:
              subprocess.run(['gh','api',f'repos/{repo}/actions/artifacts/{artifact_id}/zip'],stdout=out,check=True)
          assert 'sha256:'+hashlib.sha256(pathlib.Path('exact346.zip').read_bytes()).hexdigest()==artifact['digest']
          pathlib.Path('application').mkdir()
          with zipfile.ZipFile('exact346.zip') as archive:
              apk,=[name for name in archive.namelist() if name.endswith('.apk')]
              data=archive.read(apk)
              digest=hashlib.sha256(data).hexdigest()
              checksum,=[name for name in archive.namelist() if name.endswith('.apk.sha256')]
              assert archive.read(checksum).decode().split()[0]==digest
              pathlib.Path('application/exact346.apk').write_bytes(data)
          pathlib.Path('acceptance-source.json').write_text(json.dumps({
              'application_source':source,
              'application_run':run_id,
              'application_artifact':artifact_id,
              'application_artifact_digest':artifact['digest'],
              'application_sha256':digest,
              'application_rebuilt':False,
              'application_inputs_unchanged':True,
              'test_source':os.environ['GITHUB_SHA'],
              'failed_predecessor_job':125536302553,
              'failed_predecessor_reason':'AboutDeviceTest expected the superseded WndUimsdText source/license popup',
              'physical_device':False,
              'published':False
          },indent=2))
          print('EXACT_TEST346_APK_SHA256',digest)
          PY
      - name: Compile current instrumentation only
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :android:assembleDebugAndroidTest -PapdTestBuild -PapdBuild=C346
          test ! -f android/build/outputs/apk/debug/android-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run complete current API34 suite against exact APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb logcat -c
            adb logcat -v time > exact346-retry-logcat.txt &
            adb install -r application/exact346.apk
            adb install -r android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk
            APD_EXISTING_APK=1 bash tools/run-codex-android-checks.sh 346
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-test346-complete-api34-retry
          path: |
            acceptance-source.json
            existing-apk-instrumentation.txt
            exact346-retry-logcat.txt
            codex-visual-evidence/
            android/build/reports/androidTests/
            android/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7
