name: Build and verify APD377 removed-actor freeze correction and reviewed descriptions pair for private owner delivery
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-377-BUILD-REQUEST.txt]
permissions: {contents: read, actions: read}
concurrency: {group: apd377-preparation, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Preserve fallback and embed complete existing history
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 tools/apd_owner_delivery_policy.py
          python3 - <<'PY'
          import json,subprocess,pathlib,sys
          sys.path.insert(0,'tools')
          from apd_build_history import merge_previous_apk,embed
          repo='APD-Development/ShieldingShouldHaveWorked'
          api=lambda p:json.loads(subprocess.check_output(['gh','api',p]))
          assert api('repos/'+repo)['private']
          release=api('repos/'+repo+'/releases/tags/apd-alpha-preview-376')
          pathlib.Path('evidence').mkdir()
          pathlib.Path('evidence/fallback376.json').write_text(json.dumps(release,indent=2))
          subprocess.run(['gh','release','download','apd-alpha-preview-376','--repo',repo,'--pattern','APD-Developer-376.apk','--dir','fallback'],check=True)
          merge_previous_apk(pathlib.Path.cwd(),'fallback/APD-Developer-376.apk','Codex TEST 376')
          ledger={'date':'2026-11-08','changes':[{'category':'Fixes','sprite':'ICON_PREFS','title':'Turn queue and clearer item descriptions','text':'Releases the turn queue if its waiting actor is removed during an attack animation. Keeps live attacks and scheduled turn timing. Removes the repeated armor tutorial, reviews food, rings, containers, keys, utility, remains, quest and journal text; corrects Pickaxe and Force upgrade previews. No balance or save-format change. Full description audit remains in progress; exact owner phone-freeze cause unconfirmed.'}]}
          embed(pathlib.Path.cwd(),ledger,377)
          PY
      - name: Full core and required compilation; build exactly one pair
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          mkdir -p owner-delivery
          ./gradlew :core:test :desktop:classes :android:compileReleaseJavaWithJavac :android:assembleDebug :android:assembleDebugAndroidTest -PapdTestBuild -PapdBuild=C377
          cp android/build/outputs/apk/debug/android-debug.apk owner-delivery/APD-Developer-377.apk
          cp android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk evidence/instrumentation.apk
          ./gradlew :android:assembleDebug -PapdBuild=P377
          cp android/build/outputs/apk/debug/android-debug.apk owner-delivery/APD-Alpha-Testers-377.apk
          python3 tools/check_android_json_abi.py
          ./gradlew --stop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd377-built-pair
          path: |
            owner-delivery/
            evidence/
            core/build/test-results/test/
          retention-days: 14
  native:
    needs: build
    strategy:
      fail-fast: false
      matrix: {variant: [Developer, Alpha-Testers]}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: apd377-built-pair}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual APK without rebuilding
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none -skin 320x640
          script: |
            adb logcat -c
            adb logcat -v time > evidence/${{ matrix.variant }}-native-logcat.txt &
            adb install -r owner-delivery/APD-${{ matrix.variant }}-377.apk
            adb install -r evidence/instrumentation.apk
            if test '${{ matrix.variant }}' = Developer; then echo developer > case-label.txt; else echo alpha > case-label.txt; fi
            timeout 420 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.QolItemFeedbackDeviceTest com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/$(cat case-label.txt)-qol.txt
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 240 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.WallGeometryDeviceTest com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/$(cat case-label.txt)-wall.txt
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 180 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.TrapDiscoveryDeviceTest#a_controlWritesEnabledPreference com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/$(cat case-label.txt)-seed.txt
            python3 tools/apd_check_single_instrumentation.py evidence/$(cat case-label.txt)-seed.txt a_controlWritesEnabledPreference
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 180 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.TrapDiscoveryDeviceTest#b_freshProcessReadsEnabledAndCanDisable com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/$(cat case-label.txt)-restart.txt
            python3 tools/apd_check_single_instrumentation.py evidence/$(cat case-label.txt)-restart.txt b_freshProcessReadsEnabledAndCanDisable
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 180 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.TrapDiscoveryDeviceTest#c_runtimeDiscoveryRouteAndActualTrapEffect com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/$(cat case-label.txt)-gameplay.txt
            python3 tools/apd_check_single_instrumentation.py evidence/$(cat case-label.txt)-gameplay.txt c_runtimeDiscoveryRouteAndActualTrapEffect
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 240 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.RemovedActorStallDeviceTest com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/$(cat case-label.txt)-freeze.txt
            python3 tools/apd_check_single_instrumentation.py evidence/$(cat case-label.txt)-freeze.txt cancelledGhoulAttackReleasesQueueButLiveAttackStaysPending
            adb pull /sdcard/Pictures/APD-Test-Visuals/. evidence/${{ matrix.variant }}-visuals/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd377-native-${{ matrix.variant }}
          path: evidence/
          retention-days: 14
  prepare:
    needs: [build, native]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: apd377-built-pair}
      - uses: actions/download-artifact@v4
        with: {name: apd377-native-Developer, path: evidence}
      - uses: actions/download-artifact@v4
        with: {name: apd377-native-Alpha-Testers, path: evidence}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Verify exact identities, completed tests and corresponding source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 tools/apd_prepare377.py
      - name: Scan key-free source and full reachable history
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/apd-gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/apd-gitleaks.tar.gz' | sha256sum -c -
          mkdir /tmp/apd-gitleaks
          tar -xzf /tmp/apd-gitleaks.tar.gz -C /tmp/apd-gitleaks
          python3 tools/apd_qol_source_scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd377-prepared-owner-pair
          path: owner-delivery/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd377-source-and-native-evidence
          path: |
            evidence/
            core/build/test-results/test/
            docs/APD-377-DELIVERY-SPEC.json
          retention-days: 14
