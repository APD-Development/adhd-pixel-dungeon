name: Verify exact M53-sized tall display on unchanged TEST258
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/codex-m53-exact258.yml]
permissions:
  contents: read
  actions: read
jobs:
  title-display:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: m53-exact, size: 1080x2408, density: 420}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Find the exact application producer without building another APK
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time,pathlib,zipfile
          import hashlib,sys
          repo=os.environ['GITHUB_REPOSITORY'];source='f2b19b2534ad9e701823012e1c84b31bebd9c225'
          api=lambda p:json.loads(subprocess.check_output(['gh','api',p]))
          run=api(f'repos/{repo}/actions/runs/38968356419')
          assert run['head_sha']==source
          jobs=api(f'repos/{repo}/actions/runs/38968356419/jobs')['jobs']
          assert any(j['name']=='verify-and-build' and j['conclusion']=='success' for j in jobs)
          sys.path.insert(0,'tools')
          from apd_existing_build_evidence import application_inputs
          trees=[application_inputs(api(f'repos/{repo}/git/trees/{sha}?recursive=1')['tree']) for sha in (source,os.environ['GITHUB_SHA'])]
          assert trees[0]==trees[1],'Test wrapper changed application inputs'
          artifacts=api(f'repos/{repo}/actions/runs/38968356419/artifacts')['artifacts']
          item=next(a for a in artifacts if a['name']=='apd-codex-private-test-apk' and not a['expired'])
          with open('application.zip','wb')as out:subprocess.run(['gh','api',f'repos/{repo}/actions/artifacts/{item["id"]}/zip'],stdout=out,check=True)
          assert hashlib.sha256(pathlib.Path('application.zip').read_bytes()).hexdigest()==item['digest'].removeprefix('sha256:')
          with zipfile.ZipFile('application.zip')as z:z.extractall('application')
          apk=next(pathlib.Path('application').glob('*.apk'));digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          assert next(pathlib.Path('application').glob('*.apk.sha256')).read_text().split()[0]==digest
          pathlib.Path('acceptance-source.json').write_text(json.dumps({'application_source':source,'application_run':38968356419,'application_sha256':digest,'protected_application_inputs_identical':True,'application_rebuilt':False,'test_source':os.environ['GITHUB_SHA']},indent=2))
          with open(os.environ['GITHUB_ENV'],'a')as out:out.write('APD_BUILD=258\n')

          PY
      - name: Compile only instrumentation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :android:assembleDebugAndroidTest -PapdTestBuild "-PapdBuild=C$APD_BUILD"
          test ! -f android/build/outputs/apk/debug/android-debug.apk
          ./gradlew --stop
          python3 -m pip install pillow
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual touchscreen and capture this display
        env:
          APD_ENFORCE_DISPLAY: 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_7
          disable-animations: true
          script: adb shell settings put secure immersive_mode_confirmations confirmed && bash tools/run-title-display-check.sh '${{ matrix.size }}' '${{ matrix.density }}' '${{ matrix.mode }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-title-display-${{ matrix.name }}
          path: |
            title-evidence/
            title-instrumentation.txt
            title-logcat.txt
          retention-days: 7
