name: Verify APD 1x well activation effects
on:
  push:
    branches: [chatgpt/apd-well-use-normal-speed-20261112-1330]
    paths: [.github/workflows/apd-well-use-normal-speed-ci-20261112.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify all well-use emission call paths avoid accelerated emitters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          scene=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/scenes/GameScene.java').read_text()
          cell=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/effects/CellEmitter.java').read_text()
          health=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/blobs/WaterOfHealth.java').read_text()
          awareness=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/actors/blobs/WaterOfAwareness.java').read_text()
          assert 'gases = com.shatteredpixel.shatteredpixeldungeon.apd.PlaybackGroup.normalSpeedGroup();' in scene
          normal=scene.split('public static synchronized Emitter normalSpeedEmitter()',1)[1].split('public static synchronized Emitter floorEmitter()',1)[0]
          assert 'scene.gases.recycle( Emitter.class )' in normal
          method=cell.split('public static Emitter normalSpeed( int cell )',1)[1].split('public static Emitter center( int cell )',1)[0]
          assert 'GameScene.normalSpeedEmitter()' in method
          assert health.count('CellEmitter.normalSpeed(')==5,health.count('CellEmitter.normalSpeed(')
          assert 'CellEmitter.get(' not in health
          assert 'hero.sprite.emitter().start(' not in health
          assert 'emitter.parent.add( new Identification(' in awareness
          assert 'emoicons = com.shatteredpixel.shatteredpixeldungeon.apd.PlaybackGroup.normalSpeedGroup();' in scene
          assert 'statuses = com.shatteredpixel.shatteredpixeldungeon.apd.PlaybackGroup.normalSpeedGroup();' in scene
          print('Both passive well types, gas, alerts and well-use bursts route to normal-time visual layers')
          PY
      - name: Run core regressions and compile Android and desktop Java
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require complete passing core suite and actual well-emitter regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports,'Missing core JUnit XML'
          totals={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3302 and all(totals[k]==0 for k in ('failures','errors','skipped')),totals
          cases={t.get('name') for r in reports if r.get('name','').endswith('.PlaybackSpeedTest') for t in r.findall('testcase')}
          assert 'magicalWellActivationEmitterActuallyBelongsToNormalSpeedLayer' in cases,cases
          print('Verified',totals,'across',len(reports),'suites')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-well-use-1x-core-results
          path: core/build/test-results/test/
          retention-days: 14
          if-no-files-found: warn
