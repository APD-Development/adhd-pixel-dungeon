name: Complete378 packaging with original signing identity on unchanged verified APKs
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-378-PREPARE-REQUEST.txt]
permissions: {contents: read, actions: read}
concurrency: {group: apd378-final-preparation, cancel-in-progress: false}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: apd378-built-pair, run-id: 42509916901, github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {artifact-ids: 13628947277, run-id: 42509916901, github-token: '${{ github.token }}', path: evidence, merge-multiple: true}
      - uses: actions/download-artifact@v4
        with: {artifact-ids: 13628904854, run-id: 42510732550, github-token: '${{ github.token }}', path: evidence, merge-multiple: true}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Verify exact identities, completed tests and corresponding source
        env: {GH_TOKEN: '${{ github.token }}', APD_SOURCE_SHA: '5c225bdf7c6a181f7a4d0ee16b1edbdbae2a3e4d'}
        run: |
          python3 tools/apd_prepare378.py
          python3 - <<'PY'
          import pathlib,json,os,subprocess
          p=pathlib.Path('owner-delivery/APD-Preview-378-Verification.json');d=json.loads(p.read_text());d['original_apk_build_run']=42509916901;d['native_developer_artifact_id']=13628947277;d['native_alpha_retry_run']=42510732550;d['first_prepare_failure']='Verifier certificate pin accidentally changed during build-number text substitution. Actual APK certificate remained original; corrected verifier reran full cryptographic identity check without rebuilding.';d['first_alpha_attempt']='Partial native run: adb error closed during wall test; emulator TCP5554 then refused connection. Initial artifact13629825028 preserved. Original APK and instrumentation reused without rebuilding.';d['verification_harness_source']=os.environ['GITHUB_SHA'];changed=subprocess.check_output(['git','diff','--name-only',d['source_commit'],os.environ['GITHUB_SHA']],text=True).splitlines();assert not any(x.startswith(('core/src/main/','android/src/main/','android/src/androidTest/','SPD-classes/src/main/')) for x in changed);p.write_text(json.dumps(d,indent=2)+'\n')
          with pathlib.Path('owner-delivery/release-notes.md').open('a') as f:f.write('\nPreparation retry: original Alpha emulator connection closed during the wall case; incomplete attempt preserved, not counted as passed. Same Alpha APK and instrumentation were tested again on a fresh emulator. Developer completed evidence was reused by exact artifact ID. No new game APKs or instrumentation rebuilt.\n')
          PY
      - name: Scan key-free source and full reachable history
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/apd-gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/apd-gitleaks.tar.gz' | sha256sum -c -
          mkdir /tmp/apd-gitleaks
          tar -xzf /tmp/apd-gitleaks.tar.gz -C /tmp/apd-gitleaks
          python3 tools/apd_qol_source_scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd378-prepared-owner-pair
          path: owner-delivery/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd378-source-and-native-evidence
          path: |
            evidence/
            core/build/test-results/test/
            docs/APD-378-DELIVERY-SPEC.json
          retention-days: 14
