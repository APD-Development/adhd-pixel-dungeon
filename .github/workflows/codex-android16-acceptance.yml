name: APD Android16 targeted owner APK acceptance
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/codex-android16-acceptance.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: codex-android16-acceptance
  cancel-in-progress: false
jobs:
  existing-apk-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 182155b7e2906357fa3006ae3af70a7e472bb0bb
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Reuse the exact verified TEST222 application
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,zipfile
          repo=os.environ['GITHUB_REPOSITORY']
          assert json.loads(subprocess.check_output(['gh','api','repos/'+repo]))['private']
          source='182155b7e2906357fa3006ae3af70a7e472bb0bb'
          run_id='38809007695'
          run=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/actions/runs/'+run_id]))
          assert run['status']=='completed' and run['conclusion']=='success' and run['head_sha']==source
          subprocess.run(['git','fetch','--no-tags','--depth=1','origin',source],check=True)
          protected=['core/src/main','SPD-classes/src/main','services/src/main','android/src/main','android/build.gradle','core/build.gradle','SPD-classes/build.gradle','services/build.gradle','build.gradle','settings.gradle','gradle.properties','gradle','android/debug.keystore']
          subprocess.run(['git','diff','--exit-code',source,'HEAD','--']+protected,check=True)
          artifacts=json.loads(subprocess.check_output(['gh','api','repos/'+repo+'/actions/runs/'+run_id+'/artifacts']))['artifacts']
          apk_assets=[a for a in artifacts if a['name']=='apd-codex-private-test-apk' and not a['expired']]
          assert len(apk_assets)==1
          with open('existing-application.zip','wb') as output:
              subprocess.run(['gh','api','repos/'+repo+'/actions/artifacts/'+str(apk_assets[0]['id'])+'/zip'],stdout=output,check=True)
          with zipfile.ZipFile('existing-application.zip') as archive:
              names=[n for n in archive.namelist() if n.endswith('.apk')]
              assert len(names)==1
              apk=archive.read(names[0])
          digest=hashlib.sha256(apk).hexdigest()
          assert digest=='c4fe922f32c7b07f94666ae01591a04384fa5c801afcb4f869aca9a5c0e6aea5'
          pathlib.Path('existing-test222.apk').write_bytes(apk)
          pathlib.Path('acceptance-source.json').write_text(json.dumps({'application_source':source,'application_run':int(run_id),'application_sha256':digest,'test_source':os.environ['GITHUB_SHA'],'application_reused':True,'published':False,'physical_device':False},indent=2))
          PY
      - name: Add only the Android 16 acceptance instrumentation fixtures
        run: |
          git fetch --no-tags --depth=1 origin 1226030b5a6ed130024e339920b3bcd94c811363
          git show 1226030b5a6ed130024e339920b3bcd94c811363:android/src/androidTest/java/com/shatteredpixel/shatteredpixeldungeon/android/CustomRulesNoticeDeviceTest.java > android/src/androidTest/java/com/shatteredpixel/shatteredpixeldungeon/android/CustomRulesNoticeDeviceTest.java
          git show 1226030b5a6ed130024e339920b3bcd94c811363:android/src/androidTest/java/com/shatteredpixel/shatteredpixeldungeon/android/PlayRunDeviceTest.java > android/src/androidTest/java/com/shatteredpixel/shatteredpixeldungeon/android/PlayRunDeviceTest.java
      - name: Set up Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile the updated instrumentation APK
        run: ./gradlew :android:assembleDebugAndroidTest -PapdTestBuild -PapdBuild=C222
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise every control through native Android touch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          # The lean API 36 image keeps the AVD within the hosted runner's
          # measured free space; API level and acceptance assertions are unchanged.
          target: default
          disk-size: 4G
          disable-animations: true
          script: |
            adb install -r existing-test222.apk
            adb install -r android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk
            adb logcat -c
            timeout 480 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.CustomRulesNoticeDeviceTest#allEighteenControlsAcceptNativeTouchSaveAndReopenWithoutChangingActiveRun com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > api36-01-controls.txt 2>&1; printf '%s\n' "$?" > api36-01-controls.txt.exit
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 300 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.CustomRulesNoticeDeviceTest#healingConversionSettingExplainsItsExactScopeWithoutChangingSavedValue com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > api36-02-healing.txt 2>&1; printf '%s\n' "$?" > api36-02-healing.txt.exit
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 300 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.AboutDeviceTest#aboutFoundingStatementAndPopupFollowAdultHumorOnEveryOpening com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > api36-03-about.txt 2>&1; printf '%s\n' "$?" > api36-03-about.txt.exit
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 480 adb shell am instrument -w -r -e apdSkipPixelEvidence true -e class com.shatteredpixel.shatteredpixeldungeon.android.PlayRunDeviceTest#aRunCanBePlayedSavedContinuedAndEndedWithItsHistoryRecorded com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > api36-04-play-save.txt 2>&1; printf '%s\n' "$?" > api36-04-play-save.txt.exit
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            adb logcat -d -v time > all-controls-logcat.txt
            python3 -c "import json,pathlib,re,subprocess; cases=['api36-01-controls.txt','api36-02-healing.txt','api36-03-about.txt','api36-04-play-save.txt']; outputs={name:pathlib.Path(name).read_text() for name in cases}; print(''.join('===== '+name+' =====\\n'+outputs[name]+'\\n' for name in cases)); assert all(pathlib.Path(name+'.exit').read_text().strip()=='0' for name in cases); assert all(re.search(r'OK \\(1 test\\)',outputs[name]) for name in cases); assert all(not any(marker in outputs[name] for marker in ['FAILURES!!!','INSTRUMENTATION_FAILED','Process crashed.']) for name in cases); sdk=int(subprocess.check_output(['adb','shell','getprop','ro.build.version.sdk'])); assert sdk==36; pathlib.Path('all-controls-result.json').write_text(json.dumps({'tests':4,'passed':4,'api_level':sdk,'failures':0,'errors':0,'skipped':0,'controls':18,'boundaries':'minimum and maximum','native_touch':True,'isolated_instrumentation_processes':True,'save_and_reopen':True,'active_rules_unchanged':True,'scores_unchanged':True,'physical_device':False},indent=2))"
      - name: Preserve acceptance evidence even if a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apd-android16-targeted-acceptance
          path: |
            acceptance-source.json
            all-controls-result.json
            api36-*.txt
            api36-*.exit
            all-controls-logcat.txt
            android/build/reports/
          if-no-files-found: warn
          retention-days: 7

