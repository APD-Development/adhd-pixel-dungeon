name: APD shared ZIP entry buffer exact-source verification
on:
  push:
    branches: [chatgpt/apd-shared-zip-entry-buffer-20261115-2000]
    paths:
      - .github/workflows/apd-shared-entry-buffer-source-ci-20261115.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporter.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporterSharedEntryBufferTest.java
permissions: {contents: read}
concurrency:
  group: apd-shared-entry-buffer-20261115
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Assert one shared buffer across staged and ignored entries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporter.java').read_text()
          assert src.count('byte[] entryBuffer = new byte[16 * 1024];') == 1
          assert 'readChunk(zip, entryBuffer)' in src
          assert 'invalidDetails < MAX_INVALID_ENTRY_DETAILS, entryBuffer)' in src
          section = src.split('private static Staged stage(', 1)[1].split('private static void commit(', 1)[0]
          assert 'byte[] buf = new byte[16 * 1024]' not in section
          tests = Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporterSharedEntryBufferTest.java').read_text()
          assert 'void mixedIgnoredAndValidMembersPreserveEveryLogByte(' in tests
          assert 'void corruptFinalMemberStillRollsBackAllPriorStagedLogs(' in tests
          print('Shared entry buffer and real-ZIP regressions present')
          PY
      - name: Complete core tests and desktop/Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require all core tests green and compatibility regressions retained
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = [ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'Missing JUnit reports'
          totals = {k:sum(int(r.get(k, 0)) for r in reports) for k in ('tests', 'failures', 'errors', 'skipped')}
          assert totals['tests'] >= 3513, totals
          assert all(totals[k] == 0 for k in ('failures','errors','skipped')), totals
          names = {c.get('name') for r in reports for c in r.findall('testcase')}
          for name in (
              'mixedIgnoredAndValidMembersPreserveEveryLogByte',
              'corruptFinalMemberStillRollsBackAllPriorStagedLogs',
              'largeIgnoredPayloadsDrainBeforeNextLegitimateHistoryLog',
              'manyInvalidPresentEntriesKeepExactRejectionCountAndOriginalHistory',
              'repeatedManifestPathKeepsFirstMatchAndNeverOverwritesHistory',
              'rejectedLongPathZipPreservesExistingHistoryBytes',
          ):
              assert name in names, name
          print('JUnit:', totals, 'suites:', len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-shared-entry-buffer-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
