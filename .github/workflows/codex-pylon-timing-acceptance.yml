name: APD pylon timing regression checks
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/codex-pylon-timing-acceptance.yml]
permissions:
  contents: read
concurrency:
  group: apd-pylon-timing-acceptance
  cancel-in-progress: false
jobs:
  core-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run pylon scheduler and existing playback regressions
        run: ./gradlew :core:test --tests '*PylonTimingRegressionTest' --tests '*PlaybackSpeedTest'
      - name: Retain focused results before the complete run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apd-pylon-focused-results
          path: core/build/test-results/test/
          retention-days: 7
      - name: Run the complete current core suite
        run: ./gradlew :core:test --rerun-tasks
      - name: Retain complete results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apd-pylon-complete-results
          path: |
            core/build/test-results/test/
            core/build/reports/tests/test/
          retention-days: 7
