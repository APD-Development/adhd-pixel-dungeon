name: Publish verified APD460 Developer and Alpha APKs
on:
  push:
    branches: [codex/apd-search-radius-scan-20261112]
    paths: [.github/workflows/apd-publish460.yml]
permissions: {contents: write, actions: read}
concurrency: {group: apd460-one-time-publish, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact source build and six successful frozen-APK Android checks
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,time
          repo='APD-Development/ShieldingShouldHaveWorked'
          expectations=[
            (43237301847,'7c6a10e2db7c82f38297f5d5e38a62ceba27c962'),
            (43237859054,'3f37bff65330ea63cc05355ee514cd5b5700aa0f'),
            (43238039604,'6ee677aabaa9b38a5be00f7dbd7e21d6ae1dbf72')]
          for run_id,sha in expectations:
            for attempt in range(240):
              r=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}']))
              assert r['head_sha']==sha,(run_id,r['head_sha'],sha)
              if r['status']=='completed':
                assert r['conclusion']=='success',(run_id,r['conclusion'])
                break
              time.sleep(10)
            else: raise RuntimeError(f'Timeout waiting for {run_id}')
          jobs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/43238039604/jobs?per_page=100']))['jobs']
          assert len(jobs)==6 and all(j['conclusion']=='success' for j in jobs),[(j['name'],j['conclusion']) for j in jobs]
          arts=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/43238039604/artifacts?per_page=100']))['artifacts']
          expected={f'apd460-native-{variant}-{case}' for variant in ('Developer','Alpha-Testers')
                    for case in ('WallGeometryDeviceTest','SearchContextDeviceTest','SeedHistoryDeviceTest')}
          assert {a['name'] for a in arts}==expected,[(a['name'],a['expired']) for a in arts]
          assert all(not a['expired'] for a in arts)
          PY
          if gh release view apd-460 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'APD460 release already exists. Refusing to overwrite known-good assets.' >&2
            exit 1
          fi
      - name: Download exactly verified and signed original APK artifacts
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh run download 43237859054 --repo "$GITHUB_REPOSITORY" --name apd460-unaccepted-gated-room-candidate --dir candidate460
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('candidate460')
          r=json.loads((p/'receipt.json').read_text())
          assert r['build']==460 and r['source']=='7c6a10e2db7c82f38297f5d5e38a62ceba27c962'
          assert set(r['files'])=={'Developer','Alpha-Testers','Instrumentation'}
          for kind,info in r['files'].items():
            name='APD-Instrumentation-460.apk' if kind=='Instrumentation' else f'APD-{kind}-460.apk'
            f=p/name
            assert f.stat().st_size==info['bytes']
            assert hashlib.sha256(f.read_bytes()).hexdigest()==info['sha256'],name
          source=p/'APD-Source-460.zip'
          assert source.is_file() and source.stat().st_size>100000
          print('Verified frozen artifacts for APD460',r['files'])
          PY
      - name: Publish prerelease with direct APK downloads
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh release create apd-460 candidate460/APD-Developer-460.apk candidate460/APD-Alpha-Testers-460.apk candidate460/APD-Source-460.zip \
            --repo "$GITHUB_REPOSITORY" --target 7c6a10e2db7c82f38297f5d5e38a62ceba27c962 \
            --title 'APD460: bounded contextual Search scanning' \
            --notes 'Verified Developer and Alpha-Testers APKs on the same signed APD460 source. Bounds contextual wall-search candidate scanning to the existing class/talent footprint instead of checking a maximum-size square for ordinary heroes. One new regression covers class, acquired Wide Search, Metamorphosis, rounded corners and Foresight. Search geometry, eligibility, turn costs, scoring and saves are unchanged. Previously approved adaptive Search and Copy Seed fixes are preserved. Core/Android compilation and six isolated Android emulator cases must pass before publication. Existing game save compatibility and signer are retained. Physical-phone installation has not been verified.' \
            --prerelease --latest=false
      - name: Read back published APKs and verify exact digests
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p release-readback
          gh release download apd-460 --repo "$GITHUB_REPOSITORY" --dir release-readback
          python3 - <<'PY'
          import hashlib,json,pathlib
          r=json.loads(pathlib.Path('candidate460/receipt.json').read_text())
          for kind in ('Developer','Alpha-Testers'):
            name=f'APD-{kind}-460.apk'
            p=pathlib.Path('release-readback')/name
            assert p.stat().st_size==r['files'][kind]['bytes']
            assert hashlib.sha256(p.read_bytes()).hexdigest()==r['files'][kind]['sha256']
          assert hashlib.sha256(pathlib.Path('release-readback/APD-Source-460.zip').read_bytes()).hexdigest()==hashlib.sha256(pathlib.Path('candidate460/APD-Source-460.zip').read_bytes()).hexdigest()
          print('All three public APD460 release assets verified against frozen originals.')
          PY
