name: Publish verified APD452 Developer and Alpha APKs
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/apd-publish452.yml]
permissions: {contents: write, actions: read}
concurrency: {group: apd452-one-time-publish, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact source build and six successful frozen-APK Android checks
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,time
          repo='APD-Development/ShieldingShouldHaveWorked'
          expectations=[
            (43120545986,'faca42c894c096892a7e21bd8c04107558d786be'),
            (43120608192,'ff9228222af28f56f3ddb112708d186a7bf532b1'),
            (43120676479,'2692b1b61e2578d328dc791445637206e4cdbd91')]
          for run_id,sha in expectations:
            for attempt in range(240):
              r=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}']))
              assert r['head_sha']==sha,(run_id,r['head_sha'],sha)
              if r['status']=='completed':
                assert r['conclusion']=='success',(run_id,r['conclusion'])
                break
              time.sleep(10)
            else: raise RuntimeError(f'Timeout waiting for {run_id}')
          jobs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/43120676479/jobs?per_page=100']))['jobs']
          assert len(jobs)==6 and all(j['conclusion']=='success' for j in jobs),[(j['name'],j['conclusion']) for j in jobs]
          arts=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/43120676479/artifacts?per_page=100']))['artifacts']
          expected={f'apd452-native-{variant}-{case}' for variant in ('Developer','Alpha-Testers')
                    for case in ('WallGeometryDeviceTest','SearchContextDeviceTest','SeedHistoryDeviceTest')}
          assert {a['name'] for a in arts}==expected,[(a['name'],a['expired']) for a in arts]
          assert all(not a['expired'] for a in arts)
          PY
          if gh release view apd-452 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'APD452 release already exists. Refusing to overwrite known-good assets.' >&2
            exit 1
          fi
      - name: Download exactly verified and signed original APK artifacts
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh run download 43120608192 --repo "$GITHUB_REPOSITORY" --name apd452-unaccepted-gated-room-candidate --dir candidate452
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('candidate452')
          r=json.loads((p/'receipt.json').read_text())
          assert r['build']==452 and r['source']=='faca42c894c096892a7e21bd8c04107558d786be'
          assert set(r['files'])=={'Developer','Alpha-Testers','Instrumentation'}
          for kind,info in r['files'].items():
            name='APD-Instrumentation-452.apk' if kind=='Instrumentation' else f'APD-{kind}-452.apk'
            f=p/name
            assert f.stat().st_size==info['bytes']
            assert hashlib.sha256(f.read_bytes()).hexdigest()==info['sha256'],name
          source=p/'APD-Source-452.zip'
          assert source.is_file() and source.stat().st_size>100000
          print('Verified frozen artifacts for APD452',r['files'])
          PY
      - name: Publish prerelease with direct APK downloads
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh release create apd-452 candidate452/APD-Developer-452.apk candidate452/APD-Alpha-Testers-452.apk candidate452/APD-Source-452.zip \
            --repo "$GITHUB_REPOSITORY" --target faca42c894c096892a7e21bd8c04107558d786be \
            --title 'APD452: adaptive Search and APD Copy Seed wording' \
            --notes 'Verified Developer and Alpha-Testers APKs on the same signed APD452 source. Corrects adaptive room-center Search and locked-room marker behavior; updates Copy Seed text to ADHD Pixel Dungeon. Core/Android compilation and six isolated Android emulator cases must pass before publication. Existing game save compatibility and signer are retained. Physical-phone installation has not been verified.' \
            --prerelease --latest=false
      - name: Read back published APKs and verify exact digests
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p release-readback
          gh release download apd-452 --repo "$GITHUB_REPOSITORY" --dir release-readback
          python3 - <<'PY'
          import hashlib,json,pathlib
          r=json.loads(pathlib.Path('candidate452/receipt.json').read_text())
          for kind in ('Developer','Alpha-Testers'):
            name=f'APD-{kind}-452.apk'
            p=pathlib.Path('release-readback')/name
            assert p.stat().st_size==r['files'][kind]['bytes']
            assert hashlib.sha256(p.read_bytes()).hexdigest()==r['files'][kind]['sha256']
          assert hashlib.sha256(pathlib.Path('release-readback/APD-Source-452.zip').read_bytes()).hexdigest()==hashlib.sha256(pathlib.Path('candidate452/APD-Source-452.zip').read_bytes()).hexdigest()
          print('All three public APD452 release assets verified against frozen originals.')
          PY
