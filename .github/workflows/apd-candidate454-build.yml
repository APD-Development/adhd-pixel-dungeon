name: Build APD454 real seed-reuse scoring candidate
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/apd-candidate454-build.yml]
permissions: {contents: read, actions: read}
concurrency: {group: apd454-single-candidate, cancel-in-progress: false}
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Require exact final gated-room source verification
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess,time
          source='59724091fc3c7cb40d849c646b25e8af26433efb'
          for attempt in range(100):
              run=json.loads(subprocess.check_output(['gh','api',
                  'repos/APD-Development/ShieldingShouldHaveWorked/actions/runs/43127122366']))
              assert run['head_sha']==source
              if run['status']=='completed':
                  assert run['conclusion']=='success', 'Final wall-marker source verification failed'
                  break
              time.sleep(10)
          else: raise RuntimeError('Source verification not complete')
          subprocess.run(['git','merge-base','--is-ancestor',source,'HEAD'],check=True)
          changes=subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines()
          assert changes==['.github/workflows/apd-candidate454-build.yml'],changes
          subprocess.run(['git','checkout','--detach',source],check=True)
          PY
      - name: Assemble original-signer Developer and Alpha-Testers candidate pair
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          mkdir -p candidate454
          ./gradlew :android:assembleDebug :android:assembleDebugAndroidTest -PapdTestBuild -PapdBuild=C454
          cp android/build/outputs/apk/debug/android-debug.apk candidate454/APD-Developer-454.apk
          cp android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk candidate454/APD-Instrumentation-454.apk
          ./gradlew :android:assembleDebug -PapdBuild=P454
          cp android/build/outputs/apk/debug/android-debug.apk candidate454/APD-Alpha-Testers-454.apk
          test -s candidate454/APD-Developer-454.apk
          test -s candidate454/APD-Alpha-Testers-454.apk
          test -s candidate454/APD-Instrumentation-454.apk
      - name: Require exact signer, package and variant identities
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          tools=sorted((pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools').glob('*/apksigner'))[-1].parent
          expected='067688b3ab6bd5820a67f4c1ba7d5859db578173771cf31d3252b3e4e012246e'
          files={}
          for variant in ('Developer','Alpha-Testers'):
              path=pathlib.Path('candidate454')/f'APD-{variant}-454.apk'
              output=subprocess.check_output([str(tools/'apksigner'),'verify','--print-certs',str(path)],text=True)
              match=re.search(r'SHA-256 digest:\s*([0-9a-fA-F:]+)',output)
              assert match,output
              cert=match.group(1).replace(':','').lower()
              assert cert==expected,(variant,cert)
              badging=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(path)],text=True)
              package=next(line for line in badging.splitlines() if line.startswith('package:'))
              assert "name='com.charltonchris29.adhdpixeldungeon.indev'" in package
              assert "versionCode='920'" in package
              assert ('-bC454-TEST' if variant=='Developer' else '-bP454') in package
              files[variant]={'bytes':path.stat().st_size,'sha256':hashlib.sha256(path.read_bytes()).hexdigest(),'package':package}
          instrument=pathlib.Path('candidate454/APD-Instrumentation-454.apk')
          files['Instrumentation']={'bytes':instrument.stat().st_size,'sha256':hashlib.sha256(instrument.read_bytes()).hexdigest()}
          pathlib.Path('candidate454/receipt.json').write_text(json.dumps({'build':454,'source':'59724091fc3c7cb40d849c646b25e8af26433efb','status':'candidate_unaccepted','physical_phone_tested':False,'native_accepted':False,'files':files},indent=2)+'\n')
          PY
      - name: Preserve candidate source and hashes
        run: |
          git archive --format=zip --output=candidate454/APD-Source-454.zip HEAD
          sha256sum candidate454/*.apk candidate454/APD-Source-454.zip > candidate454/sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: apd454-unaccepted-gated-room-candidate
          path: candidate454/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: apd454-build-failure-evidence
          path: candidate454/
          if-no-files-found: warn
          retention-days: 30
