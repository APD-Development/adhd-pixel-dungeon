name: Measure real audio endpoint queue timings on existing379
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-AUDIO-ENDPOINT-REQUEST.txt]
permissions: {contents: read, actions: read}
concurrency: {group: apd-audio-endpoint379, cancel-in-progress: false}
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with: {name: apd379-built-pair, run-id: 42526945257, github-token: '${{ github.token }}', path: existing379}
      - name: Compile new instrumentation only; preserve original application bytes
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          sha256sum existing379/owner-delivery/APD-Developer-379.apk > application-before.sha256
          ./gradlew :android:assembleDebugAndroidTest -PapdTestBuild -PapdBuild=C379
          test ! -f android/build/outputs/apk/debug/android-debug.apk
          mkdir -p audio-endpoint-evidence
          cp android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk audio-endpoint-evidence/instrumentation.apk
          ./gradlew --stop
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader -feature -Vulkan -no-boot-anim -camera-back none -skin 320x640
          script: |
            adb logcat -c
            adb logcat -v time > audio-endpoint-evidence/logcat.txt &
            adb install -r existing379/owner-delivery/APD-Developer-379.apk
            adb install -r audio-endpoint-evidence/instrumentation.apk
            timeout 420 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.AudioEndpointLatencyDeviceTest com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > audio-endpoint-evidence/audio.txt
            cat audio-endpoint-evidence/audio.txt
            adb exec-out run-as com.charltonchris29.adhdpixeldungeon.indev cat files/audio-real-endpoint.json > audio-endpoint-evidence/audio-real-endpoint.json
            python3 tools/apd_check_single_instrumentation.py audio-endpoint-evidence/audio.txt realEndpointTimingsForSewersPrisonAndTenguEffectMixes com.shatteredpixel.shatteredpixeldungeon.android.AudioEndpointLatencyDeviceTest
            sha256sum -c application-before.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: apd379-audio-endpoint-evidence, path: audio-endpoint-evidence/, retention-days: 14}
