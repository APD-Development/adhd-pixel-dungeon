name: Verify bounded Rogue talent descriptions and preserve tested source
on:
  push:
    branches: [codex/apd-rogue-text-20261110]
    paths:
      - .github/workflows/apd-rogue-text-source.yml
permissions: {contents: write}
concurrency: {group: apd-rogue-text-source, cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare SDK and preserve the actual failing regression
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          mkdir -p evidence/rogue-red
          set +e
          ./gradlew :core:test --tests '*RogueTalentDescriptionTest' > evidence/rogue-red/run.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          cp core/build/test-results/test/TEST-*.xml evidence/rogue-red/
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as E
          files=list(pathlib.Path('evidence/rogue-red').glob('TEST-*.xml'))
          assert len(files)==1,files
          root=E.parse(files[0]).getroot()
          assert root.attrib['tests']=='4' and root.attrib['failures']=='3' and root.attrib['errors']=='0' and root.attrib['skipped']=='0',root.attrib
          expected={'cachedRationsNormalTextQualifiesHealingAndRunWideLimit','foresightNormalTextStatesEligibilityAndStableRoll','bothRankDetailsRemainConciseWithoutDroppingConditions'}
          failed={t.attrib['name'] for t in root.findall('testcase') if t.find('failure') is not None}
          assert failed==expected,failed
          for failure in root.findall('testcase/failure'): assert failure.attrib['type']=='java.lang.AssertionError',failure.attrib
          print('Confirmed exactly three intended description failures; read-only control passed.')
          PY
      - name: Apply only the hash-pinned presentation corrections
        run: |
          python3 tools/apd_review_rogue_text_20261110.py
          git diff --check
          python3 - <<'PY'
          import subprocess,json,pathlib
          receipt=json.loads(pathlib.Path('rogue-text-patch.json').read_text())
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert sorted(changed)==sorted(receipt['files']),changed
          PY
      - name: Full core suite and Android plus desktop compilation
        run: |
          set -o pipefail
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac 2>&1 | tee evidence/rogue-green.log
      - name: Validate exact results and commit only tested changes
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as E,json,hashlib,os,zipfile,subprocess
          roots=[E.parse(p).getroot() for p in pathlib.Path('core/build/test-results/test').glob('TEST-*.xml')]
          totals={k:sum(int(r.get(k,0)) for r in roots) for k in ['tests','failures','errors','skipped']}
          assert len(roots)==458 and totals=={'tests':3169,'failures':0,'errors':0,'skipped':0},(len(roots),totals)
          patch=json.loads(pathlib.Path('rogue-text-patch.json').read_text())
          for name,pin in patch['files'].items(): assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==pin['after_sha256'],name
          report={'workflow_run':os.environ['GITHUB_RUN_ID'],'input_commit':os.environ['GITHUB_SHA'],'tests':totals,'suites':len(roots),'intended_red_failures':3,'required_compilation':'Android debug/release/instrumentation and desktop passed','patch':patch,'apk_assembled':False,'native_executed':False,'physical_phone_tested':False,'whole_talent_audit_complete':False}
          pathlib.Path('docs/APD-ROGUE-TALENT-SOURCE-2026-11-10.json').write_text(json.dumps(report,indent=2)+'\n')
          with zipfile.ZipFile('docs/evidence/APD-20261110-rogue-description-red.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(pathlib.Path('evidence/rogue-red').glob('*')):z.write(p,p.name)
          audit_path=pathlib.Path('docs/APD-PLAYER-DESCRIPTION-AUDIT.json')
          audit=json.loads(audit_path.read_text())
          for entry in audit['entries']:
              if entry['source'].endswith('/TalentExplanation.java') or entry['source'].endswith('/actors/hero/Talent.java'):
                  entry['sha256']=hashlib.sha256(pathlib.Path(entry['source']).read_bytes()).hexdigest()
                  entry['review_notes']+=' November10 resumed follow-up: Cached Rations normal text now qualifies base healing, disabled healing, run-wide ration limits and already-generated floors. Rogue Foresight normal text now states regular main-branch/secret-feeling thresholds and fixed floor roll. Both existing details shortened; three original wording regressions reproduced before correction; full3169core/458 and required compilations passed. Two existing native-window cases extended but not yet executed. Overall talent review remains partial; handlers, saves and balance unchanged.'
          audit_path.write_text(json.dumps(audit,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
          git config user.name 'APD verified source workflow'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/src/main/assets/messages/actors/actors.properties core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/mechanics/TalentExplanation.java android/src/androidTest/java/com/shatteredpixel/shatteredpixeldungeon/android/QolItemFeedbackDeviceTest.java docs/APD-PLAYER-DESCRIPTION-AUDIT.json docs/APD-ROGUE-TALENT-SOURCE-2026-11-10.json docs/evidence/APD-20261110-rogue-description-red.zip
          git diff --cached --check
          git commit -m 'Fix Rogue talent descriptions after reproduced regressions and complete source verification'
          git push origin HEAD:refs/heads/codex/apd-rogue-text-20261110
          git rev-parse HEAD | tee evidence/verified-source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-rogue-talent-source-evidence
          path: |
            evidence/
            core/build/test-results/test/
            rogue-text-patch.json
            docs/APD-ROGUE-TALENT-SOURCE-2026-11-10.json
          retention-days: 30
