name: Build and verify APD423 Endure and Soul Mark display fixes and clearer descriptions pair for private owner delivery
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-423-BUILD-REQUEST.txt]
permissions: {contents: read, actions: read}
concurrency: {group: apd423-preparation, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Preserve fallback and embed complete existing history
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          python3 tools/apd_owner_delivery_policy.py
          python3 - <<'PY'
          import json,subprocess,pathlib,sys
          sys.path.insert(0,'tools')
          from apd_build_history import merge_previous_apk,embed
          repo='APD-Development/ShieldingShouldHaveWorked'
          api=lambda p:json.loads(subprocess.check_output(['gh','api',p]))
          assert api('repos/'+repo)['private']
          pathlib.Path('evidence').mkdir();pathlib.Path('fallback').mkdir()
          for number,run,artifact_id,artifact_digest in [(422,42660866454,13695376157,'1afa74eedb3248cdd9fcade1f40345bf5af7237dded9d2c635e6341d3188ff61'),(421,42656324353,13692341853,'fb7418c40bdba19654cd214ef3509dc8516b8e004a2aa216f9ac6dbdf2bc143a')]:
            artifact=api('repos/'+repo+'/actions/artifacts/'+str(artifact_id));assert artifact['name']==f'apd{number}-built-pair' and artifact.get('digest')=='sha256:'+artifact_digest;assert artifact['workflow_run']['id']==run
            pathlib.Path(f'evidence/previous-compiled{number}-artifact.json').write_text(json.dumps(artifact,indent=2))
            destination=pathlib.Path('fallback')/str(number)
            subprocess.run(['gh','run','download',str(run),'--repo',repo,'--name',f'apd{number}-built-pair','--dir',str(destination)],check=True)
            matches=list(destination.rglob(f'APD-Developer-{number}.apk'));assert len(matches)==1
            if number==421:assert __import__('hashlib').sha256(matches[0].read_bytes()).hexdigest()=='adf6f2dc95e1c909c0b5773c81f32e4311026c8603e9d996bd062ff3706a85cb'
            pathlib.Path(f'evidence/previous-compiled{number}-apk-sha256.txt').write_text(__import__('hashlib').sha256(matches[0].read_bytes()).hexdigest())
            merge_previous_apk(pathlib.Path.cwd(),matches[0],f'Codex TEST {number}')
          expected_paths=[".github/workflows/apd-prepare423.yml", ".github/workflows/apd-qol-source-check.yml", ".github/workflows/apd-stage421.yml", "android/src/androidTest/java/com/shatteredpixel/shatteredpixeldungeon/android/QolItemFeedbackDeviceTest.java", "core/src/main/assets/messages/actors/actors.properties", "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/mechanics/AbilityExplanation.java", "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/mechanics/BuffExplanation.java", "core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/mechanics/TalentExplanation.java", "core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/MechanicsExplanationTest.java", "docs/APD-420-MANUAL-REVIEW-HOLD.json", "docs/APD-421-INDEPENDENT-HOLD-REVIEW.json", "docs/APD-421-STAGE-REQUEST.json", "docs/APD-423-BUILD-REQUEST.txt", "docs/APD-CURRENT-STATE-2026-11-09.json", "docs/APD-PLAYER-DESCRIPTION-AUDIT.json", "docs/APD-QOL-SOURCE-VERIFY-REQUEST.txt", "docs/evidence/APD-420-manual-display-rejection.zip", "docs/evidence/APD-422-endure-soulmark-negative-effects-accepted.zip", "docs/evidence/APD-422-soulmark-fixture-red.zip", "docs/evidence/APD-423-shared-talents-accepted.zip", "tools/apd_prepare423.py"]
          actual_paths=subprocess.check_output(['git','diff','--name-only','5e2908ff05852863c06c9d402d08231c97bef8c0','HEAD'],text=True).splitlines();assert actual_paths==expected_paths,(actual_paths,expected_paths)
          generated=['core/src/main/assets/apd/history/index.tsv']+[f'core/src/main/assets/apd/history/codex-test-{n}.tsv' for n in (420,421,422,423)]
          ledger={'date':'2026-11-09','changes':[{'category':'Bug Fixes','sprite':'ICON_PREFS','title':'clearer equipment and status descriptions','text':'Endure shows its stored damage and remaining hits without conflicting future talent calculations. Soul Mark shows its remaining duration correctly. Doom, Corruption, Degrade and Shared talent descriptions are clearer and keep their existing mechanics. All earlier compiled history is preserved, including held builds.','paths':expected_paths+generated}]}
          embed(pathlib.Path.cwd(),ledger,423)
          index=pathlib.Path('core/src/main/assets/apd/history/index.tsv').read_text().splitlines();assert index[0].split('\t')[1]=='Codex TEST 423'
          for number in (420,421,422):assert any(line.split('\t')[1]==f'Codex TEST {number}' for line in index if len(line.split('\t'))==4)
          PY
      - name: Full core and required compilation; build exactly one pair
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          mkdir -p owner-delivery
          ./gradlew :core:test :desktop:classes :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac -PapdTestBuild -PapdBuild=C423
          ./gradlew :android:assembleDebug :android:assembleDebugAndroidTest -PapdTestBuild -PapdBuild=C423
          cp android/build/outputs/apk/debug/android-debug.apk owner-delivery/APD-Developer-423.apk
          cp android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk evidence/instrumentation.apk
          ./gradlew :android:assembleDebug -PapdBuild=P423
          cp android/build/outputs/apk/debug/android-debug.apk owner-delivery/APD-Alpha-Testers-423.apk
          python3 tools/check_android_json_abi.py
          ./gradlew --stop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd423-built-pair
          path: |
            owner-delivery/
            android/build/outputs/apk/
            evidence/
            core/build/test-results/test/
          retention-days: 14
  native:
    needs: build
    strategy:
      fail-fast: false
      matrix: {variant: [Developer, Alpha-Testers]}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: apd423-built-pair}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify actual APK without rebuilding
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none -skin 320x640
          script: |
            adb logcat -c
            adb logcat -v time > evidence/${{ matrix.variant }}-native-logcat.txt &
            adb install -r owner-delivery/APD-${{ matrix.variant }}-423.apk
            adb install -r evidence/instrumentation.apk
            if test '${{ matrix.variant }}' = Developer; then echo developer > case-label.txt; else echo alpha > case-label.txt; fi
            timeout 900 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.QolItemFeedbackDeviceTest com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/$(cat case-label.txt)-qol.txt
            python3 tools/apd_check_single_instrumentation.py evidence/$(cat case-label.txt)-qol.txt grassDewControlsRingBreakdownsSearchedWallAndOfflineLicenseRenderNatively com.shatteredpixel.shatteredpixeldungeon.android.QolItemFeedbackDeviceTest
            adb pull /sdcard/Pictures/APD-Test-Visuals/. evidence/${{ matrix.variant }}-visuals/
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 240 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.WallGeometryDeviceTest com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/$(cat case-label.txt)-wall.txt
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 180 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.TrapDiscoveryDeviceTest#a_controlWritesEnabledPreference com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/$(cat case-label.txt)-seed.txt
            python3 tools/apd_check_single_instrumentation.py evidence/$(cat case-label.txt)-seed.txt a_controlWritesEnabledPreference
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 180 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.TrapDiscoveryDeviceTest#b_freshProcessReadsEnabledAndCanDisable com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/$(cat case-label.txt)-restart.txt
            python3 tools/apd_check_single_instrumentation.py evidence/$(cat case-label.txt)-restart.txt b_freshProcessReadsEnabledAndCanDisable
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 180 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.TrapDiscoveryDeviceTest#c_runtimeDiscoveryRouteAndActualTrapEffect com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/$(cat case-label.txt)-gameplay.txt
            python3 tools/apd_check_single_instrumentation.py evidence/$(cat case-label.txt)-gameplay.txt c_runtimeDiscoveryRouteAndActualTrapEffect
            adb shell am force-stop com.charltonchris29.adhdpixeldungeon.indev
            timeout 240 adb shell am instrument -w -r -e class com.shatteredpixel.shatteredpixeldungeon.android.RemovedActorStallDeviceTest com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > evidence/$(cat case-label.txt)-freeze.txt
            python3 tools/apd_check_single_instrumentation.py evidence/$(cat case-label.txt)-freeze.txt cancelledGhoulAttackReleasesQueueButLiveAttackStaysPending com.shatteredpixel.shatteredpixeldungeon.android.RemovedActorStallDeviceTest
            adb pull /sdcard/Pictures/APD-Test-Visuals/. evidence/${{ matrix.variant }}-visuals/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd423-native-${{ matrix.variant }}
          path: evidence/
          retention-days: 14
  prepare:
    needs: [build, native]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: apd423-built-pair}
      - uses: actions/download-artifact@v4
        with: {name: apd423-native-Developer, path: evidence}
      - uses: actions/download-artifact@v4
        with: {name: apd423-native-Alpha-Testers, path: evidence}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Verify exact identities, completed tests and corresponding source
        env: {GH_TOKEN: '${{ github.token }}'}
        run: python3 tools/apd_prepare423.py
      - name: Scan key-free source and full reachable history
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          if ! curl --connect-timeout 20 -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/apd-gitleaks.tar.gz; then
            gh api repos/gitleaks/gitleaks/releases/assets/378332058 -H 'Accept: application/octet-stream' > /tmp/apd-gitleaks.tar.gz
          fi
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/apd-gitleaks.tar.gz' | sha256sum -c -
          mkdir /tmp/apd-gitleaks
          tar -xzf /tmp/apd-gitleaks.tar.gz -C /tmp/apd-gitleaks
          python3 tools/apd_qol_source_scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd423-prepared-owner-pair
          path: owner-delivery/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd423-source-and-native-evidence
          path: |
            evidence/
            core/build/test-results/test/
            docs/APD-423-DELIVERY-SPEC.json
          retention-days: 14
