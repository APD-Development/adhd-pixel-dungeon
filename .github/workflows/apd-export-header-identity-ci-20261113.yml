name: APD exporter header filename identity source gate
on:
  push:
    branches: [chatgpt/apd-export-header-identity-20261113-0203]
    paths:
      - .github/workflows/apd-export-header-identity-ci-20261113.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveExporter.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveExporterHeaderIdentityTest.java
permissions: {contents: read}
concurrency:
  group: apd-export-header-identity-20261113
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the exact exporter guard and regression suite
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveExporter.java').read_text()
          tests=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveExporterHeaderIdentityTest.java').read_text()
          assert 'r.header != null && (imported || id.equals(r.header.runId))' in src
          for method in (
              'copiedLogWithWrongFilenameIsExcludedAndValidNeighborsRoundTrip',
              'onlyCopiedLogIsSafelySkippedWithoutLeakingItsBytes',
              'distinctSegmentFileIdsAndSharedLogicalRunRemainImportable',
              'existingLegacyImportsRemainUnchanged',
          ):
              assert 'void '+method+'(' in tests, method
          print('Exporter header filename check and four bounded regressions present')
          PY
      - name: Complete core JUnit and desktop and Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Verify full exact-source JUnit XML and regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'missing JUnit XML'
          totals={k:sum(int(x.get(k,0)) for x in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3394, totals
          assert all(totals[k] == 0 for k in ('failures','errors','skipped')), totals
          cases={c.get('name') for r in reports for c in r.findall('testcase')}
          for method in (
              'copiedLogWithWrongFilenameIsExcludedAndValidNeighborsRoundTrip',
              'onlyCopiedLogIsSafelySkippedWithoutLeakingItsBytes',
              'distinctSegmentFileIdsAndSharedLogicalRunRemainImportable',
              'existingLegacyImportsRemainUnchanged',
          ):
              assert method in cases, method
          print('Complete core JUnit results:', totals, 'suites:', len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-export-header-identity-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
