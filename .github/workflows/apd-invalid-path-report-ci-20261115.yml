name: APD invalid archive path report boundary source verification
on:
  push:
    branches: [chatgpt/apd-invalid-path-report-bound-20261115-1800]
    paths:
      - .github/workflows/apd-invalid-path-report-ci-20261115.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporter.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveInvalidPathDiagnosticTest.java
permissions: {contents: read}
concurrency:
  group: apd-invalid-path-report-bound-20261115
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Assert narrow refusal change and independent regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporter.java').read_text()
          tests = Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveInvalidPathDiagnosticTest.java').read_text()
          assert 'MAX_INVALID_PATH_DETAIL_CHARS = 160' in source
          assert 'e.path.substring(0, MAX_INVALID_PATH_DETAIL_CHARS) + "... (truncated)"' in source
          for name in ('shortInvalidPathKeepsExactExistingRefusal',
                       'checksummedLongInvalidPathHasBoundedMarkedRefusal',
                       'rejectedLongPathZipPreservesExistingHistoryBytes'):
              assert 'void ' + name + '(' in tests, name
          print('Narrow bound and three path-specific regressions present')
          PY
      - name: Complete core suite and required desktop/Android Java compilations
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require terminal passing JUnit evidence and history compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'No JUnit results'
          totals={k:sum(int(r.get(k, 0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3510, totals
          assert all(totals[k] == 0 for k in ('failures','errors','skipped')), totals
          names={c.get('name') for r in reports for c in r.findall('testcase')}
          for name in ('shortInvalidPathKeepsExactExistingRefusal',
                       'checksummedLongInvalidPathHasBoundedMarkedRefusal',
                       'rejectedLongPathZipPreservesExistingHistoryBytes',
                       'hugeMalformedManifestInRealZipIsRejectedWithoutHistoryChanges',
                       'negativeContainerInRealZipRefusesImportWithoutTouchingExistingHistory',
                       'repeatedManifestPathKeepsFirstMatchAndNeverOverwritesHistory'):
              assert name in names, name
          print('JUnit terminal results:', totals, 'suites:', len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-invalid-path-diagnostic-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
