name: Publish verified APD455 Developer and Alpha APKs
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/apd-publish455.yml]
permissions: {contents: write, actions: read}
concurrency: {group: apd455-one-time-publish, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact source build and six successful frozen-APK Android checks
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,time
          repo='APD-Development/ShieldingShouldHaveWorked'
          expectations=[
            (43128338460,'1c18cfb066408aee88ff842c95388b7a6dc32766'),
            (43128504573,'5f3be7877e117ae4e688929340cf3a21c2a630a5'),
            (43128563962,'4588772e4fb9c1abe5072053514f77a5ca56f551')]
          for run_id,sha in expectations:
            for attempt in range(240):
              r=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}']))
              assert r['head_sha']==sha,(run_id,r['head_sha'],sha)
              if r['status']=='completed':
                assert r['conclusion']=='success',(run_id,r['conclusion'])
                break
              time.sleep(10)
            else: raise RuntimeError(f'Timeout waiting for {run_id}')
          jobs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/43128563962/jobs?per_page=100']))['jobs']
          assert len(jobs)==6 and all(j['conclusion']=='success' for j in jobs),[(j['name'],j['conclusion']) for j in jobs]
          arts=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/43128563962/artifacts?per_page=100']))['artifacts']
          expected={f'apd455-native-{variant}-{case}' for variant in ('Developer','Alpha-Testers')
                    for case in ('WallGeometryDeviceTest','SearchContextDeviceTest','SeedHistoryDeviceTest')}
          assert {a['name'] for a in arts}==expected,[(a['name'],a['expired']) for a in arts]
          assert all(not a['expired'] for a in arts)
          PY
          if gh release view apd-455 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'APD455 release already exists. Refusing to overwrite known-good assets.' >&2
            exit 1
          fi
      - name: Download exactly verified and signed original APK artifacts
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh run download 43128504573 --repo "$GITHUB_REPOSITORY" --name apd455-unaccepted-gated-room-candidate --dir candidate455
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('candidate455')
          r=json.loads((p/'receipt.json').read_text())
          assert r['build']==455 and r['source']=='1c18cfb066408aee88ff842c95388b7a6dc32766'
          assert set(r['files'])=={'Developer','Alpha-Testers','Instrumentation'}
          for kind,info in r['files'].items():
            name='APD-Instrumentation-455.apk' if kind=='Instrumentation' else f'APD-{kind}-455.apk'
            f=p/name
            assert f.stat().st_size==info['bytes']
            assert hashlib.sha256(f.read_bytes()).hexdigest()==info['sha256'],name
          source=p/'APD-Source-455.zip'
          assert source.is_file() and source.stat().st_size>100000
          print('Verified frozen artifacts for APD455',r['files'])
          PY
      - name: Publish prerelease with direct APK downloads
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh release create apd-455 candidate455/APD-Developer-455.apk candidate455/APD-Alpha-Testers-455.apk candidate455/APD-Source-455.zip \
            --repo "$GITHUB_REPOSITORY" --target 1c18cfb066408aee88ff842c95388b7a6dc32766 \
            --title 'APD455: seed-reuse scoring and history consistency' \
            --notes 'Verified Developer and Alpha-Testers APKs on the same signed APD455 source. Retains implemented seed-reuse deductions and Score Breakdown totals, verifies the active run is not counted among its own prior attempts, and avoids showing historical-seed notices on ordinary/daily score screens. Previously approved adaptive Search and Copy Seed fixes are preserved. Core/Android compilation and six isolated Android emulator cases must pass before publication. Existing game save compatibility and signer are retained. Physical-phone installation has not been verified.' \
            --prerelease --latest=false
      - name: Read back published APKs and verify exact digests
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p release-readback
          gh release download apd-455 --repo "$GITHUB_REPOSITORY" --dir release-readback
          python3 - <<'PY'
          import hashlib,json,pathlib
          r=json.loads(pathlib.Path('candidate455/receipt.json').read_text())
          for kind in ('Developer','Alpha-Testers'):
            name=f'APD-{kind}-455.apk'
            p=pathlib.Path('release-readback')/name
            assert p.stat().st_size==r['files'][kind]['bytes']
            assert hashlib.sha256(p.read_bytes()).hexdigest()==r['files'][kind]['sha256']
          assert hashlib.sha256(pathlib.Path('release-readback/APD-Source-455.zip').read_bytes()).hexdigest()==hashlib.sha256(pathlib.Path('candidate455/APD-Source-455.zip').read_bytes()).hexdigest()
          print('All three public APD455 release assets verified against frozen originals.')
          PY
