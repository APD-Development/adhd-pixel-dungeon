name: APD adaptive wall search rules + LoS throw aim
on:
  push:
    branches: [fix/apd-adaptive-wall-search-rules-20261115]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Setup Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Core tests and Android compile
        run: ./gradlew :core:test :android:compileDebugJavaWithJavac
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: core-test-reports, path: core/build/reports/tests/test}
