name: APD Community server deploy
# Deploys server/community to Cloudflare after its tests pass. Needs the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets (Chris adds them). The D1 database is found by name, or created on the first deploy.
# Without the secrets it stops after the tests and says so. It runs only when the deploy/community-server branch is
# pushed (manual dispatch needs the workflow on main, which this project never touches): nothing deploys by itself.
on:
  push:
    branches: [deploy/community-server]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/community
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Check deploy settings
        id: ready
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN secret yet: tests passed, nothing deployed."; echo "go=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "go=yes" >> "$GITHUB_OUTPUT"
      - name: Find or create the D1 database (no id to paste by hand)
        if: steps.ready.outputs.go == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ID=$(npx --yes wrangler@4 d1 list --json | python3 -c "import json,sys; d=[x for x in json.load(sys.stdin) if x.get('name')=='apd-community']; print(d[0]['uuid'] if d else '')")
          if [ -z "$ID" ]; then
            npx --yes wrangler@4 d1 create apd-community
            ID=$(npx --yes wrangler@4 d1 list --json | python3 -c "import json,sys; d=[x for x in json.load(sys.stdin) if x.get('name')=='apd-community']; print(d[0]['uuid'])")
          fi
          echo "D1 database apd-community: $ID"
          sed -i "s/SET-AFTER-CREATING-THE-D1-DATABASE/$ID/" wrangler.toml
      - name: Apply database migrations
        if: steps.ready.outputs.go == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply apd-community --remote
      - name: Deploy
        if: steps.ready.outputs.go == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
