name: APD negative archive container source verification
on:
  push:
    branches: [chatgpt/apd-negative-container-20261115-1600]
    paths:
      - .github/workflows/apd-negative-container-ci-20261115.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifest.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifestNegativeContainerTest.java
permissions: {contents: read}
concurrency:
  group: apd-negative-container-20261115
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Require negative-container guard and real archive regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifest.java').read_text()
          tests = Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifestNegativeContainerTest.java').read_text()
          assert 'if (m.container < 0)' in source
          for test in ('checksumValidNegativeContainerVersionsAreRejectedButZeroAndOneRemainValid',
                       'negativeContainerInRealZipRefusesImportWithoutTouchingExistingHistory'):
              assert 'void ' + test + '(' in tests, test
          print('Negative container guard and both regressions present')
          PY
      - name: Run full core suite and desktop/Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require no JUnit failures and retained archive compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'No JUnit reports'
          totals={key:sum(int(r.get(key, 0)) for r in reports) for key in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3504, totals
          assert all(totals[key] == 0 for key in ('failures','errors','skipped')), totals
          cases={c.get('name') for r in reports for c in r.findall('testcase')}
          for name in ('checksumValidNegativeContainerVersionsAreRejectedButZeroAndOneRemainValid',
                       'negativeContainerInRealZipRefusesImportWithoutTouchingExistingHistory',
                       'missingContainerIsRejectedWithCorrectChecksumForEmptyAndNonemptyManifests',
                       'optionalScalarOmissionsAndUnknownChecksummedExtensionRemainSupported',
                       'currentFormatAndEmptyManifestRemainValid',
                       'repeatedManifestPathKeepsFirstMatchAndNeverOverwritesHistory'):
              assert name in cases, name
          print('Core JUnit:', totals, 'suites', len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-negative-container-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
