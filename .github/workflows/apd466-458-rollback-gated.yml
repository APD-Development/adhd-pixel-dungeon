name: APD466 APD458 original playback five 1x exceptions signed paired release
on:
  push:
    branches: [chatgpt/apd458-original-speed-five-exceptions-20261113]
    paths: [.github/workflows/apd466-458-rollback-gated.yml]
permissions: {contents: write, actions: read}
concurrency: {group: apd466-exact-candidate-and-delivery, cancel-in-progress: false}
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Prove APD458 gameplay playback with only owner five 1x exceptions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon')
          scene=(root/'scenes/GameScene.java').read_text()
          group=(root/'apd/PlaybackGroup.java').read_text()
          water=(root/'actors/blobs/WaterOfHealth.java').read_text()
          cell=(root/'effects/CellEmitter.java').read_text()
          for name in ('statuses','emoicons','gases'):
              assert name+' = com.shatteredpixel.shatteredpixeldungeon.apd.PlaybackGroup.normalSpeedGroup();' in scene,name
          for name in ('terrain','ripples','customTiles','customTerrain','floorEmitters','heaps','emitters','effects','healthIndicators','overFogEffects','mobs','customWalls','spells','checkedCells','targetedCells'):
              assert name+' = new com.shatteredpixel.shatteredpixeldungeon.apd.PlaybackGroup();' in scene,name
          assert 'return new Group();' in group
          assert 'public static synchronized Emitter wellEmitter()' in scene
          assert 'Emitter emitter = GameScene.wellEmitter();' in cell
          assert water.count('CellEmitter.well(')==4
          assert 'healingEffect = GameScene.wellEmitter()' in water
          assert 'import com.shatteredpixel.shatteredpixeldungeon.scenes.GameScene;' in water
          assert 'personalSpeedGroup' not in group
          print('Original APD458 playback retained except 1x statuses, notice icons, both wells and gas')
          PY
      - name: Run complete core regression suite and compile Android and desktop Java
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require all core tests, hero/enemy frame speed and 1x effects regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          r=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert r,'Missing test reports'
          totals={k:sum(int(x.get(k,0)) for x in r) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3200 and all(totals[k]==0 for k in ('failures','errors','skipped')), totals
          names={c.get('name') for suite in r for c in suite.findall('testcase')}
          for case in ('originalDungeonVisualsRemainSpeededExceptOwnerFiveOriginalCategories','healthWellEmitterUsesUnscaledLayerAndDoesNotTouchGameplay','extremeModesNeverChangeActorClockGlobalTimescaleOrHud','nativeTweensFinishAtExpectedPlaybackDurationAcrossRefreshRates'):
              assert case in names,case
          print('Core suite',totals,'suites',len(r))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd466-core-test-reports
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 30

  candidate:
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build matched signed Developer/Alpha candidates and instrumentation (release Developer only)
        run: |
          set -e
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          mkdir -p candidate466
          ./gradlew :android:assembleDebug :android:assembleDebugAndroidTest -PapdTestBuild -PapdBuild=C466
          cp android/build/outputs/apk/debug/android-debug.apk candidate466/APD-Developer-466.apk
          cp android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk candidate466/APD-Instrumentation-466.apk
          ./gradlew :android:assembleDebug -PapdBuild=P466
          cp android/build/outputs/apk/debug/android-debug.apk candidate466/APD-Alpha-Testers-466.apk
          git archive --format=zip --output=candidate466/APD-Source-466.zip HEAD
      - name: Require original package signer and saved-game version compatibility
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,subprocess
          build=pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools'
          tools=sorted(build.iterdir())[-1]
          while not (tools/'apksigner').exists(): tools=sorted(p for p in build.iterdir() if (p/'apksigner').exists())[-1];break
          expected='067688b3ab6bd5820a67f4c1ba7d5859db578173771cf31d3252b3e4e012246e'
          files={}
          for variant in ('Developer','Alpha-Testers'):
              f=pathlib.Path('candidate466')/('APD-'+variant+'-466.apk')
              assert f.stat().st_size>1000000
              sign=subprocess.check_output([str(tools/'apksigner'),'verify','--print-certs',str(f)],text=True)
              digest=re.search(r'SHA-256 digest:\s*([0-9a-fA-F:]+)',sign).group(1).replace(':','').lower()
              assert digest==expected,(variant,digest)
              badge=subprocess.check_output([str(tools/'aapt'),'dump','badging',str(f)],text=True)
              pkg=next(line for line in badge.splitlines() if line.startswith('package:'))
              assert "name='com.charltonchris29.adhdpixeldungeon.indev'" in pkg,pkg
              assert "versionCode='920'" in pkg,pkg
              assert ('-bC466-TEST' if variant=='Developer' else '-bP466') in pkg,pkg
              files[variant]={'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'bytes':f.stat().st_size,'package':pkg}
          for name in ('APD-Instrumentation-466.apk','APD-Source-466.zip'):
              f=pathlib.Path('candidate466')/name
              assert f.stat().st_size>100000
              files[name]={'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'bytes':f.stat().st_size}
          receipt={'source':os.environ['GITHUB_SHA'],'build':466,'native_accepted':False,'published':False,'files':files}
          pathlib.Path('candidate466/receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print('Original signing certificate and both identities verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: apd466-frozen-candidate
          path: candidate466/
          if-no-files-found: error
          retention-days: 30

  native:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        variant: [Developer, Alpha-Testers]
        case: [WallGeometryDeviceTest, SearchContextDeviceTest, SeedHistoryDeviceTest]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Obtain only original frozen candidate bytes
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p candidate466
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name apd466-frozen-candidate --dir candidate466
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          d=pathlib.Path('candidate466'); receipt=json.loads((d/'receipt.json').read_text())
          assert receipt['source']==os.environ['GITHUB_SHA'] and receipt['build']==466
          for key,info in receipt['files'].items():
              name='APD-'+key+'-466.apk' if key in ('Developer','Alpha-Testers') else key
              f=d/name
              assert f.stat().st_size==info['bytes'] and hashlib.sha256(f.read_bytes()).hexdigest()==info['sha256']
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test exact original Developer/Alpha APK on Android with native visual receipts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none -skin 320x640
          script: |
            mkdir -p native466
            adb install -r candidate466/APD-${{ matrix.variant }}-466.apk
            adb install -r candidate466/APD-Instrumentation-466.apk
            adb logcat -c
            timeout 1200 adb shell am instrument -w -r -e class 'com.shatteredpixel.shatteredpixeldungeon.android.${{ matrix.case }}' com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > native466/instrumentation.txt 2>&1
            cat native466/instrumentation.txt
            python3 tools/apd466_native_postcheck.py --variant '${{ matrix.variant }}' --case '${{ matrix.case }}' --directory native466 --source "$GITHUB_SHA"
            adb logcat -d -v time > native466/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd466-native-${{ matrix.variant }}-${{ matrix.case }}
          path: native466/
          if-no-files-found: warn
          retention-days: 30

  publish:
    needs: [source, candidate, native]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Require exact six accepted native receipts from this build
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -e
          mkdir -p candidate466 native-receipts
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name apd466-frozen-candidate --dir candidate466
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'apd466-native-*' --dir native-receipts
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          source=os.environ['GITHUB_SHA']
          receipt=json.loads(Path('candidate466/receipt.json').read_text())
          assert receipt['source']==source
          verified=list(Path('native-receipts').rglob('native-verification.json'))
          assert len(verified)==6,len(verified)
          expected={(variant,case) for variant in ('Developer','Alpha-Testers')
                    for case in ('WallGeometryDeviceTest','SearchContextDeviceTest','SeedHistoryDeviceTest')}
          seen=set()
          for p in verified:
              d=json.loads(p.read_text())
              assert d['source']==source and d['build']==466 and d['tests']==1
              assert d['device_transfer_complete'] and d['screenshots']
              seen.add((d['variant'],d['case']))
          assert seen==expected,(seen,expected)
          for key,info in receipt['files'].items():
              name='APD-'+key+'-466.apk' if key in ('Developer','Alpha-Testers') else key
              f=Path('candidate466')/name
              assert f.stat().st_size==info['bytes']
              assert hashlib.sha256(f.read_bytes()).hexdigest()==info['sha256']
          print('Exact frozen source, original signed APKs and six complete native visual test receipts verified')
          PY
          if gh release view apd-466 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing APD466 release" >&2
            exit 1
          fi
      - name: Publish qualified original-signed Developer and Alpha-Testers APKs
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release create apd-466 candidate466/APD-Developer-466.apk candidate466/APD-Alpha-Testers-466.apk candidate466/APD-Source-466.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'APD466: restored original APD458 speed except five 1x visuals' --notes 'Both original-signed editions restore APD458 selected playback speed for all unchanged effects, except floating status symbols, enemy notice alerts, Health and Awareness wells, and toxic gas remain 1x. No personal 58-category overrides and no game-mechanics, save schema, hunger, buff-turn, or score changes. Signed using the original APD identity. Source tests, Android/desktop compilation, original signer/package checks and six frozen APK native visual regressions are required before publishing. Physical RedMagic installation remains unverified.' --prerelease --latest=false
      - name: Read back published assets and check byte-for-byte hashes
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          mkdir -p readback
          gh release download apd-466 --repo "$GITHUB_REPOSITORY" --dir readback
          python3 - <<'PY'
          import hashlib,json,pathlib
          receipt=json.loads(pathlib.Path('candidate466/receipt.json').read_text())
          for key,info in receipt['files'].items():
              if key=='APD-Instrumentation-466.apk':continue
              name='APD-'+key+'-466.apk' if key in ('Developer','Alpha-Testers') else key
              f=pathlib.Path('readback')/name
              assert f.stat().st_size==info['bytes'] and hashlib.sha256(f.read_bytes()).hexdigest()==info['sha256']
          print('Published APKs and corresponding source read back and matched original frozen bytes')
          PY
