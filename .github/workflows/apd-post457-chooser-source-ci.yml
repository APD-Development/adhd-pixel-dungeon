name: Verify APD Search chooser stability after 457
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/apd-post457-chooser-source-ci.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Guard chooser allocation and option order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/SearchControlContext.java')
          source=p.read_text()
          chooser=source.split('public static Action[] choices(',1)[1].split('public static boolean openRoomInterior(',1)[0]
          required=('private static final Action[] CHOICE_ORDER', 'for (Action action : CHOICE_ORDER)',
                    'choices.toArray(new Action[0])', 'Action.SEARCH, Action.WALL_SEARCH, Action.SHOW_SAVED',
                    'Action.RESUME_MOVEMENT, Action.FORGET, Action.CANCEL')
          for value in required: assert value in source, value
          assert 'new Action[]{' not in chooser, 'Repeated chooser array allocation reintroduced'
          test=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/qol/SearchControlContextTest.java').read_text()
          assert 'chooserReturnsFreshOrderAfterCallerChangesItsArrayAndMemoryState' in test
          print('Chooser uses reusable fixed order and returns fresh caller-owned results.')
          PY
      - name: Run complete core tests and compile desktop and Android variants
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require complete passing JUnit coverage including chooser regression
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          roots=[ET.parse(p).getroot() for p in pathlib.Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert roots, 'Missing core JUnit XML reports'
          totals={k:sum(int(r.get(k,0)) for r in roots) for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3263, totals
          assert totals['failures']==totals['errors']==totals['skipped']==0, totals
          matches=[r for r in roots if r.get('name','').endswith('.SearchControlContextTest')]
          assert len(matches)==1, len(matches)
          cases=[x.get('name') for x in matches[0].findall('testcase')]
          assert cases.count('chooserReturnsFreshOrderAfterCallerChangesItsArrayAndMemoryState')==1, cases
          print('Complete core verification',totals,'suites',len(roots))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-post457-chooser-complete-core-results
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
