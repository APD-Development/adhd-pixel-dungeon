name: Verify APD seeded ring deck six-replay regression
on:
  push:
    branches: [chatgpt/apd-seeded-ring-replay-regression-20261112-1400]
    paths: [.github/workflows/apd-seeded-ring-replay-ci-20261112-1400.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify isolated same-seed regression scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/loot/SeededRingDeckConsistencyTest.java')
          code=path.read_text()
          for expected in ('RUN_SEED + 1','Generator.fullReset();','Generator.random(Generator.Category.RING)',
                           'Generator.randomUsingDefaults(Generator.Category.RING)', 'replay < 6', 'first, ringTypes(replay)'):
              assert expected in code, expected
          print('Six run replays and unchanged ring-deck ordinal regression found')
          PY
      - name: Full core regression suite and desktop/Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require complete clean core suite and new test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('core/build/test-results/test').glob('TEST-*.xml'))
          assert files, 'No core reports'
          reports=[ET.parse(p).getroot() for p in files]
          totals={k:sum(int(x.get(k,0)) for x in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3303, totals
          assert totals['failures']==totals['errors']==totals['skipped']==0, totals
          fixtures=[x for x in reports if 'SeededRingDeckConsistencyTest' in x.get('name','')]
          assert len(fixtures)==1 and int(fixtures[0].get('tests',0))==1, 'Missing six-replay regression'
          print(totals, len(reports), 'test suites; seeded ring regression passed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-seeded-ring-deck-test-results
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
