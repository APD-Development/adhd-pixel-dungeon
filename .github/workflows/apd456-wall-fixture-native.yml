name: Verify isolated wall-renderer fixture on frozen APD456
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/apd456-wall-fixture-native.yml]
permissions: {contents: read, actions: read}
jobs:
  wall-renderer:
    strategy:
      fail-fast: false
      matrix:
        variant: [Developer, Alpha-Testers]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Confirm game code is identical to the published APD456 APK
        run: |
          python3 - <<'PY'
          import subprocess
          base='2734fe532e282bc415c47e1d9892fa547386b075'
          paths=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          expected='android/src/androidTest/java/com/shatteredpixel/shatteredpixeldungeon/android/WallGeometryDeviceTest.java'
          assert expected in paths,paths
          assert all(p.startswith(('android/src/androidTest/','.github/workflows/')) or p=='tools/apd456_native_postcheck.py' for p in paths),paths
          print('Game production sources are frozen. Changed files:',paths)
          PY
      - name: Get original signed APKs from the completed public release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p candidate456
          gh release download apd-456 --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --dir candidate456
          echo 'f910c185709e29308a23158fe43b84987fe852ad44bd701312c826a9423faf25  candidate456/APD-Developer-456.apk' | sha256sum -c -
          echo '6f8cd717a68ab67aff4a5a5a6ec7f6727130d1f2b060d252178b7fc9888b5821  candidate456/APD-Alpha-Testers-456.apk' | sha256sum -c -
      - name: Compile new test-only instrumentation, never build a replacement app APK
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :android:assembleDebugAndroidTest -PapdTestBuild -PapdBuild=C456
          test -s android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk
          test ! -e android/build/outputs/apk/debug/android-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run deterministic test against exact frozen APD456 app binary
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none -memory 3072 -skin 320x640
          script: |
            mkdir -p native456
            adb install -r candidate456/APD-${{ matrix.variant }}-456.apk
            adb install -r android/build/outputs/apk/androidTest/debug/android-debug-androidTest.apk
            timeout 1200 adb shell am instrument -w -r -e class 'com.shatteredpixel.shatteredpixeldungeon.android.WallGeometryDeviceTest' com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > native456/instrumentation.txt 2>&1
            cat native456/instrumentation.txt
            python3 tools/apd456_native_postcheck.py --variant '${{ matrix.variant }}' --case WallGeometryDeviceTest --directory native456
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd456-deterministic-wall-fixture-${{ matrix.variant }}
          path: native456/
          if-no-files-found: warn
          retention-days: 30
