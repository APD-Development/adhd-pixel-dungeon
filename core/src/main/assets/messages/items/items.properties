items.potions.potionofexperience.name=potion of experience
items.potions.potionofexperience.desc=Grants enough experience for one level. At the level cap, grants a temporary accuracy and evasion boost instead.

items.potions.potionoffrost.name=potion of frost
items.potions.potionoffrost.desc=Throw to release freezing cold around the impact, freezing creatures and extinguishing fire. Drinking releases it around you instead.

items.potions.potionofhaste.name=potion of haste
items.potions.potionofhaste.energetic=You feel energetic!
items.potions.potionofhaste.desc=Speeds up movement for _%s turns_, letting you escape or close in faster. Does not speed up attacks.

items.potions.potionofhealing.name=potion of healing
items.potions.potionofhealing.heal=Your wounds begin to close.
items.potions.potionofhealing.desc=Gradually restores health and cures ailments, including poison, bleeding and blindness. Repeated doses do not add their healing together.
items.potions.potionofhealing.desc_pharmacophobia=_Pharmacophobia:_ cures existing ailments, then poisons you instead of healing.
items.potions.potionofhealing.desc_disabled_healing=Your current rules disable healing. Still cures ailments, including poison, bleeding and blindness.
items.potions.potionofhealing.enemy_regions=Healing potions collected from enemies by region
items.potions.potionofhealing.enemy_regions_legacy=Earlier pickups in this older save were not recorded; counts below are partial.
items.potions.potionofhealing.enemy_region_0=Sewers
items.potions.potionofhealing.enemy_region_1=Prison
items.potions.potionofhealing.enemy_region_2=Caves
items.potions.potionofhealing.enemy_region_3=Dwarven City
items.potions.potionofhealing.enemy_region_4=Demon Halls

items.potions.potionofinvisibility.name=potion of invisibility
items.potions.potionofinvisibility.invisible=You see your hands turn invisible!
items.potions.potionofinvisibility.desc=Makes you invisible for _%s turns_. Attacking or using magic ends invisibility early.

items.potions.potionoflevitation.name=potion of levitation
items.potions.potionoflevitation.float=You float into the air!
items.potions.potionoflevitation.desc=Floats you over pits and floor traps for _%s turns_. Reach safe ground before it ends. Throwing it releases disorienting gas instead.

items.potions.potionofliquidflame.name=potion of liquid flame
items.potions.potionofliquidflame.desc=Throw to ignite an area, burning creatures and flammable terrain. Drinking releases the fire around you instead.

items.potions.potionofmindvision.name=potion of mind vision
items.potions.potionofmindvision.see_mobs=You can somehow feel the presence of other creatures' minds!
items.potions.potionofmindvision.see_none=You can somehow tell that you are alone on this level at the moment.
items.potions.potionofmindvision.desc=Senses creatures across the floor, even through walls, for _%s turns_. Also lets you see through nearby walls and doors.

items.potions.potionofparalyticgas.name=potion of paralytic gas
items.potions.potionofparalyticgas.desc=Throw to release gas that paralyzes creatures caught in it. Paralysis can linger after the gas clears. Drinking releases the gas around you instead.

items.potions.potionofpurity.name=potion of purity
items.potions.potionofpurity.freshness=You feel uncommon freshness in the air.
items.potions.potionofpurity.protected=A protective film envelops you!
items.potions.potionofpurity.desc=Drinking protects you from harmful clouds, fire and similar environmental hazards for _%s turns_. Throw to clear nearby harmful clouds and flames instead.

items.potions.potionofstrength.name=potion of strength
items.potions.potionofstrength.msg=Newfound strength surges through your body, you now have %d strength!
items.potions.potionofstrength.desc=This powerful liquid will course through your muscles, permanently increasing your strength by one point.

items.potions.potionoftoxicgas.name=potion of toxic gas
items.potions.potionoftoxicgas.desc=Throw to release toxic gas that damages creatures caught in it. Drinking releases the gas around you instead.



###brews
items.potions.brews.brew.discover_hint=You can craft this item via alchemy.

items.potions.brews.aquabrew.name=aqua brew
items.potions.brews.aquabrew.desc=Throw to douse fires, flood suitable ground and wash away traps. Pushes nearby creatures up to _2 tiles_, including you and allies. Fiery creatures also take direct damage.

items.potions.brews.blizzardbrew.name=blizzard brew
items.potions.brews.blizzardbrew.desc=Throw to create a spreading blizzard that repeatedly freezes creatures and extinguishes fire. Can shatter potions lying on the ground.

items.potions.brews.causticbrew.name=caustic brew
items.potions.brews.causticbrew.desc=Throw to coat nearby creatures in corrosive ooze, causing damage over time. Standing in water washes it off early.

items.potions.brews.infernalbrew.name=infernal brew
items.potions.brews.infernalbrew.desc=Throw to create a spreading cloud of fire that burns creatures and destroys flammable terrain.

items.potions.brews.shockingbrew.name=shocking brew
items.potions.brews.shockingbrew.desc=Throw to fill a wide area with electricity that paralyzes and damages creatures. Spreads through water and can harm you and your allies.

items.potions.brews.unstablebrew.name=unstable brew
items.potions.brews.unstablebrew.desc=Drinking applies a random beneficial potion effect. Throwing releases a random area effect, which may be harmful or clear nearby clouds.

###elixirs
items.potions.elixirs.elixir.discover_hint=You can craft this item via alchemy.

items.potions.elixirs.elixirofarcanearmor.name=elixir of arcane armor
items.potions.elixirs.elixirofarcanearmor.desc=Grants extra protection against many magical attacks. The protection gradually weakens.
items.potions.elixirs.elixirofarcanearmor.desc_amount=Initially blocks _0-%d damage_ from many magical attacks. The protection gradually weakens and does not stack.

items.potions.elixirs.elixirofaquaticrejuvenation.name=elixir of aquatic rejuvenation
items.potions.elixirs.elixirofaquaticrejuvenation.desc=Stores healing that gradually restores health while you stand in water. Healing pauses out of water or while flying.
items.potions.elixirs.elixirofaquaticrejuvenation.desc_pharmacophobia=_Pharmacophobia:_ poisons you instead of storing healing.
items.potions.elixirs.elixirofaquaticrejuvenation.desc_disabled_healing=Your current rules prevent this elixir from restoring your health.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.name=aquatic healing
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc=Heals you gradually while you stand in water. Pauses while flying, out of water or at full health.\n\nStored healing: _%d HP_ before run adjustments.
items.potions.elixirs.elixirofaquaticrejuvenation$aquahealing.desc_disabled=Your current rules prevent healing. The reserve is still spent when you are hurt and standing in water.\n\nStored healing: _%d HP_.

items.potions.elixirs.elixirofdragonsblood.name=elixir of dragon's blood
items.potions.elixirs.elixirofdragonsblood.desc=For _%1$s turns_, prevents burning and gives your hits a _%2$s%% chance_ to ignite enemies.

items.potions.elixirs.elixiroffeatherfall.name=elixir of feather fall
items.potions.elixirs.elixiroffeatherfall.light=You feel light as a feather!
items.potions.elixirs.elixiroffeatherfall.desc=Lets you drop into pits safely for _%1$s turns_. Each fall uses _%2$s extra turns_ of protection.
items.potions.elixirs.elixiroffeatherfall$featherbuff.name=feather fall
items.potions.elixirs.elixiroffeatherfall$featherbuff.desc=Protects you from falling damage. Each fall uses extra protection time.\n\nTurns remaining: %s.

items.potions.elixirs.elixirofhoneyedhealing.name=elixir of honeyed healing
items.potions.elixirs.elixirofhoneyedhealing.desc=Drink to heal, cure common ailments and relieve hunger. Throw it to heal and cure a creature; a bee can also become your ally.
items.potions.elixirs.elixirofhoneyedhealing.desc_pharmacophobia=_Pharmacophobia:_ drinking cures common ailments and relieves hunger, then poisons you instead of healing. Throwing it can still heal other creatures and befriend bees.
items.potions.elixirs.elixirofhoneyedhealing.desc_disabled_healing=Your current rules disable your healing. Drinking still cures common ailments and relieves hunger; throwing can heal other creatures and befriend bees.

items.potions.elixirs.elixiroficytouch.name=elixir of icy touch
items.potions.elixirs.elixiroficytouch.desc=For _%1$s turns_, protects against chilling and freezing. Your hits add _%2$s turns_ of Chill to enemies, slowing them.

items.potions.elixirs.elixirofmight.name=elixir of might
items.potions.elixirs.elixirofmight.msg=Newfound strength surges through your body, you now have %d strength!
items.potions.elixirs.elixirofmight.desc=Permanently adds _1 Strength_. Grants a temporary _%d maximum HP_ bonus before difficulty adjustments, fading over five level-ups. Drinking again refreshes the bonus.
items.potions.elixirs.elixirofmight.desc_without_hero=Permanently adds _1 Strength_ and grants a temporary maximum-health bonus. The health bonus fades over five level-ups; drinking again refreshes it.
items.potions.elixirs.elixirofmight$htboost.name=max health boost
items.potions.elixirs.elixirofmight$htboost.desc=Base maximum-health bonus: _%1$d HP_ before run adjustments. Level-ups remaining: _%2$d_.

items.potions.elixirs.elixiroftoxicessence.name=elixir of toxic essence
items.potions.elixirs.elixiroftoxicessence.desc=Spreads toxic gas around you for _%1$s turns_, even while standing still. Protects you from toxic gas and poison until _%2$s turns_ after emission ends. Keep allies clear; gas can outlast your protection.



