name: APD local record integrity source gate
on:
  push:
    branches: [chatgpt/apd-tabfile-integrity-20261112-1545]
    paths:
      - .github/workflows/apd-tabfile-integrity-ci-20261112.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/backendbridge/TabFile.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/backendbridge/TabFileIntegrityTest.java
permissions: {contents: read}
concurrency:
  group: apd-tabfile-integrity-20261112-1545
  cancel-in-progress: false
jobs:
  source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Require exact preservation and strict-decoding fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/backendbridge/TabFile.java').read_text()
          tests=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/backendbridge/TabFileIntegrityTest.java').read_text()
          assert 'if (file.isDirectory()) throw new IOException("not a record file: " + file)' in source
          assert 'if (file.exists() && !file.delete())' not in source
          assert 'StandardCharsets.UTF_8.newDecoder()' in source
          assert 'CharacterCodingException' in source
          for name in ('malformedUtf8LineIsSkippedWithoutInventingReplacementCharacters',
                       'replacementPreservesValidUnicodeAndLeavesNoTemporaryFile',
                       'directoryDestinationIsNotDeletedOrReplaced',
                       'failedTemporaryWriteRetainsOriginalRecordBytes'):
              assert name in tests
          print('Exact TabFile preservation and byte-integrity test controls present')
          PY
      - name: Complete core suite and Android/desktop Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Verify full core JUnit XML and four integrity regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'missing full JUnit XML'
          totals={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3315, totals
          assert all(totals[k] == 0 for k in ('failures','errors','skipped')), totals
          cases={c.get('name') for report in reports for c in report.findall('testcase')}
          assert {'malformedUtf8LineIsSkippedWithoutInventingReplacementCharacters',
                  'replacementPreservesValidUnicodeAndLeavesNoTemporaryFile',
                  'directoryDestinationIsNotDeletedOrReplaced',
                  'failedTemporaryWriteRetainsOriginalRecordBytes'} <= cases
          print('Full source suite:',totals,'suites:',len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-tabfile-integrity-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
