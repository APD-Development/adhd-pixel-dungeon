[vars]
ADMIN_EMAILS = "charltonchris29@gmail.com"      # Chris's email: signing up with it makes that account the admin
GOOGLE_CLIENT_ID = "1075731906356-tr7miehsnl77ld9ru05h3ijv84cd60jb.apps.googleusercontent.com"  # Google OAuth web client id(s), comma-separated
