# ADHD Pixel Dungeon 2026; GPL-3.0-or-later
name: Publish verified APD437 Developer and Alpha-Testers APKs
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-437-RELEASE-REQUEST.txt]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Independently verify exact successful producer and APK pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 tools/apd_owner_delivery_policy.py
          python3 - <<'PY'
          import json,subprocess,pathlib,hashlib,zipfile,xml.etree.ElementTree as E,os,sys
          repo=os.environ['GITHUB_REPOSITORY']
          api=lambda uri:json.loads(subprocess.check_output(['gh','api',uri]))
          assert api('repos/'+repo)['private']
          run=api('repos/'+repo+'/actions/runs/42927955467')
          assert run['status']=='completed' and run['conclusion']=='success'
          assert run['head_sha']=='4da1ef4cf0e116c7a5187236b5c61e53600e241b'
          assert run['path']=='.github/workflows/apd-playback-437.yml'
          jobs=api('repos/'+repo+'/actions/runs/42927955467/jobs')['jobs']
          assert len(jobs)==3 and all(j['conclusion']=='success' for j in jobs)
          artifacts=api('repos/'+repo+'/actions/runs/42927955467/artifacts')['artifacts']
          expected={'apd437-built-pair','apd437-native-Developer','apd437-native-Alpha-Testers'}
          assert expected.issubset({a['name'] for a in artifacts if not a['expired']})
          root=pathlib.Path('proof');root.mkdir()
          for name in sorted(expected):
              subprocess.run(['gh','run','download','42927955467','--repo',repo,'--name',name,'--dir',str(root/name)],check=True)
          built=root/'apd437-built-pair'
          xml=list(built.rglob('TEST-*.xml'))
          suites=[E.parse(path).getroot() for path in xml]
          totals={key:sum(int(s.get(key,0)) for s in suites) for key in ['tests','failures','errors','skipped']}
          assert len(suites)==460 and totals==dict(tests=3177,failures=0,errors=0,skipped=0),(len(suites),totals)
          proof=json.loads(next(built.rglob('apks.json')).read_text())
          signer=sorted((pathlib.Path(os.environ['ANDROID_HOME'])/'build-tools').glob('*/apksigner'))[-1]
          sys.path.insert(0,'tools')
          from apd_existing_build_evidence import certificates
          cert_expected='067688b3ab6bd5820a67f4c1ba7d5859db578173771cf31d3252b3e4e012246e'
          for variant in ['Developer','Alpha-Testers']:
              apk=built/'owner-delivery'/('APD-'+variant+'-437.apk')
              assert apk.is_file() and apk.stat().st_size>1000000
              assert hashlib.sha256(apk.read_bytes()).hexdigest()==proof[variant]['sha256']
              output=subprocess.check_output([str(signer),'verify','--print-certs',str(apk)],text=True)
              assert certificates(output)==[cert_expected]
              with zipfile.ZipFile(apk) as z:
                  assert 'Codex TEST 437' in z.read('assets/apd/history/index.tsv').decode()
                  f=z.read('assets/apd/features.txt').decode().splitlines()
                  assert 'grudge' in f
                  if variant=='Alpha-Testers':
                      assert 'testBuild' not in f and 'demoUnlock' not in f and 'clericPlayable' not in f
              native=root/('apd437-native-'+variant)
              reports=list(native.rglob('*-qol.txt'))
              assert len(reports)==1 and 'OK (1 test)' in reports[0].read_text()
              screenshots=list(native.rglob('qol-automatic-inventory-*.png'))
              assert len(screenshots)>=5 and all(p.stat().st_size>2000 for p in screenshots)
          pathlib.Path('release-notes.md').write_text(
              'APD437: Full visual-only playback speed selection is now available to every player (0.5x through 1000x). '
              'Retains six class-labelled renameable Custom Dungeon Rules preset slots, Easiest/Hardest/Default/All Max/All Min choices, '
              'and hidden Grudge for Alpha-Testers. No change to gameplay timing, combat balance, or save format. '
              'Both APKs passed 3177 core tests, Android emulator checks, and original signing verification. '
              'Physical-phone testing not claimed. Install over the existing app without uninstalling.\n')
          print('Exact producer, tests, APK hashes, certificate and both native tests verified')
          PY
      - name: Publish immutable new APD437 GitHub release and verify download-back
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view apd-alpha-preview-437 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "APD437 release already exists; refusing to overwrite"
            exit 1
          fi
          gh release create apd-alpha-preview-437 --repo "$GITHUB_REPOSITORY" \
            --target 4da1ef4cf0e116c7a5187236b5c61e53600e241b --prerelease --latest=false \
            --title "APD437: extended playback for everyone" --notes-file release-notes.md \
            proof/apd437-built-pair/owner-delivery/APD-Developer-437.apk \
            proof/apd437-built-pair/owner-delivery/APD-Alpha-Testers-437.apk
          mkdir -p downloaded
          gh release download apd-alpha-preview-437 --repo "$GITHUB_REPOSITORY" --pattern 'APD-*-437.apk' --dir downloaded
          for variant in Developer Alpha-Testers; do
            cmp "proof/apd437-built-pair/owner-delivery/APD-${variant}-437.apk" "downloaded/APD-${variant}-437.apk"
          done
          gh release view apd-alpha-preview-437 --repo "$GITHUB_REPOSITORY" --json url,isDraft,assets
