name: Verify APD stair transition null safety
on:
  push:
    branches: [codex/apd-stair-null-transition-20261112]
    paths: [.github/workflows/apd-stair-null-transition-ci-20261112.yml]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify narrowly scoped source guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/navigation/StairNavigation.java').read_text()
          method=source.split('public static int discoveredTarget(',1)[1].split('private static boolean hasTransition(',1)[0]
          assert method.index('if (!matchesRoute(transition, route)) continue;') < method.index('int cell=transition.cell();')
          assert '(level.visited[cell] || level.mapped[cell])' in method
          print('Read-only transition lookup checks route identity before accessing cell.')
          PY
      - name: Compile full APD core, desktop and Android and run core regressions
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require the new tests and the full clean core suite
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          xml=list(pathlib.Path('core/build/test-results/test').glob('TEST-*.xml'))
          assert xml,'Missing raw core test reports'
          roots=[ET.parse(p).getroot() for p in xml]
          counts={key:sum(int(r.get(key,0)) for r in roots) for key in ('tests','failures','errors','skipped')}
          assert counts['tests']>=3269 and counts['failures']==counts['errors']==counts['skipped']==0,counts
          matches=[r for r in roots if r.get('name','').endswith('.StairNavigationTest')]
          assert len(matches)==1
          cases={x.get('name') for x in matches[0].findall('testcase')}
          required={'nullTransitionEntryDoesNotCrashOrInventDiscoveredStairs','nullTransitionEntryDoesNotHideValidOrMappedStairs'}
          assert required <= cases,(required-cases)
          print('Verified',counts,'across',len(roots),'suites, including the two new stair regressions')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-stair-null-transition-core-xml
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
