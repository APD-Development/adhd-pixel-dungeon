name: Stage lunch fallback TEST123 (no publication)

# Delivery only: reuse the already tested APK; no Gradle or app rebuild.
# Accept verified SDK signer labels; retain compatibility refusal diagnostics.
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/codex-lunch-stage.yml]

permissions:
  contents: read
  actions: read

concurrency:
  group: apd-existing-test123-delivery
  cancel-in-progress: false

env:
  APD_SOURCE_SHA: 19b358d1a8a46f197837401b83fe836cba88988d
  APD_SOURCE_RUN: '38432306523'
  APD_TEST_NUMBER: '123'
  APD_CORE_TEST_COUNT: '1384'
  APD_ANDROID_TEST_COUNT: '24'
  APD_ROLLBACK_NUMBER: '67'
  APD_ROLLBACK_SHA256: '3b9fc627cafad093e44cd8359f5ef74921bff1ed5b21c988f2f82b2fa6642d15'
  APD_REQUIRED_ANDROID_METHODS: 'menusSurviveSceneRecreationAndNarrowActionsStayInsideTheirWindow,aRunCanBePlayedSavedContinuedAndEndedWithItsHistoryRecorded,aWonRunIsRecordedAsWonAndSealed,difficultyIsChosenOnTheCharacterScreenAndNotInSettings,communityMenuOpensEveryPreviewAndReturnsWithoutStackingWindows,adultHumorControlWorksWithoutAnAgeProviderAndReopensWithSavedChoice,textAndGuideScrollSurviveRepeatedResetsAndClampAfterResize,validationEmptyHistoryGroupedAndReportMessagesSurviveWithoutRepeatingActions,tourChoicesSurviveWithoutStartingATourOrRepeatingTheOffer,heroButtonsStayAboveNavigationBarAndRemainSelectable,navigationOverlapReservesVisibleBarsEvenWithFullscreenRequested,clericQuickCastsPersistAndKeepNormalCostsAndTargeting,arcanaItemDescriptionsRequireKnownEquippedRingsAndFitWindows,demoUnlockKeepsTenRunNoticeVisibleOnTitle,offlineNewsCardsOpenDatedSpritePopups,everyAboutPopupOpensScrollsAndCloses,everyUimsdScreenAndDialogCanBeBuilt,replacingHomeContentsDisposesPreviouslyDrawnImages,categoriesUseSpdColumnsAndEveryIconOpensItsExactBuildPopup,largeAndNamedHistoricalBuildsKeepAllIconsInScrollableNativeSections,tileVisibilityAndStairNavigationKeepNormalTurnsFogAndControls,noticeStaysAboveUsableControlsAndDoesNotChangeLockedRunOrScores,equipmentControlAcceptsTouchAndSavesOnlyNextRunPreferences,touchscreenSliderGesturesLockDirectionAndPreserveDraftAndSavedRules'

jobs:
  validate-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 19b358d1a8a46f197837401b83fe836cba88988d
      - uses: actions/checkout@v4
        with:
          path: lunch-preparation
      - name: Wait for exact TEST123 verification and resolve actual artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time
          repo=os.environ['GITHUB_REPOSITORY']
          run=os.environ['APD_SOURCE_RUN']
          deadline=time.monotonic()+1800
          while True:
              data=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}']))
              assert data['head_sha']==os.environ['APD_SOURCE_SHA']
              if data['status']=='completed':
                  assert data['conclusion']=='success', 'Source verification failed: no publication'
                  break
              if time.monotonic()>=deadline:
                  raise SystemExit('Source verification still pending: no publication')
              time.sleep(20)
          data=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts']))['artifacts']
          names=('apd-codex-core-tests','apd-codex-private-test-apk','apd-codex-android-checks')
          result={}
          for name in names:
              matches=[a for a in data if a['name']==name and not a['expired']]
              assert len(matches)==1
              result[name]=matches[0]['id']
          with open(os.environ['GITHUB_ENV'],'a') as target:
              target.write('APD_SOURCE_ARTIFACTS_JSON='+json.dumps(result)+'\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: apd-codex-private-test-apk
          run-id: ${{ env.APD_SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: delivery
      - uses: actions/download-artifact@v4
        with:
          name: apd-codex-core-tests
          run-id: ${{ env.APD_SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: core-reports
      - uses: actions/download-artifact@v4
        with:
          name: apd-codex-android-checks
          run-id: ${{ env.APD_SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: android-reports
      - name: Retrieve rollback APK for direct compatibility comparison
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download apd-codex-test-67 --repo "$GITHUB_REPOSITORY" --pattern ADHD-Pixel-Dungeon-CODEX-TEST-67.apk --dir rollback
      - name: Check source, tests, checksum, signing and application ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s tools -p test_apd_existing_build_evidence.py
          GITHUB_SHA="$APD_SOURCE_SHA" python3 tools/apd_existing_build_evidence.py
      - name: Stage the twenty-seven verified Android screenshots
        run: |
          mkdir -p delivery/screenshots
          cp android-reports/codex-visual-evidence/*.png delivery/screenshots/
          test "$(find delivery/screenshots -name '*.png' | wc -l)" -eq 27
          sha256sum delivery/screenshots/*.png > delivery/Android-Screenshot-Checksums.sha256
      - name: Count exact verified source for owner chat breakdown
        run: |
          git fetch --no-tags --depth=1 origin "$APD_SOURCE_SHA"
          python3 tools/apd_source_line_counts.py "$APD_SOURCE_SHA" delivery
          git archive --format=zip --output=delivery/APD-Verified-Source.zip "$APD_SOURCE_SHA" SPD-classes/src/main/java core/src/main/java core/src/test/java android/src/main/java android/src/androidTest/java
          sha256sum delivery/APD-Verified-Source.zip > delivery/APD-Verified-Source.zip.sha256
      - name: Produce today's report from verified evidence
        run: |
          python3 -m pip install reportlab==4.2.5
          python3 -m unittest discover -s tools -p test_apd_bug_report_pdf.py
          python3 tools/apd_bug_report_pdf.py lunch-preparation/docs/APD-TEST123-REPORT-2026-10-13.md delivery/APD-Bug-Fixes-2026-10-13-TEST123.pdf --verification delivery/verification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: verified-test123-delivery
          path: delivery/
          retention-days: 7

# Staging only. No releases, tags, asset publication or automatic distribution.
# Separate daily lunch schedules are unchanged. No app rebuild in this delivery workflow.

      - uses: actions/upload-artifact@v4
        with:
          name: verified-test123-evidence
          path: |
            delivery/*.json
            delivery/*.txt
            delivery/*.pdf
            delivery/*.csv
            delivery/*.md
            delivery/*.sha256
            delivery/screenshots/
            delivery/APD-Verified-Source.zip
          retention-days: 7
