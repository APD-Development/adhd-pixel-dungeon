name: Preserve rejected411 original APKs and raw evidence in private draft only
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-411-PRESERVE-REQUEST.txt]
permissions: {contents: write, actions: read}
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Preserve immutable rejected files without publishing
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh run download 42611010791 --repo "$GITHUB_REPOSITORY" --name apd411-built-pair --dir original-build
          gh run download 42611010791 --repo "$GITHUB_REPOSITORY" --name apd411-native-Developer --dir rejected-evidence/Developer
          gh run download 42611010791 --repo "$GITHUB_REPOSITORY" --name apd411-native-Alpha-Testers --dir rejected-evidence/Alpha-Testers
          python3 - <<'PYPRESERVE'
          import pathlib,json,subprocess,zipfile,hashlib,os
          repo=os.environ['GITHUB_REPOSITORY'];api=lambda p:json.loads(subprocess.check_output(['gh','api',p]));assert api('repos/'+repo)['private'];run=api('repos/'+repo+'/actions/runs/42611010791');assert run['conclusion']=='failure' and run['head_sha']=='7e92a2b45d8d3aa8338fbabac6983dca37a80087';releases=api('repos/'+repo+'/releases?per_page=100');release=next(r for r in releases if r['tag_name']=='apd-alpha-preview-411');assert release['draft']
          apps=sorted(pathlib.Path('original-build/owner-delivery').glob('APD-*-411.apk'));assert len(apps)==2
          manifest={'accepted':False,'native_acceptance':'Native QoL failed obsolete Catalyst expectation: six energy versus six alchemy energy. No successful full-grid claim. Test-only phrase correction and all12 original-APK cases pending.','source_commit':run['head_sha'],'run':run['html_url'],'application_apks_rebuilt':False,'files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in apps}}
          pathlib.Path('rejected411.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with zipfile.ZipFile('APD-411-Native-Held-Original-APKs.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in apps:z.write(p,p.name)
            z.write('rejected411.json','UNVERIFIED-READ-FIRST.json')
          with zipfile.ZipFile('APD-411-Initial-Native-Held-Evidence.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in pathlib.Path('rejected-evidence').rglob('*'):
              if p.is_file():z.write(p,p.relative_to('rejected-evidence'))
            z.write('rejected411.json','rejected411.json')
          for name in ['APD-411-Native-Held-Original-APKs.zip','APD-411-Initial-Native-Held-Evidence.zip']:
            assert name not in {a['name'] for a in release['assets']};subprocess.run(['gh','release','upload','apd-alpha-preview-411',name,'--repo',repo],check=True)
          assert next(r for r in api('repos/'+repo+'/releases?per_page=100') if r['tag_name']=='apd-alpha-preview-411')['draft'];print('Rejected immutable files preserved in private draft only; not published.')
          PYPRESERVE
