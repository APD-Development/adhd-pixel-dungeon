items.artifacts.sandalsofnature.desc_3=The plants have grown into sturdy bark boots. Feed more different seed types to reach their final form.
items.artifacts.sandalsofnature.desc_4=The plants have reached their final form: sturdy, living greaves.
items.artifacts.sandalsofnature.desc_hint=Tall grass yields seeds and dew more often while you wear the footwear.
items.artifacts.sandalsofnature.desc_cursed=While worn, stops normal seed, runestone and dew drops from grass, and prevents the footwear from charging.
