      - name: Publish the already verified private owner APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib,subprocess
          assert datetime.datetime.now(datetime.timezone.utc)>=datetime.datetime(2026,10,16,16,0,tzinfo=datetime.timezone.utc), 'No early APK publication'
          repo=os.environ['GITHUB_REPOSITORY'];tag='apd-alpha-preview-254';root=pathlib.Path('delivery')
          assert json.loads(subprocess.check_output(['gh','api','repos/'+repo]))['private']
          names=['ADHD-Pixel-Dungeon-Alpha-Preview-254.apk','ADHD-Pixel-Dungeon-Alpha-Preview-254.apk.sha256','TEST254-Verification.json','APD-Preview-Delivery.json','APD-Verified-Source.zip','APD-Verified-Source.zip.sha256','APD-Alpha-Preview-254.pdf','APD-Final-Alpha-Status-254.json','APD-Supplemental-Acceptance-254.zip']
          releases=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases?per_page=100']))
          matches=[release for release in releases if release['tag_name']==tag]
          assert len(matches)<=1,'Preserve unique release and assets'
          already_published=bool(matches)
          if not matches:
              subprocess.run(['gh','release','create',tag,'--repo',repo,'--target',os.environ['GITHUB_SHA'],'--prerelease','--latest=false','--title','APD Alpha Preview 254 — scoring explanation and reliable controls','--notes-file',str(root/'owner-release-notes.txt')]+[str(root/name) for name in names],check=True)
              releases=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/releases?per_page=100']))
              matches=[release for release in releases if release['tag_name']==tag]
          assert len(matches)==1
          release=matches[0]
          assert release['prerelease'] and not release['draft'] and release['published_at'] is not None
          assert release['target_commitish']=='51bdf6b18b1abb3c861ee80186f67def72e17df5', 'Release tag must point to its exact publication wrapper; artifact application source remains checked separately'
          for name in names:
              found=[a for a in release['assets'] if a['name']==name];assert len(found)==1
              assert found[0]['size']>0 and found[0]['digest'].startswith('sha256:')
              if not already_published or name in (names[0],names[1],names[2],names[4],names[5]):
                  assert found[0]['size']==(root/name).stat().st_size
                  assert found[0]['digest']=='sha256:'+hashlib.sha256((root/name).read_bytes()).hexdigest()
          actual=[a for a in release['assets'] if a['name']==names[0]];assert len(actual)==1
          expected=json.loads((root/'APD-Preview-Delivery.json').read_text())['apk_sha256']
          assert actual[0]['digest']=='sha256:'+expected and actual[0]['size']==(root/names[0]).stat().st_size
          target=pathlib.Path('published-download');target.mkdir(exist_ok=True)
          subprocess.run(['gh','release','download',tag,'--repo',repo,'--pattern',names[0],'--dir',str(target)],check=True)
          assert hashlib.sha256((target/names[0]).read_bytes()).hexdigest()==expected
          verified_at=datetime.datetime.now(datetime.timezone.utc).isoformat()
          for name in ['APD-Alpha-Preview-254.pdf','APD-Preview-Delivery.json','APD-Final-Alpha-Status-254.json']:
              subprocess.run(['gh','release','download',tag,'--repo',repo,'--pattern',name,'--dir',str(target)],check=True)
              asset=next(a for a in release['assets'] if a['name']==name)
              assert hashlib.sha256((target/name).read_bytes()).hexdigest()==asset['digest'].removeprefix('sha256:')
          receipt=json.loads((target/'APD-Preview-Delivery.json').read_text())
          assert receipt['application_source']=='832c1a5679a8cd216e8c57638f1bc0fe2442fdfe' and receipt['apk_sha256']==expected and not receipt['physical_device_tested']
          assert hashlib.sha256((target/'APD-Alpha-Preview-254.pdf').read_bytes()).hexdigest()==receipt['current_report_sha256']
          status=json.loads((target/'APD-Final-Alpha-Status-254.json').read_text())
          assert status['application_source']=='832c1a5679a8cd216e8c57638f1bc0fe2442fdfe' and status['application_sha256']==expected
          assert status['main_core_methods']==1736 and status['main_api34_methods']==36 and not status['physical_phone_verified']
          for api,count in [('api34',1),('api36',8)]:
              item=status['supplemental'][api]['device'];assert item['instrumented_methods']==count and item['failures']==item['errors']==item['skipped']==0
          print('Actual published APK download verified at '+verified_at)
          pdf=next(a for a in release['assets'] if a['name']=='APD-Alpha-Preview-254.pdf')
          pathlib.Path('publication-result.json').write_text(json.dumps({'release_url':release['html_url'],'published_at':release['published_at'],'download_verified_at':verified_at,'draft':False,'apk_url':actual[0]['browser_download_url'],'pdf_url':pdf['browser_download_url'],'apk_sha256':expected,'application_source':'832c1a5679a8cd216e8c57638f1bc0fe2442fdfe','private_repository':True,'public_release':False,'tester_distribution':False,'application_rebuilt':False,'chat_link_sent':False},indent=2))
          print(pathlib.Path('publication-result.json').read_text())
