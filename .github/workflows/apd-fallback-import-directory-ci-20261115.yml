name: APD fallback import directory exact-source verification
on:
  push:
    branches: [chatgpt/apd-fallback-import-dir-boundary-20261115-0500]
    paths:
      - .github/workflows/apd-fallback-import-directory-ci-20261115.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ApdFiles.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ApdFilesFallbackSymlinkTest.java
permissions: {contents: read}
concurrency:
  group: apd-fallback-import-dir-20261115
  cancel-in-progress: false
jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Complete core JUnit and desktop/Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Verify import directory boundary regression and all core tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files = list(Path('core/build/test-results/test').glob('TEST-*.xml'))
          assert files, 'JUnit XML missing'
          roots = [ET.parse(f).getroot() for f in files]
          totals = {k: sum(int(root.get(k, '0')) for root in roots)
                    for k in ('tests', 'failures', 'errors', 'skipped')}
          assert totals['tests'] >= 3479, totals
          assert all(totals[k] == 0 for k in ('failures', 'errors', 'skipped')), totals
          names = {c.get('name') for root in roots for c in root.findall('testcase')}
          for name in ('symlinkedImportsDirectoryCannotReadExternalZip',
                       'newerExternalZipSymlinkCannotOutrankLocalZip',
                       'externalZipSymlinkAloneDoesNotCountAsImportFile',
                       'symlinkedBaseRootStillAllowsDirectLocalZip'):
              assert name in names, name
          print('EXACT_APD_FALLBACK_IMPORT_DIRECTORY_JUNIT', totals, 'suites', len(files))
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apd-fallback-import-dir-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
