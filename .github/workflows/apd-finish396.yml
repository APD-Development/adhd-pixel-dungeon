name: Package verified immutable APK396 after scanner network failure
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-396-FINISH-REQUEST.txt]
permissions: {contents: read, actions: read}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: apd396-built-pair, run-id: 42565733012, github-token: '${{ github.token }}'}
      - uses: actions/download-artifact@v4
        with: {name: apd396-retry-Developer, run-id: 42567183633, github-token: '${{ github.token }}', path: evidence}
      - uses: actions/download-artifact@v4
        with: {name: apd396-retry-Alpha-Testers, run-id: 42567183633, github-token: '${{ github.token }}', path: evidence}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/download-artifact@v4
        with: {name: apd396-retry-inputs, run-id: 42567183633, github-token: '${{ github.token }}', path: evidence/corrected-instrumentation}
      - name: Verify exact identities, completed tests and corresponding source
        env: {GH_TOKEN: '${{ github.token }}', APD_SOURCE_SHA: 'd19a99f8d48163c78673e31315a802b0b3f30c5d'}
        run: |
          gh run download 42565733012 --repo "$GITHUB_REPOSITORY" --name apd396-native-Developer --dir evidence/initial-rejected/Developer
          gh run download 42565733012 --repo "$GITHUB_REPOSITORY" --name apd396-native-Alpha-Testers --dir evidence/initial-rejected/Alpha-Testers
          cp tools/apd396-native-fixture.patch evidence/corrected-test-fixture.patch
          python3 - <<'PYNATIVE'
          import subprocess,json
          jobs=json.loads(subprocess.check_output(['gh','run','view','42567183633','--repo','APD-Development/ShieldingShouldHaveWorked','--json','jobs']))['jobs']
          native=[j for j in jobs if j['name'].startswith('native (')];assert len(native)==2 and all(j['conclusion']=='success' for j in native)
          assert next(j for j in jobs if j['name']=='instrumentation')['conclusion']=='success'
          PYNATIVE
          python3 tools/apd_prepare396.py
          python3 - <<'PYPROOF'
          import pathlib,json,os
          p=pathlib.Path('owner-delivery/APD-Preview-396-Verification.json');d=json.loads(p.read_text());d['original_apk_build_run']=42565733012;d['verification_harness_source']=__import__('subprocess').check_output(['gh','run','view','42567183633','--repo','APD-Development/ShieldingShouldHaveWorked','--json','headSha','--jq','.headSha'],text=True).strip();d['original_native_retry_run']=42567183633;d['packaging_source']=os.environ['GITHUB_SHA'];d['native_retry']='Ferret fixture now checks the remaining evasion sentence instead of removed duplicate flavor, with explicit50percent and ally/enemy assertions. All six distinct cases per variant rerun on immutable original APKs. Original rejected evidence and exact fixture patch included. No application APK rebuilt.';p.write_text(json.dumps(d,indent=2)+'\n')
          with pathlib.Path('owner-delivery/release-notes.md').open('a') as f:f.write('\nVerification retry: corrected a stale Ferret flavor expectation to verify the actual evasion statement,50percent and ally/enemy effects; full twelve-case grid rerun on unchanged original APKs. Initial failed checks retained; no new game APKs rebuilt.\n')
          PYPROOF
      - name: Scan key-free source and full reachable history
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          if ! curl --connect-timeout 20 -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/apd-gitleaks.tar.gz; then
            gh api repos/gitleaks/gitleaks/releases/assets/378332058 -H 'Accept: application/octet-stream' > /tmp/apd-gitleaks.tar.gz
          fi
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/apd-gitleaks.tar.gz' | sha256sum -c -
          mkdir /tmp/apd-gitleaks
          tar -xzf /tmp/apd-gitleaks.tar.gz -C /tmp/apd-gitleaks
          python3 tools/apd_qol_source_scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd396-prepared-owner-pair
          path: owner-delivery/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd396-source-and-native-evidence
          path: |
            evidence/
            core/build/test-results/test/
            docs/APD-396-DELIVERY-SPEC.json
          retention-days: 14
