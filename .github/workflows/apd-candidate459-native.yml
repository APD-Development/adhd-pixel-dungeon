name: Qualify APD459 frozen chooser APKs on Android
on:
  push:
    branches: [codex/apd-chooser-single-array-20261112]
    paths:
      - .github/workflows/apd-candidate459-native.yml
      - tools/apd459_native_postcheck.py
permissions: {contents: read, actions: read}
concurrency: {group: apd459-native-candidate, cancel-in-progress: false}
jobs:
  android-native:
    strategy:
      fail-fast: false
      matrix:
        variant: [Developer, Alpha-Testers]
        case: [WallGeometryDeviceTest, SearchContextDeviceTest, SeedHistoryDeviceTest]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Require exact completed source-bound candidate, never rebuild
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,time
          expected='7618e1b30228b4cce2dcb5314727df9d3b73eceb'
          for retry in range(150):
              run=json.loads(subprocess.check_output(['gh','api','repos/APD-Development/ShieldingShouldHaveWorked/actions/runs/43234027944']))
              assert run['head_sha']==expected,'Unexpected APD459 producer source'
              if run['status']=='completed':
                  assert run['conclusion']=='success','Frozen APD459 producer not successful'
                  break
              time.sleep(10)
          else: raise RuntimeError('APD459 candidate still not built')
          PY
          mkdir -p candidate459
          gh run download 43234027944 --repo "$GITHUB_REPOSITORY" --name apd459-unaccepted-gated-room-candidate --dir candidate459
          python3 - <<'PY'
          import pathlib,hashlib,json
          folder=pathlib.Path('candidate459')
          receipt=json.loads((folder/'receipt.json').read_text())
          assert receipt['source']=='2b1abfd52bd397dbfe7887b5ae5c52cd5695444e'
          assert receipt['build']==459 and receipt['native_accepted'] is False
          for kind,entry in receipt['files'].items():
              name='APD-Instrumentation-459.apk' if kind=='Instrumentation' else f'APD-{kind}-459.apk'
              f=folder/name
              assert f.stat().st_size==entry['bytes']
              assert hashlib.sha256(f.read_bytes()).hexdigest()==entry['sha256']
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise existing wall, search and seed Android cases without rebuilding game
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none -skin 320x640
          script: |
            mkdir -p native459
            adb install -r candidate459/APD-${{ matrix.variant }}-459.apk
            adb install -r candidate459/APD-Instrumentation-459.apk
            adb logcat -c
            timeout 1200 adb shell am instrument -w -r -e class 'com.shatteredpixel.shatteredpixeldungeon.android.${{ matrix.case }}' com.charltonchris29.adhdpixeldungeon.indev.test/androidx.test.runner.AndroidJUnitRunner > native459/instrumentation.txt 2>&1
            cat native459/instrumentation.txt
            python3 tools/apd459_native_postcheck.py --variant '${{ matrix.variant }}' --case '${{ matrix.case }}' --directory native459
            adb logcat -d -v time > native459/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd459-native-${{ matrix.variant }}-${{ matrix.case }}
          path: native459/
          if-no-files-found: warn
          retention-days: 30
