name: APD required container manifest exact-source verification
on:
  push:
    branches: [chatgpt/apd-missing-container-20261115-0900]
    paths:
      - .github/workflows/apd-required-container-ci-20261115.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifest.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifestRequiredContainerTest.java
permissions: {contents: read}
concurrency:
  group: apd-required-container-20261115
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Require source guard and three regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifest.java').read_text()
          tst=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveManifestRequiredContainerTest.java').read_text()
          assert 'if (!containerSeen) throw new IllegalArgumentException("the manifest has no container metadata");' in src
          for name in ('missingContainerIsRejectedWithCorrectChecksumForEmptyAndNonemptyManifests',
                       'optionalScalarOmissionsAndUnknownChecksummedExtensionRemainSupported',
                       'missingContainerZipImportLeavesExistingHistoryUntouched'):
              assert 'void '+name+'(' in tst, name
          print('Source guard and three required regressions found')
          PY
      - name: Run complete core suite and compile desktop and Android Java
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require zero failures and archive compatibility regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'Missing JUnit evidence'
          sums={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert sums['tests'] >= 3494, sums
          assert all(sums[k]==0 for k in ('failures','errors','skipped')), sums
          cases={c.get('name') for r in reports for c in r.findall('testcase')}
          for name in ('missingContainerIsRejectedWithCorrectChecksumForEmptyAndNonemptyManifests',
                       'optionalScalarOmissionsAndUnknownChecksummedExtensionRemainSupported',
                       'missingContainerZipImportLeavesExistingHistoryUntouched',
                       'normalContainerAndUnknownFutureMetadataStillParse',
                       'normalUnknownAndOmittedOptionalRecordsRemainCompatible',
                       'repeatedManifestPathKeepsFirstMatchAndNeverOverwritesHistory',
                       'uncheckedSuffixInZipRefusesWithoutTouchingOriginalHistory'):
              assert name in cases, 'Missing compatibility or new regression: '+name
          print('Core JUnit:', sums, 'suites', len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-required-container-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
