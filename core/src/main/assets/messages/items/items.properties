items.artifacts.unstablespellbook.desc_index=Add one of these requested scrolls to upgrade the book:
items.artifacts.unstablespellbook.desc_empowered=Types you have added can produce their exotic effect for _2 charges_ instead of 1.
items.artifacts.unstablespellbook.read_empowered=Choose the regular effect for _1 charge_ or the exotic effect for _2 charges_.



###bags
items.bags.bag.name=backpack
items.bags.bag.discover_hint=You can buy this item in a shop.

items.bags.potionbandolier.name=potion bandolier
items.bags.potionbandolier.desc=Insulated storage for potions, your waterskin and liquid metal. Protects stored potions from freezing in your inventory.

items.bags.scrollholder.name=scroll holder
items.bags.scrollholder.desc=Stores scrolls, spell crystals, arcane styli and arcane resin. Protects stored scrolls from burning in your inventory.

items.bags.velvetpouch.name=velvet pouch
items.bags.velvetpouch.desc=A small pouch for seeds, runestones, Goo blobs and metal shards.
items.bags.velvetpouch.discover_hint=One of the heroes starts with this item.

items.bags.magicalholster.name=magical holster
items.bags.magicalholster.desc=Stores wands, thrown weapons and bombs. Stored wands recharge faster, and most thrown weapons gain _%s%%_ extra durability.



###bombs
items.bombs.arcanebomb.name=arcane bomb
items.bombs.arcanebomb.desc=Deals _%1$d-%2$d base magical damage_ within 2 tiles, bypassing armor. Stay outside the blast.
items.bombs.arcanebomb.discover_hint=You can craft this item via alchemy.

items.bombs.bomb.name=bomb
items.bombs.bomb.ac_lightthrow=LIGHT & THROW
items.bombs.bomb.snuff_fuse=You quickly snuff the bomb's fuse.
items.bombs.bomb.ondeath=The explosion killed you...
items.bombs.bomb.rankings_desc=Killed by an explosion
items.bombs.bomb.desc=A black powder bomb that deals _%1$d-%2$d base damage_ to everyone on or next to its tile. The blast can destroy nearby items and terrain.
items.bombs.bomb.desc_fuse=Light and throw it to start its short fuse. Picking it up before it explodes puts the fuse out.
items.bombs.bomb.desc_burning=The bomb's fuse is burning away, keep your distance or put it out!
items.bombs.bomb$doublebomb.name=two bombs
items.bombs.bomb$doublebomb.desc=A stack of two hefty black powder bombs, looks like you get one free!

items.bombs.firebomb.name=firebomb
items.bombs.firebomb.desc=Deals _%1$d-%2$d base damage_ within 2 tiles and leaves the area burning.
items.bombs.firebomb.discover_hint=You can craft this item via alchemy.

items.bombs.flashbangbomb.name=flashbang
items.bombs.flashbangbomb.desc=Deals _%1$d-%2$d base blast damage_ within 2 tiles, followed by an electrical burst about a quarter as strong. It can paralyze survivors for 10 turns. You and your allies can be hit too.
items.bombs.flashbangbomb.discover_hint=You can craft this item via alchemy.

items.bombs.frostbomb.name=frost bomb
items.bombs.frostbomb.desc=Deals _%1$d-%2$d base damage_ within 2 tiles, freezes creatures caught in the blast and leaves freezing air behind.
items.bombs.frostbomb.discover_hint=You can craft this item via alchemy.

items.bombs.holybomb.name=holy bomb
items.bombs.holybomb.desc=Deals _%1$d-%2$d base blast damage_ within 2 tiles. Undead and demonic creatures also take a holy burst about half as strong.
items.bombs.holybomb.discover_hint=You can craft this item via alchemy.

items.bombs.noisemaker.name=noisemaker
items.bombs.noisemaker.desc=After its fuse burns down, this bomb repeatedly makes noise to attract enemies. It explodes when a creature steps onto its tile, dealing _%1$d-%2$d base damage_ within 2 tiles. Once it starts making noise, you cannot pick it up or put it out.
items.bombs.noisemaker.desc_fuse=Light and throw it to start its short fuse and arm the noisemaker.
items.bombs.noisemaker.desc_burning=Keep clear of this active noisemaker.
items.bombs.noisemaker.discover_hint=You can craft this item via alchemy.

items.bombs.smokebomb.name=smoke bomb
items.bombs.smokebomb.desc=Deals _%1$d-%2$d base damage_ within 2 tiles and fills the area with fog that blocks most creatures’ sight.
items.bombs.smokebomb.discover_hint=You can craft this item via alchemy.

items.bombs.regrowthbomb.name=regrowth bomb
items.bombs.regrowthbomb.desc=Grows grass and plants within 3 tiles instead of exploding. Cures ailments and gradually heals you and your allies in the area, like a healing potion.
items.bombs.regrowthbomb.discover_hint=You can craft this item via alchemy.

items.bombs.shrapnelbomb.name=shrapnel bomb
items.bombs.shrapnelbomb.desc=Deals _%1$d-%2$d base damage_ to everyone in sight of the bomb, up to 8 tiles away. Take cover behind a wall before it explodes.
items.bombs.shrapnelbomb.discover_hint=You can craft this item via alchemy.

items.bombs.woollybomb.name=woolly bomb
items.bombs.woollybomb.desc=Deals _%1$d-%2$d base damage_ within 2 tiles, then fills nearby open ground with magical sheep. They block movement and last much less time on boss floors. Interact with a sheep to dismiss it.
items.bombs.woollybomb.discover_hint=You can craft this item via alchemy.

