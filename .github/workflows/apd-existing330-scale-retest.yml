name: Retest exact TEST330 scale change on API36
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/apd-existing330-scale-retest.yml]
permissions:
  contents: read
  actions: read
jobs:
  exact-scale-api36:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Download exact produced APK and prove unchanged application inputs
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,zipfile
          sys.path.insert(0,'tools')
          from apd_existing_build_evidence import application_inputs
          repo=os.environ['GITHUB_REPOSITORY'];source='35e1c85fcea93381a4f107cafd4f89f5264af391';run_id=40800528756
          api=lambda p:json.loads(subprocess.check_output(['gh','api',p]))
          assert api('repos/'+repo)['private']
          trees=[api(f'repos/{repo}/git/trees/{s}?recursive=1') for s in (source,os.environ['GITHUB_SHA'])]
          assert all(not t.get('truncated') for t in trees)
          assert application_inputs(trees[0]['tree'])==application_inputs(trees[1]['tree'])
          run=api(f'repos/{repo}/actions/runs/{run_id}');assert run['head_sha']==source
          assert any(j['name']=='verify-and-build' and j['conclusion']=='success' for j in api(f'repos/{repo}/actions/runs/{run_id}/jobs')['jobs'])
          a,=[a for a in api(f'repos/{repo}/actions/runs/{run_id}/artifacts')['artifacts'] if a['name']=='apd-codex-private-test-apk' and not a['expired']]
          with open('exact330.zip','wb') as out:subprocess.run(['gh','api',f'repos/{repo}/actions/artifacts/{a["id"]}/zip'],stdout=out,check=True)
          assert 'sha256:'+hashlib.sha256(pathlib.Path('exact330.zip').read_bytes()).hexdigest()==a['digest']
          pathlib.Path('application').mkdir()
          with zipfile.ZipFile('exact330.zip') as z:
              apk,=[n for n in z.namelist() if n.endswith('.apk')]
              data=z.read(apk);digest=hashlib.sha256(data).hexdigest()
              checksum,=[n for n in z.namelist() if n.endswith('.apk.sha256')]
              assert z.read(checksum).decode().split()[0]==digest=='3e38b1164169e404c6606d2baa6d23f61fdb4e1625bb1be53c1424ba41c20842'
              pathlib.Path('application/exact330.apk').write_bytes(data)
          print('EXACT_TEST330_APK_SHA256',digest)
          pathlib.Path('acceptance-source.json').write_text(json.dumps({'application_source':source,'application_run':run_id,'application_sha256':digest,'protected_application_inputs_identical':True,'application_rebuilt':False,'test_source':os.environ['GITHUB_SHA'],'prior_failed_job':123496862351,'prior_failure':'Instrumentation-only diagnostic compile failed before emulator: Component lacks overlapsScreenPoint; replace only that visible-icon proof with camera-projected bounds'},indent=2))
          PY
      - name: Compile instrumentation only
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :android:assembleDebugAndroidTest -PapdTestBuild -PapdBuild=C330
          test ! -f android/build/outputs/apk/debug/android-debug.apk
          ./gradlew --stop
          python3 -m pip install pillow
      - name: Free disposable runner caches before the API36 image creates its minimum partition
        run: |
          ./gradlew --stop
          apd_gradle_cache="${GRADLE_USER_HOME:-$HOME/.gradle}"
          du -sm "$apd_gradle_cache/caches" "$apd_gradle_cache/wrapper/dists" || true
          rm -rf "$apd_gradle_cache/caches" "$apd_gradle_cache/wrapper/dists"
          sudo rm -rf /usr/share/dotnet
          df -Pm "$HOME"
          python3 - <<'PY'
          import pathlib,shutil
          free=shutil.disk_usage(pathlib.Path.home()).free
          print('API36 pre-image free bytes:',free)
          assert free>=10*1024**3,'Insufficient room for API36 image download and mandatory 7.4GB userdata partition'
          PY
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Diagnose the exact expanded footer hit with compiled screen bounds and all API36 assertions
        env: {APD_ENFORCE_DISPLAY: 'true'}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: adb shell settings put global hide_error_dialogs 1 && adb shell settings put secure immersive_mode_confirmations confirmed && bash tools/run-title-display-check.sh '1216x2688' '442' scale
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-existing330-scale-retest
          path: |
            acceptance-source.json
            title-evidence/
            title-instrumentation.txt
            title-logcat.txt
          retention-days: 7
