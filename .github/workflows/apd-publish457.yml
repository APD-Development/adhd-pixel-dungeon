name: Publish verified APD457 Developer and Alpha APKs
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/apd-publish457.yml]
permissions: {contents: write, actions: read}
concurrency: {group: apd457-one-time-publish, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact source build and six successful frozen-APK Android checks
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,time
          repo='APD-Development/ShieldingShouldHaveWorked'
          expectations=[
            (43193737279,'2e4ddb0496d76458040eb9876d539fcc83f65733'),
            (43193825477,'571501a61b9a33e1592079f26b0c3c4d9b36a667'),
            (43193896014,'608e64a8993714433bc952a4e6b5a0ea8a7b2ebc')]
          for run_id,sha in expectations:
            for attempt in range(240):
              r=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}']))
              assert r['head_sha']==sha,(run_id,r['head_sha'],sha)
              if r['status']=='completed':
                assert r['conclusion']=='success',(run_id,r['conclusion'])
                break
              time.sleep(10)
            else: raise RuntimeError(f'Timeout waiting for {run_id}')
          jobs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/43193896014/jobs?per_page=100']))['jobs']
          assert len(jobs)==6 and all(j['conclusion']=='success' for j in jobs),[(j['name'],j['conclusion']) for j in jobs]
          arts=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/43193896014/artifacts?per_page=100']))['artifacts']
          expected={f'apd457-native-{variant}-{case}' for variant in ('Developer','Alpha-Testers')
                    for case in ('WallGeometryDeviceTest','SearchContextDeviceTest','SeedHistoryDeviceTest')}
          assert {a['name'] for a in arts}==expected,[(a['name'],a['expired']) for a in arts]
          assert all(not a['expired'] for a in arts)
          PY
          if gh release view apd-457 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'APD457 release already exists. Refusing to overwrite known-good assets.' >&2
            exit 1
          fi
      - name: Download exactly verified and signed original APK artifacts
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh run download 43193825477 --repo "$GITHUB_REPOSITORY" --name apd457-unaccepted-gated-room-candidate --dir candidate457
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('candidate457')
          r=json.loads((p/'receipt.json').read_text())
          assert r['build']==457 and r['source']=='2e4ddb0496d76458040eb9876d539fcc83f65733'
          assert set(r['files'])=={'Developer','Alpha-Testers','Instrumentation'}
          for kind,info in r['files'].items():
            name='APD-Instrumentation-457.apk' if kind=='Instrumentation' else f'APD-{kind}-457.apk'
            f=p/name
            assert f.stat().st_size==info['bytes']
            assert hashlib.sha256(f.read_bytes()).hexdigest()==info['sha256'],name
          source=p/'APD-Source-457.zip'
          assert source.is_file() and source.stat().st_size>100000
          print('Verified frozen artifacts for APD457',r['files'])
          PY
      - name: Publish prerelease with direct APK downloads
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh release create apd-457 candidate457/APD-Developer-457.apk candidate457/APD-Alpha-Testers-457.apk candidate457/APD-Source-457.zip \
            --repo "$GITHUB_REPOSITORY" --target 2e4ddb0496d76458040eb9876d539fcc83f65733 \
            --title 'APD457: allocation-free adaptive Search' \
            --notes 'Verified Developer and Alpha-Testers APKs on the same signed APD457 source. Removes transient array allocations in the adaptive Search room-interior check without changing Search geometry, scoring, saves, or game balance. Previously approved adaptive Search and Copy Seed fixes are preserved. Core/Android compilation and six isolated Android emulator cases must pass before publication. Existing game save compatibility and signer are retained. Physical-phone installation has not been verified.' \
            --prerelease --latest=false
      - name: Read back published APKs and verify exact digests
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p release-readback
          gh release download apd-457 --repo "$GITHUB_REPOSITORY" --dir release-readback
          python3 - <<'PY'
          import hashlib,json,pathlib
          r=json.loads(pathlib.Path('candidate457/receipt.json').read_text())
          for kind in ('Developer','Alpha-Testers'):
            name=f'APD-{kind}-457.apk'
            p=pathlib.Path('release-readback')/name
            assert p.stat().st_size==r['files'][kind]['bytes']
            assert hashlib.sha256(p.read_bytes()).hexdigest()==r['files'][kind]['sha256']
          assert hashlib.sha256(pathlib.Path('release-readback/APD-Source-457.zip').read_bytes()).hexdigest()==hashlib.sha256(pathlib.Path('candidate457/APD-Source-457.zip').read_bytes()).hexdigest()
          print('All three public APD457 release assets verified against frozen originals.')
          PY
