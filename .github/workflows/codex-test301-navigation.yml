name: APD TEST301 exact APK navigation frame acceptance
# The full51-method suite passed; strengthen stable-frame/frozen-pane assertions on the exact produced APK.
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/codex-test301-navigation.yml]
permissions:
  contents: read
  actions: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Obtain exact produced TEST301 application and prove unchanged application inputs
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          git fetch --depth=1 origin 5c11b1fc346efd8f398ab2cf2872e03b15b29dc0
          test -z "$(git diff 5c11b1fc346efd8f398ab2cf2872e03b15b29dc0 HEAD -- core/src/main android/src/main SPD-classes/src/main)"
          mkdir -p navigation-evidence
          gh api repos/APD-Development/ShieldingShouldHaveWorked/actions/artifacts/12225745338/zip > settings-application.zip
          python3 - <<'PY'
          import zipfile,pathlib,hashlib,json,os
          archive=pathlib.Path('settings-application.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='3882967ea17c814e9680d64c99f87c4cb03f2652b2b4624e05c50c6900f90ff4'
          with zipfile.ZipFile(archive) as z:
              name=next(n for n in z.namelist() if n.endswith('.apk'));data=z.read(name)
          assert hashlib.sha256(data).hexdigest()=='cb998bc22f52e9bc9526f0fca0a4eac7009357073fe63931e6dee24b8f9ca690'
          pathlib.Path('application.apk').write_bytes(data)
          pathlib.Path('navigation-evidence/source.json').write_text(json.dumps({'application_source':'5c11b1fc346efd8f398ab2cf2872e03b15b29dc0','test_source':os.environ['GITHUB_SHA'],'sha256':hashlib.sha256(data).hexdigest(),'application_rebuilt':False,'protected_application_inputs_identical':True},indent=2))
          PY
      - name: Compile corrected instrumentation only
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :android:assembleDebugAndroidTest -PapdTestBuild -PapdBuild=C301
          test ! -f android/build/outputs/apk/debug/android-debug.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify stable navigation frames and all retained assertions on the exact APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: bash tools/run-test301-navigation.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-test301-navigation-exact-apk
          path: navigation-evidence/
          if-no-files-found: error
          retention-days: 7
