name: Publish verified APD459 Developer and Alpha APKs
on:
  push:
    branches: [codex/apd-chooser-single-array-20261112]
    paths: [.github/workflows/apd-publish459.yml]
permissions: {contents: write, actions: read}
concurrency: {group: apd459-one-time-publish, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Wait for exact source build and six successful frozen-APK Android checks
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,time
          repo='APD-Development/ShieldingShouldHaveWorked'
          expectations=[
            (43233669286,'2b1abfd52bd397dbfe7887b5ae5c52cd5695444e'),
            (43234027944,'7618e1b30228b4cce2dcb5314727df9d3b73eceb'),
            (43234116279,'33befd72f75d322bf68b0eaf9d6d199711049dca')]
          for run_id,sha in expectations:
            for attempt in range(240):
              r=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}']))
              assert r['head_sha']==sha,(run_id,r['head_sha'],sha)
              if r['status']=='completed':
                assert r['conclusion']=='success',(run_id,r['conclusion'])
                break
              time.sleep(10)
            else: raise RuntimeError(f'Timeout waiting for {run_id}')
          jobs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/43234116279/jobs?per_page=100']))['jobs']
          assert len(jobs)==6 and all(j['conclusion']=='success' for j in jobs),[(j['name'],j['conclusion']) for j in jobs]
          arts=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/43234116279/artifacts?per_page=100']))['artifacts']
          expected={f'apd459-native-{variant}-{case}' for variant in ('Developer','Alpha-Testers')
                    for case in ('WallGeometryDeviceTest','SearchContextDeviceTest','SeedHistoryDeviceTest')}
          assert {a['name'] for a in arts}==expected,[(a['name'],a['expired']) for a in arts]
          assert all(not a['expired'] for a in arts)
          PY
          if gh release view apd-459 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'APD459 release already exists. Refusing to overwrite known-good assets.' >&2
            exit 1
          fi
      - name: Download exactly verified and signed original APK artifacts
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh run download 43234027944 --repo "$GITHUB_REPOSITORY" --name apd459-unaccepted-gated-room-candidate --dir candidate459
          python3 - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('candidate459')
          r=json.loads((p/'receipt.json').read_text())
          assert r['build']==459 and r['source']=='2b1abfd52bd397dbfe7887b5ae5c52cd5695444e'
          assert set(r['files'])=={'Developer','Alpha-Testers','Instrumentation'}
          for kind,info in r['files'].items():
            name='APD-Instrumentation-459.apk' if kind=='Instrumentation' else f'APD-{kind}-459.apk'
            f=p/name
            assert f.stat().st_size==info['bytes']
            assert hashlib.sha256(f.read_bytes()).hexdigest()==info['sha256'],name
          source=p/'APD-Source-459.zip'
          assert source.is_file() and source.stat().st_size>100000
          print('Verified frozen artifacts for APD459',r['files'])
          PY
      - name: Publish prerelease with direct APK downloads
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          gh release create apd-459 candidate459/APD-Developer-459.apk candidate459/APD-Alpha-Testers-459.apk candidate459/APD-Source-459.zip \
            --repo "$GITHUB_REPOSITORY" --target 2b1abfd52bd397dbfe7887b5ae5c52cd5695444e \
            --title 'APD459: one-array Search chooser' \
            --notes 'Verified Developer and Alpha-Testers APKs on the same signed APD459 source. Reduces Search chooser transient allocations to one exact-size caller-owned result array rather than creating an ArrayList and backing storage. New regression covers every saved-search/movement/preference state, independent results, and unchanged choices. Previously approved adaptive Search and Copy Seed fixes are preserved. Core/Android compilation and six isolated Android emulator cases must pass before publication. Existing game save compatibility and signer are retained. Physical-phone installation has not been verified.' \
            --prerelease --latest=false
      - name: Read back published APKs and verify exact digests
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          mkdir -p release-readback
          gh release download apd-459 --repo "$GITHUB_REPOSITORY" --dir release-readback
          python3 - <<'PY'
          import hashlib,json,pathlib
          r=json.loads(pathlib.Path('candidate459/receipt.json').read_text())
          for kind in ('Developer','Alpha-Testers'):
            name=f'APD-{kind}-459.apk'
            p=pathlib.Path('release-readback')/name
            assert p.stat().st_size==r['files'][kind]['bytes']
            assert hashlib.sha256(p.read_bytes()).hexdigest()==r['files'][kind]['sha256']
          assert hashlib.sha256(pathlib.Path('release-readback/APD-Source-459.zip').read_bytes()).hexdigest()==hashlib.sha256(pathlib.Path('candidate459/APD-Source-459.zip').read_bytes()).hexdigest()
          print('All three public APD459 release assets verified against frozen originals.')
          PY
