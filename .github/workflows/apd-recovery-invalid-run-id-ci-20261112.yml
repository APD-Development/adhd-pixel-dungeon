name: APD invalid-run-filename recovery source gate
on:
  push:
    branches: [chatgpt/apd-recovery-invalid-run-id-20261112-2328]
    paths:
      - .github/workflows/apd-recovery-invalid-run-id-ci-20261112.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/StatsStore.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/StatsStoreRecoveryFilenameBoundaryTest.java
permissions: {contents: read}
concurrency:
  group: apd-recovery-invalid-run-id-20261112
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify invalid-name repair boundary and exact regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/StatsStore.java').read_text()
          tests=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/stats/StatsStoreRecoveryFilenameBoundaryTest.java').read_text()
          assert 'isValidRunId(name.substring(0, name.length() - RunIndex.LOG_SUFFIX.length()))' in code
          assert '&& isDirectRunLog(f)' in code
          for case in ('invalidFilenameWithValidDamagedHeaderIsNeverRepaired','recoverySkipsInvalidNamesWithoutAnyValidRun'):
            assert 'void '+case+'(' in tests, case
          print('Destructive recovery filename guard and two filesystem regressions present')
          PY
      - name: Run full core JUnit and compile desktop and Android Java
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Verify full JUnit and original history compatibility cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'missing JUnit reports'
          totals={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3373, totals
          assert all(totals[k]==0 for k in ('failures','errors','skipped')), totals
          cases={c.get('name') for r in reports for c in r.findall('testcase')}
          for case in (
              'invalidFilenameWithValidDamagedHeaderIsNeverRepaired',
              'recoverySkipsInvalidNamesWithoutAnyValidRun',
              'recoveryNeverTruncatesSymlinkedRunLogs',
              'recoverAllRepairsDamagedLogsAndNeverDeletesThem',
              'validHeaderUnderInvalidFilenameCannotImpersonateItsRun',
              'saveAndLoadRoundTrip',
          ):
            assert case in cases, case
          print('Full core JUnit:', totals, 'suites:',len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-recovery-invalid-run-id-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
