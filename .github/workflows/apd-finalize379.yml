name: Finalize379 source scan and packaging on unchanged verified APKs
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [docs/APD-379-FINALIZE-REQUEST.txt]
permissions: {contents: read, actions: read}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: apd379-prepared-owner-pair, run-id: 42528440660, github-token: '${{ github.token }}', path: owner-delivery}
      - uses: actions/download-artifact@v4
        with: {name: apd379-source-and-native-evidence, run-id: 42528440660, github-token: '${{ github.token }}'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Verify exact identities, completed tests and corresponding source
        env: {GH_TOKEN: '${{ github.token }}', APD_SOURCE_SHA: 'e439e068a232f20c6a381b522dbb7a7add3cd84e'}
        run: |
          python3 tools/apd_prepare379.py
          python3 - <<'PYPROOF'
          import pathlib,json,os
          p=pathlib.Path('owner-delivery/APD-Preview-379-Verification.json');d=json.loads(p.read_text());d['original_apk_build_run']=42526945257;d['native_retry_run']=42528440660;d['source_scan_retry']='Exact already-reviewed prose line moved from11to27; retain its existing whole-line SHA256 and file/rule binding without a brittle line number.';d['verification_harness_source']=os.environ['GITHUB_SHA'];d['native_retry']='Initial Cloak text expectation was stale; ordinary-item helper incorrectly prohibited approved Arcana details. Full Qol rerun uses corrected instrumentation on unchanged379 APKs. Other ten native cases retained from original run. Initial failures preserved.';p.write_text(json.dumps(d,indent=2)+'\n')
          with pathlib.Path('owner-delivery/release-notes.md').open('a') as f:f.write('\nVerification retry: corrected instrumentation text/approved-Arcana expectations; full item-window checks rerun on unchanged original APKs. Initial failed checks retained; no new game APKs rebuilt.\n')
          PYPROOF
      - name: Scan key-free source and full reachable history
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/apd-gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/apd-gitleaks.tar.gz' | sha256sum -c -
          mkdir /tmp/apd-gitleaks
          tar -xzf /tmp/apd-gitleaks.tar.gz -C /tmp/apd-gitleaks
          python3 tools/apd_qol_source_scan.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd379-prepared-owner-pair
          path: owner-delivery/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd379-source-and-native-evidence
          path: |
            evidence/
            core/build/test-results/test/
            docs/APD-379-DELIVERY-SPEC.json
          retention-days: 14
