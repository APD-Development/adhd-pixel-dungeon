name: APD existing hash buffer exact-source verification
on:
  push:
    branches: [chatgpt/apd-existing-hash-buffer-20261115-2100]
    paths:
      - .github/workflows/apd-existing-hash-buffer-ci-20261115.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporter.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporterExistingHashBufferTest.java
permissions: {contents: read}
concurrency:
  group: apd-existing-hash-buffer-20261115
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify source and dedicated regression present
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporter.java').read_text()
          assert 'byte[] localBuffer = new byte[16 * 1024];' in s
          assert 'sameContent(target, st.entry.sha256, localBuffer)' in s
          assert 'copy(st.tmp, target, localBuffer)' in s
          assert 'byte[] buf = new byte[16 * 1024]' not in s.split('private static boolean sameContent(',1)[1]
          t = Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveImporterExistingHashBufferTest.java').read_text()
          assert 'void repeatedExistingHashChecksPreserveSkipCollisionAndNewLogBytes(' in t
          PY
      - name: Full core suite and desktop Android compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Require clean JUnit and compatibility evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          suites=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert suites
          totals={k:sum(int(s.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3514,totals
          assert totals['failures']==totals['errors']==totals['skipped']==0,totals
          names={t.get('name') for s in suites for t in s.findall('testcase')}
          for name in ('repeatedExistingHashChecksPreserveSkipCollisionAndNewLogBytes',
                       'hundredsOfDifferentExistingLogsPreserveEveryOriginalAndBoundReport',
                       'mixedIgnoredAndValidMembersPreserveEveryLogByte',
                       'corruptFinalMemberStillRollsBackAllPriorStagedLogs'):
              assert name in names,name
          print(totals,'suites',len(suites))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-existing-hash-buffer-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
