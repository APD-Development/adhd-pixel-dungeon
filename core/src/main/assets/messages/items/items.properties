items.potions.exotic.exoticpotion.no=No, I changed my mind
items.potions.exotic.exoticpotion.discover_hint=You can craft this item via alchemy.

items.potions.exotic.potionofcleansing.name=potion of cleansing
items.potions.exotic.potionofcleansing.desc=Cures most harmful effects, relieves hunger and protects against new harmful effects for _%s turns_. Can also be thrown at a creature to cleanse it.
items.potions.exotic.potionofcleansing$cleanse.name=cleansed
items.potions.exotic.potionofcleansing$cleanse.desc=Protects against most harmful status effects.\n\nTurns remaining: %s.

items.potions.exotic.potionofcorrosivegas.name=potion of corrosive gas
items.potions.exotic.potionofcorrosivegas.desc=Releases a spreading cloud of corrosive gas when opened or shattered. Exposure causes damage that grows stronger over time. The cloud can harm you and your allies too.

items.potions.exotic.potionofdragonsbreath.name=potion of dragon's breath
items.potions.exotic.potionofdragonsbreath.prompt=Choose a location to burn
items.potions.exotic.potionofdragonsbreath.desc=Drink, then choose a direction to breathe a cone of fire. Burns and briefly cripples creatures, and ignites flammable terrain.

items.potions.exotic.potionofearthenarmor.name=potion of earthen armor
items.potions.exotic.potionofearthenarmor.desc=Grants Barkskin: extra protection that gradually weakens.
items.potions.exotic.potionofearthenarmor.desc_amount=Grants Barkskin that initially blocks _0-%d extra damage_ per hit. Its protection gradually weakens. Stronger Barkskin takes precedence.

items.potions.exotic.potionofdivineinspiration.name=potion of divine inspiration
items.potions.exotic.potionofdivineinspiration.no_more_points=You can't gain any more bonus talent points.
items.potions.exotic.potionofdivineinspiration.select_tier=Select a talent tier to gain two bonus points in. You must have unlocked the tier to be able to spend the points.
items.potions.exotic.potionofdivineinspiration.bonus=+2 Talent Points!
items.potions.exotic.potionofdivineinspiration.desc=Grants _2 extra talent points_ in a tier you choose. Each tier can receive this bonus only once, and must be unlocked before you can spend the points.

items.potions.exotic.potionofmagicalsight.name=potion of magical sight
items.potions.exotic.potionofmagicalsight.desc=Lets you see through walls within _%1$d tiles_ for _%2$s turns_.

items.potions.exotic.potionofmastery.name=potion of mastery
items.potions.exotic.potionofmastery.prompt=Master an Item
items.potions.exotic.potionofmastery.weapon_easier=Your weapon becomes easier to wield!
items.potions.exotic.potionofmastery.armor_easier=Your armor becomes easier to wear!
items.potions.exotic.potionofmastery.desc=Permanently lowers one weapon or armor's strength requirement by _2_. Each item can receive this benefit only once. Cannot be used on the Spirit Bow.

items.potions.exotic.potionofshielding.name=potion of shielding
items.potions.exotic.potionofshielding.desc=Grants a temporary shield that absorbs damage without restoring health.
items.potions.exotic.potionofshielding.desc_amount=Grants _%d shielding_, keeping a stronger existing shield. Does not restore health. Unused shielding can fade over time.
items.potions.exotic.potionofshielding.desc_pharmacophobia=_Pharmacophobia:_ poisons you instead of granting shielding.

items.potions.exotic.potionofshroudingfog.name=potion of shrouding fog
items.potions.exotic.potionofshroudingfog.desc=Throw to spread thick fog that blocks most enemies' sight. You and your allies can see through it.

items.potions.exotic.potionofsnapfreeze.name=potion of snap freeze
items.potions.exotic.potionofsnapfreeze.desc=Throw to instantly freeze and root creatures around the impact. Drinking releases the effect around you instead.

items.potions.exotic.potionofstamina.name=potion of stamina
items.potions.exotic.potionofstamina.desc=Speeds up movement for _%s turns_. Does not speed up attacks.

items.potions.exotic.potionofstormclouds.name=potion of storm clouds
items.potions.exotic.potionofstormclouds.desc=Creates a spreading rain cloud. Turns suitable ground into water, extinguishes fire, destroys traps on flooded tiles and damages fiery creatures.



###quest items
items.quest.ceremonialcandle.name=ceremonial candle
items.quest.ceremonialcandle.desc=Place one candle immediately north, east, south and west of the ritual site’s center to summon a fire elemental. The ritual consumes the candles. Defeat the elemental to recover embers for the Wandmaker.
items.quest.ceremonialcandle.discover_hint=You can find this item during a specific quest.

items.quest.corpsedust.name=corpse dust
items.quest.corpsedust.chill=A chill runs down your spine.
items.quest.corpsedust.desc=Cursed dust requested by the Old Wandmaker. It attracts hostile wraiths and cannot be dropped. Giving it to the Wandmaker banishes its wraiths and stops new ones from appearing.
items.quest.corpsedust.discover_hint=You can find this item during a specific quest.
items.quest.corpsedust&dustwraith.rankings_desc=Cursed by Corpse Dust

items.quest.darkgold.name=dark gold ore
items.quest.darkgold.you_now_have=You now have %d dark gold ore.
items.quest.darkgold.desc=Ore requested by the Troll Blacksmith. Bring it back to earn his favor; it cannot be spent as shop gold.
items.quest.darkgold.discover_hint=You can find this item during a specific quest.

items.quest.dwarftoken.name=dwarf token
items.quest.dwarftoken.discard=You discard the excess token.
items.quest.dwarftoken.desc=Collect _10 tokens_ to open the sealed passage inside the dwarven vault. They are quest items, not shop currency.
items.quest.dwarftoken.desc_old=Tokens requested by the Imp. Bring him _%d tokens_ to claim the quest reward.
items.quest.dwarftoken.discover_hint=You can find this item during a specific quest.

items.quest.embers.name=elemental embers
items.quest.embers.desc=Embers from a young fire elemental. Requested by the Old Wandmaker and also used to craft Summon Elemental spells.
items.quest.embers.discover_hint=You can find this item during a specific quest.

items.quest.escapecrystal.name=escape crystal
items.quest.escapecrystal.ac_use=USE
items.quest.escapecrystal.prompt=Select an item
items.quest.escapecrystal.desc=Ends your vault expedition and returns your original equipment. The reward depends on your progress; recovering the obsidian statuette gives the best choice of reward. Most vault loot stays behind. You must make some progress before the Imp allows you to leave.
items.quest.escapecrystal.discover_hint=You can find this item during a specific quest.
items.quest.escapecrystal.injure_warning_1=Time seems to slow down as you hear the Imp's voice:\n\n"Hey, you seem to be pretty injured, is everything going alright down there? I want my statue but not badly enough for you to die trying to get it!"
items.quest.escapecrystal.injure_warning_2="If you're stuck in a nasty situation you can use one of those _teleport items from the starting room_ to escape back there and try again."
items.quest.escapecrystal.injure_warning_3="If things are looking really dire, you can _escape using that crystal I gave you._ I'm not going to give you the full reward but it's certainly better than dying!"
items.quest.escapecrystal.injure_confirm=Okay (this message won't appear again in future runs)
items.quest.escapecrystal.leaving_start=Time seems to slow down as you hear the Imp's voice:\n\n"Listen, I understand if you're nervous but please at least leave the first room!"\n\n"You don't need to worry about your gear, I'm an Imp of my word, I promise it will all be waiting for you when you get back. I also promise that I'll let you use the crystal to escape if you're actually in danger."
items.quest.escapecrystal.leaving_early=Time seems to slow down as you hear the Imp's voice:\n\n"Really, fleeing already!? You know you can run away from most of the enemies in that place right?"\n\n"Look, if your life is in danger I can pull you out, but I'm not letting you take anything back with you. I expected a lot more from you =("
items.quest.escapecrystal.leaving_partly_explored=Time seems to slow down and you hear the Imp's voice:\n\n"Oh, are you leaving already? Well I suppose you've helped chart the place out, and that's better than nothing."\n\n"Still, I had expected more from you =(. Of course I'll pull you out if you need me to. I'll let you take something like a potion or scroll with you I suppose."
items.quest.escapecrystal.leaving_fully_explored=Time seems to slow down and you hear the Imp's voice:\n\n"Need to leave? Well, you've explored the vault a decent amount at least. I was hoping you'd fare better with actually pilfering it, but I've got a much better idea of how the place works now."\n\n"I'll let you bring something out with you, but nothing magically upgraded!"
items.quest.escapecrystal.leaving_partial_victory=Time seems to slow down and you hear the Imp's voice:\n\n"I had hoped you might get my statuette, but you have done a great job of exploring and clearing most of the vault!"\n\n"Tell you what, I'll let you keep an item as long as it's not enhanced past +1, and I'll still set up shop further in the dungeon. I'll need some time to plan my next steps anyway."
items.quest.escapecrystal.leaving_victory=Time seems to slow down and you hear the Imp's voice:\n\n"Excellent work!! Are you ready to leave? I'll take the statue from you when you return."\n\n"As promised I'll set up shop further down and I'll let you take anything you like back out with you! Take your time choosing if you want, everything else will stay inside the vault."
items.quest.escapecrystal.leaving_item=Are you sure this is the item that you want to take with you?
items.quest.escapecrystal.leaving_seal=_The Broken Seal attached to this armor is tied to the mirror and cannot be taken with you._ The seal will be automatically removed from the armor. This will reduce the armor's level by 1 but will not remove any glyph it has.
items.quest.escapecrystal.leaving_staff=_This Mage's Staff is tied to the mirror and cannot be taken with you, but the wand imbued in it can._ The wand will be automatically removed from the staff, and given to you at the staff's level -1.
items.quest.escapecrystal.leaving_yes=Leave the Vault
items.quest.escapecrystal.leaving_no=Stay Here
items.quest.escapecrystal.error_start=It looks like you aren't in the Vault level! This might have happened due to a bug or crash.
items.quest.escapecrystal.error_no_items=None of your items are being stored, so the crystal has been removed from your inventory.
items.quest.escapecrystal.error_with_items=Your items are currently being stored, so you should attempt to descend into the vault again to begin the quest. Your stored items will be returned to you when the quest ends.

items.quest.gooblob.name=blob of goo
items.quest.gooblob.desc=A remnant of Goo used in alchemy, including Caustic Brew, defensive elixirs and Arcane Bombs. It can also be recycled for alchemy energy.
items.quest.gooblob.discover_hint=You can get this item as a drop from certain enemies.

items.quest.impstatue.name=obsidian statuette
items.quest.impstatue.desc=The obsidian statuette requested by the Imp. Leave the vault with it using the Escape Crystal to earn the full quest reward.
items.quest.impstatue.discover_hint=You can find this item during a specific quest.

items.quest.vaultbeacon.name=vault beacon
items.quest.vaultbeacon.desc=Teleports you to the current floor’s entrance without changing floors. The entrance must be unoccupied and reachable. Consumed only on a successful teleport, which takes 1 turn.
items.quest.vaultbeacon.discover_hint=You can find this item during a specific quest.

items.quest.metalshard.name=cursed metal shard
items.quest.metalshard.desc=An inactive magical shard from DM-300. Used in alchemy for items such as Curse Infusion and Shrapnel Bombs, or recycled for alchemy energy.
items.quest.metalshard.discover_hint=You can get this item as a drop from certain enemies.

items.quest.pickaxe.name=pickaxe
items.quest.pickaxe.ability_name=pierce
items.quest.pickaxe.ability_desc=The Duelist’s _Pierce_ cannot miss and makes survivors take more physical damage for _3 turns_. Deals _%1$d-%2$d base damage_ against inorganic creatures (such as skeletons, wraiths and statues), crabs, spiders, scorpios, bees and swarms.
items.quest.pickaxe.typical_ability_desc=The Duelist’s _Pierce_ cannot miss and makes survivors take more physical damage for _3 turns_. An unupgraded pickaxe deals _%1$d-%2$d base damage_ against inorganic creatures (such as skeletons, wraiths and statues), crabs, spiders, scorpios, bees and swarms.
items.quest.pickaxe.upgrade_ability_stat_name=Ability Damage
items.quest.pickaxe.desc=A mining tool that also works as a weapon. You can mine while it is in your backpack; it does not need to be equipped.
items.quest.pickaxe.discover_hint=You can find this item during a specific quest.



###remains
items.remains.remainsitem.ac_use=USE
items.remains.remainsitem.discover_hint=You can find this item in the remains of a specific hero from a previous lost run.

items.remains.bowfragment.name=bow fragment
items.remains.bowfragment.desc=A fragment of a fallen Huntress’s Spirit Bow. Grows grass around you, including up to _%d tiles of high grass_ where the ground allows it.

items.remains.brokenhilt.name=broken hilt
items.remains.brokenhilt.desc=A hilt from a fallen Duelist’s weapon. Adds _%s damage_ to your next _2 physical hits_. The bonus grows with your level and does not stack with other Physical Empowerment effects.

items.remains.brokenstaff.name=broken staff
items.remains.brokenstaff.desc=A fragment of a fallen Mage’s staff. Restores _1 charge_ to each of your wands, up to its normal capacity.

items.remains.cloakscrap.name=scrap of fabric
items.remains.cloakscrap.desc=A scrap from a fallen Rogue’s Cloak of Shadows. Gives your active, non-cursed artifacts a burst of charge; the amount depends on the artifact.

items.remains.sealshard.name=seal shards
items.remains.sealshard.desc=Shards from a fallen Warrior’s seal. Adds _%s_ to your Barrier, which absorbs damage before you lose health and gradually fades.

items.remains.tornpage.name=torn page
items.remains.tornpage.desc_current=A page from a fallen Cleric’s Holy Tome. Would restore _%d HP_ now.
items.remains.tornpage.desc=A page from a fallen Cleric’s Holy Tome. Normally heals _%s_, stopping at full health. Your healing setting can change the amount restored.



###rings
items.rings.ring.diamond=diamond ring
items.rings.ring.opal=opal ring
items.rings.ring.garnet=garnet ring
items.rings.ring.ruby=ruby ring
items.rings.ring.amethyst=amethyst ring
items.rings.ring.topaz=topaz ring
items.rings.ring.onyx=onyx ring
items.rings.ring.tourmaline=tourmaline ring
items.rings.ring.emerald=emerald ring
items.rings.ring.sapphire=sapphire ring
items.rings.ring.quartz=quartz ring
items.rings.ring.agate=agate ring
items.rings.ring.equip_cursed=The ring tightens around your finger painfully!
items.rings.ring.unknown_desc=This metal band is adorned with a large gem that glitters in the darkness. Who knows what effect it has when worn?
items.rings.ring.known=This is a %s
items.rings.ring.identify=You are now familiar enough with your ring to identify it.
items.rings.ring.cursed_worn=Cursed: normally cannot be removed. Magic immunity temporarily lets you take it off.
items.rings.ring.curse_known=You can feel a malevolent magic lurking within this ring.
items.rings.ring.not_cursed=This ring is free of malevolent magic.

items.rings.ringofaccuracy.name=ring of accuracy
items.rings.ringofaccuracy.stats=Accuracy bonus: _%s%%_ (not hit chance).
items.rings.ringofaccuracy.typical_stats=Example for an uncursed +0 ring: Accuracy bonus: _%s%%_ (not hit chance).
items.rings.ringofaccuracy.combined_stats=Both rings: Accuracy bonus: _%s%%_ (not hit chance).
items.rings.ringofaccuracy.upgrade_stat_name_1=Accuracy Boost
items.rings.ringofaccuracy.desc=Helps your attacks connect. A curse can reduce accuracy instead.

items.rings.ringofarcana.name=ring of arcana
items.rings.ringofarcana.stats=Enchantment and glyph power: _+%s%%_. Each enchantment and glyph shows exactly what that changes.
items.rings.ringofarcana.typical_stats=An uncursed +0 ring gives _+%s%%_ enchantment and glyph power. Each enchantment and glyph shows exactly what that changes.
items.rings.ringofarcana.combined_stats=All your Arcana rings together: _+%s%%_ enchantment and glyph power. Each enchantment and glyph shows exactly what that changes.
items.rings.ringofarcana.upgrade_stat_name_1=Arcana Boost
items.rings.ringofarcana.desc=Boosts the power of the enchantment on your weapon and the glyph on your armor, curses included.\n\nPower does two things. First, it raises the chance the effect happens, up to 100%. Once it always happens, extra power makes the effect itself bigger: longer, stronger or farther.\n\nA cursed Ring of Arcana does the opposite and weakens them.

items.rings.ringofelements.name=ring of elements
items.rings.ringofelements.stats=Resistance to elemental damage and harmful effects: _%s%%_. Negative resistance makes these effects stronger.
items.rings.ringofelements.typical_stats=Example for an uncursed +0 ring: Resistance to elemental damage and harmful effects: _%s%%_. Negative resistance makes these effects stronger.
items.rings.ringofelements.combined_stats=Both rings: Resistance to elemental damage and harmful effects: _%s%%_. Negative resistance makes these effects stronger.
items.rings.ringofelements.upgrade_stat_name_1=Resistance
items.rings.ringofelements.desc=Protects against fire, freezing, poison, electricity and many magical attacks, reducing their damage or duration. A curse can make those effects worse.

items.rings.ringofenergy.name=ring of energy
items.rings.ringofenergy.stats=Wand, artifact and armor-ability recharge speed bonus: _%s%%_.
items.rings.ringofenergy.typical_stats=Example for an uncursed +0 ring: Wand, artifact and armor-ability recharge speed bonus: _%s%%_.
items.rings.ringofenergy.combined_stats=Both rings: Wand, artifact and armor-ability recharge speed bonus: _%s%%_.
items.rings.ringofenergy.upgrade_stat_name_1=Charge Boost
items.rings.ringofenergy.desc=Speeds up recharging for wands, rechargeable artifacts and armor abilities. A curse can slow recharging instead.

items.rings.ringofevasion.name=ring of evasion
items.rings.ringofevasion.stats=Evasion bonus: _%s%%_ (not dodge chance).
items.rings.ringofevasion.typical_stats=Example for an uncursed +0 ring: Evasion bonus: _%s%%_ (not dodge chance).
items.rings.ringofevasion.combined_stats=Both rings: Evasion bonus: _%s%%_ (not dodge chance).
items.rings.ringofevasion.upgrade_stat_name_1=Evasion Boost
items.rings.ringofevasion.desc=Helps you dodge attacks. A curse can make you easier to hit.

items.rings.ringofforce.name=ring of force
items.rings.ringofforce.stats=Unarmed base damage: _%1$d-%2$d_. Melee weapon damage bonus: _%3$d_.
items.rings.ringofforce.typical_stats=Example for an uncursed +0 ring: Unarmed base damage: _%1$d-%2$d_. Melee weapon damage bonus: _%3$d_.
items.rings.ringofforce.combined_stats=Both rings: Unarmed base damage: _%1$d-%2$d_. Melee weapon damage bonus: _%3$d_.
items.rings.ringofforce.upgrade_stat_name_1=Unarmed Damage
items.rings.ringofforce.upgrade_stat_name_2=Armed Damage Boost
items.rings.ringofforce.upgrade_stat_name_3=Ability Damage
items.rings.ringofforce.ability_name=brawler's stance
items.rings.ringofforce.typical_ability_desc=The Duelist can use _Brawler’s Stance_ to make unarmed attacks while wielding a weapon. Example base damage: _%1$d-%2$d_. The weapon’s enchantment and augmentation still apply. Normal weapon-ability recharging is halved.
items.rings.ringofforce.ability_desc=The Duelist can use _Brawler’s Stance_ to make unarmed attacks while wielding a weapon. Base stance damage: _%1$d-%2$d_. The weapon’s enchantment and augmentation still apply. Normal weapon-ability recharging is halved.
items.rings.ringofforce.desc=Makes unarmed strikes stronger and adds damage when using a melee weapon. Strength improves its unarmed damage. A curse can weaken your blows.
items.rings.ringofforce$brawlersstance.name=brawler's stance
items.rings.ringofforce$brawlersstance.desc=Your normal attacks use unarmed Ring of Force damage, with the stance’s damage bonus and your weapon’s enchantment and augmentation.\n\nNormal weapon-ability recharging is halved. Turning the stance off early does not immediately end the recharge penalty.

items.rings.ringoffuror.name=ring of furor
items.rings.ringoffuror.stats=Attack speed bonus: _%s%%_. Does not speed up movement.
items.rings.ringoffuror.typical_stats=Example for an uncursed +0 ring: Attack speed bonus: _%s%%_. Does not speed up movement.
items.rings.ringoffuror.combined_stats=Both rings: Attack speed bonus: _%s%%_. Does not speed up movement.
items.rings.ringoffuror.upgrade_stat_name_1=Attack Speed Boost
items.rings.ringoffuror.desc=Lets you attack more often. A curse can slow your attacks instead.

items.rings.ringofhaste.name=ring of haste
items.rings.ringofhaste.stats=Movement speed bonus: _%s%%_. Does not speed up attacks.
items.rings.ringofhaste.typical_stats=Example for an uncursed +0 ring: Movement speed bonus: _%s%%_. Does not speed up attacks.
items.rings.ringofhaste.combined_stats=Both rings: Movement speed bonus: _%s%%_. Does not speed up attacks.
items.rings.ringofhaste.upgrade_stat_name_1=Move Speed Boost
items.rings.ringofhaste.desc=Lets you move faster. A curse can slow your movement instead.

items.rings.ringofmight.name=ring of might
items.rings.ringofmight.stats=Strength bonus: _%1$d_. Maximum health bonus: _%2$s%%_.
items.rings.ringofmight.typical_stats=Example for an uncursed +0 ring: Strength bonus: _%1$d_. Maximum health bonus: _%2$s%%_.
items.rings.ringofmight.combined_stats=Both rings: Strength bonus: _%1$d_. Maximum health bonus: _%2$s%%_.
items.rings.ringofmight.upgrade_stat_name_1=Strength Boost
items.rings.ringofmight.upgrade_stat_name_2=Max HP Boost
items.rings.ringofmight.desc=Adds Strength and increases maximum health. The extra Strength helps you wield heavier equipment. A curse can reduce both benefits.

items.rings.ringofsharpshooting.name=ring of sharpshooting
items.rings.ringofsharpshooting.stats=Thrown-weapon damage level bonus: _%1$d_. Durability bonus: _%2$s%%_.
items.rings.ringofsharpshooting.typical_stats=Example for an uncursed +0 ring: Thrown-weapon damage level bonus: _%1$d_. Durability bonus: _%2$s%%_.
items.rings.ringofsharpshooting.combined_stats=Both rings: Thrown-weapon damage level bonus: _%1$d_. Durability bonus: _%2$s%%_.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Level Damage Boost
items.rings.ringofsharpshooting.upgrade_stat_name_2=Durability Boost
items.rings.ringofsharpshooting.desc=Improves thrown-weapon damage and durability. The damage bonus also applies to the Spirit Bow. A curse can weaken these benefits.

items.rings.ringoftenacity.name=ring of tenacity
items.rings.ringoftenacity.stats_harm=Up to _%s%%_ more damage taken as health falls.
items.rings.ringoftenacity.combined_stats_harm=Both rings: Up to _%s%%_ more damage taken as health falls.
items.rings.ringoftenacity.stats=Up to _%s%%_ less damage as health falls.
items.rings.ringoftenacity.typical_stats=Example for an uncursed +0 ring: Up to _%s%%_ less damage as health falls.
items.rings.ringoftenacity.combined_stats=Both rings: Up to _%s%%_ less damage as health falls.
items.rings.ringoftenacity.upgrade_stat_name_1=Max damage change
items.rings.ringoftenacity.upgrade_less=%s%% less
items.rings.ringoftenacity.upgrade_more=%s%% more
items.rings.ringoftenacity.desc=Reduces damage more as your health falls, giving no protection at full health. A curse can increase incoming damage instead.

items.rings.ringofwealth.name=ring of wealth
items.rings.ringofwealth.stats=Loot chance bonus: _%s%%_. Extra treasure drops follow separate rules.
items.rings.ringofwealth.typical_stats=Example for an uncursed +0 ring: Loot chance bonus: _%s%%_. Extra treasure drops follow separate rules.
items.rings.ringofwealth.combined_stats=Both rings: Loot chance bonus: _%s%%_. Extra treasure drops follow separate rules.
items.rings.ringofwealth.upgrade_stat_name_1=Luck Boost
items.rings.ringofwealth.desc=Improves enemies’ normal loot chance and can produce extra treasure from eligible enemies and containers. A curse can reduce ordinary loot.



###scrolls
items.scrolls.scroll.ac_read=READ
items.scrolls.scroll.kaunan=scroll of KAUNAN
items.scrolls.scroll.sowilo=scroll of SOWILO
items.scrolls.scroll.laguz=scroll of LAGUZ
