name: APD Play release bundle
# Builds the Google Play release: a .aab (signed with the upload key when the APD_UPLOAD_* secrets exist, unsigned otherwise)
# and a release APK, then installs that release APK on Android emulators and checks it launches without crashing.
# The keystore is never in the repo: it is decoded from the APD_UPLOAD_KEYSTORE_BASE64 secret into the runner's temp folder.
on:
  push:
    branches: [release/play-closed-test]
    paths:
      - .github/workflows/apd-play-release.yml
      - .github/ci/release-smoke-test.sh
      - build.gradle
      - android/**
      - services/**
      - settings.gradle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Write upload key from secrets (if present)
        env:
          KEY_B64: ${{ secrets.APD_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/apd-upload.jks"
            echo "APD_UPLOAD_KEYSTORE=$RUNNER_TEMP/apd-upload.jks" >> "$GITHUB_ENV"
            echo "Upload key found: the bundle will be signed."
          else
            echo "No APD_UPLOAD_KEYSTORE_BASE64 secret: the bundle will be unsigned."
          fi
      - name: Build release bundle and APK
        env:
          APD_UPLOAD_STORE_PASSWORD: ${{ secrets.APD_UPLOAD_STORE_PASSWORD }}
          APD_UPLOAD_KEY_PASSWORD: ${{ secrets.APD_UPLOAD_KEY_PASSWORD }}
          APD_UPLOAD_KEY_ALIAS: ${{ secrets.APD_UPLOAD_KEY_ALIAS }}
        run: ./gradlew :android:bundleRelease :android:assembleRelease --no-daemon
      - name: Describe outputs
        run: |
          find android/build/outputs -name "*.aab" -o -name "*.apk" | xargs ls -l
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APK=$(find android/build/outputs/apk/release -name "*.apk" | head -1)
          "$ANDROID_HOME/build-tools/$BT/aapt" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion"
          rm -f "$RUNNER_TEMP/apd-upload.jks"
      - name: Bundle signature
        run: |
          AAB=android/build/outputs/bundle/release/android-release.aab
          if jarsigner -verify -verbose:summary "$AAB" | grep -q "jar verified"; then
            jarsigner -verify -verbose -certs "$AAB" | grep -m1 "Signed by" || true
            echo "SIGNED: the .aab is signed and ready for Play"
          else
            echo "UNSIGNED: add the APD_UPLOAD_* secrets, then rerun this workflow"
          fi
      - name: Hand the unsigned bundle to the signing session (no keys involved)
        if: github.event_name == 'workflow_dispatch'
        run: |
          AAB=android/build/outputs/bundle/release/android-release.aab
          mkdir -p /tmp/handoff && cp "$AAB" /tmp/handoff/apd-unsigned.aab
          cd /tmp/handoff && git init -q -b handoff/unsigned-aab
          git config user.name "apd-ci" && git config user.email "ci@users.noreply.github.com"
          git add apd-unsigned.aab && git commit -q -m "Unsigned release bundle from run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" handoff/unsigned-aab
      - name: No Shattered servers in the release
        run: |
          APK=$(find android/build/outputs/apk/release -name "*.apk" | head -1)
          mkdir -p apkx && unzip -q -o "$APK" -d apkx
          HITS=$(grep -a -o -h -E "shatteredpixel\.com|00-Evan/shattered|api\.github\.com/repos/00-Evan" apkx/classes*.dex | sort | uniq -c || true)
          if [ -n "$HITS" ]; then echo "FAIL: release code still names Shattered servers:"; echo "$HITS"; exit 1; fi
          echo "PASS: no shatteredpixel.com or 00-Evan GitHub address in the release code"
      - uses: actions/upload-artifact@v4
        with:
          name: APD-Play-Release-Bundle
          path: android/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: APD-Release-APK-unsigned-or-upload-signed
          path: android/build/outputs/apk/release/*.apk

  smoke:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 34
            target: default
          - api-level: 36
            target: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: APD-Release-APK-unsigned-or-upload-signed
          path: release-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Sign a test copy with a throwaway key (only for installing on the emulator)
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APK=$(find release-apk -name "*.apk" | head -1)
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -storepass throwaway -keypass throwaway -alias t -keyalg RSA -keysize 2048 -validity 2 -dname "CN=throwaway" >/dev/null 2>&1
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f 4 "$APK" aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks "$RUNNER_TEMP/throwaway.jks" --ks-pass pass:throwaway --out smoke.apk aligned.apk
      - name: Install and launch on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          disable-animations: true
          script: bash .github/ci/release-smoke-test.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-api${{ matrix.api-level }}
          path: |
            smoke-logcat.txt
            smoke-screen-*.png
          if-no-files-found: warn
