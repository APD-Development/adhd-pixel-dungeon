name: APD legacy header demo provenance source gate
on:
  push:
    branches: [chatgpt/apd-legacy-demo-header-20261113-0236]
    paths:
      - .github/workflows/apd-legacy-demo-header-ci-20261113.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveExporter.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveDemoProvenanceExportTest.java
permissions: {contents: read}
concurrency:
  group: apd-legacy-demo-header-20261113
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify header and typed run identity checks plus three regression methods
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveExporter.java').read_text()
          tests=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveDemoProvenanceExportTest.java').read_text()
          assert 'StatsStore.isValidRunId(r.header.runId)' in src
          assert 'r.header.runId.startsWith(DatasetStore.DEMO_LOG_PREFIX)' in src
          assert 'l.runId.startsWith(DatasetStore.DEMO_LOG_PREFIX)' in src
          for method in (
              'legacyDemoHeaderCannotBeHiddenByOrdinaryTypedRunStart',
              'invalidLegacyHeaderIdCannotEnterArchiveEvenWithOrdinaryTypedStart',
              'validLegacyHeaderAndDifferentLogicalRunIdStillRoundTrip',
          ):
              assert 'void '+method+'(' in tests, method
          print('Both independent header and logical run provenance guards present')
          PY
      - name: Full core JUnit and desktop and Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Check full JUnit XML and all new cases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'missing JUnit XML'
          totals={k:sum(int(x.get(k,0)) for x in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests'] >= 3400, totals
          assert all(totals[k] == 0 for k in ('failures','errors','skipped')), totals
          cases={c.get('name') for r in reports for c in r.findall('testcase')}
          for method in (
              'legacyDemoHeaderCannotBeHiddenByOrdinaryTypedRunStart',
              'invalidLegacyHeaderIdCannotEnterArchiveEvenWithOrdinaryTypedStart',
              'validLegacyHeaderAndDifferentLogicalRunIdStillRoundTrip',
          ):
              assert method in cases, method
          print('Full core JUnit:', totals, 'suites:', len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-legacy-demo-header-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
