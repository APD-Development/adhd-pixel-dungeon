name: Compile gated-room Android visual fixture without rebuilding game
on:
  push:
    branches: [codex/apd-phone-fixes-2026-10-09]
    paths: [.github/workflows/apd448-gated-visual-fixture-ci.yml]
permissions: {contents: read}
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Confirm only tooling and instrumentation changed after frozen APD448 game
        run: |
          python3 - <<'PY'
          import subprocess
          base='fbc7d6edf5d531e70f4d1046ed8f27ce98f04862'
          files=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          for file in files:
              assert file.startswith('tools/') or file.startswith('.github/workflows/') or file.startswith('android/src/androidTest/'), file
          expected='android/src/androidTest/java/com/shatteredpixel/shatteredpixeldungeon/android/WallGeometryDeviceTest.java'
          assert expected in files
          print('Only independent verification code differs:',files)
          PY
      - name: Compile actual gated-room instrumentation source
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :android:compileDebugAndroidTestJavaWithJavac -PapdTestBuild -PapdBuild=C448
