name: APD archive terminal run-end privacy source gate
on:
  push:
    branches: [chatgpt/apd-archive-terminal-end-20261113-0100]
    paths:
      - .github/workflows/apd-archive-terminal-end-ci-20261113.yml
      - core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveExporter.java
      - core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveTerminalEndPrivacyTest.java
permissions: {contents: read}
concurrency:
  group: apd-archive-terminal-end-privacy-20261113
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify source boundary and test assertions exist
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('core/src/main/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveExporter.java').read_text()
          tests=Path('core/src/test/java/com/shatteredpixel/shatteredpixeldungeon/apd/archive/ArchiveTerminalEndPrivacyTest.java').read_text()
          assert 'r.sealed && r.status.isClean() && !r.events.isEmpty()' in source
          assert 'possibleEnd.type == EventTypes.RUN_END' in source
          assert 'LegacyEvents.decodeRankingLink(last, r)' in source
          for name in (
              'unsealedLogWithReadableRunEndStillRedactsHiddenFacts',
              'sealedLogWithEventsAfterRunEndStillRedactsHiddenFacts',
              'cleanSealedTerminalRunEndStillExportsOriginalBytes',
              'completedRunWithNormalRankingLinkTrailerStaysLossless',
          ):
              assert 'void '+name+'(' in tests, name
          print('Bounded terminal archive completion guard and three regressions present')
          PY
      - name: Full core JUnit and desktop/Android Java compilation
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
          ./gradlew :core:test :desktop:classes :android:compileDebugJavaWithJavac :android:compileReleaseJavaWithJavac :android:compileDebugAndroidTestJavaWithJavac
      - name: Assert complete JUnit XML and privacy regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=[ET.parse(p).getroot() for p in Path('core/build/test-results/test').glob('TEST-*.xml')]
          assert reports, 'missing JUnit reports'
          totals={k:sum(int(r.get(k,0)) for r in reports) for k in ('tests','failures','errors','skipped')}
          assert totals['tests']>=3385, totals
          assert all(totals[k]==0 for k in ('failures','errors','skipped')), totals
          cases={c.get('name') for r in reports for c in r.findall('testcase')}
          for case in (
              'unsealedLogWithReadableRunEndStillRedactsHiddenFacts',
              'sealedLogWithEventsAfterRunEndStillRedactsHiddenFacts',
              'cleanSealedTerminalRunEndStillExportsOriginalBytes',
              'completedRunWithNormalRankingLinkTrailerStaysLossless',
              'resumedRunWithSameTimestampKeepsEverySegmentRedacted',
              'finishedRunWithSameTimestampKeepsEverySegmentLossless',
              'nothingHiddenIsInTheRedactedCopyAndTheCopyIsExactlyWhatThePlayerCouldKnow',
          ):
              assert case in cases, case
          print('Full source JUnit:',totals,'suites:',len(reports))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apd-archive-terminal-end-junit
          path: core/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14
